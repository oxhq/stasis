<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stasis recursive microtask limit</title>
  </head>
  <body>
    <button id="start" type="button">Start recursive microtasks</button>
    <p id="status">idle</p>
    <script>
      document.querySelector("#start").addEventListener("click", () => {
        document.querySelector("#status").textContent = "running";
        const recurse = () => Promise.resolve().then(recurse);
        recurse();
      });
    </script>
  </body>
</html>
