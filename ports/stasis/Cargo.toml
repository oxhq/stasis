[package]
name = "stasis-shell"
version = "0.3.1"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Controlled Servo automation shell"
repository = "https://github.com/oxhq/stasis.git"

[[bin]]
name = "stasis"
path = "src/main.rs"

[dependencies]
dpi = { workspace = true }
embedder_traits = { workspace = true }
net_traits = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
servo = { workspace = true, default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
servo-base = { workspace = true }
storage_traits = { workspace = true }
timers = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
libc = { workspace = true }
servo = { workspace = true, default-features = false, features = ["no-wgl"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
sha2 = { workspace = true }
