[package]
name = "stasis-shell"
version = "0.1.0-alpha.0"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Controlled Servo automation shell"
repository = "https://github.com/oxhq/stasis.git"

[[bin]]
name = "stasis"
path = "src/main.rs"

[dependencies]
dpi = { workspace = true }
embedder_traits = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
servo = { workspace = true, default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
servo-base = { workspace = true }
timers = { workspace = true }
url = { workspace = true }
