<!doctype html>
<meta charset="utf-8">
<title>Synchronous action source</title>
<main>
  <button id="sync-action" type="button">Navigate synchronously</button>
  <output id="sync-action-source-status">sync-action-source-ready</output>
</main>
<script>
  let activations = 0;
  document.querySelector("#sync-action").addEventListener("click", () => {
    activations += 1;
    document.querySelector("#sync-action-source-status").textContent =
      `sync-action-source-activated-${activations}`;
    location.assign(`/sync-action-destination?activation=${activations}`);
  });
</script>
