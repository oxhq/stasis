name: Stasis v0.3.3 performance crawl phase diagnostic V4

on:
  push:
    branches:
      - codex/stasis-v033-crawl-phase-diagnostic-v4

permissions:
  actions: read
  contents: read

concurrency:
  group: stasis-v0.3.3-performance-crawl-phase-diagnostic-v4-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_HARNESS_SHA: 58742c0f35939558b334eeb792cbf17ae8ab3426
  BENCHMARK_HARNESS_PARENT_SHA: ff081f0defd22420e6928701ef4aefb52a3f8b11
  DIAGNOSTIC_SCHEMA: stasis-v0.3.3-performance-crawl-phase-diagnostic-v2
  DIAGNOSTIC_PROTOCOL: stasis-v0.3.3-performance-crawl-phase-diagnostic-v2
  DIAGNOSTIC_EVIDENCE_SCHEMA: stasis-v0.3.3-performance-crawl-phase-localization-evidence-v2
  DIAGNOSTIC_EVIDENCE_PROTOCOL: stasis-v0.3.3-performance-crawl-phase-localization-v2
  STASIS_DIAGNOSTIC_DEPENDENCY_HOOK: sdk_frozen_plain_object_adapter_v2
  COMPARISON_INPUT_VERIFICATION_SCHEMA: stasis-v0.3.3-performance-crawl-phase-comparison-input-verification-v2
  DIAGNOSTIC_OUTCOME_SCHEMA: stasis-v0.3.3-performance-crawl-phase-diagnostic-outcome-v2
  # S4 must execute frozen H4, so only H4's generated semantic and CLI receipts remain V1.
  H4_DIAGNOSTIC_VERIFICATION_SCHEMA: stasis-v0.3.3-performance-crawl-phase-diagnostic-verification-v1
  H4_DIAGNOSTIC_VERIFICATION_CLI_SCHEMA: stasis-v0.3.3-performance-crawl-phase-diagnostic-verification-cli-v1
  V1_INVALID_SOURCE_SHA: 6c142d18631b910ab9e7ce842b52ed817b46ecc5
  V1_INVALID_RUN_ID: "33878174891"
  V1_INVALID_RUN_ATTEMPT: "1"
  V1_INVALID_JOB_ID: "101040077123"
  V1_INVALID_ARTIFACT_ID: "9938737579"
  V1_INVALID_ARTIFACT_BYTES: "491"
  V1_INVALID_ARTIFACT_SHA256: b512db23bd922943606f8c366c144fab99163a0bb2a4a606f53b24c63fb7b676
  V1_INVALID_OUTCOME_SCHEMA: stasis-v0.3.3-performance-crawl-phase-diagnostic-outcome-v1
  V1_INVALID_OUTCOME_BYTES: "612"
  V1_INVALID_OUTCOME_SHA256: 27c81015c1e3e095f9148e71b4fd32039eda1dfc16b7c5be4aedc17caa82cc03
  V1_HOSTED_PROVENANCE_BYTES: "15477"
  V1_HOSTED_PROVENANCE_SHA256: 42ccfa01f80d8c791182d92010c803327af386b4fc08dc63515ccc843bfe10db
  V1_EVIDENCE_RELEASE_ID: "382790743"
  V1_EVIDENCE_RELEASE_TAG: stasis-v0.3.3-performance-crawl-phase-diagnostic-evidence-v1
  V1_EVIDENCE_RELEASE_TARGET: 24242dcbcf652f07ca9ae62e8b48ce35949dda15
  V1_PUBLIC_VERIFICATION_RELEASE_ID: "382795113"
  V1_PUBLIC_VERIFICATION_RELEASE_TAG: stasis-v0.3.3-performance-crawl-phase-diagnostic-public-verification-v1
  V1_PUBLIC_VERIFICATION_CREATED_AT: "2026-09-04T14:24:03Z"
  V1_PUBLIC_VERIFICATION_PUBLISHED_AT: "2026-09-04T14:33:20Z"
  V1_PUBLIC_VERIFICATION_TAG_TARGET: ff081f0defd22420e6928701ef4aefb52a3f8b11
  V1_PUBLIC_VERIFICATION_RECEIPT_ASSET_ID: "544462676"
  V1_PUBLIC_VERIFICATION_RECEIPT_BYTES: "7434"
  V1_PUBLIC_VERIFICATION_RECEIPT_SHA256: 05299186edea4e770abc26900e55ce7fa485d7a84093a8ea240d3470e10a6343
  WORKFLOW_PARENT_SHA: fc1dfca00b0f25d1da35cae23fa206d511aa876e
  COMPARISON_RELEASE_ID: "382679391"
  COMPARISON_RELEASE_TAG: stasis-v0.3.3-performance-replication-evidence-v1
  COMPARISON_RELEASE_TARGET: 6c1a0066eb17425628293993fd7312d4cf26e0f5
  COMPARISON_RELEASE_CREATED_AT: "2026-09-04T11:36:56Z"
  COMPARISON_RELEASE_PUBLISHED_AT: "2026-09-04T11:37:42Z"
  FRESH_CRAWL_RAW_ASSET_ID: "544250086"
  FRESH_CRAWL_RAW_BYTES: "221543"
  FRESH_CRAWL_RAW_SHA256: 52a76a4ebb726c6ab78b70356655e8abd7a5e84d9ce175a8e0d876f543c1a16b
  ARTIFACT_BINDING_ASSET_ID: "544250114"
  ARTIFACT_BINDING_BYTES: "5086"
  ARTIFACT_BINDING_SHA256: 78d91f9c12f85d538dff1944e772614bf9b0adc9841d647c93ab8f608f1ba4ad
  STASIS_PACKAGE_RUN_ID: "33506181780"
  STASIS_PACKAGE_RUN_ATTEMPT: "1"
  STASIS_REVISION: 48c5a718a9ddd63f496e45307e1484974ccf8587

jobs:
  crawl-phase-diagnostic-v4:
    name: Native Ubuntu 22.04 crawl phase diagnostic V4
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Validate the one-shot workflow invocation
        id: validate_invocation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'oxhq/stasis'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/codex/stasis-v033-crawl-phase-diagnostic-v4'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BENCHMARK_HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BENCHMARK_HARNESS_SHA" = '58742c0f35939558b334eeb792cbf17ae8ab3426'
          test "$BENCHMARK_HARNESS_PARENT_SHA" = "$V1_PUBLIC_VERIFICATION_TAG_TARGET"
          test "$COMPARISON_RELEASE_TARGET" = '6c1a0066eb17425628293993fd7312d4cf26e0f5'
          test "$DIAGNOSTIC_SCHEMA" = 'stasis-v0.3.3-performance-crawl-phase-diagnostic-v2'
          test "$DIAGNOSTIC_PROTOCOL" = "$DIAGNOSTIC_SCHEMA"
          test "$DIAGNOSTIC_EVIDENCE_SCHEMA" = 'stasis-v0.3.3-performance-crawl-phase-localization-evidence-v2'
          test "$DIAGNOSTIC_EVIDENCE_PROTOCOL" = 'stasis-v0.3.3-performance-crawl-phase-localization-v2'
          test "$STASIS_DIAGNOSTIC_DEPENDENCY_HOOK" = 'sdk_frozen_plain_object_adapter_v2'
          test "$COMPARISON_INPUT_VERIFICATION_SCHEMA" = 'stasis-v0.3.3-performance-crawl-phase-comparison-input-verification-v2'
          test "$DIAGNOSTIC_OUTCOME_SCHEMA" = 'stasis-v0.3.3-performance-crawl-phase-diagnostic-outcome-v2'
          test "$H4_DIAGNOSTIC_VERIFICATION_SCHEMA" = 'stasis-v0.3.3-performance-crawl-phase-diagnostic-verification-v1'
          test "$H4_DIAGNOSTIC_VERIFICATION_CLI_SCHEMA" = 'stasis-v0.3.3-performance-crawl-phase-diagnostic-verification-cli-v1'
          test "$STASIS_PACKAGE_RUN_ID" = '33506181780'
          test "$STASIS_PACKAGE_RUN_ATTEMPT" = '1'
          test "$STASIS_REVISION" = '48c5a718a9ddd63f496e45307e1484974ccf8587'

          EVENT_PATH="$GITHUB_EVENT_PATH" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "after": os.environ["GITHUB_SHA"],
              "before": "0" * 40,
              "created": True,
              "deleted": False,
              "forced": False,
              "ref": "refs/heads/codex/stasis-v033-crawl-phase-diagnostic-v4",
          }
          for key, value in expected.items():
              if event.get(key) != value:
                  raise SystemExit(f"one-shot push identity mismatch: {key}")
          PY

          commit_record="$RUNNER_TEMP/diagnostic-workflow-commit.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" > "$commit_record"
          COMMIT_RECORD="$commit_record" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          commit = json.loads(Path(os.environ["COMMIT_RECORD"]).read_text(encoding="utf-8"))
          if commit.get("sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("workflow source commit identity mismatch")
          parents = commit.get("parents") or []
          if [parent.get("sha") for parent in parents] != [os.environ["WORKFLOW_PARENT_SHA"]]:
              raise SystemExit("workflow source must have the frozen sole parent")
          files = commit.get("files") or []
          expected_path = ".github/workflows/stasis-v0.3.3-performance-crawl-phase-diagnostic-v4.yml"
          if [(item.get("filename"), item.get("status")) for item in files] != [
              (expected_path, "added")
          ]:
              raise SystemExit("workflow source commit changed files outside the frozen path")
          PY

      - name: Check out the exact diagnostic harness
        id: checkout_harness
        if: ${{ steps.validate_invocation.outcome == 'success' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: oxhq/stasis-compat-bench
          ref: ${{ env.BENCHMARK_HARNESS_SHA }}
          path: benchmark
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node 22.20.0 x64
        id: setup_node
        if: ${{ steps.checkout_harness.outcome == 'success' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Verify the exact harness and Node runtime
        id: verify_runtime
        if: ${{ steps.setup_node.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.20.0'
          test "$(node -p 'process.platform')" = 'linux'
          test "$(node -p 'process.arch')" = 'x64'
          test "$RUNNER_OS" = 'Linux'
          test "$RUNNER_ARCH" = 'X64'
          test "$(git -C benchmark rev-parse HEAD)" = "$BENCHMARK_HARNESS_SHA"
          mapfile -t harness_parent_headers < <(
            git -C benchmark cat-file -p HEAD | sed -n 's/^parent //p'
          )
          test "${#harness_parent_headers[@]}" = '1'
          test "${harness_parent_headers[0]}" = "$BENCHMARK_HARNESS_PARENT_SHA"
          test -z "$(git -C benchmark status --porcelain=v1 --untracked-files=all)"

      - name: Verify the published V1 invalid motivation anonymously
        id: verify_v1_motivation
        if: ${{ steps.verify_runtime.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          motivation_root="$RUNNER_TEMP/stasis-crawl-phase-v1-invalid-motivation"
          test ! -e "$motivation_root"
          mkdir "$motivation_root"
          release_api="$motivation_root/public-verification-release.json"
          tag_api="$motivation_root/public-verification-tag-ref.json"
          receipt="$motivation_root/public-verification-receipt.json"
          hosted_provenance="$motivation_root/v1-hosted-provenance.json"
          diagnostic_outcome="$motivation_root/v1-diagnostic-outcome.json"
          release_url="https://api.github.com/repos/oxhq/stasis-compat-bench/releases/$V1_PUBLIC_VERIFICATION_RELEASE_ID"
          tag_url="https://api.github.com/repos/oxhq/stasis-compat-bench/git/ref/tags/$V1_PUBLIC_VERIFICATION_RELEASE_TAG"
          receipt_url="https://github.com/oxhq/stasis-compat-bench/releases/download/$V1_PUBLIC_VERIFICATION_RELEASE_TAG/stasis-diagnostic-public-receipt-ff081f0.json"
          hosted_url="https://github.com/oxhq/stasis-compat-bench/releases/download/$V1_EVIDENCE_RELEASE_TAG/hosted-provenance.json"
          outcome_url="https://github.com/oxhq/stasis-compat-bench/releases/download/$V1_EVIDENCE_RELEASE_TAG/diagnostic-outcome.json"

          unset GH_TOKEN GITHUB_TOKEN
          for specification in \
            "$release_api|$release_url|1048576|application/vnd.github+json" \
            "$tag_api|$tag_url|1048576|application/vnd.github+json" \
            "$receipt|$receipt_url|65536|application/octet-stream" \
            "$hosted_provenance|$hosted_url|65536|application/octet-stream" \
            "$diagnostic_outcome|$outcome_url|65536|application/octet-stream"
          do
            IFS='|' read -r destination url maximum accept <<< "$specification"
            curl -q --fail --silent --show-error --location --retry 0 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 --max-redirs 3 \
              --max-filesize "$maximum" --connect-timeout 30 --max-time 300 \
              --header "Accept: $accept" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'User-Agent: stasis-v0.3.3-crawl-phase-diagnostic-v2' \
              --output "$destination" "$url"
          done

          RELEASE_API="$release_api" \
          TAG_API="$tag_api" \
          RECEIPT="$receipt" \
          RECEIPT_URL="$receipt_url" \
          HOSTED_PROVENANCE="$hosted_provenance" \
          DIAGNOSTIC_OUTCOME="$diagnostic_outcome" \
            node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          function fail(message) {
            throw new Error(message);
          }
          function exact(value, expected, label) {
            if (value !== expected) fail(`${label} mismatch`);
          }
          async function canonicalJson(filePath, expectedBytes, expectedSha256, label) {
            const bytes = await readFile(filePath);
            exact(bytes.byteLength, Number(expectedBytes), `${label} bytes`);
            exact(
              createHash("sha256").update(bytes).digest("hex"),
              expectedSha256,
              `${label} SHA-256`,
            );
            const value = JSON.parse(bytes.toString("utf8"));
            const canonical = Buffer.from(`${JSON.stringify(value, null, 2)}\n`, "utf8");
            if (!canonical.equals(bytes)) fail(`${label} is not canonical JSON`);
            return value;
          }

          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          const releaseUrl = `https://api.github.com/repos/oxhq/stasis-compat-bench/releases/${process.env.V1_PUBLIC_VERIFICATION_RELEASE_ID}`;
          const releaseWebUrl = `https://github.com/oxhq/stasis-compat-bench/releases/tag/${process.env.V1_PUBLIC_VERIFICATION_RELEASE_TAG}`;
          const expectedRelease = {
            id: Number(process.env.V1_PUBLIC_VERIFICATION_RELEASE_ID),
            tag_name: process.env.V1_PUBLIC_VERIFICATION_RELEASE_TAG,
            target_commitish: "main",
            url: releaseUrl,
            html_url: releaseWebUrl,
            created_at: process.env.V1_PUBLIC_VERIFICATION_CREATED_AT,
            published_at: process.env.V1_PUBLIC_VERIFICATION_PUBLISHED_AT,
            immutable: true,
            draft: false,
            prerelease: false,
          };
          for (const [key, expected] of Object.entries(expectedRelease)) {
            exact(release[key], expected, `public verification release ${key}`);
          }
          if (!Array.isArray(release.assets) || release.assets.length !== 1) {
            fail("public verification release asset inventory mismatch");
          }
          const releaseAsset = release.assets[0];
          const expectedAsset = {
            id: Number(process.env.V1_PUBLIC_VERIFICATION_RECEIPT_ASSET_ID),
            name: "stasis-diagnostic-public-receipt-ff081f0.json",
            state: "uploaded",
            size: Number(process.env.V1_PUBLIC_VERIFICATION_RECEIPT_BYTES),
            digest: `sha256:${process.env.V1_PUBLIC_VERIFICATION_RECEIPT_SHA256}`,
            browser_download_url: process.env.RECEIPT_URL,
          };
          for (const [key, expected] of Object.entries(expectedAsset)) {
            exact(releaseAsset[key], expected, `public verification receipt asset ${key}`);
          }

          const tagReference = JSON.parse(await readFile(process.env.TAG_API, "utf8"));
          exact(
            tagReference.ref,
            `refs/tags/${process.env.V1_PUBLIC_VERIFICATION_RELEASE_TAG}`,
            "public verification tag ref",
          );
          exact(tagReference.object?.type, "commit", "public verification tag object type");
          exact(
            tagReference.object?.sha,
            process.env.V1_PUBLIC_VERIFICATION_TAG_TARGET,
            "public verification tag target",
          );

          const receipt = await canonicalJson(
            process.env.RECEIPT,
            process.env.V1_PUBLIC_VERIFICATION_RECEIPT_BYTES,
            process.env.V1_PUBLIC_VERIFICATION_RECEIPT_SHA256,
            "public verification receipt",
          );
          const hosted = await canonicalJson(
            process.env.HOSTED_PROVENANCE,
            process.env.V1_HOSTED_PROVENANCE_BYTES,
            process.env.V1_HOSTED_PROVENANCE_SHA256,
            "V1 hosted provenance",
          );
          const outcome = await canonicalJson(
            process.env.DIAGNOSTIC_OUTCOME,
            process.env.V1_INVALID_OUTCOME_BYTES,
            process.env.V1_INVALID_OUTCOME_SHA256,
            "V1 diagnostic outcome",
          );

          exact(receipt.status, "passed", "public verification receipt status");
          exact(receipt.diagnosticStatus, "failed", "public verification diagnostic status");
          exact(receipt.outcomeClass, "DIAGNOSTIC_INVALID_WITH_STATUS", "public verification outcome class");
          exact(receipt.release?.releaseId, Number(process.env.V1_EVIDENCE_RELEASE_ID), "V1 evidence release id");
          exact(receipt.release?.tag, process.env.V1_EVIDENCE_RELEASE_TAG, "V1 evidence release tag");
          exact(receipt.release?.targetCommitSha, process.env.V1_EVIDENCE_RELEASE_TARGET, "V1 evidence release target");
          exact(receipt.release?.immutable, true, "V1 evidence release immutability");
          exact(receipt.release?.tagBindings?.evidence?.objectSha, process.env.V1_EVIDENCE_RELEASE_TARGET, "V1 evidence tag target");
          exact(receipt.release?.tagBindings?.contract?.objectSha, process.env.V1_EVIDENCE_RELEASE_TARGET, "V1 contract tag target");
          exact(receipt.release?.tagBindings?.comparison?.objectSha, process.env.COMPARISON_RELEASE_TARGET, "comparison evidence tag target");
          exact(receipt.decisionState, "STAY_0_4_UNASSIGNED", "public verification decision state");

          const retainedByteMap = new Map(
            (receipt.assetByteMap ?? []).map((entry) => [entry.name, entry]),
          );
          const retainedFiles = [
            ["actions-diagnostic-bundle.zip", Number(process.env.V1_INVALID_ARTIFACT_BYTES), process.env.V1_INVALID_ARTIFACT_SHA256],
            ["diagnostic-outcome.json", Number(process.env.V1_INVALID_OUTCOME_BYTES), process.env.V1_INVALID_OUTCOME_SHA256],
            ["hosted-provenance.json", Number(process.env.V1_HOSTED_PROVENANCE_BYTES), process.env.V1_HOSTED_PROVENANCE_SHA256],
          ];
          for (const [name, bytes, sha256] of retainedFiles) {
            const entry = retainedByteMap.get(name);
            exact(entry?.bytes, bytes, `${name} retained bytes`);
            exact(entry?.sha256, sha256, `${name} retained SHA-256`);
          }

          exact(hosted.status, "passed", "V1 hosted provenance status");
          exact(hosted.outcomeClass, "DIAGNOSTIC_INVALID_WITH_STATUS", "V1 hosted outcome class");
          exact(hosted.producer?.headSha, process.env.V1_INVALID_SOURCE_SHA, "V1 source SHA");
          exact(hosted.producer?.runId, Number(process.env.V1_INVALID_RUN_ID), "V1 run id");
          exact(hosted.producer?.runAttempt, Number(process.env.V1_INVALID_RUN_ATTEMPT), "V1 run attempt");
          exact(hosted.oneShot?.invocationCount, 1, "V1 invocation count");
          exact(hosted.oneShot?.rerunCount, 0, "V1 rerun count");
          exact(hosted.job?.id, Number(process.env.V1_INVALID_JOB_ID), "V1 job id");
          exact(hosted.execution?.retries, false, "V1 retries");
          exact(hosted.execution?.sleeps, false, "V1 sleeps");
          exact(hosted.execution?.fallbacks, false, "V1 fallbacks");
          exact(hosted.execution?.discardedObservations, false, "V1 discarded observations");
          if (!Array.isArray(hosted.artifacts) || hosted.artifacts.length !== 1) {
            fail("V1 invalid artifact inventory mismatch");
          }
          exact(hosted.artifacts[0].id, Number(process.env.V1_INVALID_ARTIFACT_ID), "V1 artifact id");
          exact(hosted.artifacts[0].sizeInBytes, Number(process.env.V1_INVALID_ARTIFACT_BYTES), "V1 artifact bytes");
          exact(hosted.artifacts[0].digest, `sha256:${process.env.V1_INVALID_ARTIFACT_SHA256}`, "V1 artifact digest");

          const disabledClaims = [
            "authorityEligible",
            "timingEligible",
            "statisticsEligible",
            "comparisonEligible",
            "optimizationEligible",
            "generalizedSpeedClaimAuthorized",
            "implementationWorkAuthorized",
          ];
          for (const name of disabledClaims) {
            exact(receipt[name], false, `public verification ${name}`);
            exact(outcome[name], false, `V1 diagnostic outcome ${name}`);
          }
          exact(outcome.schema, process.env.V1_INVALID_OUTCOME_SCHEMA, "V1 diagnostic outcome schema");
          exact(outcome.status, "failed", "V1 diagnostic outcome status");
          exact(outcome.outcomeClass, "DIAGNOSTIC_INVALID_WITH_STATUS", "V1 diagnostic outcome class");
          exact(outcome.phase, "diagnostic_execution", "V1 diagnostic failure phase");
          exact(outcome.runAttempt, 1, "V1 diagnostic outcome run attempt");
          exact(outcome.evidenceArtifactEligible, false, "V1 diagnostic evidence eligibility");
          exact(outcome.failure?.code, "DIAGNOSTIC_EXECUTION_FAILED", "V1 diagnostic failure code");
          exact(outcome.decisionState, "STAY_0_4_UNASSIGNED", "V1 diagnostic decision state");
          NODE

      - name: Install the frozen diagnostic harness
        id: install_harness
        if: ${{ steps.verify_v1_motivation.outcome == 'success' }}
        shell: bash
        working-directory: benchmark
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NPM_CONFIG_FETCH_RETRIES: "0"
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --timing --registry=https://registry.npmjs.org/
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install the exact Playwright Chromium runtime
        id: install_browser
        if: ${{ steps.install_harness.outcome == 'success' }}
        shell: bash
        working-directory: benchmark
        timeout-minutes: 30
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/stasis-performance-playwright
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          browser_path=$(node -e 'import("playwright").then(({ chromium }) => process.stdout.write(chromium.executablePath()))')
          test -x "$browser_path"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' \
            "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

      - name: Provision the exact Stasis EGL runtime prerequisite
        id: provision_egl
        if: ${{ steps.install_browser.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libegl-mesa0 \
            libglvnd0
          python3 - <<'PY'
          import ctypes
          import os

          library = ctypes.CDLL("libEGL.so.1", mode=os.RTLD_LAZY)
          if not hasattr(library, "eglGetProcAddress"):
              raise SystemExit("libEGL.so.1 does not export eglGetProcAddress")
          PY

      - name: Verify and download the immutable comparison inputs anonymously
        id: verify_comparison_input
        if: ${{ steps.provision_egl.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          authority_root="$RUNNER_TEMP/stasis-crawl-phase-authority-v2"
          test ! -e "$authority_root"
          mkdir "$authority_root"
          release_api="$authority_root/release.json"
          tag_api="$authority_root/tag-ref.json"
          fresh_raw="$authority_root/fresh-crawl-raw.json"
          artifact_binding="$authority_root/artifact-binding.json"
          input_receipt="$authority_root/comparison-input-verification.json"
          release_url="https://api.github.com/repos/oxhq/stasis-compat-bench/releases/$COMPARISON_RELEASE_ID"
          tag_url="https://api.github.com/repos/oxhq/stasis-compat-bench/git/ref/tags/$COMPARISON_RELEASE_TAG"
          fresh_url="https://github.com/oxhq/stasis-compat-bench/releases/download/$COMPARISON_RELEASE_TAG/fresh-crawl-raw.json"
          binding_url="https://github.com/oxhq/stasis-compat-bench/releases/download/$COMPARISON_RELEASE_TAG/artifact-binding.json"

          unset GH_TOKEN GITHUB_TOKEN
          curl -q --fail --silent --show-error --location --retry 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-redirs 3 --max-filesize 1048576 \
            --connect-timeout 30 --max-time 300 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'User-Agent: stasis-v0.3.3-crawl-phase-diagnostic-v2' \
            --output "$release_api" "$release_url"
          curl -q --fail --silent --show-error --location --retry 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-redirs 3 --max-filesize 1048576 \
            --connect-timeout 30 --max-time 300 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'User-Agent: stasis-v0.3.3-crawl-phase-diagnostic-v2' \
            --output "$tag_api" "$tag_url"
          curl -q --fail --silent --show-error --location --retry 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-redirs 3 --max-filesize 1048576 \
            --connect-timeout 30 --max-time 300 \
            --header 'Accept: application/octet-stream' \
            --header 'User-Agent: stasis-v0.3.3-crawl-phase-diagnostic-v2' \
            --output "$fresh_raw" "$fresh_url"
          curl -q --fail --silent --show-error --location --retry 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-redirs 3 --max-filesize 1048576 \
            --connect-timeout 30 --max-time 300 \
            --header 'Accept: application/octet-stream' \
            --header 'User-Agent: stasis-v0.3.3-crawl-phase-diagnostic-v2' \
            --output "$artifact_binding" "$binding_url"

          RELEASE_API="$release_api" \
          TAG_API="$tag_api" \
          FRESH_RAW="$fresh_raw" \
          ARTIFACT_BINDING="$artifact_binding" \
          INPUT_RECEIPT="$input_receipt" \
          FRESH_URL="$fresh_url" \
          BINDING_URL="$binding_url" \
            node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          function fail(message) {
            throw new Error(message);
          }
          function exactInteger(value, expected, label) {
            if (value !== Number(expected)) fail(`${label} mismatch`);
          }
          async function canonicalJson(filePath, expectedBytes, expectedSha256, label) {
            const bytes = await readFile(filePath);
            exactInteger(bytes.byteLength, expectedBytes, `${label} bytes`);
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (digest !== expectedSha256) fail(`${label} SHA-256 mismatch`);
            let value;
            try {
              value = JSON.parse(bytes.toString("utf8"));
            } catch {
              fail(`${label} is not valid JSON`);
            }
            const canonical = Buffer.from(`${JSON.stringify(value, null, 2)}\n`, "utf8");
            if (!canonical.equals(bytes)) fail(`${label} is not canonical JSON`);
          }

          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          const releaseApiUrl = `https://api.github.com/repos/oxhq/stasis-compat-bench/releases/${process.env.COMPARISON_RELEASE_ID}`;
          const releaseWebUrl = `https://github.com/oxhq/stasis-compat-bench/releases/tag/${process.env.COMPARISON_RELEASE_TAG}`;
          const releaseExpected = {
            id: Number(process.env.COMPARISON_RELEASE_ID),
            tag_name: process.env.COMPARISON_RELEASE_TAG,
            target_commitish: process.env.COMPARISON_RELEASE_TARGET,
            url: releaseApiUrl,
            html_url: releaseWebUrl,
            created_at: process.env.COMPARISON_RELEASE_CREATED_AT,
            published_at: process.env.COMPARISON_RELEASE_PUBLISHED_AT,
            immutable: true,
            draft: false,
            prerelease: false,
          };
          for (const [key, expected] of Object.entries(releaseExpected)) {
            if (release[key] !== expected) fail(`comparison release ${key} mismatch`);
          }
          const tagReference = JSON.parse(await readFile(process.env.TAG_API, "utf8"));
          const expectedTagRef = `refs/tags/${process.env.COMPARISON_RELEASE_TAG}`;
          const expectedTagApiUrl = `https://api.github.com/repos/oxhq/stasis-compat-bench/git/refs/tags/${process.env.COMPARISON_RELEASE_TAG}`;
          const expectedTagObjectUrl = `https://api.github.com/repos/oxhq/stasis-compat-bench/git/commits/${process.env.COMPARISON_RELEASE_TARGET}`;
          if (
            tagReference.ref !== expectedTagRef ||
            tagReference.url !== expectedTagApiUrl ||
            tagReference.object?.type !== "commit" ||
            tagReference.object?.sha !== process.env.COMPARISON_RELEASE_TARGET ||
            tagReference.object?.url !== expectedTagObjectUrl
          ) {
            fail("comparison release lightweight tag identity mismatch");
          }
          const expectedAssetNames = [
            "SHA256SUMS.txt",
            "actions-combined-logs.zip",
            "actions-combined.zip",
            "actions-crawl-logs.zip",
            "actions-crawl-raw.zip",
            "actions-rwa-logs.zip",
            "actions-rwa-raw.zip",
            "actions-source-metadata.zip",
            "artifact-binding.json",
            "contract-commit.json",
            "contract-release.json",
            "fresh-combined-evidence.json",
            "fresh-combined-evidence.md",
            "fresh-combined-verification.json",
            "fresh-crawl-raw.json",
            "fresh-independent-statistics-replay.json",
            "fresh-rwa-raw.json",
            "hosted-provenance.json",
            "original-combined-evidence.json",
            "original-crawl-raw.json",
            "original-rwa-raw.json",
            "privacy-scan.json",
            "replication-report.md",
            "replication-verification.json",
            "workflow-artifacts.json",
            "workflow-jobs.json",
            "workflow-run.json",
            "workflow-runs.json",
          ];
          const observedAssetNames = (release.assets ?? []).map(({ name }) => name).sort();
          if (JSON.stringify(observedAssetNames) !== JSON.stringify(expectedAssetNames)) {
            fail("comparison release 28-name asset inventory mismatch");
          }
          const expectedAssets = [
            {
              key: "freshCrawlRaw",
              id: Number(process.env.FRESH_CRAWL_RAW_ASSET_ID),
              name: "fresh-crawl-raw.json",
              bytes: Number(process.env.FRESH_CRAWL_RAW_BYTES),
              sha256: process.env.FRESH_CRAWL_RAW_SHA256,
              browserDownloadUrl: process.env.FRESH_URL,
              path: process.env.FRESH_RAW,
            },
            {
              key: "artifactBinding",
              id: Number(process.env.ARTIFACT_BINDING_ASSET_ID),
              name: "artifact-binding.json",
              bytes: Number(process.env.ARTIFACT_BINDING_BYTES),
              sha256: process.env.ARTIFACT_BINDING_SHA256,
              browserDownloadUrl: process.env.BINDING_URL,
              path: process.env.ARTIFACT_BINDING,
            },
          ];
          const retainedInputs = {};
          for (const expected of expectedAssets) {
            const matches = (release.assets ?? []).filter(({ name }) => name === expected.name);
            if (matches.length !== 1) fail(`comparison release asset count mismatch: ${expected.name}`);
            const asset = matches[0];
            if (
              asset.id !== expected.id ||
              asset.state !== "uploaded" ||
              asset.size !== expected.bytes ||
              asset.digest !== `sha256:${expected.sha256}` ||
              asset.browser_download_url !== expected.browserDownloadUrl
            ) {
              fail(`comparison release asset metadata mismatch: ${expected.name}`);
            }
            await canonicalJson(expected.path, expected.bytes, expected.sha256, expected.name);
            retainedInputs[expected.key] = {
              assetId: expected.id,
              name: expected.name,
              bytes: expected.bytes,
              sha256: expected.sha256,
              browserDownloadUrl: expected.browserDownloadUrl,
            };
          }
          const receipt = {
            schema: process.env.COMPARISON_INPUT_VERIFICATION_SCHEMA,
            status: "passed",
            mode: "anonymous_https",
            retries: false,
            credentialsUsed: false,
            comparisonEvidenceRelease: {
              repository: "oxhq/stasis-compat-bench",
              releaseId: releaseExpected.id,
              tag: releaseExpected.tag_name,
              targetCommitish: releaseExpected.target_commitish,
              apiUrl: releaseApiUrl,
              webUrl: releaseWebUrl,
              createdAt: releaseExpected.created_at,
              publishedAt: releaseExpected.published_at,
              immutable: true,
              draft: false,
              prerelease: false,
              assetNames: expectedAssetNames,
              tagReference: {
                ref: expectedTagRef,
                apiUrl: expectedTagApiUrl,
                objectType: "commit",
                objectSha: process.env.COMPARISON_RELEASE_TARGET,
                objectUrl: expectedTagObjectUrl,
              },
            },
            inputs: retainedInputs,
            verification: {
              releaseMetadataExact: true,
              releaseChronologyExact: true,
              exactTwentyEightNameAssetInventory: true,
              lightweightTagReferenceExact: true,
              selectedAssetMetadataExact: true,
              anonymousDownloads: true,
              downloadedBytesExact: true,
              downloadedSha256Exact: true,
              canonicalJsonExact: true,
            },
          };
          await writeFile(
            process.env.INPUT_RECEIPT,
            `${JSON.stringify(receipt, null, 2)}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 },
          );
          NODE

      - name: Verify the exact package source records
        id: verify_package_source
        if: ${{ steps.verify_comparison_input.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_record="$RUNNER_TEMP/stasis-package-run-$STASIS_PACKAGE_RUN_ID.json"
          artifact_records="$RUNNER_TEMP/stasis-package-artifacts-$STASIS_PACKAGE_RUN_ID.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STASIS_PACKAGE_RUN_ID" > "$run_record"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STASIS_PACKAGE_RUN_ID/artifacts?per_page=100" \
            > "$artifact_records"
          RUN_RECORD="$run_record" ARTIFACT_RECORDS="$artifact_records" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path(os.environ["RUN_RECORD"]).read_text(encoding="utf-8"))
          expected_run = {
              "id": 33506181780,
              "run_attempt": 1,
              "event": "push",
              "status": "completed",
              "conclusion": "success",
              "head_branch": "main",
              "head_sha": "48c5a718a9ddd63f496e45307e1484974ccf8587",
              "path": ".github/workflows/stasis-package.yml",
              "workflow_id": 340124521,
          }
          for key, expected in expected_run.items():
              if run.get(key) != expected:
                  raise SystemExit(f"package run {key} mismatch")

          expected_artifacts = {
              "stasis-runtime-manifest-attempt-1": (9803607695, 1070),
              "stasis-typescript-attempt-1": (9803606920, 184329),
              "stasis-linux-x86_64-act-settle-inspect-proof-attempt-1": (9803003770, 786),
              "stasis-linux-x86_64-attempt-1": (9803003109, 34117650),
          }
          records = json.loads(
              Path(os.environ["ARTIFACT_RECORDS"]).read_text(encoding="utf-8")
          ).get("artifacts", [])
          by_name = {record.get("name"): record for record in records}
          for name, (artifact_id, compressed_bytes) in expected_artifacts.items():
              record = by_name.get(name)
              workflow_run = (record or {}).get("workflow_run") or {}
              if (
                  record is None
                  or record.get("id") != artifact_id
                  or record.get("size_in_bytes") != compressed_bytes
                  or record.get("expired") is not False
                  or workflow_run.get("id") != expected_run["id"]
                  or workflow_run.get("head_sha") != expected_run["head_sha"]
              ):
                  raise SystemExit(f"package artifact metadata mismatch: {name}")
          PY

      - name: Download the exact Linux package artifact
        id: download_linux
        if: ${{ steps.verify_package_source.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
