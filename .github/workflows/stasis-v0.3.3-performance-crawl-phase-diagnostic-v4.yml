      - name: Verify and extract the exact Linux candidate inputs
        id: verify_candidate
        if: ${{ steps.download_runtime_manifest.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stasis-linux-input/stasis-0.3.3-linux-x86_64.tar.gz"
          proof="$RUNNER_TEMP/stasis-linux-proof-input/stasis-0.3.3-linux-x86_64-act-settle-inspect.json"
          sdk="$RUNNER_TEMP/stasis-typescript-input/oxhq-stasis-0.3.3.tgz"
          manifest="$RUNNER_TEMP/stasis-runtime-manifest-input/stasis-0.3.3-runtime-manifest.json"
          linux_extract="$RUNNER_TEMP/stasis-linux-extracted"
          sdk_extract="$RUNNER_TEMP/stasis-sdk-extracted"
          test ! -e "$linux_extract"
          test ! -e "$sdk_extract"
          mkdir "$linux_extract" "$sdk_extract"
          test "$(stat --format='%s' "$archive")" = '34279279'
          test "$(sha256sum "$archive" | awk '{print $1}')" = '5965e932cab407aa75d3f283015bf5d5df92cf06ecbd5f1add03083937208e86'
          test "$(stat --format='%s' "$proof")" = '1160'
          test "$(sha256sum "$proof" | awk '{print $1}')" = '81e44c9dba85bc10cc67536388f11a9e251b7d4d29e3fc740c98afbfefba1cac'
          test "$(stat --format='%s' "$sdk")" = '181292'
          test "$(sha256sum "$sdk" | awk '{print $1}')" = '55063c0ab9fc802e101d792831c292f1a7b0b497a141603102eacbef9fc029ec'
          test "$(stat --format='%s' "$manifest")" = '2503'
          test "$(sha256sum "$manifest" | awk '{print $1}')" = '4e466dbd269fb08738c265133aa5bed2d139d2750db6a5060230e63527ee39a4'
          tar -xzf "$archive" -C "$linux_extract"
          tar -xzf "$sdk" -C "$sdk_extract"
          executable="$linux_extract/stasis-0.3.3-linux-x86_64/stasis"
          test -x "$executable"
          test "$(stat --format='%s' "$executable")" = '83877352'
          test "$(sha256sum "$executable" | awk '{print $1}')" = 'c6a37995cde25275454d7f1ee61c2803964b04bf0d35f8fde7c78e9575c74c37'
          salt=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
          test "${#salt}" = '64'
          echo "::add-mask::$salt"
          printf 'STASIS_PERFORMANCE_BOOT_SALT=%s\n' "$salt" >> "$GITHUB_ENV"

      - name: Run one Crawlee-then-Stasis phase diagnostic V2
        id: diagnostic_execution
        if: ${{ steps.verify_candidate.outcome == 'success' }}
        shell: bash
        working-directory: benchmark
        env:
          STASIS_COMPAT_ARTIFACT_DIR: ${{ github.workspace }}/benchmark/artifacts/runs/crawl-phase-diagnostic-v2-${{ github.run_id }}-${{ github.run_attempt }}
          STASIS_PERFORMANCE_AUTHORITY_CRAWL_RAW_PATH: ${{ runner.temp }}/stasis-crawl-phase-authority-v2/fresh-crawl-raw.json
          STASIS_PERFORMANCE_AUTHORITY_CRAWL_RAW_SHA256: 52a76a4ebb726c6ab78b70356655e8abd7a5e84d9ce175a8e0d876f543c1a16b
          STASIS_PERFORMANCE_ARTIFACT_BINDING_PATH: ${{ runner.temp }}/stasis-crawl-phase-authority-v2/artifact-binding.json
          STASIS_PERFORMANCE_LINUX_ARCHIVE: ${{ runner.temp }}/stasis-linux-input/stasis-0.3.3-linux-x86_64.tar.gz
          STASIS_PERFORMANCE_LINUX_EXECUTABLE: ${{ runner.temp }}/stasis-linux-extracted/stasis-0.3.3-linux-x86_64/stasis
          STASIS_PERFORMANCE_LINUX_PROOF: ${{ runner.temp }}/stasis-linux-proof-input/stasis-0.3.3-linux-x86_64-act-settle-inspect.json
          STASIS_PERFORMANCE_RUNTIME_MANIFEST: ${{ runner.temp }}/stasis-runtime-manifest-input/stasis-0.3.3-runtime-manifest.json
          STASIS_PERFORMANCE_SDK_ARCHIVE: ${{ runner.temp }}/stasis-typescript-input/oxhq-stasis-0.3.3.tgz
          STASIS_PERFORMANCE_SDK_PACKAGE_ROOT: ${{ runner.temp }}/stasis-sdk-extracted/package
        run: |
          set -euo pipefail
          node src/performance/run-crawl-phase-diagnostic.mjs

      - name: Verify the diagnostic V2 artifact set offline
        id: offline_verification
        if: ${{ steps.diagnostic_execution.outcome == 'success' }}
        shell: bash
        working-directory: benchmark
        env:
          DIAGNOSTIC_ROOT: ${{ github.workspace }}/benchmark/artifacts/runs/crawl-phase-diagnostic-v2-${{ github.run_id }}-${{ github.run_attempt }}/performance/diagnostics
          AUTHORITY_ROOT: ${{ runner.temp }}/stasis-crawl-phase-authority-v2
        run: |
          set -euo pipefail
          crawlee_raw="$DIAGNOSTIC_ROOT/crawl-phase-crawlee-raw.json"
          stasis_raw="$DIAGNOSTIC_ROOT/crawl-phase-stasis-raw.json"
          localization="$DIAGNOSTIC_ROOT/crawl-phase-localization-evidence.json"
          fresh_authority="$AUTHORITY_ROOT/fresh-crawl-raw.json"
          artifact_binding="$AUTHORITY_ROOT/artifact-binding.json"
          verification="$DIAGNOSTIC_ROOT/diagnostic-verification.json"
          cli_receipt="$RUNNER_TEMP/stasis-crawl-phase-diagnostic-v2-verification-cli.json"
          test ! -e "$cli_receipt"
          node src/performance/crawl-phase-diagnostic-verification-cli.mjs verify \
            "$crawlee_raw" \
            "$stasis_raw" \
            "$localization" \
            "$fresh_authority" \
            "$artifact_binding" \
            "$verification" > "$cli_receipt"
          VERIFICATION="$verification" \
          CLI_RECEIPT="$cli_receipt" \
          CRAWLEE_RAW="$crawlee_raw" \
          STASIS_RAW="$stasis_raw" \
          LOCALIZATION="$localization" \
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          async function canonicalJson(filePath, label) {
            const bytes = await readFile(filePath);
            const value = JSON.parse(bytes.toString("utf8"));
            const canonical = Buffer.from(`${JSON.stringify(value, null, 2)}\n`, "utf8");
            if (!canonical.equals(bytes)) throw new Error(`${label} is not canonical`);
            return value;
          }

          const receipt = await canonicalJson(
            process.env.VERIFICATION,
            "diagnostic verification",
          );
          const cliReceipt = await canonicalJson(
            process.env.CLI_RECEIPT,
            "diagnostic verification CLI receipt",
          );
          if (
            receipt.schema !== process.env.H4_DIAGNOSTIC_VERIFICATION_SCHEMA
            || cliReceipt.schema !== process.env.H4_DIAGNOSTIC_VERIFICATION_CLI_SCHEMA
            || cliReceipt.status !== "passed"
            || cliReceipt.command !== "verify"
            || cliReceipt.receiptSchema !== process.env.H4_DIAGNOSTIC_VERIFICATION_SCHEMA
            || cliReceipt.outputCreatedExclusively !== true
            || cliReceipt.outputName !== "diagnostic-verification.json"
          ) {
            throw new Error("frozen H4 V1 verification receipt identity mismatch");
          }
          const crawlee = await canonicalJson(process.env.CRAWLEE_RAW, "Crawlee raw diagnostic");
          const stasis = await canonicalJson(process.env.STASIS_RAW, "Stasis raw diagnostic");
          const localization = await canonicalJson(
            process.env.LOCALIZATION,
            "localization evidence",
          );
          for (const [lane, artifact] of [["crawlee", crawlee], ["stasis", stasis]]) {
            if (
              artifact.schema !== process.env.DIAGNOSTIC_SCHEMA
              || artifact.protocol !== process.env.DIAGNOSTIC_PROTOCOL
              || artifact.lane !== lane
              || artifact.purpose !== "phase_localization_diagnostic_only"
              || artifact.settlement?.status !== "fulfilled"
              || artifact.outerInterval?.settlement !== "fulfilled"
            ) {
              throw new Error(`${lane} V2 diagnostic identity mismatch`);
            }
          }
          if (
            stasis.runner?.sourceModule !== "src/performance/crawl.mjs"
            || stasis.runner?.factory !== "createStasisPerformanceRunner"
            || stasis.runner?.dependencyHook !== process.env.STASIS_DIAGNOSTIC_DEPENDENCY_HOOK
            || stasis.runner?.substituted !== false
          ) {
            throw new Error("Stasis V2 frozen-SDK adapter identity mismatch");
          }
          if (
            localization.schema !== process.env.DIAGNOSTIC_EVIDENCE_SCHEMA
            || localization.protocol !== process.env.DIAGNOSTIC_EVIDENCE_PROTOCOL
            || localization.purpose !== "phase_localization_diagnostic_only"
          ) {
            throw new Error("V2 localization evidence identity mismatch");
          }
          const expected = {
            status: "passed",
            authorityEligible: false,
            timingEligible: false,
            statisticsEligible: false,
            comparisonEligible: false,
            optimizationEligible: false,
            generalizedSpeedClaimAuthorized: false,
            implementationWorkAuthorized: false,
            decisionState: "STAY_0_4_UNASSIGNED",
          };
          for (const [key, value] of Object.entries(expected)) {
            if (receipt[key] !== value) throw new Error(`diagnostic verification ${key} mismatch`);
          }
          NODE

      - name: Seal the exact five-file diagnostic V2 evidence inventory
        id: seal_evidence
        if: ${{ steps.offline_verification.outcome == 'success' }}
        shell: bash
        working-directory: benchmark
        env:
          DIAGNOSTIC_ROOT: ${{ github.workspace }}/benchmark/artifacts/runs/crawl-phase-diagnostic-v2-${{ github.run_id }}-${{ github.run_attempt }}/performance/diagnostics
          INPUT_RECEIPT: ${{ runner.temp }}/stasis-crawl-phase-authority-v2/comparison-input-verification.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, readdir, lstat, writeFile } from "node:fs/promises";
          import path from "node:path";

          const root = path.resolve(process.env.DIAGNOSTIC_ROOT);
          const before = [
            "crawl-phase-crawlee-raw.json",
            "crawl-phase-localization-evidence.json",
            "crawl-phase-stasis-raw.json",
            "diagnostic-verification.json",
          ];
          const after = [
            "comparison-input-verification.json",
            ...before,
          ].sort();
          const observedBefore = (await readdir(root)).sort();
          if (JSON.stringify(observedBefore) !== JSON.stringify(before)) {
            throw new Error("pre-seal diagnostic inventory mismatch");
          }
          const inputBytes = await readFile(process.env.INPUT_RECEIPT);
          const input = JSON.parse(inputBytes.toString("utf8"));
          const inputCanonical = Buffer.from(`${JSON.stringify(input, null, 2)}\n`, "utf8");
          if (!inputCanonical.equals(inputBytes) || input.status !== "passed") {
            throw new Error("comparison input verification receipt is invalid");
          }
          await writeFile(
            path.join(root, "comparison-input-verification.json"),
            inputBytes,
            { flag: "wx", mode: 0o600 },
          );
          const observedAfter = (await readdir(root)).sort();
          if (JSON.stringify(observedAfter) !== JSON.stringify(after)) {
            throw new Error("sealed diagnostic inventory mismatch");
          }
          for (const name of observedAfter) {
            const filePath = path.join(root, name);
            const metadata = await lstat(filePath);
            if (!metadata.isFile() || metadata.isSymbolicLink()) {
              throw new Error(`sealed diagnostic member is not a regular file: ${name}`);
            }
            const bytes = await readFile(filePath);
            const value = JSON.parse(bytes.toString("utf8"));
            const canonical = Buffer.from(`${JSON.stringify(value, null, 2)}\n`, "utf8");
            if (!canonical.equals(bytes)) {
              throw new Error(`sealed diagnostic member is not canonical: ${name}`);
            }
          }
          NODE

      - name: Create the bounded diagnostic V2 outcome
        id: create_outcome
        if: always()
        shell: bash
        env:
          VALIDATE_INVOCATION_OUTCOME: ${{ steps.validate_invocation.outcome }}
          CHECKOUT_HARNESS_OUTCOME: ${{ steps.checkout_harness.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          VERIFY_RUNTIME_OUTCOME: ${{ steps.verify_runtime.outcome }}
          VERIFY_V1_MOTIVATION_OUTCOME: ${{ steps.verify_v1_motivation.outcome }}
          INSTALL_HARNESS_OUTCOME: ${{ steps.install_harness.outcome }}
          INSTALL_BROWSER_OUTCOME: ${{ steps.install_browser.outcome }}
          PROVISION_EGL_OUTCOME: ${{ steps.provision_egl.outcome }}
          VERIFY_COMPARISON_INPUT_OUTCOME: ${{ steps.verify_comparison_input.outcome }}
          VERIFY_PACKAGE_SOURCE_OUTCOME: ${{ steps.verify_package_source.outcome }}
          DOWNLOAD_LINUX_OUTCOME: ${{ steps.download_linux.outcome }}
          DOWNLOAD_LINUX_PROOF_OUTCOME: ${{ steps.download_linux_proof.outcome }}
          DOWNLOAD_TYPESCRIPT_OUTCOME: ${{ steps.download_typescript.outcome }}
          DOWNLOAD_RUNTIME_MANIFEST_OUTCOME: ${{ steps.download_runtime_manifest.outcome }}
          VERIFY_CANDIDATE_OUTCOME: ${{ steps.verify_candidate.outcome }}
          DIAGNOSTIC_EXECUTION_OUTCOME: ${{ steps.diagnostic_execution.outcome }}
          OFFLINE_VERIFICATION_OUTCOME: ${{ steps.offline_verification.outcome }}
          SEAL_EVIDENCE_OUTCOME: ${{ steps.seal_evidence.outcome }}
        run: |
          set -euo pipefail
          status_root="$RUNNER_TEMP/stasis-crawl-phase-diagnostic-v2-status"
          test ! -e "$status_root"
          mkdir "$status_root"
          STATUS_ROOT="$status_root" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          input_steps = [
              "VALIDATE_INVOCATION_OUTCOME",
              "CHECKOUT_HARNESS_OUTCOME",
              "SETUP_NODE_OUTCOME",
              "VERIFY_RUNTIME_OUTCOME",
              "VERIFY_V1_MOTIVATION_OUTCOME",
              "INSTALL_HARNESS_OUTCOME",
              "INSTALL_BROWSER_OUTCOME",
              "PROVISION_EGL_OUTCOME",
              "VERIFY_COMPARISON_INPUT_OUTCOME",
              "VERIFY_PACKAGE_SOURCE_OUTCOME",
              "DOWNLOAD_LINUX_OUTCOME",
              "DOWNLOAD_LINUX_PROOF_OUTCOME",
              "DOWNLOAD_TYPESCRIPT_OUTCOME",
              "DOWNLOAD_RUNTIME_MANIFEST_OUTCOME",
              "VERIFY_CANDIDATE_OUTCOME",
          ]
          diagnostic_steps = ["DIAGNOSTIC_EXECUTION_OUTCOME"]
          offline_steps = [
              "OFFLINE_VERIFICATION_OUTCOME",
              "SEAL_EVIDENCE_OUTCOME",
          ]
          if not all(os.environ.get(name) == "success" for name in input_steps):
              phase = "input_verification"
              failure_code = "INPUT_VERIFICATION_FAILED"
          elif not all(os.environ.get(name) == "success" for name in diagnostic_steps):
              phase = "diagnostic_execution"
              failure_code = "DIAGNOSTIC_EXECUTION_FAILED"
          elif not all(os.environ.get(name) == "success" for name in offline_steps):
              phase = "offline_verification"
              failure_code = "OFFLINE_VERIFICATION_FAILED"
          else:
              phase = "complete"
              failure_code = None

          passed = failure_code is None
          outcome = {
              "schema": os.environ["DIAGNOSTIC_OUTCOME_SCHEMA"],
              "status": "passed" if passed else "failed",
              "outcomeClass": (
                  "VALID_NON_AUTHORITATIVE"
                  if passed
                  else "DIAGNOSTIC_INVALID_WITH_STATUS"
              ),
              "phase": phase,
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "evidenceArtifactEligible": passed,
              "authorityEligible": False,
              "timingEligible": False,
              "statisticsEligible": False,
              "comparisonEligible": False,
              "optimizationEligible": False,
              "generalizedSpeedClaimAuthorized": False,
              "implementationWorkAuthorized": False,
              "decisionState": "STAY_0_4_UNASSIGNED",
              "failure": (
                  None
                  if passed
                  else {"code": failure_code, "messageOmitted": True}
              ),
          }
          destination = Path(os.environ["STATUS_ROOT"]) / "diagnostic-outcome.json"
          with destination.open("x", encoding="utf-8", newline="\n") as handle:
              json.dump(outcome, handle, ensure_ascii=True, indent=2)
              handle.write("\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"diagnostic_v2_status={outcome['status']}\n")
          PY

      - name: Seal the outcome-specific diagnostic V2 bundle
        id: seal_bundle
        if: ${{ always() && steps.create_outcome.outcome == 'success' }}
        shell: bash
        env:
          DIAGNOSTIC_ROOT: ${{ github.workspace }}/benchmark/artifacts/runs/crawl-phase-diagnostic-v2-${{ github.run_id }}-${{ github.run_attempt }}/performance/diagnostics
          OUTCOME_PATH: ${{ runner.temp }}/stasis-crawl-phase-diagnostic-v2-status/diagnostic-outcome.json
        run: |
          set -euo pipefail
          bundle_root="$RUNNER_TEMP/stasis-crawl-phase-diagnostic-v2-bundle"
          test ! -e "$bundle_root"
          mkdir "$bundle_root"
          BUNDLE_ROOT="$bundle_root" node --input-type=module <<'NODE'
          import { lstat, readFile, readdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          const validEvidenceNames = [
            "comparison-input-verification.json",
            "crawl-phase-crawlee-raw.json",
            "crawl-phase-localization-evidence.json",
            "crawl-phase-stasis-raw.json",
            "diagnostic-verification.json",
          ];
          const outcomeKeys = [
            "schema",
            "status",
            "outcomeClass",
            "phase",
            "runAttempt",
            "evidenceArtifactEligible",
            "authorityEligible",
            "timingEligible",
            "statisticsEligible",
            "comparisonEligible",
            "optimizationEligible",
            "generalizedSpeedClaimAuthorized",
            "implementationWorkAuthorized",
            "decisionState",
            "failure",
          ];
          const disabledClaims = [
            "authorityEligible",
            "timingEligible",
            "statisticsEligible",
            "comparisonEligible",
            "optimizationEligible",
            "generalizedSpeedClaimAuthorized",
            "implementationWorkAuthorized",
          ];
          const failedPhases = new Map([
            ["input_verification", "INPUT_VERIFICATION_FAILED"],
            ["diagnostic_execution", "DIAGNOSTIC_EXECUTION_FAILED"],
            ["offline_verification", "OFFLINE_VERIFICATION_FAILED"],
          ]);
          const root = path.resolve(process.env.BUNDLE_ROOT);
          const outcomeBytes = await canonicalJsonFile(process.env.OUTCOME_PATH, "diagnostic outcome");
          const outcome = JSON.parse(outcomeBytes.toString("utf8"));
          assertExactKeys(outcome, outcomeKeys, "diagnostic outcome");
          if (
            outcome.schema !== process.env.DIAGNOSTIC_OUTCOME_SCHEMA
            || outcome.runAttempt !== 1
            || outcome.decisionState !== "STAY_0_4_UNASSIGNED"
            || disabledClaims.some((name) => outcome[name] !== false)
          ) {
            throw new Error("diagnostic outcome common invariants are invalid");
          }
          if (outcome.status === "passed") {
            if (
              outcome.outcomeClass !== "VALID_NON_AUTHORITATIVE"
              || outcome.phase !== "complete"
              || outcome.evidenceArtifactEligible !== true
              || outcome.failure !== null
            ) {
              throw new Error("valid diagnostic outcome invariants are invalid");
            }
          } else if (outcome.status === "failed") {
            assertExactKeys(outcome.failure, ["code", "messageOmitted"], "diagnostic failure");
            if (
              outcome.outcomeClass !== "DIAGNOSTIC_INVALID_WITH_STATUS"
              || outcome.evidenceArtifactEligible !== false
              || failedPhases.get(outcome.phase) !== outcome.failure.code
              || outcome.failure.messageOmitted !== true
            ) {
              throw new Error("invalid diagnostic outcome invariants are invalid");
            }
          } else {
            throw new Error("diagnostic outcome status is invalid");
          }
          await writeFile(path.join(root, "diagnostic-outcome.json"), outcomeBytes, {
            flag: "wx",
            mode: 0o600,
          });
          const expected = ["diagnostic-outcome.json"];
          if (outcome.status === "passed") {
            const evidenceRoot = path.resolve(process.env.DIAGNOSTIC_ROOT);
            const observedEvidence = (await readdir(evidenceRoot)).sort();
            if (JSON.stringify(observedEvidence) !== JSON.stringify(validEvidenceNames)) {
              throw new Error("valid diagnostic evidence inventory changed before bundling");
            }
            for (const name of validEvidenceNames) {
              const bytes = await canonicalJsonFile(path.join(evidenceRoot, name), name);
              await writeFile(path.join(root, name), bytes, { flag: "wx", mode: 0o600 });
              expected.push(name);
            }
          }
          expected.sort();
          const observed = (await readdir(root)).sort();
          if (JSON.stringify(observed) !== JSON.stringify(expected)) {
            throw new Error("outcome-specific diagnostic bundle inventory mismatch");
          }
          for (const name of observed) {
            const metadata = await lstat(path.join(root, name));
            if (!metadata.isFile() || metadata.isSymbolicLink()) {
              throw new Error(`diagnostic bundle member is not a regular file: ${name}`);
            }
          }

          async function canonicalJsonFile(filePath, label) {
            const metadata = await lstat(filePath);
            if (!metadata.isFile() || metadata.isSymbolicLink()) {
              throw new Error(`${label} is not a regular file`);
            }
            const bytes = await readFile(filePath);
            const value = JSON.parse(bytes.toString("utf8"));
            const canonical = Buffer.from(`${JSON.stringify(value, null, 2)}\n`, "utf8");
            if (!canonical.equals(bytes)) throw new Error(`${label} is not canonical JSON`);
            return bytes;
          }

          function assertExactKeys(value, expected, label) {
            if (value === null || Array.isArray(value) || typeof value !== "object") {
              throw new Error(`${label} is not an object`);
            }
            const observed = Object.keys(value);
            if (JSON.stringify(observed) !== JSON.stringify(expected)) {
              throw new Error(`${label} keys are invalid`);
            }
          }
          NODE

      - name: Retain the outcome-specific diagnostic V2 bundle
        id: upload_bundle
        if: ${{ always() && steps.seal_bundle.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-v0.3.3-crawl-phase-diagnostic-v4-bundle-attempt-1
          path: ${{ runner.temp }}/stasis-crawl-phase-diagnostic-v2-bundle
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: false

      - name: Propagate the terminal diagnostic V2 outcome
        if: ${{ always() && (steps.create_outcome.outcome != 'success' || steps.seal_bundle.outcome != 'success' || steps.upload_bundle.outcome != 'success' || steps.create_outcome.outputs.diagnostic_v2_status != 'passed') }}
        shell: bash
        run: |
          set -euo pipefail
          exit 1
