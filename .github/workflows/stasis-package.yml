          cat > release-notes.md <<EOF
          # Stasis $TAG

          Stasis modern-web controlled-session release.

          - Exact source commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$HEAD_SHA
          - Package and gate run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - Producer attempts: macOS $MACOS_RUN_ATTEMPT, Linux $LINUX_RUN_ATTEMPT, SDK $SDK_RUN_ATTEMPT, provenance $ATTEST_RUN_ATTEMPT
          - Native platforms: macOS Apple Silicon and Linux x86_64
          - Linux compatibility floor: Ubuntu 22.04 / glibc 2.35
          - macOS signing: unsigned and not Apple-notarized

          Stasis 0.3 preserves the frozen controlled-webapp-v1 and
          controlled-web-session-v1 contracts. The explicitly selected
          controlled-web-session-v2 profile adds bounded, same-global, untransferred
          MessageChannel/MessagePort delivery; a bounded direct top-level HTMLImageElement.src
          cache/decode completion path for canonical data SVG and direct HTTP(S) selection; a
          distinct bounded top-level inline SVG
          path for its exact cached internally serialized data-SVG request and cache-ID owner on the
          same ScriptThread/ImageCache. An identical current inline root may join an exact retained
          producer when its cache-key URL and PendingImageId match an existing same-ID fenced
          layout record and every live callback is uniformly fenced with that exact producer URL
          key. The callback owns that key until terminal removal, so an earlier DOM owner may
          already have unbound and its identity is neither required nor trusted. The callback set
          remains nonempty, no baseline work may coexist, and the new current owner is retained
          once. The peer reuses the existing listener and producer without adding a listener,
          producer, or fetch.
          Baseline, v1, external/nested SVG, iframe, worker, worklet, and cross-loop authority
          remains unchanged. V2 also adds
          an explicit headless InputMethod boundary for controlled top-level, single-line text focus
          without a virtual-keyboard request. Admitted HTML image completion sets and
          engine-generated focus transitions use document-clock timestamps. Every browser-created
          event constructed synchronously during one public mutating automation action shares one
          pre-mutation document-clock sample; the form-event proof is representative. Each nonempty
          owned CSS animation pending-event dispatch batch also shares one document-clock sample
          across internal AnimationEvent records owned by the exact public non-auxiliary controlled
          top-level WebView/document. TransitionEvent stamping is conditional on an existing owned
          transition record reaching that queue; general transition settlement is not claimed.
          Auxiliary WebViews remain host-stamped.
          The v2 profile also owns persistent-cookie expiry inside the controlled session: the
          document clock is Unix-nanosecond authority, the last valid Max-Age takes precedence
          over Expires, lifetime is clamped to 400 days, expiry is lazily purged, and an expiry at
          or before controlled now deletes the cookie. SameSite selection uses the captured
          schemeful site-for-cookies, the current redirect-hop method, and the top-level-navigation
          bit; ineligible cookies are filtered before a request. After successful controlled
          parsing, cross-site subresource responses retain only valid Secure SameSite=None cookies;
          otherwise valid Strict/Lax/unspecified values are ignored, while parse, normalization,
          and time-range failures retain their existing typed outcomes. Persistent cookies remain
          memory-only and become portable only through explicit controlled-web-session-v2 state
          export/import. A v1 artifact is never migrated implicitly, opaque or unknown SameSite
          context is typed unsupported, and partitioned cookies remain outside the profile.
          The HTML image path requires direct-src selection within its initial 65,536-byte selected-URL
          and retained-ownership limits. An admitted synchronous cache hit is owned in the current
          Script turn without an invented asynchronous Image producer lease; finite asynchronous
          cache/decode completion is Image-producer fenced. Canonical data URLs require exact
          image/svg+xml; direct HTTP(S) is admitted before response format is known, with Resource I/O
          separately owned and finite decode failure retained as an owned error completion. A final
          redirect URL is not rechecked against that initial selected-URL limit; Resource I/O and the
          immutable session network policy remain authoritative. Deterministic cache reuse is proven
          only within one pipeline's image-cache store under immutable fixture routes, not across
          pipelines or for live or mutable HTTP content. Post-metadata
          multipart/x-mixed-replace remains typed unsupported after separately owned finite Resource
          I/O drains, without baseline callback fallback; an endless response remains blocked on
          that external I/O. Public document replacement while HTTP image resource I/O remains active keeps
          the fatal blocked_on_external_io boundary; v2 does not claim replacement through that
          state. The inline path also
          requires an internal request and exact cached-URL/cache-ID join; it is fenced through
          decode/raster completion and creates no DOM load event. Script-created events, including
          AnimationEvent/TransitionEvent constructors, port
          transfer, excluded image sources/consumers, general SVG/resource semantics, cross-global
          messaging, workers, iframes, external ingress, and other undeclared sources receive no
          new controlled authority. Baseline and v1 SVG behavior are unchanged.
          A nonempty document-owned pending CSS animation-event queue retains one later owned
          rendering opportunity until dispatch drains it; an empty queue leaves no opportunity.
          With persistentWork=report, v2 may advance an eligible exact JavaScript interval head
          while finite work remains. Finite timer and animated-image deadlines must be strictly
          later. One finite rendering opportunity may share the timestamp only as a distinct exact
          same-scheduler owner whose TimerId sequence follows the interval head; same-entry,
          lower-or-equal-order, foreign-scheduler, bare/unowned, equal finite-timer, and equal
          animated-image collisions remain blocked. Every callback consumes the existing execution budgets, and an
          interval-only document checkpoints as quiescent_with_persistent_work without another
          cycle. Strict policy and both predecessor profiles retain stop-at-interval behavior.

          Windows x86_64 is compiled, packaged, dependency-closed, and exercised in package CI.
          It remains an unsigned CI-only artifact and is not a managed release asset in this tag.

          This draft contains both native archives, archive and binary SHA-256 sidecars,
          artifact-bound native gate proofs, and the exact runtime distribution manifest
          embedded in the npm package. GitHub build provenance is available through the
          GitHub CLI attestation verifier for every asset.
          EOF

          mkdir release-state
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-state/release-pages.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          version = os.environ["STASIS_VERSION"]
          tag = os.environ["TAG"]
          title = f"Stasis {tag}"
          expected_names = {f"stasis-{version}-runtime-manifest.json"}
          for platform in ("macos-aarch64", "linux-x86_64"):
              bundle = f"stasis-{version}-{platform}"
              archive = f"{bundle}.tar.gz"
              expected_names.update({
                  archive,
                  f"{archive}.sha256",
                  f"{bundle}.binary.sha256",
                  f"{bundle}-act-settle-inspect.json",
              })

          files = {}
          for directory_name in ("release-assets", "gate-proof"):
              directory = pathlib.Path(directory_name)
              for filename in directory.iterdir():
                  if filename.is_symlink() or not filename.is_file():
                      raise SystemExit("release handoff contains a non-regular asset")
                  if filename.name in files:
                      raise SystemExit(f"duplicate local release asset: {filename.name}")
                  digest = hashlib.sha256()
                  with filename.open("rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  files[filename.name] = {
                      "path": str(filename),
                      "size": filename.stat().st_size,
                      "digest": f"sha256:{digest.hexdigest()}",
                  }
          if set(files) != expected_names:
              raise SystemExit(
                  "local release inventory changed before draft recovery: "
                  f"{sorted(files)}"
              )
          pathlib.Path("release-state/expected-assets.json").write_text(
              json.dumps(files, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          pages = json.loads(
              pathlib.Path("release-state/release-pages.json").read_text(encoding="utf-8")
          )
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("authenticated release enumeration is malformed")
          releases = [release for page in pages for release in page]
          matches = [
              release for release in releases
              if isinstance(release, dict) and release.get("tag_name") == tag
          ]
          if len(matches) > 1:
              raise SystemExit(f"multiple releases use exact tag {tag}")

          state = {
              "releaseId": None,
              "missingAssetNames": sorted(expected_names),
              "starterAssetIds": [],
          }
          if matches:
              release = matches[0]
              release_id = release.get("id")
              notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
              if (
                  type(release_id) is not int
                  or release_id <= 0
                  or release.get("tag_name") != tag
                  or release.get("name") != title
                  or release.get("body") != notes
                  or release.get("draft") is not True
                  or release.get("prerelease") is not False
                  or release.get("immutable") is not False
                  or release.get("published_at") is not None
              ):
                  raise SystemExit(f"existing release {tag} is not the exact resumable draft")
              assets = release.get("assets")
              if not isinstance(assets, list):
                  raise SystemExit("existing draft asset inventory is malformed")
              seen = set()
              missing = set(expected_names)
              starter_ids = []
              for asset in assets:
                  if not isinstance(asset, dict):
                      raise SystemExit("existing draft has a malformed asset")
                  name = asset.get("name")
                  if not isinstance(name, str) or name not in files or name in seen:
                      raise SystemExit(f"existing draft has an unexpected or duplicate asset: {name!r}")
                  seen.add(name)
                  expected = files[name]
                  asset_state = asset.get("state")
                  if asset_state == "uploaded":
                      if (
                          asset.get("size") != expected["size"]
                          or asset.get("digest") != expected["digest"]
                      ):
                          raise SystemExit(f"existing draft asset bytes changed: {name}")
                      missing.remove(name)
                  elif asset_state == "starter":
                      asset_id = asset.get("id")
                      if (
                          type(asset_id) is not int
                          or asset_id <= 0
                          or asset.get("size") not in (0, None)
                          or asset.get("digest") not in (None, "")
                      ):
                          raise SystemExit(f"existing draft starter asset is malformed: {name}")
                      starter_ids.append(asset_id)
                  else:
                      raise SystemExit(f"existing draft asset is not immutable uploaded state: {name}")
              state = {
                  "releaseId": release_id,
                  "missingAssetNames": sorted(missing),
                  "starterAssetIds": sorted(starter_ids),
              }
          pathlib.Path("release-state/draft-state.json").write_text(
              json.dumps(state, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          draft_release_id=$(jq -r '.releaseId // ""' release-state/draft-state.json)
          if [[ -n "$draft_release_id" && ! "$draft_release_id" =~ ^[1-9][0-9]*$ ]]; then
