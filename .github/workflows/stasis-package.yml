              "servo_revision": "0d579bd5aab6df3764fad805427254751632a6e4",
              "pliego_repository": "https://github.com/oxhq/pliego.git",
              "pliego_revision": "556c774242b272b11bc60999449c5debff1ad20f",
              "pliego_servo_merge_base": "313b6d5ecc113b08010ce434140db3ca5abcc71c",
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }

          max_tarball_bytes = 32 * 1024 * 1024
          max_member_bytes = 16 * 1024 * 1024
          max_total_member_bytes = 64 * 1024 * 1024
          max_tar_members = 256
          max_expanded_tar_bytes = max_total_member_bytes + 4 * 1024 * 1024
          stream_chunk_bytes = 1024 * 1024
          install_hooks = {
              "preinstall", "install", "postinstall", "prepublish",
              "preprepare", "prepare", "postprepare",
          }
          windows_reserved = {
              "con", "prn", "aux", "nul",
              *(f"com{number}" for number in range(1, 10)),
              *(f"lpt{number}" for number in range(1, 10)),
          }
          windows_forbidden = set('<>:"\\|?*')

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(source_bytes, context):
              if isinstance(source_bytes, bytes):
                  try:
                      source_bytes = source_bytes.decode("utf-8")
                  except UnicodeError as error:
                      raise SystemExit(f"{context} is not UTF-8: {error}") from error
              try:
                  return json.loads(
                      source_bytes,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
