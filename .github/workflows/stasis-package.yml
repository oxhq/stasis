            read -r tag_type tag_sha < <(jq -er '[.object.type, .object.sha] | @tsv' tag.json)
            if [[ "$tag_type" != 'commit' || "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "existing tag $TAG is not a lightweight tag at $HEAD_SHA" >&2
              exit 1
            fi
            create_tag=false
          fi
          echo "CREATE_TAG=$create_tag" >> "$GITHUB_ENV"

      - name: Reconfirm every release identity immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ \
            || ! "$OVERALL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            || ! "$ATTEST_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            || "$OVERALL_RUN_ATTEMPT" != "$ATTEST_RUN_ATTEMPT" ]]; then
            echo 'verified package run attempt handoff changed before release mutation' >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml@refs/heads/$HEAD_BRANCH"
          if [[ ! "$VERIFIED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            || "$GITHUB_WORKFLOW_SHA" != "$VERIFIED_WORKFLOW_SHA" \
            || "$VERIFIED_WORKFLOW_REF" != "$expected_workflow_ref" \
            || "$GITHUB_WORKFLOW_REF" != "$VERIFIED_WORKFLOW_REF" ]]; then
            echo 'the executing promotion workflow identity changed before release mutation' >&2
            exit 1
          fi

          for profile_binding in \
            "controlled-webapp-v1.json:$STASIS_FROZEN_V1_PROFILE_SHA256" \
            "controlled-web-session-v1.json:$STASIS_FROZEN_V2_PROFILE_SHA256"; do
            profile_name=${profile_binding%%:*}
            expected_profile_sha256=${profile_binding#*:}
            profile_file="$RUNNER_TEMP/stasis-$profile_name"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/profiles/$profile_name?ref=$HEAD_SHA" \
              > "$profile_file"
