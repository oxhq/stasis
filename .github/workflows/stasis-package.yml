          version = os.environ["STASIS_VERSION"]
          revision = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          native_run_attempts = {
              "macos-aarch64": os.environ["MACOS_RUN_ATTEMPT"],
              "linux-x86_64": os.environ["LINUX_RUN_ATTEMPT"],
          }
          sdk_run_attempt = os.environ["SDK_RUN_ATTEMPT"]
          platforms = ("macos-aarch64", "linux-x86_64")
          sdk_name = f"oxhq-stasis-{version}.tgz"
          sdk_proof_name = f"stasis-{version}-typescript-act-settle-inspect.json"
          runtime_manifest_name = f"stasis-{version}-runtime-manifest.json"
          source = {
