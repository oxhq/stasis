name: Stasis package and promote

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Stasis package push run ID; leave both inputs empty to package this SHA
        required: false
        type: string
      release_tag:
        description: Exact stable Stasis release tag; v0.2.1 is the only accepted value
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: stasis-package-run-${{ inputs.package_run_id || github.run_id }}
  queue: max

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  STASIS_FROZEN_V1_PROFILE_SHA256: 6e262edf0f8be11a1cece28f68f00d59fdac68b79b0a670ac891d36998720100
  STASIS_FROZEN_V2_PROFILE_SHA256: 9b62b9245b2c6a6f9620b117da6787a18df9298be1115cbce2e6c3d5439cc41a
  STASIS_RELEASE_VERSION: 0.2.1

jobs:
  validate-invocation:
    name: Select package or promotion mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        name: Validate workflow inputs
        shell: bash
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || '' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$PACKAGE_RUN_ID" && -z "$RELEASE_TAG" ]]; then
            echo 'mode=package' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PACKAGE_RUN_ID" && -n "$RELEASE_TAG" && "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'mode=promote' >> "$GITHUB_OUTPUT"
          else
            echo 'package_run_id and release_tag must either both be empty or both be set for a manual promotion' >&2
            exit 1
          fi

  archive-contract:
    name: Release archive contract
    needs: validate-invocation
    if: needs.validate-invocation.outputs.mode == 'package'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify source identity and archive contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("ports/stasis/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          test "$version" = "$STASIS_RELEASE_VERSION"
          test "$(sha256sum profiles/controlled-webapp-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V1_PROFILE_SHA256"
          test "$(sha256sum profiles/controlled-web-session-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V2_PROFILE_SHA256"
          python3 etc/ci/stasis/release_archive.py verify-frozen-v1-profile \
            --source-root .
          python3 etc/ci/stasis/release_archive.py verify-frozen-v2-profile \
            --source-root .
          python3 etc/ci/stasis/release_archive.py self-test
          python3 etc/ci/stasis/npm_release.py self-test
          python3 etc/ci/stasis/verify_build_provenance.py self-test
          node --check etc/ci/stasis/verify_registry_sdk.mjs

  package-native:
    name: Package and gate ${{ matrix.release_platform }}
    needs:
      - validate-invocation
      - archive-contract
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.archive-contract.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          - release_platform: macos-aarch64
            runner: macos-15
            kernel: Darwin
            architecture: arm64
          - release_platform: linux-x86_64
            runner: ubuntu-22.04
            kernel: Linux
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      STASIS_REVISION: ${{ github.sha }}
      STASIS_PLATFORM: ${{ matrix.release_platform }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - id: package-names
        name: Resolve immutable package names
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = '${{ matrix.kernel }}'
          test "$(uname -m)" = '${{ matrix.architecture }}'
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            test "$(sysctl -n hw.optional.arm64)" = '1'
          else
            test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("ports/stasis/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          test "$version" = "$STASIS_RELEASE_VERSION"
          bundle="stasis-${version}-${STASIS_PLATFORM}"
          {
            echo "STASIS_VERSION=$version"
            echo "STASIS_BUNDLE=$bundle"
            echo "STASIS_ARCHIVE=${bundle}.tar.gz"
            echo "STASIS_BINARY_SHA256=${bundle}.binary.sha256"
            echo "STASIS_GATE_PROOF=${bundle}-act-settle-inspect.json"
          } >> "$GITHUB_ENV"
          {
            echo "native_artifact_name=stasis-${STASIS_PLATFORM}-attempt-$GITHUB_RUN_ATTEMPT"
            echo "native_proof_artifact_name=stasis-${STASIS_PLATFORM}-act-settle-inspect-proof-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare and measure the ephemeral macOS runner
        if: matrix.release_platform == 'macos-aarch64'
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh prepare 10485760

      - name: Require the Ubuntu 22.04 compatibility floor
        if: matrix.release_platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Linux'
          test "$(uname -m)" = 'x86_64'
          test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Bootstrap macOS build dependencies
        if: matrix.release_platform == 'macos-aarch64'
        run: ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Bootstrap Linux build dependencies
        if: matrix.release_platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Build the exact-SHA Stasis executable
        shell: bash
        run: |
          set -euo pipefail
          test "$STASIS_REVISION" = "$GITHUB_SHA"
          cargo build --locked -p stasis-shell --profile production-stripped
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            bash etc/ci/stasis/prepare_macos_runner.sh check 4194304
          else
            test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
            file target/production-stripped/stasis | grep -F 'ELF 64-bit LSB'
            ldd target/production-stripped/stasis | LC_ALL=C sort > dist-linux-dependencies.txt
            test -s dist-linux-dependencies.txt
            if grep -F 'not found' dist-linux-dependencies.txt; then
              echo 'the Linux release binary has an unresolved shared-library dependency' >&2
              exit 1
            fi
            max_glibc=$(objdump -T target/production-stripped/stasis \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sort -Vu \
              | tail -n 1)
            python3 - "$max_glibc" <<'PY'
          import re
          import sys

          match = re.fullmatch(r"GLIBC_([0-9]+)\.([0-9]+)", sys.argv[1])
          if match is None or tuple(map(int, match.groups())) > (2, 35):
              raise SystemExit(f"Linux binary exceeds the glibc 2.35 floor: {sys.argv[1]!r}")
          PY
          fi

      - name: Set up Node for the platform v0.2 gate
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the SDK harness for the platform v0.2 gate
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'
          pnpm install --frozen-lockfile
          pnpm build

      - name: Gate the v0.2 controlled-session North Star on this native platform
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/production-stripped/stasis"
          test -x "$binary"
          gate_runner=(env)
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            gate_runner=(xvfb-run -a env)
          fi
          explicit_runtime_cache="$RUNNER_TEMP/stasis-${STASIS_PLATFORM}-explicit-runtime-cache"
          mkdir "$explicit_runtime_cache"
          session_gate_log="$RUNNER_TEMP/stasis-${STASIS_PLATFORM}-session-north-star.jsonl"
          "${gate_runner[@]}" \
            STASIS_SESSION_NORTH_STAR_BINARY="$binary" \
            STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE="$explicit_runtime_cache" \
            node test/fixtures/public-package-session-north-star.mjs \
              2>&1 | tee "$session_gate_log"
          grep -F '"proof":"stasis-v0.2-session-north-star"' "$session_gate_log"
          grep -F '"runs":3' "$session_gate_log"
          grep -F '"sessions":6' "$session_gate_log"
          grep -F '"runtimeAcquisition":"explicit-executable-override-cache-bypassed"' \
            "$session_gate_log"

      - name: Gate the automation and bounded-settlement fixture matrix
        shell: bash
        run: |
          set -euo pipefail
          test_runner=(env)
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            test_runner=(xvfb-run -a env)
          fi
          "${test_runner[@]}" \
            cargo test --locked --profile production-stripped \
              -p stasis-shell --test controlled_mvp \
              -- --test-threads=1 --show-output

      - name: Gate controlled-network redirect ordering invariants
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --profile production-stripped \
            -p servo-net-traits --lib controlled_network::tests \
            -- --test-threads=1 --show-output

      - name: Build and verify the release archive
        shell: bash
        run: |
          set -euo pipefail
          python3 etc/ci/stasis/release_archive.py create \
            --binary target/production-stripped/stasis \
            --dist dist \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root .
          python3 etc/ci/stasis/release_archive.py verify \
            --asset-directory dist \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root . \
            --extract-to "$RUNNER_TEMP/stasis-release-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Gate the extracted artifact with act-settle-inspect
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/stasis-release-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$STASIS_BUNDLE/stasis"
          binary_sha256=$(awk '{print $1}' "dist/$STASIS_BINARY_SHA256")
          gate_log="$RUNNER_TEMP/stasis-act-settle-inspect.log"
          gate_runner=(env)
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            gate_runner=(xvfb-run -a env)
          fi
          "${gate_runner[@]}" \
            STASIS_RELEASE_BINARY="$binary" \
            STASIS_RELEASE_ARCHIVE="$GITHUB_WORKSPACE/dist/$STASIS_ARCHIVE" \
            STASIS_RELEASE_REVISION="$GITHUB_SHA" \
            STASIS_RELEASE_SHA256="$binary_sha256" \
            cargo test --locked --profile production-stripped -p stasis-shell --test controlled_mvp \
              release_gate_published_binary_completes_act_settle_inspect \
              -- --ignored --exact --test-threads=1 --show-output \
              2>&1 | tee "$gate_log"
          grep -F 'test release_gate_published_binary_completes_act_settle_inspect ... ok' "$gate_log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$gate_log"
          python3 etc/ci/stasis/release_archive.py gate-proof \
            --proof "dist/$STASIS_GATE_PROOF" \
            --gate-log "$gate_log" \
            --asset-directory dist \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Recheck runner disk after the native release gate
        if: matrix.release_platform == 'macos-aarch64'
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 2097152

      - name: Upload exact release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package-names.outputs.native_artifact_name }}
          path: |
            dist/${{ env.STASIS_ARCHIVE }}
            dist/${{ env.STASIS_ARCHIVE }}.sha256
            dist/${{ env.STASIS_BINARY_SHA256 }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload artifact-bound gate proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package-names.outputs.native_proof_artifact_name }}
          path: dist/${{ env.STASIS_GATE_PROOF }}
          if-no-files-found: error
          retention-days: 90

  package-sdk:
    name: Bind both native runtimes and gate the TypeScript package
    needs:
      - validate-invocation
      - archive-contract
      - package-native
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.archive-contract.result == 'success'
        && needs.package-native.result == 'success'
    outputs:
      linux_run_attempt: ${{ steps.producer-attempts.outputs.linux_run_attempt }}
      macos_run_attempt: ${{ steps.producer-attempts.outputs.macos_run_attempt }}
      sdk_run_attempt: ${{ steps.producer-attempts.outputs.sdk_run_attempt }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      STASIS_VERSION: 0.2.1
      STASIS_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require space for native verification and SDK packing
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh prepare 6291456

      - id: producer-attempts
        name: Resolve the exact successful native producer attempts
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/native-artifact-pages.json"
          native_job_attempts="$RUNNER_TEMP/native-job-attempt-pages"
          mkdir "$native_job_attempts"
          for ((attempt = 1; attempt <= GITHUB_RUN_ATTEMPT; attempt++)); do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
              > "$native_job_attempts/$attempt.json"
          done
          read -r macos_run_attempt linux_run_attempt < <(
            RUN_ID="$GITHUB_RUN_ID" HEAD_SHA="$RUN_HEAD_SHA" \
              JOB_ATTEMPT_DIR="$native_job_attempts" \
              OVERALL_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          run_id = int(os.environ["RUN_ID"])
          head_sha = os.environ["HEAD_SHA"]
          overall_attempt = int(os.environ["OVERALL_RUN_ATTEMPT"])

          def flatten_pages(filename, key):
              pages = json.load(open(filename, encoding="utf-8"))
              if not isinstance(pages, list) or not pages:
                  raise SystemExit(f"{key} pagination response is malformed")
              entries = []
              totals = set()
              for page in pages:
                  if not isinstance(page, dict) or type(page.get("total_count")) is not int:
                      raise SystemExit(f"{key} pagination response is malformed")
                  values = page.get(key)
                  if not isinstance(values, list):
                      raise SystemExit(f"{key} pagination response is malformed")
                  totals.add(page["total_count"])
                  entries.extend(values)
              if len(totals) != 1 or totals.pop() != len(entries):
                  raise SystemExit(f"{key} pagination response is incomplete")
              identifiers = [entry.get("id") for entry in entries if isinstance(entry, dict)]
              if len(identifiers) != len(entries) or any(type(value) is not int for value in identifiers):
                  raise SystemExit(f"{key} identity is malformed")
              if len(set(identifiers)) != len(identifiers):
                  raise SystemExit(f"{key} pagination response contains duplicates")
              return entries

          artifacts = flatten_pages(
              os.path.join(os.environ["RUNNER_TEMP"], "native-artifact-pages.json"),
              "artifacts",
          )
          jobs_by_attempt = []
          job_ids = set()
          job_attempt_dir = pathlib.Path(os.environ["JOB_ATTEMPT_DIR"])
          for attempt in range(1, overall_attempt + 1):
              attempt_jobs = flatten_pages(job_attempt_dir / f"{attempt}.json", "jobs")
              for job in attempt_jobs:
                  job_id = job["id"]
                  if job_id in job_ids:
                      raise SystemExit("job history contains a duplicate job identity")
                  job_ids.add(job_id)
                  reported_attempt = job.get("run_attempt")
                  if reported_attempt is not None and reported_attempt != attempt:
                      raise SystemExit("attempt-specific job history claims another run attempt")
                  jobs_by_attempt.append((attempt, job))
          prefixes = (
              "stasis-macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof",
              "stasis-linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof",
              "stasis-runtime-manifest",
              "stasis-typescript",
          )
          patterns = tuple(
              (prefix, re.compile(rf"^{re.escape(prefix)}-attempt-([1-9][0-9]*)$"))
              for prefix in prefixes
          )
          native_by_platform_attempt = {
              "macos-aarch64": {},
              "linux-x86_64": {},
          }
          for artifact in artifacts:
              if artifact.get("expired") is True:
                  continue
              workflow_run = artifact.get("workflow_run")
              if (
                  artifact.get("expired") is not False
                  or not isinstance(workflow_run, dict)
                  or workflow_run.get("id") != run_id
                  or workflow_run.get("head_sha") != head_sha
              ):
                  raise SystemExit("active package artifact identity is malformed")
              name = artifact.get("name")
              if not isinstance(name, str):
                  raise SystemExit("active package artifact name is malformed")
              matched = next(
                  ((prefix, match) for prefix, pattern in patterns if (match := pattern.fullmatch(name))),
                  None,
              )
              if matched is None:
                  raise SystemExit(f"unexpected active package artifact: {name!r}")
              attempt = int(matched[1].group(1))
              if attempt > overall_attempt:
                  raise SystemExit("package artifact claims a future run attempt")
              if matched[0].startswith("stasis-macos-"):
                  platform = "macos-aarch64"
              elif matched[0].startswith("stasis-linux-"):
                  platform = "linux-x86_64"
              else:
                  continue
              native_by_platform_attempt[platform].setdefault(attempt, []).append(name)

          producer_names = {
              "macos-aarch64": "Package and gate macos-aarch64",
              "linux-x86_64": "Package and gate linux-x86_64",
          }
          producer_jobs = {name: {} for name in producer_names.values()}
          seen_jobs = set()
          for attempt, job in jobs_by_attempt:
              name = job.get("name")
              if name not in producer_names.values():
                  continue
              identity = (attempt, name)
              if (
                  job.get("run_id") != run_id
                  or job.get("head_sha") != head_sha
                  or identity in seen_jobs
              ):
                  raise SystemExit("native producer job identity is malformed or ambiguous")
              seen_jobs.add(identity)
              producer_jobs[name][attempt] = (job.get("status"), job.get("conclusion"))

          selected = []
          for platform in ("macos-aarch64", "linux-x86_64"):
              prefixes_for_platform = (
                  f"stasis-{platform}",
                  f"stasis-{platform}-act-settle-inspect-proof",
              )
              producer_attempts = producer_jobs[producer_names[platform]]
              if not producer_attempts:
                  raise SystemExit(f"no {platform} producer job exists")
              producer_attempt = max(producer_attempts)
              if producer_attempts[producer_attempt] != ("completed", "success"):
                  raise SystemExit(f"latest {platform} producer job did not succeed")
              expected = sorted(
                  f"{prefix}-attempt-{producer_attempt}" for prefix in prefixes_for_platform
              )
              if sorted(native_by_platform_attempt[platform].get(producer_attempt, [])) != expected:
                  raise SystemExit(f"latest successful {platform} producer artifacts are unavailable")
              if max(native_by_platform_attempt[platform], default=0) > producer_attempt:
                  raise SystemExit(f"newer incomplete or unsuccessful {platform} artifacts exist")
              selected.append(producer_attempt)
          print(*selected)
          PY
          )
          if [[ ! "$macos_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$linux_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'native producer attempts are invalid' >&2
            exit 1
          fi
          {
            echo "MACOS_RUN_ATTEMPT=$macos_run_attempt"
            echo "LINUX_RUN_ATTEMPT=$linux_run_attempt"
            echo "SDK_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
          {
            echo "macos_run_attempt=$macos_run_attempt"
            echo "linux_run_attempt=$linux_run_attempt"
            echo "sdk_run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact macOS native archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}
          path: native-inputs/stasis-macos-aarch64-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}

      - name: Download the exact macOS native gate proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}
          path: native-inputs/stasis-macos-aarch64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}

      - name: Download the exact Linux native archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}
          path: native-inputs/stasis-linux-x86_64-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}

      - name: Download the exact Linux native gate proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}
          path: native-inputs/stasis-linux-x86_64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}

      - name: Verify the exact native handoff and extract the macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected=$(printf '%s\n' \
            "stasis-linux-x86_64-act-settle-inspect-proof-attempt-$LINUX_RUN_ATTEMPT" \
            "stasis-linux-x86_64-attempt-$LINUX_RUN_ATTEMPT" \
            "stasis-macos-aarch64-act-settle-inspect-proof-attempt-$MACOS_RUN_ATTEMPT" \
            "stasis-macos-aarch64-attempt-$MACOS_RUN_ATTEMPT")
          actual=$(find native-inputs -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | LC_ALL=C sort)
          test "$actual" = "$expected"
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$MACOS_RUN_ATTEMPT
            else
              producer_attempt=$LINUX_RUN_ATTEMPT
            fi
            asset_dir="native-inputs/stasis-${platform}-attempt-$producer_attempt"
            proof_dir="native-inputs/stasis-${platform}-act-settle-inspect-proof-attempt-$producer_attempt"
            if [[ "$platform" == 'macos-aarch64' ]]; then
              python3 etc/ci/stasis/release_archive.py verify \
                --asset-directory "$asset_dir" \
                --version "$STASIS_VERSION" \
                --platform "$platform" \
                --revision "$GITHUB_SHA" \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --source-root . \
                --extract-to "$RUNNER_TEMP/stasis-sdk-native"
            else
              python3 etc/ci/stasis/release_archive.py verify \
                --asset-directory "$asset_dir" \
                --version "$STASIS_VERSION" \
                --platform "$platform" \
                --revision "$GITHUB_SHA" \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --source-root .
            fi
            python3 etc/ci/stasis/release_archive.py verify-gate-proof \
              --proof-directory "$proof_dir" \
              --asset-directory "$asset_dir" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$producer_attempt"
          done

      - name: Set up Node for manifest generation and SDK release preflight
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate the exact public runtime distribution manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-manifest
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["GITHUB_SHA"]
          native_run_attempts = {
              "macos-aarch64": os.environ["MACOS_RUN_ATTEMPT"],
              "linux-x86_64": os.environ["LINUX_RUN_ATTEMPT"],
          }
          repository = os.environ["GITHUB_REPOSITORY"]
          if version != "0.2.1" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("runtime manifest release identity is invalid")
          upstream = tomllib.loads(pathlib.Path("STASIS_UPSTREAM.toml").read_text(encoding="utf-8"))
          expected_upstream_keys = {
              "servo_repository", "servo_revision", "pliego_repository",
              "pliego_revision", "pliego_servo_merge_base",
          }
          if set(upstream) != expected_upstream_keys or any(
              not isinstance(value, str) or not value for value in upstream.values()
          ):
              raise SystemExit("source identity manifest changed")
          source = {
              **upstream,
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }
          archive_files = [
              "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
              "VERSION.txt", "stasis",
          ]

          def sha256(filename):
              digest = hashlib.sha256()
              with filename.open("rb") as source_file:
                  for chunk in iter(lambda: source_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def checksum(filename, label):
              match = re.fullmatch(
                  r"([0-9a-f]{64})  " + re.escape(label) + r"\n",
                  filename.read_text(encoding="ascii"),
              )
              if match is None:
                  raise SystemExit(f"invalid checksum sidecar: {filename}")
              return match.group(1)

          artifacts = {}
          for node_key, node_platform, node_arch, release_platform in (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          ):
              directory = pathlib.Path(
                  f"native-inputs/stasis-{release_platform}-attempt-"
                  f"{native_run_attempts[release_platform]}"
              )
              root = f"stasis-{version}-{release_platform}"
              archive_name = f"{root}.tar.gz"
              archive = directory / archive_name
              archive_digest = sha256(archive)
              if checksum(directory / f"{archive_name}.sha256", archive_name) != archive_digest:
                  raise SystemExit(f"archive digest changed for {release_platform}")
              executable_digest = checksum(
                  directory / f"{root}.binary.sha256", f"{root}/stasis"
              )
              artifacts[node_key] = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": release_platform,
                  "archiveUrl": (
                      f"https://github.com/{repository}/releases/download/v{version}/{archive_name}"
                  ),
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": root,
                  "archiveFiles": archive_files,
                  "executablePath": "stasis",
                  "executableSha256": executable_digest,
              }
          manifest = {
              "schema": 1,
              "packageName": "@oxhq/stasis",
              "sdkVersion": version,
              "releaseTag": f"v{version}",
              "implementation": {"name": "stasis-shell", "source": source},
              "artifacts": artifacts,
          }
          output = pathlib.Path(f"dist/runtime-manifest/stasis-{version}-runtime-manifest.json")
          output.write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          node sdk/typescript/scripts/generate-runtime-manifest.mjs \
            --input "dist/runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json" \
            --output sdk/typescript/src/runtime-manifest.generated.ts

      - name: Install, typecheck, test, build, and pack the SDK
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          mkdir "$GITHUB_WORKSPACE/dist/sdk"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/sdk"
          shopt -s nullglob
          packages=("$GITHUB_WORKSPACE"/dist/sdk/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "pnpm pack produced ${#packages[@]} tarballs, expected exactly one" >&2
            exit 1
          fi
          {
            echo "STASIS_SDK_TARBALL=${packages[0]}"
            echo "STASIS_SDK_TARBALL_NAME=$(basename "${packages[0]}")"
            echo "STASIS_SDK_PROOF=stasis-${STASIS_VERSION}-typescript-act-settle-inspect.json"
          } >> "$GITHUB_ENV"

      - name: Gate the native synchronous-hang fail-stop supervisor
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/stasis-sdk-native/stasis-${STASIS_VERSION}-macos-aarch64/stasis"
          test -x "$binary"
          STASIS_NORTH_STAR_BINARY="$binary" \
            pnpm exec tsx --test test/native-command-timeout.test.ts

      - name: Gate the packed SDK against the extracted macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/stasis-package-sdk-consumer"
          mkdir "$consumer"
          (
            cd "$consumer"
            pnpm init
            pnpm add --ignore-scripts "$STASIS_SDK_TARBALL"
          )
          bundle="stasis-${STASIS_VERSION}-macos-aarch64"
          binary="$RUNNER_TEMP/stasis-sdk-native/$bundle/stasis"
          sdk_gate_log="$RUNNER_TEMP/stasis-sdk-act-settle-inspect.log"
          node etc/ci/stasis/verify_registry_sdk.mjs \
            --binary "$binary" \
            --fixture ports/stasis/tests/fixtures/timer_10s.html \
            --consumer-root "$consumer" \
            --package "$STASIS_SDK_TARBALL" \
            --revision "$GITHUB_SHA" \
            --version "$STASIS_VERSION" \
            2>&1 | tee "$sdk_gate_log"
          cp sdk/typescript/test/fixtures/public-package-north-star.mjs \
            "$consumer/public-package-north-star.mjs"
          cp sdk/typescript/test/fixtures/north-star.html "$consumer/north-star.html"
          north_star_log="$RUNNER_TEMP/stasis-package-north-star.jsonl"
          STASIS_NORTH_STAR_BINARY="$binary" \
            node "$consumer/public-package-north-star.mjs" 2>&1 | tee "$north_star_log"
          grep -F '"proof":"stasis-v0.1-north-star"' "$north_star_log"
          grep -F '"runs":3' "$north_star_log"
          cat "$north_star_log" >> "$sdk_gate_log"
          cp sdk/typescript/test/fixtures/public-package-session-north-star.mjs \
            "$consumer/public-package-session-north-star.mjs"
          cp -R sdk/typescript/test/fixtures/session-north-star \
            "$consumer/session-north-star"
          explicit_runtime_cache="$RUNNER_TEMP/stasis-package-session-explicit-runtime-cache"
          mkdir "$explicit_runtime_cache"
          session_north_star_log="$RUNNER_TEMP/stasis-package-session-north-star.jsonl"
          STASIS_SESSION_NORTH_STAR_BINARY="$binary" \
            STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE="$explicit_runtime_cache" \
            node "$consumer/public-package-session-north-star.mjs" \
              2>&1 | tee "$session_north_star_log"
          grep -F '"proof":"stasis-v0.2-session-north-star"' "$session_north_star_log"
          grep -F '"runs":3' "$session_north_star_log"
          grep -F '"sessions":6' "$session_north_star_log"
          grep -F '"runtimeAcquisition":"explicit-executable-override-cache-bypassed"' \
            "$session_north_star_log"
          cat "$session_north_star_log" >> "$sdk_gate_log"
          binary_sha256=$(awk '{print $1}' \
            "native-inputs/stasis-macos-aarch64-attempt-$MACOS_RUN_ATTEMPT/$bundle.binary.sha256")
          python3 etc/ci/stasis/npm_release.py create-proof \
            --package "$STASIS_SDK_TARBALL" \
            --gate-log "$sdk_gate_log" \
            --output "dist/sdk/$STASIS_SDK_PROOF" \
            --version "$STASIS_VERSION" \
            --revision "$GITHUB_SHA" \
            --native-binary-sha256 "$binary_sha256" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$SDK_RUN_ATTEMPT"

      - name: Recheck runner disk after all package gates
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 1048576

      - name: Upload the pre-gated TypeScript package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-typescript-attempt-${{ github.run_attempt }}
          path: |
            dist/sdk/${{ env.STASIS_SDK_TARBALL_NAME }}
            dist/sdk/${{ env.STASIS_SDK_PROOF }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload the exact runtime distribution manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-runtime-manifest-attempt-${{ github.run_attempt }}
          path: dist/runtime-manifest/stasis-${{ env.STASIS_VERSION }}-runtime-manifest.json
          if-no-files-found: error
          retention-days: 90


  attest-package:
    name: Attest exact credential-free package outputs
    needs:
      - validate-invocation
      - package-native
      - package-sdk
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.package-native.result == 'success'
        && needs.package-sdk.result == 'success'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && github.repository == 'oxhq/stasis'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      LINUX_RUN_ATTEMPT: ${{ needs.package-sdk.outputs.linux_run_attempt }}
      MACOS_RUN_ATTEMPT: ${{ needs.package-sdk.outputs.macos_run_attempt }}
      SDK_RUN_ATTEMPT: ${{ needs.package-sdk.outputs.sdk_run_attempt }}
    steps:
      - name: Validate the exact producer attempt handoff
        shell: bash
        run: |
          set -euo pipefail
          for producer_attempt in \
            "$MACOS_RUN_ATTEMPT" "$LINUX_RUN_ATTEMPT" "$SDK_RUN_ATTEMPT"; do
            if [[ ! "$producer_attempt" =~ ^[1-9][0-9]*$ \
              || "$producer_attempt" -gt "$GITHUB_RUN_ATTEMPT" ]]; then
              echo 'package producer attempt handoff is invalid' >&2
              exit 1
            fi
          done
          if [[ "$MACOS_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" ]]; then
            echo 'SDK producer attempt predates a selected native producer' >&2
            exit 1
          fi

      - name: Download macOS native files from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-attempt-${{ needs.package-sdk.outputs.macos_run_attempt }}
          path: release-assets/macos-aarch64

      - name: Download macOS native gate proof from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-act-settle-inspect-proof-attempt-${{ needs.package-sdk.outputs.macos_run_attempt }}
          path: gate-proof/macos-aarch64

      - name: Download Linux native files from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-attempt-${{ needs.package-sdk.outputs.linux_run_attempt }}
          path: release-assets/linux-x86_64

      - name: Download Linux native gate proof from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-act-settle-inspect-proof-attempt-${{ needs.package-sdk.outputs.linux_run_attempt }}
          path: gate-proof/linux-x86_64

      - name: Download SDK files from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-typescript-attempt-${{ needs.package-sdk.outputs.sdk_run_attempt }}
          path: sdk-proof

      - name: Download runtime manifest from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-runtime-manifest-attempt-${{ needs.package-sdk.outputs.sdk_run_attempt }}
          path: runtime-manifest

      - name: Recheck exact identities and digests without repository code
        shell: bash
        env:
          STASIS_VERSION: 0.2.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import os
          import pathlib
          import posixpath
          import re
          import tarfile
          import tempfile
          import zlib

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          native_run_attempts = {
              "macos-aarch64": os.environ["MACOS_RUN_ATTEMPT"],
              "linux-x86_64": os.environ["LINUX_RUN_ATTEMPT"],
          }
          sdk_run_attempt = os.environ["SDK_RUN_ATTEMPT"]
          platforms = ("macos-aarch64", "linux-x86_64")
          sdk_name = f"oxhq-stasis-{version}.tgz"
          sdk_proof_name = f"stasis-{version}-typescript-act-settle-inspect.json"
          runtime_manifest_name = f"stasis-{version}-runtime-manifest.json"
          source = {
              "servo_repository": "https://github.com/servo/servo.git",
              "servo_revision": "0d579bd5aab6df3764fad805427254751632a6e4",
              "pliego_repository": "https://github.com/oxhq/pliego.git",
              "pliego_revision": "556c774242b272b11bc60999449c5debff1ad20f",
              "pliego_servo_merge_base": "313b6d5ecc113b08010ce434140db3ca5abcc71c",
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }

          max_tarball_bytes = 32 * 1024 * 1024
          max_member_bytes = 16 * 1024 * 1024
          max_total_member_bytes = 64 * 1024 * 1024
          max_tar_members = 256
          max_expanded_tar_bytes = max_total_member_bytes + 4 * 1024 * 1024
          stream_chunk_bytes = 1024 * 1024
          install_hooks = {
              "preinstall", "install", "postinstall", "prepublish",
              "preprepare", "prepare", "postprepare",
          }
          windows_reserved = {
              "con", "prn", "aux", "nul",
              *(f"com{number}" for number in range(1, 10)),
              *(f"lpt{number}" for number in range(1, 10)),
          }
          windows_forbidden = set('<>:"\\|?*')

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(source_bytes, context):
              if isinstance(source_bytes, bytes):
                  try:
                      source_bytes = source_bytes.decode("utf-8")
                  except UnicodeError as error:
                      raise SystemExit(f"{context} is not UTF-8: {error}") from error
              try:
                  return json.loads(
                      source_bytes,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          def exact_tarball_binding(value, expected):
              return (
                  isinstance(value, dict)
                  and set(value) == {"name", "sha256", "integrity"}
                  and all(
                      isinstance(value.get(field), str)
                      for field in ("name", "sha256", "integrity")
                  )
                  and value == expected
              )

          def canonical_member_path(member):
              name = member.name
              if not name or not name.isascii():
                  raise SystemExit(f"SDK tarball contains a non-ASCII or empty member: {name!r}")
              if member.isdir() and name.endswith("/"):
                  canonical = name[:-1]
                  if not canonical or canonical.endswith("/"):
                      raise SystemExit(f"SDK tarball contains a non-canonical member: {name!r}")
              else:
                  canonical = name
              if (
                  not canonical
                  or canonical.startswith("/")
                  or (name != canonical and name != canonical + "/")
                  or "\\" in canonical
                  or posixpath.normpath(canonical) != canonical
              ):
                  raise SystemExit(f"SDK tarball contains a non-canonical member: {name!r}")
              components = canonical.split("/")
              for component in components:
                  if (
                      not component
                      or component in {".", ".."}
                      or component != component.strip()
                      or component.endswith(".")
                      or any(ord(character) < 32 or ord(character) == 127 for character in component)
                      or windows_forbidden.intersection(component)
                      or component.split(".", 1)[0].lower() in windows_reserved
                  ):
                      raise SystemExit(
                          f"SDK tarball member is not portable across supported filesystems: {name!r}"
                      )
              return canonical, "/".join(component.lower() for component in components)

          def copy_bounded_gzip(package, destination):
              expanded_bytes = 0
              try:
                  with package.open("rb") as source_file:
                      if source_file.read(3) != b"\x1f\x8b\x08":
                          raise SystemExit("SDK tarball is not a gzip stream")
                      source_file.seek(0)
                      decompressor = zlib.decompressobj(wbits=16 + zlib.MAX_WBITS)
                      while chunk := source_file.read(stream_chunk_bytes):
                          pending = chunk
                          while pending:
                              remaining = max_expanded_tar_bytes - expanded_bytes
                              decompressed = decompressor.decompress(
                                  pending, min(stream_chunk_bytes, remaining + 1)
                              )
                              expanded_bytes += len(decompressed)
                              if expanded_bytes > max_expanded_tar_bytes:
                                  raise SystemExit("SDK tarball exceeds the expanded tar-stream limit")
                              destination.write(decompressed)
                              pending = decompressor.unconsumed_tail
                              if decompressor.eof:
                                  break
                          if decompressor.eof:
                              if decompressor.unused_data or source_file.read(1):
                                  raise SystemExit("SDK tarball has trailing data or another gzip member")
                              break
                      flushed = decompressor.flush(
                          min(stream_chunk_bytes, max_expanded_tar_bytes - expanded_bytes + 1)
                      )
                      expanded_bytes += len(flushed)
                      if expanded_bytes > max_expanded_tar_bytes:
                          raise SystemExit("SDK tarball exceeds the expanded tar-stream limit")
                      destination.write(flushed)
                      if not decompressor.eof:
                          raise SystemExit("SDK tarball gzip stream ended before its validated trailer")
              except SystemExit:
                  raise
              except (EOFError, OSError, zlib.error) as error:
                  raise SystemExit(f"SDK tarball is not a valid bounded gzip stream: {error}") from error
              if expanded_bytes == 0:
                  raise SystemExit("SDK tarball expands to an empty tar stream")
              destination.seek(0)

          def verify_sdk_tarball(package, selected_version):
              if package.is_symlink() or not package.is_file():
                  raise SystemExit("SDK tarball is not a regular file")
              package_size = package.stat().st_size
              if package_size <= 0 or package_size > max_tarball_bytes:
                  raise SystemExit("SDK tarball compressed size is outside the release limit")
              file_names = set()
              directory_names = set()
              paths = {}
              metadata_bytes = None
              total_member_bytes = 0
              member_count = 0
              with tempfile.SpooledTemporaryFile(max_size=8 * 1024 * 1024, mode="w+b") as expanded:
                  copy_bounded_gzip(package, expanded)
                  try:
                      with tarfile.open(fileobj=expanded, mode="r:") as archive:
                          for member in archive:
                              member_count += 1
                              if member_count > max_tar_members:
                                  raise SystemExit("SDK tarball exceeds the member-count limit")
                              canonical, collision_key = canonical_member_path(member)
                              if collision_key in paths:
                                  raise SystemExit(
                                      f"SDK tarball contains a cross-platform path collision: "
                                      f"{paths[collision_key][0]!r} and {member.name!r}"
                                  )
                              if not member.isfile() and not member.isdir():
                                  raise SystemExit(f"SDK tarball has an unsupported entry: {member.name!r}")
                              paths[collision_key] = (
                                  canonical, "file" if member.isfile() else "directory"
                              )
                              if member.size < 0 or member.size > max_member_bytes:
                                  raise SystemExit(f"SDK tarball member size is invalid: {member.name!r}")
                              if member.isdir():
                                  if member.size != 0:
                                      raise SystemExit(f"SDK tarball directory has a nonzero size: {member.name!r}")
                                  directory_names.add(canonical)
                                  continue
                              total_member_bytes += member.size
                              if total_member_bytes > max_total_member_bytes:
                                  raise SystemExit("SDK tarball exceeds the total member-size limit")
                              member_source = archive.extractfile(member)
                              if member_source is None:
                                  raise SystemExit(f"SDK tarball member cannot be read: {member.name!r}")
                              captured = bytearray() if canonical == "package/package.json" else None
                              actual_size = 0
                              while chunk := member_source.read(stream_chunk_bytes):
                                  actual_size += len(chunk)
                                  if actual_size > member.size or actual_size > max_member_bytes:
                                      raise SystemExit(f"SDK tarball member exceeds its size: {member.name!r}")
                                  if captured is not None:
                                      captured.extend(chunk)
                              if actual_size != member.size:
                                  raise SystemExit(f"SDK tarball member is truncated: {member.name!r}")
                              if captured is not None:
                                  metadata_bytes = bytes(captured)
                              file_names.add(canonical)
                          payload_end = archive.offset
                          expanded.seek(0, 2)
                          expanded_size = expanded.tell()
                          trailing_size = expanded_size - payload_end
                          if (
                              expanded_size < 1024
                              or expanded_size % 512 != 0
                              or payload_end > expanded_size
                              or trailing_size < 1024
                              or trailing_size % 512 != 0
                          ):
                              raise SystemExit("SDK tar stream has non-canonical framing")
                          expanded.seek(payload_end)
                          while trailing := expanded.read(stream_chunk_bytes):
                              if any(trailing):
                                  raise SystemExit(
                                      "SDK tar stream contains nonzero data after its final member"
                                  )
                  except SystemExit:
                      raise
                  except (EOFError, OSError, tarfile.TarError) as error:
                      raise SystemExit(f"SDK tarball is not a valid bounded tar stream: {error}") from error
              for collision_key in paths:
                  components = collision_key.split("/")
                  for index in range(1, len(components)):
                      parent = "/".join(components[:index])
                      if parent in paths and paths[parent][1] == "file":
                          raise SystemExit(f"SDK tarball file is also a parent directory: {paths[parent][0]!r}")
              if directory_names - {"package", "package/dist"}:
                  raise SystemExit("SDK tarball has an unknown directory")
              required = {
                  "package/package.json", "package/README.md", "package/LICENSE",
                  "package/dist/index.js", "package/dist/index.d.ts",
              }
              if not required.issubset(file_names):
                  raise SystemExit("SDK tarball is missing a required public file")
              if any(
                  name not in required and not name.startswith("package/dist/")
                  for name in file_names
              ):
                  raise SystemExit("SDK tarball has a development-only or unknown file")
              if metadata_bytes is None:
                  raise SystemExit("SDK package metadata cannot be read")
              metadata = strict_json_loads(metadata_bytes, "SDK package metadata")
              if not isinstance(metadata, dict):
                  raise SystemExit("SDK package metadata is not an object")
              if "tag" in metadata:
                  raise SystemExit("SDK package metadata overrides the publish dist-tag")
              if metadata.get("name") != "@oxhq/stasis" or metadata.get("version") != selected_version:
                  raise SystemExit("SDK package name/version changed")
              if metadata.get("repository") != {"type": "git", "url": "https://github.com/oxhq/stasis.git"}:
                  raise SystemExit("SDK package repository changed")
              publish = metadata.get("publishConfig")
              if (
                  not isinstance(publish, dict)
                  or set(publish) != {"access", "tag", "provenance"}
                  or publish.get("access") != "public"
                  or publish.get("tag") != "latest"
                  or publish.get("provenance") is not True
              ):
                  raise SystemExit("SDK package publication policy changed")
              scripts = metadata.get("scripts", {})
              if not isinstance(scripts, dict) or install_hooks.intersection(scripts):
                  raise SystemExit("SDK package defines an install lifecycle script")
              runtime_fields = {
                  "dependencies", "optionalDependencies", "peerDependencies",
                  "bundledDependencies", "bundleDependencies",
              }
              if any(metadata.get(field) not in (None, {}, []) for field in runtime_fields):
                  raise SystemExit("SDK package adds a runtime dependency field")
              entrypoints = {
                  "type": "module", "main": "./dist/index.js", "types": "./dist/index.d.ts",
                  "exports": {".": {"types": "./dist/index.d.ts", "import": "./dist/index.js"}},
              }
              if any(metadata.get(key) != value for key, value in entrypoints.items()):
                  raise SystemExit("SDK package entrypoint metadata changed")
              return metadata

          def exact_directory(name, expected):
              directory = pathlib.Path(name)
              entries = list(directory.iterdir())
              if any(item.is_symlink() or not item.is_file() for item in entries):
                  raise SystemExit(f"{name} contains a non-regular entry")
              actual = {item.name for item in entries}
              if actual != expected:
                  raise SystemExit(f"{name} inventory changed: {sorted(actual)}")
              return directory

          def sha256(filename):
              digest = hashlib.sha256()
              with filename.open("rb") as source_file:
                  for chunk in iter(lambda: source_file.read(stream_chunk_bytes), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def sha512_integrity(filename):
              digest = hashlib.sha512()
              with filename.open("rb") as source_file:
                  for chunk in iter(lambda: source_file.read(stream_chunk_bytes), b""):
                      digest.update(chunk)
              return "sha512-" + base64.b64encode(digest.digest()).decode("ascii")

          def checksum(filename, label):
              if filename.stat().st_size <= 0 or filename.stat().st_size > 1024:
                  raise SystemExit(f"checksum sidecar size is outside the release limit: {filename}")
              match = re.fullmatch(r"([0-9a-f]{64})  ([^\r\n]+)\n", filename.read_text(encoding="ascii"))
              if match is None or match.group(2) != label:
                  raise SystemExit(f"invalid checksum sidecar: {filename}")
              return match.group(1)

          native_max_compressed_bytes = 512 * 1024 * 1024
          native_max_binary_bytes = 512 * 1024 * 1024
          native_max_text_bytes = 8 * 1024 * 1024
          native_max_expanded_bytes = 600 * 1024 * 1024
          native_gzip_header = bytes.fromhex("1f8b08000000000002ff")
          native_files = {
              "stasis", "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html", "VERSION.txt",
          }

          def decompress_native_archive(archive, destination):
              expanded_bytes = 0
              try:
                  with archive.open("rb") as source_file:
                      if source_file.read(len(native_gzip_header)) != native_gzip_header:
                          raise SystemExit("native archive does not use the canonical gzip header")
                      source_file.seek(0)
                      decompressor = zlib.decompressobj(wbits=16 + zlib.MAX_WBITS)
                      while chunk := source_file.read(stream_chunk_bytes):
                          pending = chunk
                          while pending:
                              remaining = native_max_expanded_bytes - expanded_bytes
                              decompressed = decompressor.decompress(
                                  pending, min(4 * 1024 * 1024, remaining + 1)
                              )
                              expanded_bytes += len(decompressed)
                              if expanded_bytes > native_max_expanded_bytes:
                                  raise SystemExit("native archive exceeds the expanded-size limit")
                              destination.write(decompressed)
                              pending = decompressor.unconsumed_tail
                              if decompressor.eof:
                                  break
                          if decompressor.eof:
                              if decompressor.unused_data or source_file.read(1):
                                  raise SystemExit(
                                      "native archive has trailing data or another gzip member"
                                  )
                              break
                      flushed = decompressor.flush(
                          min(4 * 1024 * 1024, native_max_expanded_bytes - expanded_bytes + 1)
                      )
                      expanded_bytes += len(flushed)
                      if expanded_bytes > native_max_expanded_bytes:
                          raise SystemExit("native archive exceeds the expanded-size limit")
                      destination.write(flushed)
                      if not decompressor.eof:
                          raise SystemExit(
                              "native archive gzip stream ended before its validated trailer"
                          )
              except SystemExit:
                  raise
              except (EOFError, OSError, zlib.error) as error:
                  raise SystemExit(
                      f"native archive is not a valid bounded gzip stream: {error}"
                  ) from error
              if expanded_bytes == 0:
                  raise SystemExit("native archive expands to an empty tar stream")
              destination.seek(0)

          def normalized_native_info(name, *, directory, executable=False):
              info = tarfile.TarInfo(name)
              info.type = tarfile.DIRTYPE if directory else tarfile.REGTYPE
              info.mode = 0o755 if directory or executable else 0o644
              info.uid = 0
              info.gid = 0
              info.uname = ""
              info.gname = ""
              info.mtime = 0
              return info

          class HashingReader:
              def __init__(self, source_file):
                  self.source_file = source_file
                  self.digest = hashlib.sha256()
                  self.bytes_read = 0

              def read(self, size=-1):
                  chunk = self.source_file.read(size)
                  self.digest.update(chunk)
                  self.bytes_read += len(chunk)
                  if self.bytes_read > native_max_binary_bytes:
                      raise SystemExit("native archive binary exceeds its size limit")
                  return chunk

          def streams_equal(left, right):
              left.seek(0)
              right.seek(0)
              while True:
                  left_chunk = left.read(stream_chunk_bytes)
                  right_chunk = right.read(stream_chunk_bytes)
                  if left_chunk != right_chunk:
                      return False
                  if not left_chunk:
                      return True

          def verify_native_archive(archive, selected_bundle, expected_binary_digest):
              archive_size = archive.stat().st_size
              if archive_size <= 0 or archive_size > native_max_compressed_bytes:
                  raise SystemExit("native archive compressed size is outside the release limit")
              expected_order = [
                  selected_bundle,
                  *(f"{selected_bundle}/{name}" for name in sorted(native_files)),
              ]
              binary_reader = None
              with tempfile.SpooledTemporaryFile(max_size=8 * 1024 * 1024, mode="w+b") as expanded:
                  decompress_native_archive(archive, expanded)
                  with tempfile.SpooledTemporaryFile(max_size=8 * 1024 * 1024, mode="w+b") as canonical:
                      try:
                          with tarfile.open(fileobj=expanded, mode="r:") as package:
                              members = []
                              for member in package:
                                  if len(members) == len(expected_order):
                                      raise SystemExit(
                                          "native archive exceeds the exact member-count limit"
                                      )
                                  members.append(member)
                              if [member.name for member in members] != expected_order:
                                  raise SystemExit(
                                      "native archive member order or inventory is not canonical"
                                  )
                              by_name = {member.name: member for member in members}
                              root = by_name[selected_bundle]
                              if (
                                  not root.isdir()
                                  or root.size != 0
                                  or root.mode != 0o755
                                  or root.uid != 0
                                  or root.gid != 0
                                  or root.uname
                                  or root.gname
                                  or root.mtime != 0
                              ):
                                  raise SystemExit("native archive root metadata is not normalized")
                              total_member_bytes = 0
                              for name in sorted(native_files):
                                  member = by_name[f"{selected_bundle}/{name}"]
                                  maximum = (
                                      native_max_binary_bytes
                                      if name == "stasis"
                                      else native_max_text_bytes
                                  )
                                  expected_mode = 0o755 if name == "stasis" else 0o644
                                  if (
                                      not member.isfile()
                                      or member.size < 0
                                      or member.size > maximum
                                      or member.mode != expected_mode
                                      or member.uid != 0
                                      or member.gid != 0
                                      or member.uname
                                      or member.gname
                                      or member.mtime != 0
                                  ):
                                      raise SystemExit(
                                          f"native archive member metadata is not normalized: {member.name}"
                                      )
                                  total_member_bytes += member.size
                              if total_member_bytes > native_max_expanded_bytes:
                                  raise SystemExit("native archive exceeds the total member-size limit")

                              with tarfile.open(
                                  fileobj=canonical, mode="w", format=tarfile.USTAR_FORMAT
                              ) as normalized:
                                  normalized.addfile(
                                      normalized_native_info(selected_bundle, directory=True)
                                  )
                                  for name in sorted(native_files):
                                      member = by_name[f"{selected_bundle}/{name}"]
                                      member_source = package.extractfile(member)
                                      if member_source is None:
                                          raise SystemExit(
                                              f"native archive member cannot be read: {member.name}"
                                          )
                                      reader = member_source
                                      if name == "stasis":
                                          binary_reader = HashingReader(member_source)
                                          reader = binary_reader
                                      info = normalized_native_info(
                                          member.name,
                                          directory=False,
                                          executable=name == "stasis",
                                      )
                                      info.size = member.size
                                      normalized.addfile(info, reader)
                      except SystemExit:
                          raise
                      except (EOFError, OSError, tarfile.TarError) as error:
                          raise SystemExit(
                              f"native archive is not a valid bounded tar stream: {error}"
                          ) from error
                      if binary_reader is None or binary_reader.bytes_read != by_name[
                          f"{selected_bundle}/stasis"
                      ].size:
                          raise SystemExit("native archive binary is truncated")
                      if binary_reader.digest.hexdigest() != expected_binary_digest:
                          raise SystemExit("native archive binary digest changed")
                      if not streams_equal(expanded, canonical):
                          raise SystemExit(
                              "native archive tar bytes are not the canonical normalized serialization"
                          )

          def verify_native_target(platform):
              bundle = f"stasis-{version}-{platform}"
              archive_name = f"{bundle}.tar.gz"
              archive_sidecar_name = f"{archive_name}.sha256"
              binary_sidecar_name = f"{bundle}.binary.sha256"
              native_proof_name = f"{bundle}-act-settle-inspect.json"
              native = exact_directory(
                  f"release-assets/{platform}",
                  {archive_name, archive_sidecar_name, binary_sidecar_name},
              )
              gate = exact_directory(f"gate-proof/{platform}", {native_proof_name})
              archive = native / archive_name
              if archive.stat().st_size <= 0 or archive.stat().st_size > native_max_compressed_bytes:
                  raise SystemExit("native archive compressed size is outside the release limit")
              binary_label = f"{bundle}/stasis"
              binary_digest = checksum(native / binary_sidecar_name, binary_label)
              verify_native_archive(archive, bundle, binary_digest)
              archive_digest = sha256(archive)
              if checksum(native / archive_sidecar_name, archive_name) != archive_digest:
                  raise SystemExit("archive sidecar changed after the credential-free build")

              native_proof_file = gate / native_proof_name
              if native_proof_file.stat().st_size <= 0 or native_proof_file.stat().st_size > 64 * 1024:
                  raise SystemExit("native gate proof size is outside the release limit")
              native_proof = strict_json_loads(
                  native_proof_file.read_text(encoding="utf-8"), "native gate proof"
              )
              expected_native = {
                  "schema": 2,
                  "gate": "act-settle-inspect",
                  "test": "release_gate_published_binary_completes_act_settle_inspect",
                  "version": version,
                  "platform": platform,
                  "revision": revision,
                  "workflowRunId": run_id,
                  "workflowRunAttempt": native_run_attempts[platform],
                  "archive": {"name": archive_name, "sha256": archive_digest},
                  "binary": {"path": binary_label, "sha256": binary_digest},
                  "source": source,
              }
              if (
                  not isinstance(native_proof, dict)
                  or set(native_proof) != set(expected_native) | {"gateLogSha256"}
                  or type(native_proof.get("schema")) is not int
              ):
                  raise SystemExit("native gate proof schema changed")
              for field, keys in (
                  ("archive", {"name", "sha256"}),
                  ("binary", {"path", "sha256"}),
              ):
                  binding = native_proof.get(field)
                  if (
                      not isinstance(binding, dict)
                      or set(binding) != keys
                      or any(not isinstance(binding.get(key), str) for key in keys)
                  ):
                      raise SystemExit(f"native gate proof {field} binding has invalid types")
              if any(native_proof.get(key) != value for key, value in expected_native.items()):
                  raise SystemExit("native gate proof identity changed")
              native_log_digest = native_proof.get("gateLogSha256")
              if (
                  not isinstance(native_log_digest, str)
                  or re.fullmatch(r"[0-9a-f]{64}", native_log_digest) is None
              ):
                  raise SystemExit("native gate proof log digest is invalid")
              return {
                  "archiveName": archive_name,
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": bundle,
                  "executableSha256": binary_digest,
              }

          native_bindings = {
              platform: verify_native_target(platform) for platform in platforms
          }
          sdk = exact_directory("sdk-proof", {sdk_name, sdk_proof_name})
          manifest_directory = exact_directory(
              "runtime-manifest", {runtime_manifest_name}
          )
          runtime_manifest_file = manifest_directory / runtime_manifest_name
          if runtime_manifest_file.stat().st_size <= 0 or runtime_manifest_file.stat().st_size > 128 * 1024:
              raise SystemExit("runtime distribution manifest size is outside the release limit")
          runtime_manifest = strict_json_loads(
              runtime_manifest_file.read_text(encoding="utf-8"),
              "runtime distribution manifest",
          )
          expected_artifacts = {}
          for node_key, node_platform, node_arch, platform in (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          ):
              binding = native_bindings[platform]
              expected_artifacts[node_key] = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": platform,
                  "archiveUrl": (
                      f"https://github.com/oxhq/stasis/releases/download/v{version}/"
                      f"{binding['archiveName']}"
                  ),
                  "archiveSizeBytes": binding["archiveSizeBytes"],
                  "archiveSha256": binding["archiveSha256"],
                  "archiveRoot": binding["archiveRoot"],
                  "archiveFiles": [
                      "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
                      "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
                      "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
                      "VERSION.txt", "stasis",
                  ],
                  "executablePath": "stasis",
                  "executableSha256": binding["executableSha256"],
              }
          expected_manifest = {
              "schema": 1,
              "packageName": "@oxhq/stasis",
              "sdkVersion": version,
              "releaseTag": f"v{version}",
              "implementation": {"name": "stasis-shell", "source": source},
              "artifacts": expected_artifacts,
          }
          if runtime_manifest != expected_manifest:
              raise SystemExit("runtime distribution manifest changed after SDK packing")
          binary_digest = native_bindings["macos-aarch64"]["executableSha256"]

          sdk_tarball = sdk / sdk_name
          verify_sdk_tarball(sdk_tarball, version)
          sdk_sha256 = sha256(sdk_tarball)
          sdk_integrity = sha512_integrity(sdk_tarball)

          sdk_proof_file = sdk / sdk_proof_name
          if sdk_proof_file.stat().st_size <= 0 or sdk_proof_file.stat().st_size > 64 * 1024:
              raise SystemExit("SDK gate proof size is outside the release limit")
          sdk_proof = strict_json_loads(
              sdk_proof_file.read_text(encoding="utf-8"), "SDK gate proof"
          )
          expected_sdk = {
              "schema": 2,
              "gate": "sdk-act-settle-inspect",
              "package": f"@oxhq/stasis@{version}",
              "revision": revision,
              "workflowRunId": run_id,
              "workflowRunAttempt": sdk_run_attempt,
              "source": source,
              "tarball": {"name": sdk_name, "sha256": sdk_sha256, "integrity": sdk_integrity},
              "nativeBinarySha256": binary_digest,
          }
          if (
              not isinstance(sdk_proof, dict)
              or set(sdk_proof) != set(expected_sdk) | {"gateLogSha256"}
              or type(sdk_proof.get("schema")) is not int
          ):
              raise SystemExit("SDK gate proof schema changed")
          if not exact_tarball_binding(sdk_proof.get("tarball"), expected_sdk["tarball"]):
              raise SystemExit("SDK gate proof tarball binding has invalid types")
          if (
              not isinstance(sdk_proof.get("nativeBinarySha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", sdk_proof["nativeBinarySha256"]) is None
          ):
              raise SystemExit("SDK gate proof native digest is invalid")
          if any(sdk_proof.get(key) != value for key, value in expected_sdk.items()):
              raise SystemExit("SDK gate proof identity changed")
          sdk_log_digest = sdk_proof.get("gateLogSha256")
          if (
              not isinstance(sdk_log_digest, str)
              or re.fullmatch(r"[0-9a-f]{64}", sdk_log_digest) is None
          ):
              raise SystemExit("SDK gate proof log digest is invalid")
          PY

      - name: Generate GitHub build provenance for all eleven outputs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/macos-aarch64/stasis-0.2.1-macos-aarch64.tar.gz
            release-assets/macos-aarch64/stasis-0.2.1-macos-aarch64.tar.gz.sha256
            release-assets/macos-aarch64/stasis-0.2.1-macos-aarch64.binary.sha256
            gate-proof/macos-aarch64/stasis-0.2.1-macos-aarch64-act-settle-inspect.json
            release-assets/linux-x86_64/stasis-0.2.1-linux-x86_64.tar.gz
            release-assets/linux-x86_64/stasis-0.2.1-linux-x86_64.tar.gz.sha256
            release-assets/linux-x86_64/stasis-0.2.1-linux-x86_64.binary.sha256
            gate-proof/linux-x86_64/stasis-0.2.1-linux-x86_64-act-settle-inspect.json
            runtime-manifest/stasis-0.2.1-runtime-manifest.json
            sdk-proof/oxhq-stasis-0.2.1.tgz
            sdk-proof/stasis-0.2.1-typescript-act-settle-inspect.json

  verify-promotion:
    name: Verify immutable promotion inputs
    needs: validate-invocation
    if: needs.validate-invocation.outputs.mode == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      attestations: read
    outputs:
      attest_run_attempt: ${{ steps.selected-run.outputs.attest_run_attempt }}
      head_sha: ${{ steps.selected-run.outputs.head_sha }}
      head_branch: ${{ steps.selected-run.outputs.head_branch }}
      linux_run_attempt: ${{ steps.selected-run.outputs.linux_run_attempt }}
      macos_run_attempt: ${{ steps.selected-run.outputs.macos_run_attempt }}
      overall_run_attempt: ${{ steps.selected-run.outputs.overall_run_attempt }}
      sdk_run_attempt: ${{ steps.selected-run.outputs.sdk_run_attempt }}
      staged_gate_artifact_name: ${{ steps.stage-names.outputs.gate_artifact_name }}
      staged_release_artifact_name: ${{ steps.stage-names.outputs.release_artifact_name }}
      version: ${{ steps.selected-run.outputs.version }}
      workflow_ref: ${{ steps.selected-run.outputs.workflow_ref }}
      workflow_sha: ${{ steps.selected-run.outputs.workflow_sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.package_run_id }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - id: selected-run
        name: Verify the selected successful package run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'oxhq/stasis' ]]; then
            echo 'promotion is restricted to oxhq/stasis' >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml@refs/heads/$DEFAULT_BRANCH"
          if [[ ! "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            || "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
            echo 'the executing promotion workflow identity is not the exact default-branch workflow' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != 'branch' || "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo 'promotion must be dispatched from the default branch' >&2
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'package_run_id must be a positive integer' >&2
            exit 1
          fi
          if [[ "$TAG" != "v$STASIS_RELEASE_VERSION" ]]; then
            echo "the stable promotion tag must be v$STASIS_RELEASE_VERSION" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          read -r head_sha head_branch overall_run_attempt < <(
            jq -er --arg repository "$GITHUB_REPOSITORY" --arg default_branch "$DEFAULT_BRANCH" '
              select(.repository.full_name == $repository)
              | select(.head_repository.full_name == $repository)
              | select(.name == "Stasis package and promote")
              | select(.path == ".github/workflows/stasis-package.yml")
              | select(.event == "push")
              | select(.status == "completed" and .conclusion == "success")
              | select(.head_branch == $default_branch)
              | [.head_sha, .head_branch, (.run_attempt | tostring)] | @tsv
            ' run.json
          )
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ || ! "$overall_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'selected package run did not resolve to an exact commit and attempt' >&2
            exit 1
          fi

          current_default_sha=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$DEFAULT_BRANCH" \
            -f per_page=1 \
            --jq 'if length == 1 then .[0].sha else error("default branch did not resolve exactly") end')
          if [[ ! "$current_default_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'current default branch did not resolve to an exact commit' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$head_sha...$current_default_sha" > ancestry.json
          jq -e --arg head_sha "$head_sha" '
            .merge_base_commit.sha == $head_sha
            and (.status == "ahead" or .status == "identical")
          ' ancestry.json > /dev/null

          workflow_tree_sha() {
            local commit_sha=$1
            local root_tree_sha dot_github_tree_sha
            root_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha')
            dot_github_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$root_tree_sha" \
              --jq '.tree | map(select(.path == ".github" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github tree") end')
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$dot_github_tree_sha" \
              --jq '.tree | map(select(.path == "workflows" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github/workflows tree") end'
          }
          packaged_workflow_tree=$(workflow_tree_sha "$head_sha")
          current_workflow_tree=$(workflow_tree_sha "$current_default_sha")
          executing_workflow_tree=$(workflow_tree_sha "$GITHUB_WORKFLOW_SHA")
          if [[ ! "$packaged_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$current_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$executing_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || "$packaged_workflow_tree" != "$current_workflow_tree" \
            || "$packaged_workflow_tree" != "$executing_workflow_tree" ]]; then
            echo '.github/workflows differs across the package, executing, or current default revision' >&2
            exit 1
          fi

          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/ports/stasis/Cargo.toml?ref=$head_sha" \
            > stasis-Cargo.toml
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("stasis-Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          if [[ "$version" != "$STASIS_RELEASE_VERSION" || "$TAG" != "v$version" ]]; then
            echo "tag $TAG does not exactly match Stasis version $version at $head_sha" >&2
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > artifact-pages.json
          job_attempts="$RUNNER_TEMP/package-job-attempt-pages"
          mkdir "$job_attempts"
          for ((attempt = 1; attempt <= overall_run_attempt; attempt++)); do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt/jobs?per_page=100" \
              > "$job_attempts/$attempt.json"
          done
          read -r macos_run_attempt linux_run_attempt sdk_run_attempt attest_run_attempt < <(
            RUN_ID="$RUN_ID" HEAD_SHA="$head_sha" HEAD_BRANCH="$head_branch" \
              JOB_ATTEMPT_DIR="$job_attempts" \
              OVERALL_RUN_ATTEMPT="$overall_run_attempt" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          run_id = int(os.environ["RUN_ID"])
          head_sha = os.environ["HEAD_SHA"]
          head_branch = os.environ["HEAD_BRANCH"]
          overall_attempt = int(os.environ["OVERALL_RUN_ATTEMPT"])

          def flatten_pages(filename, key):
              pages = json.load(open(filename, encoding="utf-8"))
              if not isinstance(pages, list) or not pages:
                  raise SystemExit(f"{key} pagination response is malformed")
              entries = []
              totals = set()
              for page in pages:
                  if not isinstance(page, dict) or type(page.get("total_count")) is not int:
                      raise SystemExit(f"{key} pagination response is malformed")
                  values = page.get(key)
                  if not isinstance(values, list):
                      raise SystemExit(f"{key} pagination response is malformed")
                  totals.add(page["total_count"])
                  entries.extend(values)
              if len(totals) != 1 or totals.pop() != len(entries):
                  raise SystemExit(f"{key} pagination response is incomplete")
              identifiers = [entry.get("id") for entry in entries if isinstance(entry, dict)]
              if len(identifiers) != len(entries) or any(type(value) is not int for value in identifiers):
                  raise SystemExit(f"{key} identity is malformed")
              if len(set(identifiers)) != len(identifiers):
                  raise SystemExit(f"{key} pagination response contains duplicates")
              return entries

          artifacts = flatten_pages("artifact-pages.json", "artifacts")
          jobs_by_attempt = []
          job_ids = set()
          job_attempt_dir = pathlib.Path(os.environ["JOB_ATTEMPT_DIR"])
          for attempt in range(1, overall_attempt + 1):
              attempt_jobs = flatten_pages(job_attempt_dir / f"{attempt}.json", "jobs")
              for job in attempt_jobs:
                  job_id = job["id"]
                  if job_id in job_ids:
                      raise SystemExit("job history contains a duplicate job identity")
                  job_ids.add(job_id)
                  reported_attempt = job.get("run_attempt")
                  if reported_attempt is not None and reported_attempt != attempt:
                      raise SystemExit("attempt-specific job history claims another run attempt")
                  jobs_by_attempt.append((attempt, job))

          prefixes = (
              "stasis-macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof",
              "stasis-linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof",
              "stasis-runtime-manifest",
              "stasis-typescript",
          )
          patterns = tuple(
              (prefix, re.compile(rf"^{re.escape(prefix)}-attempt-([1-9][0-9]*)$"))
              for prefix in prefixes
          )
          prefix_groups = {
              "stasis-macos-aarch64": "macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof": "macos-aarch64",
              "stasis-linux-x86_64": "linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof": "linux-x86_64",
              "stasis-runtime-manifest": "sdk",
              "stasis-typescript": "sdk",
          }
          by_group_attempt = {group: {} for group in set(prefix_groups.values())}
          for artifact in artifacts:
              if artifact.get("expired") is True:
                  continue
              workflow_run = artifact.get("workflow_run")
              if (
                  artifact.get("expired") is not False
                  or not isinstance(workflow_run, dict)
                  or workflow_run.get("id") != run_id
                  or workflow_run.get("head_sha") != head_sha
                  or workflow_run.get("head_branch") != head_branch
              ):
                  raise SystemExit("active package artifact identity is malformed")
              name = artifact.get("name")
              if not isinstance(name, str):
                  raise SystemExit("active package artifact name is malformed")
              matched = next(
                  ((prefix, match) for prefix, pattern in patterns if (match := pattern.fullmatch(name))),
                  None,
              )
              if matched is None:
                  raise SystemExit(f"unexpected active package artifact: {name!r}")
              attempt = int(matched[1].group(1))
              if attempt > overall_attempt:
                  raise SystemExit("package artifact claims a future run attempt")
              group = prefix_groups[matched[0]]
              by_group_attempt[group].setdefault(attempt, []).append(name)

          producer_names = {
              "macos-aarch64": "Package and gate macos-aarch64",
              "linux-x86_64": "Package and gate linux-x86_64",
              "sdk": "Bind both native runtimes and gate the TypeScript package",
              "attest": "Attest exact credential-free package outputs",
          }
          producer_jobs = {name: {} for name in producer_names.values()}
          seen_jobs = set()
          for attempt, job in jobs_by_attempt:
              name = job.get("name")
              if name not in producer_names.values():
                  continue
              identity = (attempt, name)
              if (
                  job.get("run_id") != run_id
                  or job.get("head_sha") != head_sha
                  or identity in seen_jobs
              ):
                  raise SystemExit("package producer job identity is malformed or ambiguous")
              seen_jobs.add(identity)
              producer_jobs[name][attempt] = (job.get("status"), job.get("conclusion"))

          group_prefixes = {
              "macos-aarch64": (
                  "stasis-macos-aarch64",
                  "stasis-macos-aarch64-act-settle-inspect-proof",
              ),
              "linux-x86_64": (
                  "stasis-linux-x86_64",
                  "stasis-linux-x86_64-act-settle-inspect-proof",
              ),
              "sdk": ("stasis-runtime-manifest", "stasis-typescript"),
          }
          selected = {}
          for group, expected_prefixes in group_prefixes.items():
              producer_attempts = producer_jobs[producer_names[group]]
              if not producer_attempts:
                  raise SystemExit(f"no {group} producer job exists")
              producer_attempt = max(producer_attempts)
              if producer_attempts[producer_attempt] != ("completed", "success"):
                  raise SystemExit(f"latest {group} producer job did not succeed")
              expected = sorted(
                  f"{prefix}-attempt-{producer_attempt}" for prefix in expected_prefixes
              )
              if sorted(by_group_attempt[group].get(producer_attempt, [])) != expected:
                  raise SystemExit(f"latest successful {group} producer artifacts are unavailable")
              if max(by_group_attempt[group], default=0) > producer_attempt:
                  raise SystemExit(f"newer incomplete or unsuccessful {group} artifacts exist")
              selected[group] = producer_attempt
          if (
              selected["macos-aarch64"] > selected["sdk"]
              or selected["linux-x86_64"] > selected["sdk"]
          ):
              raise SystemExit("selected SDK producer predates a selected native producer")
          attest_attempts = producer_jobs[producer_names["attest"]]
          if not attest_attempts:
              raise SystemExit("no package attestation producer job exists")
          attest_attempt = max(attest_attempts)
          if attest_attempts[attest_attempt] != ("completed", "success"):
              raise SystemExit("latest package attestation producer job did not succeed")
          if attest_attempt != overall_attempt:
              raise SystemExit("successful package attestation is not from the overall run attempt")
          if max(selected.values()) > attest_attempt:
              raise SystemExit("selected package attestation predates a selected producer")
          print(
              selected["macos-aarch64"],
              selected["linux-x86_64"],
              selected["sdk"],
              attest_attempt,
          )
          PY
          )
          if [[ ! "$macos_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$linux_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$sdk_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$attest_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'package producer attempts are invalid' >&2
            exit 1
          fi

          {
            echo "HEAD_SHA=$head_sha"
            echo "HEAD_BRANCH=$head_branch"
            echo "MACOS_RUN_ATTEMPT=$macos_run_attempt"
            echo "LINUX_RUN_ATTEMPT=$linux_run_attempt"
            echo "SDK_RUN_ATTEMPT=$sdk_run_attempt"
            echo "ATTEST_RUN_ATTEMPT=$attest_run_attempt"
            echo "OVERALL_RUN_ATTEMPT=$overall_run_attempt"
            echo "STASIS_VERSION=$version"
          } >> "$GITHUB_ENV"
          {
            echo "head_sha=$head_sha"
            echo "head_branch=$head_branch"
            echo "macos_run_attempt=$macos_run_attempt"
            echo "linux_run_attempt=$linux_run_attempt"
            echo "sdk_run_attempt=$sdk_run_attempt"
            echo "attest_run_attempt=$attest_run_attempt"
            echo "overall_run_attempt=$overall_run_attempt"
            echo "version=$version"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "eligible package run: $RUN_ID native attempts $macos_run_attempt/$linux_run_attempt, SDK attempt $sdk_run_attempt, and attestation attempt $attest_run_attempt (overall attempt $overall_run_attempt) at $head_sha"

      - name: Check out the exact packaged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.selected-run.outputs.head_sha }}

      - name: Verify workflow-owned frozen profile identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(sha256sum profiles/controlled-webapp-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V1_PROFILE_SHA256"
          test "$(sha256sum profiles/controlled-web-session-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V2_PROFILE_SHA256"

      - name: Download the exact package and gate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$MACOS_RUN_ATTEMPT
            else
              producer_attempt=$LINUX_RUN_ATTEMPT
            fi
            native_artifact="stasis-${platform}-attempt-$producer_attempt"
            proof_artifact="stasis-${platform}-act-settle-inspect-proof-attempt-$producer_attempt"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$native_artifact" --dir "release-assets/$platform"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$proof_artifact" --dir "gate-proof/$platform"
          done
          sdk_artifact="stasis-typescript-attempt-$SDK_RUN_ATTEMPT"
          manifest_artifact="stasis-runtime-manifest-attempt-$SDK_RUN_ATTEMPT"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$sdk_artifact" --dir sdk-proof
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$manifest_artifact" --dir runtime-manifest

      - name: Verify exact contents, checksums, gate proof, and provenance
        shell: bash
        run: |
          set -euo pipefail
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$MACOS_RUN_ATTEMPT
            else
              producer_attempt=$LINUX_RUN_ATTEMPT
            fi
            python3 etc/ci/stasis/release_archive.py verify \
              --asset-directory "release-assets/$platform" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$HEAD_SHA" \
              --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --source-root .
            python3 etc/ci/stasis/release_archive.py verify-gate-proof \
              --proof-directory "gate-proof/$platform" \
              --asset-directory "release-assets/$platform" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$HEAD_SHA" \
              --run-id "$RUN_ID" \
              --run-attempt "$producer_attempt"
          done
          manifest="runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json"
          test -f "$manifest" && test ! -L "$manifest"
          node sdk/typescript/scripts/generate-runtime-manifest.mjs \
            --input "$manifest" \
            --output "$RUNNER_TEMP/runtime-manifest.generated.ts"
          STASIS_RUNTIME_MANIFEST="$manifest" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["HEAD_SHA"]
          manifest = json.loads(
              pathlib.Path(os.environ["STASIS_RUNTIME_MANIFEST"]).read_text(encoding="utf-8")
          )
          upstream = tomllib.loads(pathlib.Path("STASIS_UPSTREAM.toml").read_text(encoding="utf-8"))
          source = {
              **upstream,
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }
          if (
              set(manifest) != {
                  "schema", "packageName", "sdkVersion", "releaseTag",
                  "implementation", "artifacts",
              }
              or manifest["schema"] != 1
              or manifest["packageName"] != "@oxhq/stasis"
              or manifest["sdkVersion"] != version
              or manifest["releaseTag"] != f"v{version}"
              or manifest["implementation"] != {"name": "stasis-shell", "source": source}
          ):
              raise SystemExit("runtime manifest root identity changed")
          inventory = [
              "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
              "VERSION.txt", "stasis",
          ]
          targets = (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          )
          if set(manifest["artifacts"]) != {target[0] for target in targets}:
              raise SystemExit("runtime manifest target inventory changed")
          for key, node_platform, node_arch, platform in targets:
              root = f"stasis-{version}-{platform}"
              archive_name = f"{root}.tar.gz"
              directory = pathlib.Path("release-assets") / platform
              archive = directory / archive_name
              archive_digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              archive_sidecar = (directory / f"{archive_name}.sha256").read_text(encoding="ascii")
              binary_sidecar = (directory / f"{root}.binary.sha256").read_text(encoding="ascii")
              archive_match = re.fullmatch(
                  rf"([0-9a-f]{{64}})  {re.escape(archive_name)}\n", archive_sidecar
              )
              binary_match = re.fullmatch(
                  rf"([0-9a-f]{{64}})  {re.escape(root)}/stasis\n", binary_sidecar
              )
              if archive_match is None or archive_match.group(1) != archive_digest or binary_match is None:
                  raise SystemExit(f"runtime manifest sidecar input changed for {platform}")
              expected = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": platform,
                  "archiveUrl": (
                      f"https://github.com/oxhq/stasis/releases/download/v{version}/{archive_name}"
                  ),
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": root,
                  "archiveFiles": inventory,
                  "executablePath": "stasis",
                  "executableSha256": binary_match.group(1),
              }
              if manifest["artifacts"][key] != expected:
                  raise SystemExit(f"runtime manifest binding changed for {platform}")
          PY
          binary_sha256=$(awk '{print $1}' \
            "release-assets/macos-aarch64/stasis-${STASIS_VERSION}-macos-aarch64.binary.sha256")
          python3 etc/ci/stasis/npm_release.py verify-proof \
            --directory sdk-proof \
            --version "$STASIS_VERSION" \
            --revision "$HEAD_SHA" \
            --native-binary-sha256 "$binary_sha256" \
            --run-id "$RUN_ID" \
            --run-attempt "$SDK_RUN_ATTEMPT"
          provenance_subjects=(
            release-assets/*/*
            gate-proof/*/*
            runtime-manifest/*
            sdk-proof/*
          )
          test "${#provenance_subjects[@]}" -eq 11
          provenance_json="$RUNNER_TEMP/stasis-package-provenance.json"
          gh attestation verify "${provenance_subjects[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/$HEAD_BRANCH" \
            --deny-self-hosted-runners \
            --limit 100 \
            --format json > "$provenance_json"
          provenance_verifier=(
            python3 etc/ci/stasis/verify_build_provenance.py verify
            --verification-json "$provenance_json"
            --repository "$GITHUB_REPOSITORY"
            --workflow .github/workflows/stasis-package.yml
            --revision "$HEAD_SHA"
            --source-ref "refs/heads/$HEAD_BRANCH"
            --server-url "$GITHUB_SERVER_URL"
            --run-id "$RUN_ID"
            --run-attempt "$ATTEST_RUN_ATTEMPT"
            --expected-subject-count 11
          )
          for provenance_subject in "${provenance_subjects[@]}"; do
            provenance_verifier+=(--subject "$provenance_subject")
          done
          "${provenance_verifier[@]}"
          mkdir staged-release-assets staged-gate-proof
          cp release-assets/*/* staged-release-assets/
          cp "$manifest" staged-release-assets/
          cp gate-proof/*/* staged-gate-proof/

      - id: stage-names
        name: Resolve this promotion attempt's handoff names
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "release_artifact_name=verified-stasis-release-assets-attempt-$GITHUB_RUN_ATTEMPT"
            echo "gate_artifact_name=verified-stasis-gate-proof-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Stage verified release assets for the credentialed job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.stage-names.outputs.release_artifact_name }}
          path: |
            staged-release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Stage verified gate proof for the credentialed job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.stage-names.outputs.gate_artifact_name }}
          path: |
            staged-gate-proof/*
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Create immutable draft stable release
    needs:
      - validate-invocation
      - verify-promotion
    if: |
      needs.validate-invocation.outputs.mode == 'promote'
        && needs.verify-promotion.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      ATTEST_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.attest_run_attempt }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.verify-promotion.outputs.head_sha }}
      HEAD_BRANCH: ${{ needs.verify-promotion.outputs.head_branch }}
      LINUX_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.linux_run_attempt }}
      MACOS_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.macos_run_attempt }}
      OVERALL_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.overall_run_attempt }}
      SDK_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.sdk_run_attempt }}
      RUN_ID: ${{ inputs.package_run_id }}
      STASIS_VERSION: ${{ needs.verify-promotion.outputs.version }}
      TAG: ${{ inputs.release_tag }}
      VERIFIED_WORKFLOW_REF: ${{ needs.verify-promotion.outputs.workflow_ref }}
      VERIFIED_WORKFLOW_SHA: ${{ needs.verify-promotion.outputs.workflow_sha }}
    steps:
      - name: Recheck selected commit is on the current default branch
        shell: bash
        run: |
          set -euo pipefail
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml@refs/heads/$HEAD_BRANCH"
          if [[ ! "$VERIFIED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            || "$GITHUB_WORKFLOW_SHA" != "$VERIFIED_WORKFLOW_SHA" \
            || "$VERIFIED_WORKFLOW_REF" != "$expected_workflow_ref" \
            || "$GITHUB_WORKFLOW_REF" != "$VERIFIED_WORKFLOW_REF" ]]; then
            echo 'credentialed job is not executing the exact verified promotion workflow revision' >&2
            exit 1
          fi
          current_default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [[ -z "$current_default_branch" ]]; then
            echo 'repository has no current default branch' >&2
            exit 1
          fi
          if [[ "$current_default_branch" != "$HEAD_BRANCH" ]]; then
            echo 'repository default branch changed after promotion verification' >&2
            exit 1
          fi
          current_default_sha=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$current_default_branch" \
            -f per_page=1 \
            --jq 'if length == 1 then .[0].sha else error("default branch did not resolve exactly") end')
          if [[ ! "$current_default_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'current default branch did not resolve to an exact commit' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$current_default_sha" > ancestry.json
          jq -e --arg head_sha "$HEAD_SHA" '
            .merge_base_commit.sha == $head_sha
            and (.status == "ahead" or .status == "identical")
          ' ancestry.json > /dev/null

          workflow_tree_sha() {
            local commit_sha=$1
            local root_tree_sha dot_github_tree_sha
            root_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha')
            dot_github_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$root_tree_sha" \
              --jq '.tree | map(select(.path == ".github" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github tree") end')
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$dot_github_tree_sha" \
              --jq '.tree | map(select(.path == "workflows" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github/workflows tree") end'
          }
          packaged_workflow_tree=$(workflow_tree_sha "$HEAD_SHA")
          current_workflow_tree=$(workflow_tree_sha "$current_default_sha")
          executing_workflow_tree=$(workflow_tree_sha "$GITHUB_WORKFLOW_SHA")
          if [[ ! "$packaged_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$current_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$executing_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || "$packaged_workflow_tree" != "$current_workflow_tree" \
            || "$packaged_workflow_tree" != "$executing_workflow_tree" ]]; then
            echo '.github/workflows differs across the package, executing, or current default revision' >&2
            exit 1
          fi

      - name: Download release assets verified by the read-only job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify-promotion.outputs.staged_release_artifact_name }}
          path: release-assets

      - name: Download gate proof verified by the read-only job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify-promotion.outputs.staged_gate_artifact_name }}
          path: gate-proof

      - name: Recheck staged identities and provenance without candidate code
        shell: bash
        run: |
          set -euo pipefail
          for producer_attempt in \
            "$MACOS_RUN_ATTEMPT" "$LINUX_RUN_ATTEMPT" "$SDK_RUN_ATTEMPT" \
            "$ATTEST_RUN_ATTEMPT"; do
            if [[ ! "$producer_attempt" =~ ^[1-9][0-9]*$ ]]; then
              echo 'staged producer attempt handoff is invalid' >&2
              exit 1
            fi
          done
          if [[ "$MACOS_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" ]]; then
            echo 'staged SDK producer predates a native producer' >&2
            exit 1
          fi
          if [[ "$SDK_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" \
            || "$MACOS_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" ]]; then
            echo 'staged attestation predates a selected producer' >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["HEAD_SHA"]
          run_id = os.environ["RUN_ID"]
          native_run_attempts = {
              "macos-aarch64": os.environ["MACOS_RUN_ATTEMPT"],
              "linux-x86_64": os.environ["LINUX_RUN_ATTEMPT"],
          }
          platforms = ("macos-aarch64", "linux-x86_64")
          assets_root = pathlib.Path("release-assets")
          proof_root = pathlib.Path("gate-proof")
          manifest_name = f"stasis-{version}-runtime-manifest.json"
          expected_release_names = {manifest_name}
          expected_proof_names = set()
          for platform in platforms:
              bundle = f"stasis-{version}-{platform}"
              archive_name = f"{bundle}.tar.gz"
              expected_release_names.update({
                  archive_name, f"{archive_name}.sha256", f"{bundle}.binary.sha256",
              })
              expected_proof_names.add(f"{bundle}-act-settle-inspect.json")
          if {item.name for item in assets_root.iterdir()} != expected_release_names:
              raise SystemExit("staged release inventory changed after read-only verification")
          if {item.name for item in proof_root.iterdir()} != expected_proof_names:
              raise SystemExit("staged proof inventory changed after read-only verification")
          if any(item.is_symlink() or not item.is_file() for item in assets_root.iterdir()) or any(
              item.is_symlink() or not item.is_file() for item in proof_root.iterdir()
          ):
              raise SystemExit("staged handoff contains a symbolic link")

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(document, context):
              try:
                  return json.loads(
                      document,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          def checksum(filename: pathlib.Path, label: str) -> str:
              if filename.stat().st_size <= 0 or filename.stat().st_size > 1024:
                  raise SystemExit(f"checksum sidecar size is outside the release limit: {filename}")
              match = re.fullmatch(r"([0-9a-f]{64})  ([^\r\n]+)\n", filename.read_text(encoding="ascii"))
              if match is None or match.group(2) != label:
                  raise SystemExit(f"invalid checksum sidecar: {filename}")
              return match.group(1)

          source = {
              "servo_repository": "https://github.com/servo/servo.git",
              "servo_revision": "0d579bd5aab6df3764fad805427254751632a6e4",
              "pliego_repository": "https://github.com/oxhq/pliego.git",
              "pliego_revision": "556c774242b272b11bc60999449c5debff1ad20f",
              "pliego_servo_merge_base": "313b6d5ecc113b08010ce434140db3ca5abcc71c",
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }
          bindings = {}
          for platform in platforms:
              bundle = f"stasis-{version}-{platform}"
              archive_name = f"{bundle}.tar.gz"
              binary_sidecar_name = f"{bundle}.binary.sha256"
              proof_name = f"{bundle}-act-settle-inspect.json"
              archive = assets_root / archive_name
              archive_digest_state = hashlib.sha256()
              with archive.open("rb") as archive_source:
                  for chunk in iter(lambda: archive_source.read(1024 * 1024), b""):
                      archive_digest_state.update(chunk)
              archive_digest = archive_digest_state.hexdigest()
              if checksum(assets_root / f"{archive_name}.sha256", archive_name) != archive_digest:
                  raise SystemExit("staged archive digest changed")
              binary_label = f"{bundle}/stasis"
              binary_digest = checksum(assets_root / binary_sidecar_name, binary_label)
              proof_file = proof_root / proof_name
              if proof_file.stat().st_size <= 0 or proof_file.stat().st_size > 64 * 1024:
                  raise SystemExit("staged native gate proof size is outside the release limit")
              proof = strict_json_loads(
                  proof_file.read_text(encoding="utf-8"), "staged native gate proof"
              )
              expected = {
                  "schema": 2,
                  "gate": "act-settle-inspect",
                  "test": "release_gate_published_binary_completes_act_settle_inspect",
                  "version": version,
                  "platform": platform,
                  "revision": revision,
                  "workflowRunId": run_id,
                  "workflowRunAttempt": native_run_attempts[platform],
                  "archive": {"name": archive_name, "sha256": archive_digest},
                  "binary": {"path": binary_label, "sha256": binary_digest},
                  "source": source,
              }
              if (
                  not isinstance(proof, dict)
                  or set(proof) != set(expected) | {"gateLogSha256"}
                  or type(proof.get("schema")) is not int
                  or any(proof.get(key) != value for key, value in expected.items())
                  or re.fullmatch(r"[0-9a-f]{64}", proof.get("gateLogSha256", "")) is None
              ):
                  raise SystemExit(f"staged gate proof changed for {platform}")
              bindings[platform] = {
                  "archiveName": archive_name,
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": bundle,
                  "executableSha256": binary_digest,
              }

          manifest_file = assets_root / manifest_name
          if manifest_file.stat().st_size <= 0 or manifest_file.stat().st_size > 128 * 1024:
              raise SystemExit("staged runtime manifest size is outside the release limit")
          manifest = strict_json_loads(
              manifest_file.read_text(encoding="utf-8"), "staged runtime manifest"
          )
          inventory = [
              "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
              "VERSION.txt", "stasis",
          ]
          artifacts = {}
          for key, node_platform, node_arch, platform in (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          ):
              binding = bindings[platform]
              artifacts[key] = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": platform,
                  "archiveUrl": (
                      f"https://github.com/oxhq/stasis/releases/download/v{version}/"
                      f"{binding['archiveName']}"
                  ),
                  "archiveSizeBytes": binding["archiveSizeBytes"],
                  "archiveSha256": binding["archiveSha256"],
                  "archiveRoot": binding["archiveRoot"],
                  "archiveFiles": inventory,
                  "executablePath": "stasis",
                  "executableSha256": binding["executableSha256"],
              }
          expected_manifest = {
              "schema": 1,
              "packageName": "@oxhq/stasis",
              "sdkVersion": version,
              "releaseTag": f"v{version}",
              "implementation": {"name": "stasis-shell", "source": source},
              "artifacts": artifacts,
          }
          if manifest != expected_manifest:
              raise SystemExit("staged runtime distribution manifest changed")
          PY
          provenance_subjects=(release-assets/* gate-proof/*)
          test "${#provenance_subjects[@]}" -eq 9
          provenance_json="$RUNNER_TEMP/stasis-staged-release-provenance.json"
          gh attestation verify "${provenance_subjects[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/$HEAD_BRANCH" \
            --deny-self-hosted-runners \
            --limit 100 \
            --format json > "$provenance_json"
          PROVENANCE_JSON="$provenance_json" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def nested(value, *keys):
              for key in keys:
                  if not isinstance(value, dict):
                      return None
                  value = value.get(key)
              return value

          def sha256(filename):
              digest = hashlib.sha256()
              with filename.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          try:
              document = json.loads(
                  pathlib.Path(os.environ["PROVENANCE_JSON"]).read_text(encoding="utf-8"),
                  object_pairs_hook=strict_object,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite number {value!r}")
                  ),
              )
          except (OSError, UnicodeError, ValueError, RecursionError) as error:
              raise SystemExit(f"cannot read strict staged provenance JSON: {error}") from error
          if not isinstance(document, list) or not document:
              raise SystemExit("staged provenance verification returned no statements")

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["HEAD_SHA"]
          source_ref = f"refs/heads/{os.environ['HEAD_BRANCH']}"
          repository = os.environ["GITHUB_REPOSITORY"]
          repository_uri = f"https://github.com/{repository}"
          signer_uri = (
              f"{repository_uri}/.github/workflows/stasis-package.yml@{source_ref}"
          )
          invocation_uri = (
              f"{repository_uri}/actions/runs/{os.environ['RUN_ID']}/attempts/"
              f"{os.environ['ATTEST_RUN_ATTEMPT']}"
          )
          candidates = []
          for record in document:
              certificate_invocation = nested(
                  record, "verificationResult", "signature", "certificate", "runInvocationURI"
              )
              predicate_invocation = nested(
                  record, "verificationResult", "statement", "predicate", "runDetails",
                  "metadata", "invocationId",
              )
              if certificate_invocation == invocation_uri or predicate_invocation == invocation_uri:
                  candidates.append(record)
          if len(candidates) != 1:
              raise SystemExit("staged release did not resolve to one exact package attestation")

          result = nested(candidates[0], "verificationResult")
          certificate = nested(result, "signature", "certificate")
          if not isinstance(certificate, dict):
              raise SystemExit("staged release verified certificate is missing")
          expected_certificate = {
              "subjectAlternativeName": signer_uri,
              "githubWorkflowSHA": revision,
              "githubWorkflowRepository": repository,
              "githubWorkflowRef": source_ref,
              "runnerEnvironment": "github-hosted",
              "sourceRepositoryURI": repository_uri,
              "sourceRepositoryDigest": revision,
              "sourceRepositoryRef": source_ref,
              "buildSignerURI": signer_uri,
              "runInvocationURI": invocation_uri,
          }
          if any(certificate.get(key) != value for key, value in expected_certificate.items()):
              raise SystemExit("staged release verified certificate identity changed")

          statement = nested(result, "statement")
          if (
              not isinstance(statement, dict)
              or statement.get("_type") != "https://in-toto.io/Statement/v1"
              or statement.get("predicateType") != "https://slsa.dev/provenance/v1"
          ):
              raise SystemExit("staged release provenance statement type changed")
          expected_names = {f"stasis-{version}-runtime-manifest.json"}
          for platform in ("macos-aarch64", "linux-x86_64"):
              bundle = f"stasis-{version}-{platform}"
              archive = f"{bundle}.tar.gz"
              expected_names.update({
                  archive,
                  f"{archive}.sha256",
                  f"{bundle}.binary.sha256",
                  f"{bundle}-act-settle-inspect.json",
              })
          sdk_names = {
              f"oxhq-stasis-{version}.tgz",
              f"stasis-{version}-typescript-act-settle-inspect.json",
          }
          expected_names.update(sdk_names)
          actual_subjects = {}
          for subject in statement.get("subject", []):
              if not isinstance(subject, dict) or set(subject) != {"name", "digest"}:
                  raise SystemExit("staged release provenance subject shape changed")
              name = subject.get("name")
              digest = subject.get("digest")
              if (
                  not isinstance(name, str)
                  or name in actual_subjects
                  or not isinstance(digest, dict)
                  or set(digest) != {"sha256"}
                  or re.fullmatch(r"[0-9a-f]{64}", digest.get("sha256", "")) is None
              ):
                  raise SystemExit("staged release provenance subject is malformed")
              actual_subjects[name] = digest["sha256"]
          if set(actual_subjects) != expected_names:
              raise SystemExit("staged release provenance subject inventory changed")
          local_subjects = {}
          for filename in (*pathlib.Path("release-assets").iterdir(), *pathlib.Path("gate-proof").iterdir()):
              if filename.is_symlink() or not filename.is_file() or filename.name in local_subjects:
                  raise SystemExit("staged release provenance file identity is invalid")
              local_subjects[filename.name] = sha256(filename)
          if set(local_subjects) != expected_names - sdk_names or any(
              actual_subjects[name] != digest for name, digest in local_subjects.items()
          ):
              raise SystemExit("staged release provenance digest binding changed")
          predicate = statement.get("predicate")
          if nested(predicate, "runDetails", "metadata") != {"invocationId": invocation_uri}:
              raise SystemExit("staged release SLSA invocation identity changed")
          if nested(predicate, "runDetails", "builder") != {"id": signer_uri}:
              raise SystemExit("staged release SLSA builder identity changed")
          PY

      - name: Verify immutable tag and resumable draft state
        shell: bash
        run: |
          set -euo pipefail
          get_or_404() {
            local endpoint=$1
            local output=$2
            local response status
            set +e
            response=$(gh api "$endpoint" 2>&1)
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              printf '%s\n' "$response" > "$output"
              return 0
            fi
            if [[ "$response" == *'HTTP 404'* ]]; then
              return 1
            fi
            echo "$response" >&2
            exit "$status"
          }

          cat > release-notes.md <<EOF
          # Stasis $TAG

          Corrective Stasis controlled web-session release.

          - Exact source commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$HEAD_SHA
          - Package and gate run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - Producer attempts: macOS $MACOS_RUN_ATTEMPT, Linux $LINUX_RUN_ATTEMPT, SDK $SDK_RUN_ATTEMPT, provenance $ATTEST_RUN_ATTEMPT
          - Native platforms: macOS Apple Silicon and Linux x86_64
          - Linux compatibility floor: Ubuntu 22.04 / glibc 2.35
          - macOS signing: unsigned and not Apple-notarized

          Stasis 0.2 preserves the frozen controlled-webapp-v1 contract and adds
          controlled-web-session-v1 navigation, session state, network evidence, and
          crawler-grade extraction. Both profiles fail closed outside their declared surface.

          This patch retains redirect predecessors until their terminal callback even when
          a successor begins first, preserving complete response evidence in either ordering.

          This draft contains both native archives, archive and binary SHA-256 sidecars,
          artifact-bound native gate proofs, and the exact runtime distribution manifest
          embedded in the npm package. GitHub build provenance is available through the
          GitHub CLI attestation verifier for every asset.
          EOF

          mkdir release-state
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-state/release-pages.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          version = os.environ["STASIS_VERSION"]
          tag = os.environ["TAG"]
          title = f"Stasis {tag}"
          expected_names = {f"stasis-{version}-runtime-manifest.json"}
          for platform in ("macos-aarch64", "linux-x86_64"):
              bundle = f"stasis-{version}-{platform}"
              archive = f"{bundle}.tar.gz"
              expected_names.update({
                  archive,
                  f"{archive}.sha256",
                  f"{bundle}.binary.sha256",
                  f"{bundle}-act-settle-inspect.json",
              })

          files = {}
          for directory_name in ("release-assets", "gate-proof"):
              directory = pathlib.Path(directory_name)
              for filename in directory.iterdir():
                  if filename.is_symlink() or not filename.is_file():
                      raise SystemExit("release handoff contains a non-regular asset")
                  if filename.name in files:
                      raise SystemExit(f"duplicate local release asset: {filename.name}")
                  digest = hashlib.sha256()
                  with filename.open("rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  files[filename.name] = {
                      "path": str(filename),
                      "size": filename.stat().st_size,
                      "digest": f"sha256:{digest.hexdigest()}",
                  }
          if set(files) != expected_names:
              raise SystemExit(
                  "local release inventory changed before draft recovery: "
                  f"{sorted(files)}"
              )
          pathlib.Path("release-state/expected-assets.json").write_text(
              json.dumps(files, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          pages = json.loads(
              pathlib.Path("release-state/release-pages.json").read_text(encoding="utf-8")
          )
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("authenticated release enumeration is malformed")
          releases = [release for page in pages for release in page]
          matches = [
              release for release in releases
              if isinstance(release, dict) and release.get("tag_name") == tag
          ]
          if len(matches) > 1:
              raise SystemExit(f"multiple releases use exact tag {tag}")

          state = {
              "releaseId": None,
              "missingAssetNames": sorted(expected_names),
              "starterAssetIds": [],
          }
          if matches:
              release = matches[0]
              release_id = release.get("id")
              notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
              if (
                  type(release_id) is not int
                  or release_id <= 0
                  or release.get("tag_name") != tag
                  or release.get("name") != title
                  or release.get("body") != notes
                  or release.get("draft") is not True
                  or release.get("prerelease") is not False
                  or release.get("immutable") is not False
                  or release.get("published_at") is not None
              ):
                  raise SystemExit(f"existing release {tag} is not the exact resumable draft")
              assets = release.get("assets")
              if not isinstance(assets, list):
                  raise SystemExit("existing draft asset inventory is malformed")
              seen = set()
              missing = set(expected_names)
              starter_ids = []
              for asset in assets:
                  if not isinstance(asset, dict):
                      raise SystemExit("existing draft has a malformed asset")
                  name = asset.get("name")
                  if not isinstance(name, str) or name not in files or name in seen:
                      raise SystemExit(f"existing draft has an unexpected or duplicate asset: {name!r}")
                  seen.add(name)
                  expected = files[name]
                  asset_state = asset.get("state")
                  if asset_state == "uploaded":
                      if (
                          asset.get("size") != expected["size"]
                          or asset.get("digest") != expected["digest"]
                      ):
                          raise SystemExit(f"existing draft asset bytes changed: {name}")
                      missing.remove(name)
                  elif asset_state == "starter":
                      asset_id = asset.get("id")
                      if (
                          type(asset_id) is not int
                          or asset_id <= 0
                          or asset.get("size") not in (0, None)
                          or asset.get("digest") not in (None, "")
                      ):
                          raise SystemExit(f"existing draft starter asset is malformed: {name}")
                      starter_ids.append(asset_id)
                  else:
                      raise SystemExit(f"existing draft asset is not immutable uploaded state: {name}")
              state = {
                  "releaseId": release_id,
                  "missingAssetNames": sorted(missing),
                  "starterAssetIds": sorted(starter_ids),
              }
          pathlib.Path("release-state/draft-state.json").write_text(
              json.dumps(state, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          draft_release_id=$(jq -r '.releaseId // ""' release-state/draft-state.json)
          if [[ -n "$draft_release_id" && ! "$draft_release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo 'resumable draft release ID is invalid' >&2
            exit 1
          fi
          echo "DRAFT_RELEASE_ID=$draft_release_id" >> "$GITHUB_ENV"

          create_tag=true
          if get_or_404 "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" tag.json; then
            read -r tag_type tag_sha < <(jq -er '[.object.type, .object.sha] | @tsv' tag.json)
            if [[ "$tag_type" != 'commit' || "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "existing tag $TAG is not a lightweight tag at $HEAD_SHA" >&2
              exit 1
            fi
            create_tag=false
          fi
          echo "CREATE_TAG=$create_tag" >> "$GITHUB_ENV"

      - name: Reconfirm every release identity immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ \
            || ! "$OVERALL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            || ! "$ATTEST_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            || "$OVERALL_RUN_ATTEMPT" != "$ATTEST_RUN_ATTEMPT" ]]; then
            echo 'verified package run attempt handoff changed before release mutation' >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml@refs/heads/$HEAD_BRANCH"
          if [[ ! "$VERIFIED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            || "$GITHUB_WORKFLOW_SHA" != "$VERIFIED_WORKFLOW_SHA" \
            || "$VERIFIED_WORKFLOW_REF" != "$expected_workflow_ref" \
            || "$GITHUB_WORKFLOW_REF" != "$VERIFIED_WORKFLOW_REF" ]]; then
            echo 'the executing promotion workflow identity changed before release mutation' >&2
            exit 1
          fi

          for profile_binding in \
            "controlled-webapp-v1.json:$STASIS_FROZEN_V1_PROFILE_SHA256" \
            "controlled-web-session-v1.json:$STASIS_FROZEN_V2_PROFILE_SHA256"; do
            profile_name=${profile_binding%%:*}
            expected_profile_sha256=${profile_binding#*:}
            profile_file="$RUNNER_TEMP/stasis-$profile_name"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/profiles/$profile_name?ref=$HEAD_SHA" \
              > "$profile_file"
            actual_profile_sha256=$(sha256sum "$profile_file" | awk '{print $1}')
            if [[ "$actual_profile_sha256" != "$expected_profile_sha256" ]]; then
              echo "frozen profile $profile_name changed before release mutation" >&2
              exit 1
            fi
          done

          package_run="$RUNNER_TEMP/stasis-package-run-before-mutation.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$package_run"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_branch "$HEAD_BRANCH" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$OVERALL_RUN_ATTEMPT" '
              .id == $run_id
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .name == "Stasis package and promote"
              and .path == ".github/workflows/stasis-package.yml"
              and .event == "push"
              and .head_sha == $head_sha
              and .head_branch == $head_branch
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == $run_attempt
            ' "$package_run" > /dev/null

          current_default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [[ -z "$current_default_branch" || "$current_default_branch" != "$HEAD_BRANCH" ]]; then
            echo 'repository default branch changed before release mutation' >&2
            exit 1
          fi
          current_default_sha=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$current_default_branch" \
            -f per_page=1 \
            --jq 'if length == 1 then .[0].sha else error("default branch did not resolve exactly") end')
          if [[ ! "$current_default_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'current default branch did not resolve to an exact commit before mutation' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$current_default_sha" \
            > "$RUNNER_TEMP/stasis-ancestry-before-mutation.json"
          jq -e --arg head_sha "$HEAD_SHA" '
            .merge_base_commit.sha == $head_sha
            and (.status == "ahead" or .status == "identical")
          ' "$RUNNER_TEMP/stasis-ancestry-before-mutation.json" > /dev/null

          workflow_tree_sha() {
            local commit_sha=$1
            local root_tree_sha dot_github_tree_sha
            root_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha')
            dot_github_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$root_tree_sha" \
              --jq '.tree | map(select(.path == ".github" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github tree") end')
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$dot_github_tree_sha" \
              --jq '.tree | map(select(.path == "workflows" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github/workflows tree") end'
          }
          packaged_workflow_tree=$(workflow_tree_sha "$HEAD_SHA")
          current_workflow_tree=$(workflow_tree_sha "$current_default_sha")
          executing_workflow_tree=$(workflow_tree_sha "$GITHUB_WORKFLOW_SHA")
          if [[ ! "$packaged_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$current_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$executing_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || "$packaged_workflow_tree" != "$current_workflow_tree" \
            || "$packaged_workflow_tree" != "$executing_workflow_tree" ]]; then
            echo '.github/workflows changed before release mutation' >&2
            exit 1
          fi

      - name: Create the exact-SHA lightweight tag
        if: env.CREATE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          created=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$HEAD_SHA")
          test "$(jq -er '.object.type' <<< "$created")" = 'commit'
          test "$(jq -er '.object.sha' <<< "$created")" = "$HEAD_SHA"

      - name: Create or resume the exact draft stable release by ID
        shell: bash
        run: |
          set -euo pipefail
          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || "$tag_sha" != "$HEAD_SHA" ]]; then
            echo "$TAG changed before draft release mutation" >&2
            exit 1
          fi

          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-state/fresh-release-pages.json
          python3 - <<'PY'
          import json
          import os
          import pathlib

          pages = json.loads(
              pathlib.Path("release-state/fresh-release-pages.json").read_text(encoding="utf-8")
          )
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("fresh authenticated release enumeration is malformed")
          releases = [release for page in pages for release in page]
          identifiers = [release.get("id") for release in releases if isinstance(release, dict)]
          if (
              len(identifiers) != len(releases)
              or any(type(identifier) is not int or identifier <= 0 for identifier in identifiers)
              or len(set(identifiers)) != len(identifiers)
          ):
              raise SystemExit("fresh authenticated release identities are malformed or duplicated")
          tag = os.environ["TAG"]
          matches = [release for release in releases if release.get("tag_name") == tag]
          if len(matches) > 1:
              raise SystemExit(f"multiple releases use exact tag {tag}")
          fresh_id = None
          if matches:
              release = matches[0]
              notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
              if (
                  release.get("name") != f"Stasis {tag}"
                  or release.get("body") != notes
                  or release.get("draft") is not True
                  or release.get("prerelease") is not False
                  or release.get("immutable") is not False
                  or release.get("published_at") is not None
              ):
                  raise SystemExit(f"existing release {tag} changed before mutation")
              fresh_id = release["id"]
          snapshot = os.environ.get("DRAFT_RELEASE_ID") or None
          snapshot_id = int(snapshot) if snapshot is not None else None
          if fresh_id != snapshot_id:
              raise SystemExit("draft release identity changed after the verified snapshot")
          pathlib.Path("release-state/fresh-release-id.txt").write_text(
              "" if fresh_id is None else f"{fresh_id}\n", encoding="ascii"
          )
          PY

          release_id=$(tr -d '\n' < release-state/fresh-release-id.txt)
          if [[ -z "$release_id" ]]; then
            jq -n \
              --arg tag "$TAG" \
              --arg revision "$HEAD_SHA" \
              --arg title "Stasis $TAG" \
              --rawfile notes release-notes.md \
              '{
                tag_name: $tag,
                target_commitish: $revision,
                name: $title,
                body: $notes,
                draft: true,
                prerelease: false
              }' > release-state/create-draft.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --input release-state/create-draft.json \
              > release-state/created-draft.json
            jq -e \
              --arg tag "$TAG" \
              --arg title "Stasis $TAG" '
                (.id | type == "number" and . > 0)
                and .tag_name == $tag
                and .name == $title
                and .draft == true
                and .prerelease == false
                and .immutable == false
                and .published_at == null
                and (.assets | type == "array" and length == 0)
              ' release-state/created-draft.json > /dev/null
            release_id=$(jq -er '.id' release-state/created-draft.json)
          fi
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo 'draft release ID is invalid' >&2
            exit 1
          fi

          mutation_count=0
          while true; do
            if ((mutation_count >= 32)); then
              echo 'draft recovery exceeded its bounded mutation count' >&2
              exit 1
            fi
            read -r live_tag_type live_tag_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            if [[ "$live_tag_type" != 'commit' || "$live_tag_sha" != "$HEAD_SHA" ]]; then
              echo "$TAG changed during draft recovery" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              > release-state/live-draft.json
            DRAFT_RELEASE_ID="$release_id" python3 - <<'PY'
          import json
          import os
          import pathlib

          release_id = int(os.environ["DRAFT_RELEASE_ID"])
          tag = os.environ["TAG"]
          release = json.loads(
              pathlib.Path("release-state/live-draft.json").read_text(encoding="utf-8")
          )
          expected = json.loads(
              pathlib.Path("release-state/expected-assets.json").read_text(encoding="utf-8")
          )
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          if (
              not isinstance(release, dict)
              or release.get("id") != release_id
              or release.get("tag_name") != tag
              or release.get("name") != f"Stasis {tag}"
              or release.get("body") != notes
              or release.get("draft") is not True
              or release.get("prerelease") is not False
              or release.get("immutable") is not False
              or release.get("published_at") is not None
          ):
              raise SystemExit("draft release identity changed during recovery")
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("live draft asset inventory is malformed")
          missing = set(expected)
          starters = []
          seen = set()
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("live draft has a malformed asset")
              name = asset.get("name")
              asset_id = asset.get("id")
              if (
                  not isinstance(name, str)
                  or name not in expected
                  or name in seen
                  or type(asset_id) is not int
                  or asset_id <= 0
              ):
                  raise SystemExit(f"live draft has an unexpected or duplicate asset: {name!r}")
              seen.add(name)
              binding = expected[name]
              state = asset.get("state")
              if state == "uploaded":
                  if asset.get("size") != binding["size"] or asset.get("digest") != binding["digest"]:
                      raise SystemExit(f"live draft asset bytes changed: {name}")
                  missing.remove(name)
              elif state == "starter":
                  if asset.get("size") not in (0, None) or asset.get("digest") not in (None, ""):
                      raise SystemExit(f"live draft starter asset is malformed: {name}")
                  starters.append((name, asset_id))
              else:
                  raise SystemExit(f"live draft asset is not recoverable: {name}")
          if starters:
              name, asset_id = sorted(starters)[0]
              action = {"kind": "delete", "name": name, "assetId": asset_id}
          elif missing:
              action = {"kind": "upload", "name": sorted(missing)[0]}
          else:
              action = {"kind": "done"}
          pathlib.Path("release-state/next-draft-action.json").write_text(
              json.dumps(action, ensure_ascii=True, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            action_kind=$(jq -er '.kind' release-state/next-draft-action.json)
            if [[ "$action_kind" == 'done' ]]; then
              break
            fi
            if [[ "$action_kind" == 'delete' ]]; then
              asset_name=$(jq -er '.name' release-state/next-draft-action.json)
              starter_asset_id=$(jq -er '.assetId' release-state/next-draft-action.json)
              if [[ ! "$starter_asset_id" =~ ^[1-9][0-9]*$ ]]; then
                echo 'starter asset ID is invalid' >&2
                exit 1
              fi
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$starter_asset_id" \
                > release-state/live-starter-asset.json
              jq -e \
                --arg name "$asset_name" \
                --argjson asset_id "$starter_asset_id" '
                  .id == $asset_id
                  and .name == $name
                  and .state == "starter"
                  and (.size == 0 or .size == null)
                  and (.digest == null or .digest == "")
                ' release-state/live-starter-asset.json > /dev/null
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$starter_asset_id" \
                --silent
            elif [[ "$action_kind" == 'upload' ]]; then
              asset_name=$(jq -er '.name' release-state/next-draft-action.json)
              asset_path=$(jq -er --arg name "$asset_name" '.[$name].path' \
                release-state/expected-assets.json)
              asset_size=$(jq -er --arg name "$asset_name" '.[$name].size' \
                release-state/expected-assets.json)
              asset_digest=$(jq -er --arg name "$asset_name" '.[$name].digest' \
                release-state/expected-assets.json)
              encoded_name=$(jq -rn --arg name "$asset_name" '$name | @uri')
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Content-Type: application/octet-stream' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --data-binary "@$asset_path" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded_name" \
                > release-state/uploaded-asset.json
              jq -e \
                --arg name "$asset_name" \
                --arg digest "$asset_digest" \
                --argjson size "$asset_size" '
                  (.id | type == "number" and . > 0)
                  and .name == $name
                  and .state == "uploaded"
                  and .size == $size
                  and .digest == $digest
                ' release-state/uploaded-asset.json > /dev/null
            else
              echo "unknown draft recovery action: $action_kind" >&2
              exit 1
            fi
            mutation_count=$((mutation_count + 1))
          done

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > release-state/final-draft.json
          DRAFT_RELEASE_ID="$release_id" python3 - <<'PY'
          import json
          import os
          import pathlib

          tag = os.environ["TAG"]
          release_id = int(os.environ["DRAFT_RELEASE_ID"])
          expected = json.loads(
              pathlib.Path("release-state/expected-assets.json").read_text(encoding="utf-8")
          )
          release = json.loads(
              pathlib.Path("release-state/final-draft.json").read_text(encoding="utf-8")
          )
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          if (
              release.get("id") != release_id
              or release.get("tag_name") != tag
              or release.get("name") != f"Stasis {tag}"
              or release.get("body") != notes
              or release.get("draft") is not True
              or release.get("prerelease") is not False
              or release.get("immutable") is not False
              or release.get("published_at") is not None
          ):
              raise SystemExit("final draft release identity changed")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != len(expected):
              raise SystemExit("final draft release asset count changed")
          seen = set()
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("final draft release has a malformed asset")
              name = asset.get("name")
              if name not in expected or name in seen:
                  raise SystemExit(f"final draft has an unexpected or duplicate asset: {name!r}")
              seen.add(name)
              binding = expected[name]
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("size") != binding["size"]
                  or asset.get("digest") != binding["digest"]
              ):
                  raise SystemExit(f"final draft asset bytes changed: {name}")
          if seen != set(expected):
              raise SystemExit("final draft release inventory is incomplete")
          PY
          echo "verified resumable draft release $TAG (ID $release_id) with exact assets"
