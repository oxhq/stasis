            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$current_default_sha" \
            > "$RUNNER_TEMP/stasis-ancestry-before-mutation.json"
          jq -e --arg head_sha "$HEAD_SHA" '
            .merge_base_commit.sha == $head_sha
            and (.status == "ahead" or .status == "identical")
          ' "$RUNNER_TEMP/stasis-ancestry-before-mutation.json" > /dev/null

          workflow_tree_sha() {
            local commit_sha=$1
            local root_tree_sha dot_github_tree_sha
            root_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha')
            dot_github_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$root_tree_sha" \
              --jq '.tree | map(select(.path == ".github" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github tree") end')
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$dot_github_tree_sha" \
              --jq '.tree | map(select(.path == "workflows" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github/workflows tree") end'
          }
          packaged_workflow_tree=$(workflow_tree_sha "$HEAD_SHA")
          current_workflow_tree=$(workflow_tree_sha "$current_default_sha")
          executing_workflow_tree=$(workflow_tree_sha "$GITHUB_WORKFLOW_SHA")
          if [[ ! "$packaged_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$current_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$executing_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || "$packaged_workflow_tree" != "$current_workflow_tree" \
            || "$packaged_workflow_tree" != "$executing_workflow_tree" ]]; then
            echo '.github/workflows changed before release mutation' >&2
            exit 1
          fi

      - name: Create the exact-SHA lightweight tag
        if: env.CREATE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          created=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$HEAD_SHA")
          test "$(jq -er '.object.type' <<< "$created")" = 'commit'
          test "$(jq -er '.object.sha' <<< "$created")" = "$HEAD_SHA"

      - name: Create or resume the exact draft stable release by ID
        shell: bash
        run: |
          set -euo pipefail
          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || "$tag_sha" != "$HEAD_SHA" ]]; then
            echo "$TAG changed before draft release mutation" >&2
            exit 1
          fi

          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-state/fresh-release-pages.json
          python3 - <<'PY'
          import json
          import os
          import pathlib

          pages = json.loads(
              pathlib.Path("release-state/fresh-release-pages.json").read_text(encoding="utf-8")
          )
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("fresh authenticated release enumeration is malformed")
          releases = [release for page in pages for release in page]
          identifiers = [release.get("id") for release in releases if isinstance(release, dict)]
          if (
              len(identifiers) != len(releases)
              or any(type(identifier) is not int or identifier <= 0 for identifier in identifiers)
              or len(set(identifiers)) != len(identifiers)
          ):
              raise SystemExit("fresh authenticated release identities are malformed or duplicated")
          tag = os.environ["TAG"]
          matches = [release for release in releases if release.get("tag_name") == tag]
          if len(matches) > 1:
              raise SystemExit(f"multiple releases use exact tag {tag}")
          fresh_id = None
          if matches:
              release = matches[0]
              notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
              if (
                  release.get("name") != f"Stasis {tag}"
                  or release.get("body") != notes
                  or release.get("draft") is not True
                  or release.get("prerelease") is not False
                  or release.get("immutable") is not False
                  or release.get("published_at") is not None
              ):
                  raise SystemExit(f"existing release {tag} changed before mutation")
              fresh_id = release["id"]
          snapshot = os.environ.get("DRAFT_RELEASE_ID") or None
          snapshot_id = int(snapshot) if snapshot is not None else None
          if fresh_id != snapshot_id:
              raise SystemExit("draft release identity changed after the verified snapshot")
          pathlib.Path("release-state/fresh-release-id.txt").write_text(
              "" if fresh_id is None else f"{fresh_id}\n", encoding="ascii"
          )
          PY

          release_id=$(tr -d '\n' < release-state/fresh-release-id.txt)
          if [[ -z "$release_id" ]]; then
            jq -n \
              --arg tag "$TAG" \
              --arg revision "$HEAD_SHA" \
              --arg title "Stasis $TAG" \
              --rawfile notes release-notes.md \
              '{
                tag_name: $tag,
                target_commitish: $revision,
                name: $title,
                body: $notes,
                draft: true,
                prerelease: false
              }' > release-state/create-draft.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --input release-state/create-draft.json \
              > release-state/created-draft.json
            jq -e \
              --arg tag "$TAG" \
              --arg title "Stasis $TAG" '
                (.id | type == "number" and . > 0)
                and .tag_name == $tag
                and .name == $title
                and .draft == true
                and .prerelease == false
                and .immutable == false
                and .published_at == null
                and (.assets | type == "array" and length == 0)
              ' release-state/created-draft.json > /dev/null
            release_id=$(jq -er '.id' release-state/created-draft.json)
          fi
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo 'draft release ID is invalid' >&2
            exit 1
          fi

          mutation_count=0
          while true; do
            if ((mutation_count >= 32)); then
              echo 'draft recovery exceeded its bounded mutation count' >&2
              exit 1
            fi
            read -r live_tag_type live_tag_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            if [[ "$live_tag_type" != 'commit' || "$live_tag_sha" != "$HEAD_SHA" ]]; then
              echo "$TAG changed during draft recovery" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              > release-state/live-draft.json
            DRAFT_RELEASE_ID="$release_id" python3 - <<'PY'
          import json
          import os
          import pathlib

          release_id = int(os.environ["DRAFT_RELEASE_ID"])
          tag = os.environ["TAG"]
          release = json.loads(
              pathlib.Path("release-state/live-draft.json").read_text(encoding="utf-8")
          )
          expected = json.loads(
              pathlib.Path("release-state/expected-assets.json").read_text(encoding="utf-8")
          )
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          if (
              not isinstance(release, dict)
              or release.get("id") != release_id
              or release.get("tag_name") != tag
              or release.get("name") != f"Stasis {tag}"
              or release.get("body") != notes
              or release.get("draft") is not True
              or release.get("prerelease") is not False
              or release.get("immutable") is not False
              or release.get("published_at") is not None
          ):
              raise SystemExit("draft release identity changed during recovery")
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("live draft asset inventory is malformed")
          missing = set(expected)
          starters = []
          seen = set()
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("live draft has a malformed asset")
              name = asset.get("name")
              asset_id = asset.get("id")
              if (
                  not isinstance(name, str)
                  or name not in expected
                  or name in seen
                  or type(asset_id) is not int
                  or asset_id <= 0
              ):
                  raise SystemExit(f"live draft has an unexpected or duplicate asset: {name!r}")
              seen.add(name)
              binding = expected[name]
              state = asset.get("state")
              if state == "uploaded":
                  if asset.get("size") != binding["size"] or asset.get("digest") != binding["digest"]:
                      raise SystemExit(f"live draft asset bytes changed: {name}")
                  missing.remove(name)
              elif state == "starter":
                  if asset.get("size") not in (0, None) or asset.get("digest") not in (None, ""):
                      raise SystemExit(f"live draft starter asset is malformed: {name}")
                  starters.append((name, asset_id))
              else:
                  raise SystemExit(f"live draft asset is not recoverable: {name}")
          if starters:
              name, asset_id = sorted(starters)[0]
              action = {"kind": "delete", "name": name, "assetId": asset_id}
          elif missing:
              action = {"kind": "upload", "name": sorted(missing)[0]}
          else:
              action = {"kind": "done"}
          pathlib.Path("release-state/next-draft-action.json").write_text(
              json.dumps(action, ensure_ascii=True, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            action_kind=$(jq -er '.kind' release-state/next-draft-action.json)
            if [[ "$action_kind" == 'done' ]]; then
              break
            fi
            if [[ "$action_kind" == 'delete' ]]; then
              asset_name=$(jq -er '.name' release-state/next-draft-action.json)
              starter_asset_id=$(jq -er '.assetId' release-state/next-draft-action.json)
              if [[ ! "$starter_asset_id" =~ ^[1-9][0-9]*$ ]]; then
                echo 'starter asset ID is invalid' >&2
                exit 1
              fi
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$starter_asset_id" \
                > release-state/live-starter-asset.json
              jq -e \
                --arg name "$asset_name" \
                --argjson asset_id "$starter_asset_id" '
                  .id == $asset_id
                  and .name == $name
                  and .state == "starter"
                  and (.size == 0 or .size == null)
                  and (.digest == null or .digest == "")
                ' release-state/live-starter-asset.json > /dev/null
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$starter_asset_id" \
                --silent
            elif [[ "$action_kind" == 'upload' ]]; then
              asset_name=$(jq -er '.name' release-state/next-draft-action.json)
              asset_path=$(jq -er --arg name "$asset_name" '.[$name].path' \
                release-state/expected-assets.json)
              asset_size=$(jq -er --arg name "$asset_name" '.[$name].size' \
                release-state/expected-assets.json)
              asset_digest=$(jq -er --arg name "$asset_name" '.[$name].digest' \
                release-state/expected-assets.json)
              encoded_name=$(jq -rn --arg name "$asset_name" '$name | @uri')
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Content-Type: application/octet-stream' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --data-binary "@$asset_path" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded_name" \
                > release-state/uploaded-asset.json
              jq -e \
                --arg name "$asset_name" \
                --arg digest "$asset_digest" \
                --argjson size "$asset_size" '
                  (.id | type == "number" and . > 0)
                  and .name == $name
                  and .state == "uploaded"
                  and .size == $size
                  and .digest == $digest
                ' release-state/uploaded-asset.json > /dev/null
            else
              echo "unknown draft recovery action: $action_kind" >&2
              exit 1
            fi
            mutation_count=$((mutation_count + 1))
          done

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > release-state/final-draft.json
          DRAFT_RELEASE_ID="$release_id" python3 - <<'PY'
          import json
          import os
          import pathlib

          tag = os.environ["TAG"]
          release_id = int(os.environ["DRAFT_RELEASE_ID"])
          expected = json.loads(
              pathlib.Path("release-state/expected-assets.json").read_text(encoding="utf-8")
          )
          release = json.loads(
              pathlib.Path("release-state/final-draft.json").read_text(encoding="utf-8")
          )
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          if (
              release.get("id") != release_id
              or release.get("tag_name") != tag
              or release.get("name") != f"Stasis {tag}"
              or release.get("body") != notes
              or release.get("draft") is not True
              or release.get("prerelease") is not False
              or release.get("immutable") is not False
              or release.get("published_at") is not None
          ):
              raise SystemExit("final draft release identity changed")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != len(expected):
              raise SystemExit("final draft release asset count changed")
          seen = set()
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("final draft release has a malformed asset")
              name = asset.get("name")
              if name not in expected or name in seen:
                  raise SystemExit(f"final draft has an unexpected or duplicate asset: {name!r}")
              seen.add(name)
              binding = expected[name]
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("size") != binding["size"]
                  or asset.get("digest") != binding["digest"]
              ):
                  raise SystemExit(f"final draft asset bytes changed: {name}")
          if seen != set(expected):
              raise SystemExit("final draft release inventory is incomplete")
          PY
          echo "verified resumable draft release $TAG (ID $release_id) with exact assets"
