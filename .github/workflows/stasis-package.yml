                  raise SystemExit("native archive compressed size is outside the release limit")
              expected_order = [
                  selected_bundle,
                  *(f"{selected_bundle}/{name}" for name in sorted(native_files)),
              ]
              binary_reader = None
              with tempfile.SpooledTemporaryFile(max_size=8 * 1024 * 1024, mode="w+b") as expanded:
                  decompress_native_archive(archive, expanded)
                  with tempfile.SpooledTemporaryFile(max_size=8 * 1024 * 1024, mode="w+b") as canonical:
