name: Stasis package and promote

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Stasis package push run ID; leave both inputs empty to package this SHA
        required: false
        type: string
      release_tag:
        description: Exact Stasis release tag; v0.3.0 is the only accepted value
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: stasis-package-${{ inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  STASIS_FROZEN_V1_PROFILE_SHA256: 6e262edf0f8be11a1cece28f68f00d59fdac68b79b0a670ac891d36998720100
  STASIS_FROZEN_V2_PROFILE_SHA256: 9b62b9245b2c6a6f9620b117da6787a18df9298be1115cbce2e6c3d5439cc41a
  STASIS_RELEASE_VERSION: 0.3.0

jobs:
  validate-invocation:
    name: Select package or promotion mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        name: Validate workflow inputs
        shell: bash
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || '' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$PACKAGE_RUN_ID" && -z "$RELEASE_TAG" ]]; then
            if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
              echo 'Stasis 0.3 package qualification requires a fresh workflow run at attempt 1' >&2
              exit 1
            fi
            echo 'mode=package' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PACKAGE_RUN_ID" && -n "$RELEASE_TAG" && "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'mode=promote' >> "$GITHUB_OUTPUT"
          else
            echo 'package_run_id and release_tag must either both be empty or both be set for a manual promotion' >&2
            exit 1
          fi

  archive-contract:
    name: Release archive contract
    needs: validate-invocation
    if: needs.validate-invocation.outputs.mode == 'package'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up the declared Node 20 SDK floor
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.0.0"
          package-manager-cache: false

      - name: Verify source identity and archive contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("ports/stasis/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          test "$version" = "$STASIS_RELEASE_VERSION"
          test "$(sha256sum profiles/controlled-webapp-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V1_PROFILE_SHA256"
          test "$(sha256sum profiles/controlled-web-session-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V2_PROFILE_SHA256"
          python3 etc/ci/stasis/release_archive.py verify-frozen-v1-profile \
            --source-root .
          python3 etc/ci/stasis/release_archive.py verify-frozen-v2-profile \
            --source-root .
          python3 etc/ci/stasis/release_archive.py verify-candidate-v2-profile \
            --source-root .
          python3 etc/ci/stasis/release_archive.py self-test
          python3 etc/ci/stasis/npm_release.py self-test
          python3 etc/ci/stasis/verify_build_provenance.py self-test
          python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py self-test
          node --check etc/ci/stasis/verify_registry_sdk.mjs

      - name: Gate the source SDK on Node 20
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '20.0.0'
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          node20_test_root="$RUNNER_TEMP/stasis-node20-tests"
          test ! -e "$node20_test_root"
          mkdir -p "$node20_test_root/test"
          pnpm exec tsc -p tsconfig.json \
            --outDir "$node20_test_root" \
            --rootDir . \
            --noEmit false \
            --declaration false \
            --declarationMap false \
            --sourceMap false \
            --inlineSources false
          cp package.json "$node20_test_root/package.json"
          cp -R scripts "$node20_test_root/scripts"
          cp -R test/fixtures "$node20_test_root/test/fixtures"
          for source_test in test/*.test.ts; do
            test -f "$node20_test_root/${source_test%.ts}.js"
          done
          node --test "$node20_test_root"/test/*.test.js

  linux-lifecycle-stress:
    name: Ubuntu 22.04 lifecycle stress (${{ matrix.lane }})
    needs:
      - validate-invocation
      - archive-contract
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.archive-contract.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        lane:
          - traced
          - untraced
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      STASIS_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Bootstrap the native Jammy lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Linux'
          test "$(uname -m)" = 'x86_64'
          test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          unset PKG_CONFIG_PATH
          printf '%s\n' 'PKG_CONFIG_PATH=' >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes xvfb
          ./mach bootstrap --yes --skip-lints --skip-nextest
          freetype_pc_dir=$(pkg-config --variable=pcfiledir freetype2)
          test -n "$freetype_pc_dir"
          if [[ "$freetype_pc_dir" == /opt/hostedtoolcache/* ]]; then
            echo "Jammy lifecycle pkg-config resolved hosted-toolcache FreeType: $freetype_pc_dir" >&2
            exit 1
          fi

      - name: Build the exact-SHA lifecycle candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$STASIS_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" ]]; then
            git status --short --untracked-files=all --ignore-submodules=none >&2
            echo 'the lifecycle checkout is dirty after bootstrap' >&2
            exit 1
          fi
          cargo build --locked -p stasis-shell --profile production-stripped
          file target/production-stripped/stasis | grep -F 'ELF 64-bit LSB'

          ownership_log="$RUNNER_TEMP/stasis-lifecycle-${{ matrix.lane }}-ownership.log"
          : > "$ownership_log"
          # Keep font ownership tests in Stasis's bundled-FreeType feature graph, and run every
          # other owner regression through a real test target rather than trusting a zero-test
          # package invocation.
          ownership_status=0
          set +e
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-base --lib global_thread_pool_ownership_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-paint --lib thread_ownership \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-fonts --lib thread_owner_join \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-profile --lib thread_ownership_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-media --lib initialization_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-canvas --lib thread_ownership_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo --lib shutdown_thread_ownership_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-constellation --lib finished_event_loop_cleanup_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-net-traits --lib fetch_thread_ownership_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-net --lib thread_ownership_tests \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-net --features servo-net/test-util --test main \
            resource_thread::exit_ack_precedes_physical_resource_thread_termination \
            -- --exact --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-net --features servo-net/test-util --test main \
            resource_thread::resource_thread_owner_join_surfaces_post_ack_panic \
            -- --exact --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-storage --lib owner_ \
            -- --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-storage --test main \
            storage_thread::test_new_storage_threads_create_independent_groups \
            -- --exact --test-threads=1 --show-output >> "$ownership_log" 2>&1 || ownership_status=$?
          set -e
          if (( ownership_status != 0 )); then
            cat "$ownership_log"
            rm -f -- "$ownership_log"
            exit "$ownership_status"
          fi
          expected_ownership_records=(
            'test threadpool::global_thread_pool_ownership_tests::shutdown_fences_accepted_work_and_physical_worker_drop ... ok'
            'test threadpool::global_thread_pool_ownership_tests::shutdown_surfaces_first_and_drains_every_unhandled_task_panic ... ok'
            'test threadpool::global_thread_pool_ownership_tests::worker_join_continues_after_first_panicking_handle ... ok'
            'test thread_ownership::tests::backend_join_continues_after_the_first_panicking_handle ... ok'
            'test thread_ownership::tests::backend_join_fences_post_ack_thread_owned_state ... ok'
            'test thread_ownership::tests::backend_shutdown_ack_does_not_hide_a_later_thread_panic ... ok'
            'test thread_ownership::tests::production_spawn_handler_joins_every_custom_rayon_worker ... ok'
            'test thread_ownership::tests::worker_join_continues_after_the_first_panicking_handle ... ok'
            'test painter::thread_ownership_tests::pre_ack_shutdown_failure_forces_every_queue_before_joining_physical_owners ... ok'
            'test painter::thread_ownership_tests::force_shutdown_wakes_surviving_queues_after_low_priority_disconnect ... ok'
            'test system_font_service::tests::thread_owner_join_fences_post_ack_thread_owned_state ... ok'
            'test system_font_service::tests::thread_owner_join_surfaces_post_ack_panic ... ok'
            'test mem::thread_ownership_tests::memory_profiler_owner_join_fences_thread_owned_state ... ok'
            'test mem::thread_ownership_tests::memory_profiler_owner_joins_the_real_profiler_after_exit ... ok'
            'test initialization_tests::initialization_completes_on_the_calling_thread_before_returning ... ok'
            'test initialization_tests::initializer_panic_is_synchronous_and_leaves_the_cell_uninitialized ... ok'
            'test canvas_paint_thread::thread_ownership_tests::owner_join_fences_real_exit_ack_before_post_ack_drop ... ok'
            'test canvas_paint_thread::thread_ownership_tests::owner_join_surfaces_real_post_ack_panic ... ok'
            'test servo::shutdown_thread_ownership_tests::late_owner_panic_does_not_replace_primary_unwind ... ok'
            'test servo::shutdown_thread_ownership_tests::missing_shutdown_terminal_remains_failure_after_tls_owner_join ... ok'
            'test constellation::finished_event_loop_cleanup_tests::finished_event_loop_handles_are_joined_while_running_handles_are_retained ... ok'
            'test constellation::finished_event_loop_cleanup_tests::normally_finished_event_loop_handles_join_without_failure ... ok'
            'test fetch_thread_ownership_tests::exit_and_join_fences_callback_drop_and_surfaces_post_exit_panic ... ok'
            'test async_runtime::thread_ownership_tests::shutdown_waits_for_worker_owned_task_drop ... ok'
            'test resource_thread::exit_ack_precedes_physical_resource_thread_termination ... ok'
            'test resource_thread::resource_thread_owner_join_surfaces_post_ack_panic ... ok'
            'test cache_storage::tests::owner_join_closes_exit_acknowledgement_before_physical_drop_gap ... ok'
            'test storage_thread::tests::owner_attempts_every_join_and_reports_every_failure ... ok'
            'test storage_thread::test_new_storage_threads_create_independent_groups ... ok'
          )
          test "${#expected_ownership_records[@]}" = '29'
          for test_record in "${expected_ownership_records[@]}"; do
            test "$(grep -Fxc "$test_record" "$ownership_log")" = '1'
          done
          cat "$ownership_log"
          rm -f -- "$ownership_log"

          oracle_log="$RUNNER_TEMP/stasis-lifecycle-${{ matrix.lane }}-source-oracle.raw.log"
          set +e
          xvfb-run -a cargo test --locked --profile production-stripped \
            -p stasis-shell --test controlled_mvp \
            source_binary_ \
            -- --test-threads=1 --show-output > "$oracle_log" 2>&1
          oracle_status=$?
          set -e
          if (( oracle_status != 0 )); then
            oracle_summary="$RUNNER_TEMP/stasis-lifecycle-${{ matrix.lane }}-source-oracle-summary.log"
            python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
              --input "$oracle_log" \
              --output "$oracle_summary" \
              --failed-gate controlled_mvp \
              --workspace "$GITHUB_WORKSPACE" || true
            cat "$oracle_summary"
            rm -f -- "$oracle_log" "$oracle_summary"
            exit "$oracle_status"
          fi
          test "$(grep -Fxc 'test source_binary_canvas_close_lifecycle_joins_physical_owner ... ok' "$oracle_log")" = '1'
          test "$(grep -Fxc 'test source_binary_single_close_lifecycle_is_owner_ordered ... ok' "$oracle_log")" = '1'
          test "$(grep -Ec '^test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$oracle_log")" = '1'
          cat "$oracle_log"
          rm -f -- "$oracle_log"

      - id: lifecycle_stress_gate
        name: Require 150 fresh single-close processes without retries
        shell: bash
        env:
          STASIS_LIFECYCLE_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          raw_log="$RUNNER_TEMP/stasis-lifecycle-${STASIS_LIFECYCLE_LANE}.raw.log"
          : > "$raw_log"
          echo "STASIS_LIFECYCLE_RAW_LOG=$raw_log" >> "$GITHUB_ENV"
          trace_environment=(env -u STASIS_LIFECYCLE_TRACE_V1)
          if [[ "$STASIS_LIFECYCLE_LANE" == 'traced' ]]; then
            trace_environment=(env STASIS_LIFECYCLE_TRACE_V1=1)
          elif [[ "$STASIS_LIFECYCLE_LANE" != 'untraced' ]]; then
            echo 'unknown lifecycle lane' >&2
            exit 1
          fi
          for sample in $(seq 1 150); do
            printf 'session_north_star_%s_sample=%03d/150\n' \
              "$STASIS_LIFECYCLE_LANE" "$sample"
            printf 'session_north_star_%s_sample=%03d/150\n' \
              "$STASIS_LIFECYCLE_LANE" "$sample" >> "$raw_log"
            set +e
            xvfb-run -a "${trace_environment[@]}" \
              cargo test --locked --profile production-stripped \
                -p stasis-shell --test controlled_mvp \
                ten_second_timeout_session_closes_cleanly_after_virtual_advance \
                -- --exact --test-threads=1 --show-output \
              >> "$raw_log" 2>&1
            status=$?
            set -e
            if (( status != 0 )); then
              printf 'failed_sample=%03d\n' "$sample" >> "$GITHUB_OUTPUT"
              exit "$status"
            fi
          done
          rm -f -- "$raw_log"
          echo 'completed_samples=150' >> "$GITHUB_OUTPUT"

      - name: Sanitize failed lifecycle evidence
        if: failure() && steps.lifecycle_stress_gate.outcome == 'failure'
        shell: bash
        env:
          STASIS_LIFECYCLE_LANE: ${{ matrix.lane }}
        run: |
          set +e
          diagnostics="$RUNNER_TEMP/stasis-lifecycle-${STASIS_LIFECYCLE_LANE}-diagnostics"
          mkdir -p "$diagnostics"
          summary="$diagnostics/failure-summary.log"
          python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
            --input "$STASIS_LIFECYCLE_RAW_LOG" \
            --output "$summary" \
            --failed-gate "session_north_star_${STASIS_LIFECYCLE_LANE}" \
            --workspace "$GITHUB_WORKSPACE"
          sanitizer_status=$?
          rm -f -- "$STASIS_LIFECYCLE_RAW_LOG"
          {
            echo 'schema=1'
            echo 'boundary=failure_only_fixed_vocabulary_lifecycle_evidence'
            echo "revision=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "lane=$STASIS_LIFECYCLE_LANE"
            echo "failed_sample=${{ steps.lifecycle_stress_gate.outputs.failed_sample }}"
            echo "sanitizer_status=$sanitizer_status"
            echo 'raw_log_uploaded=false'
            echo 'raw_core_memory_uploaded=false'
            echo 'process_environment_values_captured=false'
            sha256sum target/production-stripped/stasis | awk '{print "binary_sha256=" $1}'
            if [[ -f "$summary" && ! -L "$summary" ]]; then
              sha256sum "$summary" | awk '{print "failure_summary_sha256=" $1}'
            fi
          } > "$diagnostics/metadata.txt"
          echo "STASIS_LIFECYCLE_DIAGNOSTICS=$diagnostics" >> "$GITHUB_ENV"
          exit 0

      - name: Upload failed lifecycle evidence
        if: failure() && steps.lifecycle_stress_gate.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-linux-lifecycle-${{ matrix.lane }}-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.STASIS_LIFECYCLE_DIAGNOSTICS }}/failure-summary.log
            ${{ env.STASIS_LIFECYCLE_DIAGNOSTICS }}/metadata.txt
          if-no-files-found: error
          retention-days: 7

  package-native:
    name: Package and gate ${{ matrix.release_platform }}
    needs:
      - validate-invocation
      - archive-contract
      - linux-lifecycle-stress
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.archive-contract.result == 'success'
        && needs.linux-lifecycle-stress.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          - release_platform: macos-aarch64
            runner: macos-15
            kernel: Darwin
            architecture: arm64
          - release_platform: linux-x86_64
            runner: ubuntu-22.04
            kernel: Linux
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      STASIS_REVISION: ${{ github.sha }}
      STASIS_PLATFORM: ${{ matrix.release_platform }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - id: package-names
        name: Resolve immutable package names
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = '${{ matrix.kernel }}'
          test "$(uname -m)" = '${{ matrix.architecture }}'
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            test "$(sysctl -n hw.optional.arm64)" = '1'
          else
            test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("ports/stasis/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          test "$version" = "$STASIS_RELEASE_VERSION"
          bundle="stasis-${version}-${STASIS_PLATFORM}"
          {
            echo "STASIS_VERSION=$version"
            echo "STASIS_BUNDLE=$bundle"
            echo "STASIS_ARCHIVE=${bundle}.tar.gz"
            echo "STASIS_BINARY_SHA256=${bundle}.binary.sha256"
            echo "STASIS_GATE_PROOF=${bundle}-act-settle-inspect.json"
          } >> "$GITHUB_ENV"
          {
            echo "native_artifact_name=stasis-${STASIS_PLATFORM}-attempt-$GITHUB_RUN_ATTEMPT"
            echo "native_proof_artifact_name=stasis-${STASIS_PLATFORM}-act-settle-inspect-proof-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare and measure the ephemeral macOS runner
        if: matrix.release_platform == 'macos-aarch64'
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh prepare 10485760

      - name: Require the Ubuntu 22.04 compatibility floor
        if: matrix.release_platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Linux'
          test "$(uname -m)" = 'x86_64'
          test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Bootstrap macOS build dependencies
        if: matrix.release_platform == 'macos-aarch64'
        run: ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Bootstrap Linux build dependencies
        if: matrix.release_platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          # setup-python exports its private pkg-config directory. Do not let that shadow
          # the Ubuntu 22.04 compatibility-floor metadata used by native dependencies.
          unset PKG_CONFIG_PATH
          echo 'PKG_CONFIG_PATH=' >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes xvfb
          ./mach bootstrap --yes --skip-lints --skip-nextest
          freetype_pc_dir=$(pkg-config --variable=pcfiledir freetype2)
          test -n "$freetype_pc_dir"
          if [[ "$freetype_pc_dir" == /opt/hostedtoolcache/* ]]; then
            echo "Linux native pkg-config still resolves FreeType from setup-python: $freetype_pc_dir" >&2
            exit 1
          fi

      - name: Prepare Linux native-test diagnostics
        if: matrix.release_platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/stasis-linux-crash-attempt-$GITHUB_RUN_ATTEMPT"
          test ! -e "$diagnostics"
          mkdir -p "$diagnostics/logs" "$diagnostics/binaries"
          echo "STASIS_LINUX_CRASH_DIR=$diagnostics" >> "$GITHUB_ENV"

      - name: Build the exact-SHA Stasis executable
        shell: bash
        run: |
          set -euo pipefail
          test "$STASIS_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! worktree_changes=$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none); then
            echo 'could not inspect the checkout before the native build' >&2
            exit 1
          fi
          if [[ -n "$worktree_changes" ]]; then
            git status --short --untracked-files=all --ignore-submodules=none >&2
            echo 'the checkout is dirty after native bootstrap' >&2
            exit 1
          fi
          cargo build --locked -p stasis-shell --profile production-stripped
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            bash etc/ci/stasis/prepare_macos_runner.sh check 4194304
          else
            test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
            file target/production-stripped/stasis | grep -F 'ELF 64-bit LSB'
            linux_dependencies="$RUNNER_TEMP/stasis-linux-dependencies.txt"
            ldd target/production-stripped/stasis | LC_ALL=C sort > "$linux_dependencies"
            test -s "$linux_dependencies"
            if grep -F 'not found' "$linux_dependencies"; then
              echo 'the Linux release binary has an unresolved shared-library dependency' >&2
              exit 1
            fi
            max_glibc=$(objdump -T target/production-stripped/stasis \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sort -Vu \
              | tail -n 1)
            python3 - "$max_glibc" <<'PY'
          import re
          import sys

          match = re.fullmatch(r"GLIBC_([0-9]+)\.([0-9]+)", sys.argv[1])
          if match is None or tuple(map(int, match.groups())) > (2, 35):
              raise SystemExit(f"Linux binary exceeds the glibc 2.35 floor: {sys.argv[1]!r}")
          PY
          fi

      - name: Set up Node for the controlled-session gate
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the SDK harness for the controlled-session gate
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'
          pnpm install --frozen-lockfile
          pnpm build

      - name: Gate the controlled-session v1 North Star on this native platform
        id: session_north_star_gate
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/production-stripped/stasis"
          test -x "$binary"
          gate_runner=(env)
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            gate_runner=(xvfb-run -a env)
          fi
          explicit_runtime_cache="$RUNNER_TEMP/stasis-${STASIS_PLATFORM}-explicit-runtime-cache"
          mkdir "$explicit_runtime_cache"
          session_gate_log="$RUNNER_TEMP/stasis-${STASIS_PLATFORM}-session-north-star.jsonl"
          expected_samples=1
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            session_gate_log="$STASIS_LINUX_CRASH_DIR/logs/session-north-star.raw.log"
            expected_samples=50
          fi
          : > "$session_gate_log"
          for ((lifecycle_sample = 1; lifecycle_sample <= expected_samples; lifecycle_sample++)); do
            printf 'session_north_star_lifecycle_sample=%02d/%02d\n' \
              "$lifecycle_sample" "$expected_samples"
            printf 'session_north_star_lifecycle_sample=%02d/%02d\n' \
              "$lifecycle_sample" "$expected_samples" >> "$session_gate_log"
            set +e
            "${gate_runner[@]}" \
              STASIS_SESSION_NORTH_STAR_BINARY="$binary" \
              STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE="$explicit_runtime_cache" \
              node test/fixtures/public-package-session-north-star.mjs \
                >> "$session_gate_log" 2>&1
            status=$?
            set -e
            if (( status != 0 )); then
              exit "$status"
            fi
          done
          test "$(grep -Fc '"proof":"stasis-v0.2-session-north-star"' "$session_gate_log")" \
            = "$expected_samples"
          test "$(grep -Fc '"runs":3' "$session_gate_log")" = "$expected_samples"
          test "$(grep -Fc '"sessions":6' "$session_gate_log")" = "$expected_samples"
          test "$(grep -Fc '"runtimeAcquisition":"explicit-executable-override-cache-bypassed"' \
            "$session_gate_log")" = "$expected_samples"

      - name: Gate Stasis library and controlled-source invariants on this native platform
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --profile production-stripped -p stasis-shell --lib -- --test-threads=1 --show-output
          # Keep standalone component tests in the release binary's bundled-FreeType feature
          # graph; Ubuntu 22.04 intentionally does not provide freetype2 >= 24.3.18.
          cargo test --locked --profile production-stripped -p stasis-shell -p servo-script --lib pending_nonanimated_image_observation_tests -- --test-threads=1 --show-output
          cargo test --locked --profile production-stripped -p stasis-shell -p servo --lib controlled_cookie_context_tests -- --test-threads=1 --show-output
          cargo test --locked --profile production-stripped -p stasis-shell -p servo-net --lib request_interceptor::tests -- --test-threads=1 --show-output
          cargo test --locked --profile production-stripped -p stasis-shell -p servo-net --test main cookie::controlled_cookie_v2_retrieval_obeys_the_samesite_matrix -- --exact --test-threads=1 --show-output
          cargo test --locked --profile production-stripped -p stasis-shell -p servo-net --test main cookie::controlled_cookie_v2_storage_obeys_the_samesite_matrix -- --exact --test-threads=1 --show-output
          cargo test --locked --profile production-stripped -p stasis-shell -p servo-constellation --lib controlled_session_navigation_load_data_tests -- --test-threads=1 --show-output

      - name: Gate the automation and bounded-settlement fixture matrix
        id: controlled_mvp_gate
        shell: bash
        run: |
          set -euo pipefail
          test_runner=(env)
          raw_log="$RUNNER_TEMP/stasis-controlled-mvp.raw.log"
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            test_runner=(xvfb-run -a env)
            raw_log="$STASIS_LINUX_CRASH_DIR/logs/controlled-mvp.raw.log"
          fi
          set +e
          "${test_runner[@]}" \
            cargo test --locked --profile production-stripped \
              -p stasis-shell --test controlled_mvp \
              -- --test-threads=1 --show-output \
            > "$raw_log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            if [[ "$STASIS_PLATFORM" != 'linux-x86_64' ]]; then
              summary="$RUNNER_TEMP/stasis-controlled-mvp-failure-summary.log"
              set +e
              python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
                --input "$raw_log" \
                --output "$summary" \
                --failed-gate controlled_mvp \
                --workspace "$GITHUB_WORKSPACE"
              sanitizer_status=$?
              if [[ -f "$summary" && ! -L "$summary" ]]; then
                cat "$summary"
              fi
              rm -f -- "$raw_log" "$summary"
              echo "controlled_mvp_sanitizer_status=$sanitizer_status"
            fi
            exit "$status"
          fi
          rm -f -- "$raw_log"
          echo 'controlled_mvp_gate=passed'

      - name: Gate the full baseline protocol matrix
        id: baseline_protocol_gate
        shell: bash
        run: |
          set -euo pipefail
          test_runner=(env)
          raw_log="$RUNNER_TEMP/stasis-baseline-protocol.raw.log"
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            test_runner=(xvfb-run -a env)
            raw_log="$STASIS_LINUX_CRASH_DIR/logs/baseline.raw.log"
          fi
          set +e
          "${test_runner[@]}" \
            cargo test --locked --profile production-stripped \
              -p stasis-shell --test baseline_protocol \
              -- --test-threads=1 --show-output \
            > "$raw_log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            if [[ "$STASIS_PLATFORM" != 'linux-x86_64' ]]; then
              summary="$RUNNER_TEMP/stasis-baseline-protocol-failure-summary.log"
              set +e
              python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
                --input "$raw_log" \
                --output "$summary" \
                --failed-gate baseline_protocol \
                --workspace "$GITHUB_WORKSPACE"
              sanitizer_status=$?
              if [[ -f "$summary" && ! -L "$summary" ]]; then
                cat "$summary"
              fi
              rm -f -- "$raw_log" "$summary"
              echo "baseline_protocol_sanitizer_status=$sanitizer_status"
            fi
            exit "$status"
          fi
          rm -f -- "$raw_log"
          echo 'baseline_protocol_gate=passed'

      - name: Collect Linux native-test crash diagnostics
        if: >-
          failure()
          && matrix.release_platform == 'linux-x86_64'
          && env.STASIS_LINUX_CRASH_DIR != ''
          && (
            steps.session_north_star_gate.outcome == 'failure'
            || steps.controlled_mvp_gate.outcome == 'failure'
            || steps.baseline_protocol_gate.outcome == 'failure'
          )
        shell: bash
        env:
          SESSION_NORTH_STAR_OUTCOME: ${{ steps.session_north_star_gate.outcome }}
          CONTROLLED_MVP_OUTCOME: ${{ steps.controlled_mvp_gate.outcome }}
          BASELINE_PROTOCOL_OUTCOME: ${{ steps.baseline_protocol_gate.outcome }}
        run: |
          set +e
          diagnostics="$STASIS_LINUX_CRASH_DIR"
          status_file="$diagnostics/collection-status.txt"
          if [[ ! -d "$diagnostics" ]]; then
            echo 'the Linux crash diagnostics directory was not prepared' >&2
            exit 0
          fi
          : > "$status_file"
          echo 'schema=1' >> "$status_file"
          if [[ "$SESSION_NORTH_STAR_OUTCOME" == 'failure' ]]; then
            failed_gate='session_north_star'
            failed_log="$diagnostics/logs/session-north-star.raw.log"
          elif [[ "$CONTROLLED_MVP_OUTCOME" == 'failure' ]]; then
            failed_gate='controlled_mvp'
            failed_log="$diagnostics/logs/controlled-mvp.raw.log"
          elif [[ "$BASELINE_PROTOCOL_OUTCOME" == 'failure' ]]; then
            failed_gate='baseline_protocol'
            failed_log="$diagnostics/logs/baseline.raw.log"
          else
            failed_gate='unknown'
            failed_log=''
          fi
          echo "failed_gate=$failed_gate" >> "$status_file"
          if [[ -s "$diagnostics/logs/session-north-star.raw.log" ]]; then
            echo 'session_north_star_raw_log=available_for_sanitization' >> "$status_file"
          else
            echo 'session_north_star_raw_log=missing_or_empty' >> "$status_file"
          fi
          if [[ -s "$diagnostics/logs/controlled-mvp.raw.log" ]]; then
            echo 'controlled_mvp_raw_log=available_for_sanitization' >> "$status_file"
          else
            echo 'controlled_mvp_raw_log=missing_or_empty' >> "$status_file"
          fi
          if [[ -s "$diagnostics/logs/baseline.raw.log" ]]; then
            echo 'baseline_protocol_raw_log=available_for_sanitization' >> "$status_file"
          else
            echo 'baseline_protocol_raw_log=missing_or_empty' >> "$status_file"
          fi

          binary_source="$GITHUB_WORKSPACE/target/production-stripped/stasis"
          if [[ -f "$binary_source" && ! -L "$binary_source" ]]; then
            if cp --preserve=mode,timestamps -- "$binary_source" "$diagnostics/binaries/stasis"; then
              echo 'stasis_binary_copy=ok' >> "$status_file"
            else
              echo 'stasis_binary_copy=failed' >> "$status_file"
            fi
          else
            echo 'stasis_binary_copy=source_missing_or_symlink' >> "$status_file"
          fi

          harness_relative=''
          if [[ -n "$failed_log" && -s "$failed_log" \
              && "$failed_gate" =~ ^(controlled_mvp|baseline_protocol)$ ]]; then
            harness_relative=$(LC_ALL=C sed -nE \
              "s|^[[:space:]]*Running tests/${failed_gate}\\.rs \\((target/production-stripped/deps/${failed_gate}-[0-9a-f]+)\\)[[:space:]]*$|\\1|p" \
              "$failed_log" | tail -n 1)
          fi
          if [[ "$harness_relative" =~ ^target/production-stripped/deps/${failed_gate}-[0-9a-f]+$ ]]; then
            harness_source="$GITHUB_WORKSPACE/$harness_relative"
            if [[ -f "$harness_source" && ! -L "$harness_source" && -x "$harness_source" ]]; then
              if cp --preserve=mode,timestamps -- \
                  "$harness_source" "$diagnostics/binaries/failed-test-harness"; then
                echo 'failed_harness_copy=ok' >> "$status_file"
              else
                echo 'failed_harness_copy=failed' >> "$status_file"
              fi
            else
              echo 'failed_harness_copy=source_missing_symlink_or_not_executable' >> "$status_file"
            fi
          else
            echo 'failed_harness_copy=path_unavailable_or_invalid' >> "$status_file"
          fi

          summary="$diagnostics/logs/failure-summary.log"
          if python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
            --input "$failed_log" \
            --output "$summary" \
            --failed-gate "$failed_gate" \
            --workspace "$GITHUB_WORKSPACE"; then
            echo 'failure_summary=ok' >> "$status_file"
          else
            echo 'failure_summary=source_missing_or_sanitizer_failed' >> "$status_file"
          fi

          rm -f -- \
            "$diagnostics/logs/session-north-star.raw.log" \
            "$diagnostics/logs/controlled-mvp.raw.log" \
            "$diagnostics/logs/baseline.raw.log"
          if [[ ! -e "$diagnostics/logs/session-north-star.raw.log" \
              && ! -e "$diagnostics/logs/controlled-mvp.raw.log" \
              && ! -e "$diagnostics/logs/baseline.raw.log" ]]; then
            echo 'raw_logs_deleted=ok' >> "$status_file"
          else
            echo 'raw_logs_deleted=failed' >> "$status_file"
          fi

          if {
            echo 'schema=1'
            echo 'boundary=failure_only_sanitized_lifecycle_diagnostics'
            echo "revision=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "failed_gate=$failed_gate"
            echo "session_north_star_outcome=$SESSION_NORTH_STAR_OUTCOME"
            echo "controlled_mvp_outcome=$CONTROLLED_MVP_OUTCOME"
            echo "baseline_protocol_outcome=$BASELINE_PROTOCOL_OUTCOME"
            echo 'raw_logs_uploaded=false'
            echo 'raw_core_memory_uploaded=false'
            echo 'process_environment_values_captured=false'
            printf 'kernel='; uname -srm
            printf 'libc='; LC_ALL=C getconf GNU_LIBC_VERSION
            if [[ -f "$summary" && ! -L "$summary" ]]; then
              stat --printf='failure_summary_size=%s\n' "$summary"
              printf 'failure_summary_sha256='
              sha256sum "$summary" | awk '{print $1}'
            else
              echo 'failure_summary=missing_or_symlink'
            fi
            for binary_spec in \
              "stasis:$diagnostics/binaries/stasis" \
              "failed_test_harness:$diagnostics/binaries/failed-test-harness"; do
              binary_label=${binary_spec%%:*}
              copied_binary=${binary_spec#*:}
              if [[ -f "$copied_binary" && ! -L "$copied_binary" ]]; then
                stat --printf="${binary_label}_size=%s\n${binary_label}_mode=%a\n" "$copied_binary"
                printf '%s_sha256=' "$binary_label"
                sha256sum "$copied_binary" | awk '{print $1}'
                build_id=$(readelf --notes "$copied_binary" \
                  | LC_ALL=C sed -nE 's/^[[:space:]]*Build ID: ([0-9a-f]+)$/\1/p' \
                  | head -n 1)
                if [[ "$build_id" =~ ^[0-9a-f]+$ ]]; then
                  echo "${binary_label}_build_id=$build_id"
                else
                  echo "${binary_label}_build_id=unavailable"
                fi
                ldd_private="$RUNNER_TEMP/stasis-${binary_label}-ldd.private.txt"
                ldd "$copied_binary" | LC_ALL=C sort > "$ldd_private"
                ldd_size=$(stat --printf='%s' "$ldd_private")
                ldd_count=$(wc -l < "$ldd_private")
                if (( ldd_size <= 65536 && ldd_count <= 256 )); then
                  echo "${binary_label}_ldd_dependency_count=$ldd_count"
                  printf '%s_ldd_sha256=' "$binary_label"
                  sha256sum "$ldd_private" | awk '{print $1}'
                else
                  echo "${binary_label}_ldd_inventory=outside_bound"
                fi
                rm -f -- "$ldd_private"
              else
                echo "${binary_label}=missing_or_symlink"
              fi
            done
          } > "$diagnostics/metadata.txt" 2>&1; then
            echo 'metadata=ok' >> "$status_file"
          else
            echo 'metadata=failed' >> "$status_file"
          fi
          exit 0

      - name: Upload Linux native-test crash diagnostics
        if: >-
          failure()
          && matrix.release_platform == 'linux-x86_64'
          && env.STASIS_LINUX_CRASH_DIR != ''
          && (
            steps.session_north_star_gate.outcome == 'failure'
            || steps.controlled_mvp_gate.outcome == 'failure'
            || steps.baseline_protocol_gate.outcome == 'failure'
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-linux-crash-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.STASIS_LINUX_CRASH_DIR }}/logs/failure-summary.log
            ${{ env.STASIS_LINUX_CRASH_DIR }}/binaries/stasis
            ${{ env.STASIS_LINUX_CRASH_DIR }}/binaries/failed-test-harness
            ${{ env.STASIS_LINUX_CRASH_DIR }}/collection-status.txt
            ${{ env.STASIS_LINUX_CRASH_DIR }}/metadata.txt
          if-no-files-found: error
          retention-days: 7

      - name: Gate controlled-network redirect ordering invariants
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the release binary's bundled-FreeType feature graph on Linux while forcing
          # servo-net-traits' otherwise-disabled unit-test target.
          cargo test --locked --profile production-stripped \
            -p stasis-shell -p servo-net-traits --lib controlled_network::tests \
            -- --test-threads=1 --show-output

      - name: Build and verify the release archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! worktree_changes=$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none); then
            echo 'could not inspect the checkout before release archive staging' >&2
            exit 1
          fi
          if [[ -n "$worktree_changes" ]]; then
            git status --short --untracked-files=all --ignore-submodules=none >&2
            echo 'the source tree changed before release archive staging' >&2
            exit 1
          fi
          python3 etc/ci/stasis/release_archive.py create \
            --binary target/production-stripped/stasis \
            --dist dist \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root .
          python3 etc/ci/stasis/release_archive.py verify \
            --asset-directory dist \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root . \
            --extract-to "$RUNNER_TEMP/stasis-release-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Gate the extracted artifact with act-settle-inspect
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/stasis-release-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$STASIS_BUNDLE/stasis"
          binary_sha256=$(awk '{print $1}' "dist/$STASIS_BINARY_SHA256")
          gate_log="$RUNNER_TEMP/stasis-act-settle-inspect.log"
          gate_runner=(env)
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            gate_runner=(xvfb-run -a env)
          fi
          set +e
          "${gate_runner[@]}" \
            STASIS_RELEASE_BINARY="$binary" \
            STASIS_RELEASE_ARCHIVE="$GITHUB_WORKSPACE/dist/$STASIS_ARCHIVE" \
            STASIS_RELEASE_REVISION="$GITHUB_SHA" \
            STASIS_RELEASE_SHA256="$binary_sha256" \
            cargo test --locked --profile production-stripped -p stasis-shell --test controlled_mvp \
              release_gate_published_binary_completes_act_settle_inspect \
              -- --ignored --exact --test-threads=1 --show-output \
              > "$gate_log" 2>&1
          gate_status=$?
          set -e
          if (( gate_status != 0 )); then
            failure_summary="$RUNNER_TEMP/stasis-act-settle-inspect-failure-summary.log"
            set +e
            python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
              --input "$gate_log" \
              --output "$failure_summary" \
              --failed-gate release_artifact_gate \
              --workspace "$GITHUB_WORKSPACE"
            sanitizer_status=$?
            if [[ -f "$failure_summary" && ! -L "$failure_summary" ]]; then
              cat "$failure_summary"
            fi
            rm -f -- "$gate_log" "$failure_summary"
            echo "release_artifact_gate_sanitizer_status=$sanitizer_status"
            exit "$gate_status"
          fi
          grep -Fq 'test release_gate_published_binary_completes_act_settle_inspect ... ok' "$gate_log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$gate_log"
          python3 etc/ci/stasis/release_archive.py gate-proof \
            --proof "dist/$STASIS_GATE_PROOF" \
            --gate-log "$gate_log" \
            --asset-directory dist \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          rm -f -- "$gate_log"
          echo 'release_artifact_gate=passed'

      - name: Recheck runner disk after the native release gate
        if: matrix.release_platform == 'macos-aarch64'
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 2097152

      - name: Upload exact release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package-names.outputs.native_artifact_name }}
          path: |
            dist/${{ env.STASIS_ARCHIVE }}
            dist/${{ env.STASIS_ARCHIVE }}.sha256
            dist/${{ env.STASIS_BINARY_SHA256 }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload artifact-bound gate proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package-names.outputs.native_proof_artifact_name }}
          path: dist/${{ env.STASIS_GATE_PROOF }}
          if-no-files-found: error
          retention-days: 90

  package-windows-ci:
    name: Build and gate Windows x86-64 CI bundle
    needs:
      - validate-invocation
      - archive-contract
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.archive-contract.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: C:\a\stasis\stasis\target
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      RUSTUP_WINDOWS_PATH_ADD_BIN: 1
      STASIS_REVISION: ${{ github.sha }}
      STASIS_WINDOWS_PLATFORM: windows-x86_64
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - id: windows-python
        name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Verify the Windows Python and aws-lc assembler boundary
        env:
          STASIS_SETUP_PYTHON: ${{ steps.windows-python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $env:STASIS_SETUP_PYTHON
          if ([string]::IsNullOrWhiteSpace($python) `
            -or -not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "setup-python did not produce a usable interpreter: $python"
          }
          $python = (Resolve-Path -LiteralPath $python).Path
          if ($python -match '(?i)\\WindowsApps\\') {
            throw "setup-python resolved the Windows Store alias: $python"
          }
          $expectedPython = (Get-Content -LiteralPath '.python-version' -Raw).Trim()
          if ($expectedPython -notmatch '^[0-9]+\.[0-9]+$') {
            throw "the pinned Python minor is invalid: $expectedPython"
          }
          $actualPython = (& $python -c `
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")').Trim()
          if ($LASTEXITCODE -ne 0 -or $actualPython -cne $expectedPython) {
            throw "setup-python provided Python $actualPython, expected $expectedPython"
          }
          $pathPython = (Get-Command python.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1).Source
          $pathPython = (Resolve-Path -LiteralPath $pathPython).Path
          if ($pathPython -ne $python) {
            throw "PATH resolves python.exe to $pathPython instead of setup-python $python"
          }
          "UV_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON3=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_EXPECTED_PYTHON_MINOR=$expectedPython" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STASIS_WINDOWS_PYTHON_BOUNDARY=setup-python-$expectedPython-via-uv" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not [string]::IsNullOrEmpty($env:AWS_LC_SYS_PREBUILT_NASM)) {
            throw 'AWS_LC_SYS_PREBUILT_NASM must be selected only after the runner NASM probe'
          }
          if (-not [string]::IsNullOrEmpty($env:AWS_LC_SYS_NO_ASM)) {
            throw 'AWS_LC_SYS_NO_ASM conflicts with the declared Windows assembly boundary'
          }
          $lock = Get-Content -LiteralPath 'Cargo.lock' -Raw
          $awsLc = [regex]::Matches(
            $lock,
            '(?ms)^\[\[package\]\]\r?\nname = "aws-lc-sys"\r?\nversion = "([^"]+)"'
          )
          if ($awsLc.Count -ne 1 -or $awsLc[0].Groups[1].Value -cne '0.44.0') {
            throw 'Cargo.lock no longer contains the audited aws-lc-sys 0.44.0 package'
          }
          $nasm = Get-Command nasm.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($null -eq $nasm) {
            Write-Host 'NASM is absent; aws-lc-sys will use its locked prebuilt x86-64 objects.'
            $prebuiltNasm = '1'
            $assemblerBoundary = 'aws-lc-sys-0.44.0-prebuilt'
          } else {
            $nasmVersion = (& $nasm.Source -version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($nasmVersion)) {
              throw "the runner NASM is unusable: $($nasm.Source)"
            }
            Write-Host "Using runner NASM at $($nasm.Source): $nasmVersion"
            $prebuiltNasm = '0'
            $assemblerBoundary = 'runner-nasm-probed'
          }
          $expectedBoundaryByChoice = @{
            '0' = 'runner-nasm-probed'
            '1' = 'aws-lc-sys-0.44.0-prebuilt'
          }
          if ($expectedBoundaryByChoice[$prebuiltNasm] -cne $assemblerBoundary) {
            throw 'the Windows NASM choice and proof boundary diverged'
          }
          @(
            "AWS_LC_SYS_PREBUILT_NASM=$prebuiltNasm"
            "STASIS_WINDOWS_PREBUILT_NASM=$prebuiltNasm"
            "STASIS_WINDOWS_ASSEMBLER_BOUNDARY=$assemblerBoundary"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - id: windows-names
        name: Resolve the exact Windows CI identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -cne 'X64' -or -not [Environment]::Is64BitProcess) {
            throw "the Windows CI bundle requires an x86-64 runner, observed $env:RUNNER_ARCH"
          }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw "checkout HEAD $head does not equal event SHA $env:GITHUB_SHA"
          }
          if ($env:STASIS_REVISION -cne $env:GITHUB_SHA) {
            throw 'the configured Stasis revision does not equal the event SHA'
          }
          $versionMatch = Select-String `
            -LiteralPath 'ports/stasis/Cargo.toml' `
            -Pattern '^version = "([^"]+)"$' `
            | Select-Object -First 1
          if ($null -eq $versionMatch) {
            throw 'could not read the stasis-shell package version'
          }
          $version = $versionMatch.Matches[0].Groups[1].Value
          if ($version -cne $env:STASIS_RELEASE_VERSION) {
            throw "stasis-shell version $version does not equal $env:STASIS_RELEASE_VERSION"
          }
          $bundle = "stasis-$version-$env:STASIS_WINDOWS_PLATFORM-ci"
          $dist = Join-Path $env:RUNNER_TEMP 'stasis-windows-ci'
          $artifacts = Join-Path $dist 'artifacts'
          $logs = Join-Path $dist 'logs'
          $binary = Join-Path $env:CARGO_TARGET_DIR 'production-stripped\stasis.exe'
          New-Item -ItemType Directory -Force -Path $artifacts, $logs | Out-Null
          @(
            "STASIS_WINDOWS_VERSION=$version"
            "STASIS_WINDOWS_BUNDLE=$bundle"
            "STASIS_WINDOWS_BINARY=$binary"
            "STASIS_WINDOWS_DIST=$dist"
            "STASIS_WINDOWS_ARTIFACTS=$artifacts"
            "STASIS_WINDOWS_LOGS=$logs"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            "bundle_artifact_name=stasis-windows-x86_64-ci-attempt-$env:GITHUB_RUN_ATTEMPT"
            "log_artifact_name=stasis-windows-x86_64-ci-logs-attempt-$env:GITHUB_RUN_ATTEMPT"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Bootstrap the Windows build environment
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonProbe = @'
          import os
          import pathlib
          import sys

          executable = str(pathlib.Path(sys.executable).resolve())
          mozilla_python = str(pathlib.Path(os.environ["PYTHON3"]).resolve())
          expected = os.environ["STASIS_EXPECTED_PYTHON_MINOR"]
          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          if (
              actual != expected
              or "\\windowsapps\\" in executable.lower()
              or "\\windowsapps\\" in mozilla_python.lower()
              or not pathlib.Path(mozilla_python).is_file()
              or not pathlib.Path(executable).samefile(mozilla_python)
          ):
              raise SystemExit(
                  f"mach Python boundary mismatch: executable={executable!r}, "
                  f"PYTHON3={mozilla_python!r}, "
                  f"version={actual!r}, expected={expected!r}"
              )
          print(f"mach Python: {executable}; Mozilla PYTHON3: {mozilla_python} ({actual})")
          '@
          & .\mach.ps1 exec -- python -c $pythonProbe
          if ($LASTEXITCODE -ne 0) {
            throw "mach Python verification failed with exit code $LASTEXITCODE"
          }
          $lldLink = Join-Path $env:LIBCLANG_PATH 'lld-link.exe'
          if (-not (Test-Path -LiteralPath $lldLink -PathType Leaf)) {
            throw "LLVM linker is missing: $lldLink"
          }
          $env:LIBCLANG_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & .\mach.ps1 fetch
          if ($LASTEXITCODE -ne 0) {
            throw "mach fetch failed with exit code $LASTEXITCODE"
          }
          & .\mach.ps1 bootstrap-gstreamer
          if ($LASTEXITCODE -ne 0) {
            throw "mach bootstrap-gstreamer failed with exit code $LASTEXITCODE"
          }

      - name: Build the exact-SHA production-stripped Stasis executable
        run: |
          $ErrorActionPreference = 'Stop'
          $validAssemblerBoundary =
            ($env:AWS_LC_SYS_PREBUILT_NASM -ceq '0' `
              -and $env:STASIS_WINDOWS_PREBUILT_NASM -ceq '0' `
              -and $env:STASIS_WINDOWS_ASSEMBLER_BOUNDARY -ceq 'runner-nasm-probed') `
            -or ($env:AWS_LC_SYS_PREBUILT_NASM -ceq '1' `
              -and $env:STASIS_WINDOWS_PREBUILT_NASM -ceq '1' `
              -and $env:STASIS_WINDOWS_ASSEMBLER_BOUNDARY `
                -ceq 'aws-lc-sys-0.44.0-prebuilt')
          if (-not $validAssemblerBoundary) {
            throw 'the Windows build did not inherit one exact audited NASM boundary'
          }
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {
            throw 'the checkout changed after Windows bootstrap'
          }
          $worktreeChanges = @(& git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0 -or $worktreeChanges.Count -ne 0) {
            $worktreeChanges | ForEach-Object { Write-Error $_ }
            throw 'the checkout is dirty after Windows bootstrap'
          }
          $rustVersion = (& .\mach.ps1 exec -- rustc -vV | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "rustc identity failed with exit code $LASTEXITCODE"
          }
          if ($rustVersion -notmatch '(?m)^host: x86_64-pc-windows-msvc\s*$') {
            throw "unexpected Windows Rust host:`n$rustVersion"
          }
          & .\mach.ps1 exec -- cargo build --locked -p stasis-shell --profile production-stripped
          if ($LASTEXITCODE -ne 0) {
            throw "Stasis Windows build failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $env:STASIS_WINDOWS_BINARY -PathType Leaf)) {
            throw "production-stripped Stasis executable is missing: $env:STASIS_WINDOWS_BINARY"
          }
          if ((Get-Item -LiteralPath $env:STASIS_WINDOWS_BINARY).Length -lt 1) {
            throw 'production-stripped Stasis executable is empty'
          }

      - name: Gate Stasis library and controlled-source invariants on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $stasisLibTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell --lib ' +
            '-- --test-threads=1 --show-output; exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $stasisLibTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows Stasis library-invariant gate failed with exit code $LASTEXITCODE"
          }
          $controlledImageCapacityTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p servo-script --lib ' +
            'pending_nonanimated_image_observation_tests -- --test-threads=1 --show-output; ' +
            'exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $controlledImageCapacityTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows controlled-image capacity gate failed with exit code $LASTEXITCODE"
          }
          $controlledCookieContextTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p servo --lib ' +
            'controlled_cookie_context_tests -- --test-threads=1 --show-output; ' +
            'exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $controlledCookieContextTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows controlled-cookie context gate failed with exit code $LASTEXITCODE"
          }
          $requestInterceptorTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p servo-net --lib ' +
            'request_interceptor::tests -- --test-threads=1 --show-output; ' +
            'exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $requestInterceptorTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows request-interceptor provenance gate failed with exit code $LASTEXITCODE"
          }
          $controlledCookieRetrievalTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p servo-net --test main ' +
            'cookie::controlled_cookie_v2_retrieval_obeys_the_samesite_matrix -- --exact ' +
            '--test-threads=1 --show-output; exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $controlledCookieRetrievalTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows controlled-cookie retrieval gate failed with exit code $LASTEXITCODE"
          }
          $controlledCookieStorageTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p servo-net --test main ' +
            'cookie::controlled_cookie_v2_storage_obeys_the_samesite_matrix -- --exact ' +
            '--test-threads=1 --show-output; exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $controlledCookieStorageTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows controlled-cookie storage gate failed with exit code $LASTEXITCODE"
          }
          $controlledNavigationLoadDataTestCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p servo-constellation --lib ' +
            'controlled_session_navigation_load_data_tests -- --test-threads=1 --show-output; ' +
            'exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $controlledNavigationLoadDataTestCommand
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows controlled-session navigation/load-data gate failed with exit code $LASTEXITCODE"
          }

      - name: Stage the required ANGLE runtime beside Stasis
        run: |
          $ErrorActionPreference = 'Stop'
          $profileDirectory = Split-Path -Parent $env:STASIS_WINDOWS_BINARY
          $buildDirectory = Join-Path $profileDirectory 'build'
          if (-not (Test-Path -LiteralPath $buildDirectory -PathType Container)) {
            throw "Cargo build output is missing: $buildDirectory"
          }
          foreach ($dllName in @('libEGL.dll', 'libGLESv2.dll')) {
            $candidates = @(Get-ChildItem -LiteralPath $buildDirectory -Recurse -File `
              -Filter $dllName | Sort-Object FullName)
            if ($candidates.Count -lt 1) {
              throw "the servo/no-wgl build did not produce $dllName"
            }
            $candidateHashes = @($candidates `
              | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash } `
              | Sort-Object -Unique)
            if ($candidateHashes.Count -ne 1) {
              throw "the servo/no-wgl build produced conflicting copies of $dllName"
            }
            Copy-Item -LiteralPath $candidates[0].FullName `
              -Destination (Join-Path $profileDirectory $dllName) -Force
          }
          $profileDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node for the Windows controlled-session gate
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the TypeScript SDK harness
        working-directory: sdk/typescript
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'corepack enable failed' }
          corepack prepare pnpm@9.12.3 --activate
          if ($LASTEXITCODE -ne 0) { throw 'could not activate pnpm 9.12.3' }
          if ((pnpm --version).Trim() -cne '9.12.3') {
            throw 'the active pnpm version is not 9.12.3'
          }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'the TypeScript SDK build failed' }

      - name: Gate the platform-honest TypeScript SDK suite on Windows
        working-directory: sdk/typescript
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'the Windows TypeScript SDK suite failed' }

      - name: Gate the controlled-session v1 North Star with the explicit executable
        working-directory: sdk/typescript
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeCache = Join-Path $env:RUNNER_TEMP `
            "stasis-windows-explicit-runtime-cache-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $runtimeCache | Out-Null
          $env:STASIS_SESSION_NORTH_STAR_BINARY = $env:STASIS_WINDOWS_BINARY
          $env:STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE = $runtimeCache
          $log = Join-Path $env:STASIS_WINDOWS_LOGS 'session-north-star.raw.log'
          $summary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'session-north-star-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          & node test/fixtures/public-package-session-north-star.mjs *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            & $env:PYTHON3 $sanitizer sanitize `
              --input $log `
              --output $summary `
              --failed-gate session_north_star `
              --workspace $env:GITHUB_WORKSPACE
            $sanitizerExit = $LASTEXITCODE
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $summary -PathType Leaf) {
              Get-Content -LiteralPath $summary
            }
            Write-Output "windows_session_north_star_sanitizer_status=$sanitizerExit"
            throw "the Windows controlled-session North Star failed with exit code $exitCode"
          }
          $proof = Get-Content -LiteralPath $log -Raw
          $missing = @()
          foreach ($required in @(
            '"proof":"stasis-v0.2-session-north-star"',
            '"runs":3',
            '"sessions":6',
            '"runtimeAcquisition":"explicit-executable-override-cache-bypassed"'
          )) {
            if (-not $proof.Contains($required)) {
              $missing += $required
            }
          }
          Remove-Item -LiteralPath $log -Force
          if ($missing.Count -ne 0) {
            throw 'the private Windows North Star log omitted fixed success evidence'
          }
          @"
          schema=1
          gate=session_north_star
          revision=$env:GITHUB_SHA
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          runs=3
          sessions=6
          runtime_acquisition=explicit_executable_override_cache_bypassed
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS 'session-north-star-proof.txt') `
            -Encoding utf8NoBOM
          Write-Output 'windows_session_north_star=passed'

      - name: Gate the automation and bounded-settlement fixture matrix
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:STASIS_WINDOWS_LOGS 'controlled-mvp.raw.log'
          $summary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'controlled-mvp-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          $testCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell ' +
            '--test controlled_mvp -- --test-threads=1 --show-output; exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $testCommand *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            & $env:PYTHON3 $sanitizer sanitize `
              --input $log `
              --output $summary `
              --failed-gate controlled_mvp `
              --workspace $env:GITHUB_WORKSPACE
            $sanitizerExit = $LASTEXITCODE
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $summary -PathType Leaf) {
              Get-Content -LiteralPath $summary
            }
            Write-Output "windows_controlled_mvp_sanitizer_status=$sanitizerExit"
            throw "the Windows controlled_mvp gate failed with exit code $exitCode"
          }
          $gateText = Get-Content -LiteralPath $log -Raw
          Remove-Item -LiteralPath $log -Force
          if (-not $gateText.Contains('test result: ok.')) {
            throw 'the private Windows controlled_mvp log omitted fixed success evidence'
          }
          @"
          schema=1
          gate=controlled_mvp
          revision=$env:GITHUB_SHA
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          result=passed
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS 'controlled-mvp-proof.txt') `
            -Encoding utf8NoBOM
          Write-Output 'windows_controlled_mvp=passed'

      - name: Gate the full baseline protocol matrix on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:STASIS_WINDOWS_LOGS 'baseline-protocol.raw.log'
          $summary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'baseline-protocol-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          $testCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell ' +
            '--test baseline_protocol -- --test-threads=1 --show-output; ' +
            'exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $testCommand *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            & $env:PYTHON3 $sanitizer sanitize `
              --input $log `
              --output $summary `
              --failed-gate baseline_protocol `
              --workspace $env:GITHUB_WORKSPACE
            $sanitizerExit = $LASTEXITCODE
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $summary -PathType Leaf) {
              Get-Content -LiteralPath $summary
            }
            Write-Output "windows_baseline_protocol_sanitizer_status=$sanitizerExit"
            throw "the Windows baseline_protocol gate failed with exit code $exitCode"
          }
          $gateText = Get-Content -LiteralPath $log -Raw
          Remove-Item -LiteralPath $log -Force
          if (-not $gateText.Contains('test result: ok.')) {
            throw 'the private Windows baseline_protocol log omitted fixed success evidence'
          }
          @"
          schema=1
          gate=baseline_protocol
          revision=$env:GITHUB_SHA
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          result=passed
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS 'baseline-protocol-proof.txt') `
            -Encoding utf8NoBOM
          Write-Output 'windows_baseline_protocol=passed'

      - name: Gate repeated Windows rejected-transfer shutdown lifecycles
        run: |
          $ErrorActionPreference = 'Stop'
          $testName = 'predecessor_profile_keeps_pre_v2_stream_transfer_side_effect_order'
          $testCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell ' +
            "--test baseline_protocol $testName -- --exact --test-threads=1 --show-output; " +
            'exit $LASTEXITCODE'
          $log = Join-Path $env:STASIS_WINDOWS_LOGS `
            'rejected-transfer-lifecycle.raw.log'
          $summary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'rejected-transfer-lifecycle-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          # Every invocation must pass. These are independent lifecycle samples, not retries of a
          # failed assertion or process.
          foreach ($sample in 1..50) {
            Write-Output ("windows_lifecycle_fresh_process_sample={0:D2}/50 test={1}" -f `
              $sample, $testName)
            & .\mach.ps1 exec -- pwsh -NoProfile -Command $testCommand *> $log
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              & $env:PYTHON3 $sanitizer sanitize `
                --input $log `
                --output $summary `
                --failed-gate baseline_protocol `
                --workspace $env:GITHUB_WORKSPACE
              $sanitizerExit = $LASTEXITCODE
              Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $summary -PathType Leaf) {
                Get-Content -LiteralPath $summary
              }
              Write-Output `
                "windows_rejected_transfer_sanitizer_status=$sanitizerExit"
              throw "Windows lifecycle sample $sample/50 failed with exit code $exitCode"
            }
            Remove-Item -LiteralPath $log -Force
          }
          @"
          schema=1
          gate=rejected_transfer_lifecycle
          revision=$env:GITHUB_SHA
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          completed_samples=50
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS `
              'rejected-transfer-lifecycle-proof.txt') `
            -Encoding utf8NoBOM

      - name: Gate controlled-network redirect ordering invariants
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:STASIS_WINDOWS_LOGS 'redirect-order.raw.log'
          $summary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'redirect-order-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          $testCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell ' +
            '-p servo-net-traits --lib controlled_network::tests -- --test-threads=1 ' +
            '--show-output; exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $testCommand *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            & $env:PYTHON3 $sanitizer sanitize `
              --input $log `
              --output $summary `
              --failed-gate unknown `
              --workspace $env:GITHUB_WORKSPACE
            $sanitizerExit = $LASTEXITCODE
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $summary -PathType Leaf) {
              Get-Content -LiteralPath $summary
            }
            Write-Output "windows_redirect_order_sanitizer_status=$sanitizerExit"
            throw "the Windows redirect-order gate failed with exit code $exitCode"
          }
          Remove-Item -LiteralPath $log -Force
          @"
          schema=1
          gate=redirect_order
          revision=$env:GITHUB_SHA
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          result=passed
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS 'redirect-order-proof.txt') `
            -Encoding utf8NoBOM

      - name: Gate Windows stdio protocol isolation
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:STASIS_WINDOWS_LOGS 'stdio-isolation.raw.log'
          $summary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'stdio-isolation-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          $testCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell ' +
            '--lib stdio::platform::tests -- --test-threads=1 --show-output; ' +
            'exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $testCommand *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            & $env:PYTHON3 $sanitizer sanitize `
              --input $log `
              --output $summary `
              --failed-gate unknown `
              --workspace $env:GITHUB_WORKSPACE
            $sanitizerExit = $LASTEXITCODE
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $summary -PathType Leaf) {
              Get-Content -LiteralPath $summary
            }
            Write-Output "windows_stdio_isolation_sanitizer_status=$sanitizerExit"
            throw "the Windows stdio isolation gate failed with exit code $exitCode"
          }
          Remove-Item -LiteralPath $log -Force
          @"
          schema=1
          gate=stdio_isolation
          revision=$env:GITHUB_SHA
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          result=passed
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS 'stdio-isolation-proof.txt') `
            -Encoding utf8NoBOM

      - name: Create the Windows CI-only bundle and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {
            throw 'the checkout commit changed before Windows bundle staging'
          }
          $worktreeChanges = @(& git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0 -or $worktreeChanges.Count -ne 0) {
            $worktreeChanges | ForEach-Object { Write-Error $_ }
            throw 'the source tree changed before Windows bundle staging'
          }
          $bundleRoot = Join-Path $env:STASIS_WINDOWS_DIST $env:STASIS_WINDOWS_BUNDLE
          New-Item -ItemType Directory -Path $bundleRoot | Out-Null
          $copyMap = [ordered]@{
            'LICENSE' = 'LICENSE'
            'LICENSE_WHATWG_SPECS' = 'LICENSE_WHATWG_SPECS'
            'README.md' = 'README.md'
            'STASIS.md' = 'STASIS.md'
            'STASIS_UPSTREAM.toml' = 'STASIS_UPSTREAM.toml'
            'docs/stasis/releases.md' = 'RELEASES.md'
            'docs/stasis/session-v0.3-candidate.md' = 'session-v0.3-candidate.md'
            'profiles/controlled-web-session-v2.json' = 'controlled-web-session-v2.json'
            'resources/resource_protocol/license.html' = 'THIRD_PARTY_LICENSES.html'
          }
          foreach ($entry in $copyMap.GetEnumerator()) {
            Copy-Item -LiteralPath $entry.Key -Destination (Join-Path $bundleRoot $entry.Value)
          }
          Copy-Item -LiteralPath $env:STASIS_WINDOWS_BINARY `
            -Destination (Join-Path $bundleRoot 'stasis.exe')

          $profileDirectory = Split-Path -Parent $env:STASIS_WINDOWS_BINARY
          $angleDllNames = @('libEGL.dll', 'libGLESv2.dll')
          foreach ($dllName in $angleDllNames) {
            $source = Join-Path $profileDirectory $dllName
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "the staged ANGLE runtime is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $bundleRoot $dllName)
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is missing: $vswhere"
          }
          $vsInstall = (& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) {
            throw 'could not resolve the Visual Studio C++ toolchain'
          }
          $vcToolsVersion = (Get-Content -LiteralPath `
            (Join-Path $vsInstall 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') `
            -Raw).Trim()
          $dumpbin = Join-Path $vsInstall `
            "VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "dumpbin is missing: $dumpbin"
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class StasisSystem32Loader
          {
              private const uint LoadLibrarySearchSystem32 = 0x00000800;

              [DllImport("kernel32.dll", EntryPoint = "LoadLibraryExW", CharSet = CharSet.Unicode,
                  SetLastError = true)]
              private static extern IntPtr LoadLibraryEx(
                  string fileName, IntPtr reserved, uint flags);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool FreeLibrary(IntPtr module);

              public static bool TryLoad(string fileName)
              {
                  IntPtr module = LoadLibraryEx(fileName, IntPtr.Zero, LoadLibrarySearchSystem32);
                  if (module == IntPtr.Zero) return false;
                  if (!FreeLibrary(module)) {
                      throw new InvalidOperationException("FreeLibrary failed for " + fileName);
                  }
                  return true;
              }
          }
          '@
          $redistRoot = Join-Path $vsInstall 'VC\Redist\MSVC'
          $redistVersion = Get-ChildItem -LiteralPath $redistRoot -Directory `
            | Where-Object Name -Match '^[0-9]+\.[0-9]+\.[0-9]+$' `
            | Sort-Object { [version]$_.Name } -Descending `
            | Select-Object -First 1
          if ($null -eq $redistVersion) {
            throw "the MSVC redistribution root is empty: $redistRoot"
          }
          $crtDirectory = Get-ChildItem `
            -LiteralPath (Join-Path $redistVersion.FullName 'x64') -Directory `
            | Where-Object Name -Match '^Microsoft\.VC[0-9]+\.CRT$' `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if ($null -eq $crtDirectory) {
            throw 'the x86-64 app-local MSVC runtime directory is missing'
          }
          $crtByName = @{}
          foreach ($file in Get-ChildItem -LiteralPath $crtDirectory.FullName -File -Filter '*.dll') {
            $crtByName[$file.Name.ToLowerInvariant()] = $file.FullName
          }

          function Get-ImportedDllNames([string] $path) {
            $output = @(& $dumpbin /nologo /dependents $path 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $path with exit code $LASTEXITCODE"
            }
            $inDependencySection = $false
            $sawDependencySection = $false
            $imports = [Collections.Generic.List[string]]::new()
            foreach ($outputLine in $output) {
              $line = "$outputLine"
              if ($line -match '^\s*Image has the following (?:delay load )?dependencies:\s*$') {
                $inDependencySection = $true
                $sawDependencySection = $true
                continue
              }
              if ($line -match '^\s*Summary\s*$') {
                $inDependencySection = $false
                continue
              }
              if (-not $inDependencySection -or [string]::IsNullOrWhiteSpace($line)) {
                continue
              }
              $dependency = $line.Trim()
              if ($dependency -notmatch '^[A-Za-z0-9._-]+\.dll$') {
                throw "dumpbin reported an unrepresentable dependency '$dependency' for $path"
              }
              [void]$imports.Add($dependency)
            }
            if (-not $sawDependencySection) {
              throw "dumpbin did not report a dependency section for $path"
            }
            return @($imports | Sort-Object -Unique)
          }

          $pending = [Collections.Generic.Queue[string]]::new()
          $pending.Enqueue((Join-Path $bundleRoot 'stasis.exe'))
          foreach ($file in Get-ChildItem -LiteralPath $bundleRoot -File -Filter '*.dll') {
            $pending.Enqueue($file.FullName)
          }
          $visited = @{}
          $copied = @{}
          while ($pending.Count -gt 0) {
            $current = $pending.Dequeue()
            if ($visited.ContainsKey($current)) { continue }
            $visited[$current] = $true
            foreach ($dependency in Get-ImportedDllNames $current) {
              $key = $dependency.ToLowerInvariant()
              if ($crtByName.ContainsKey($key)) {
                if (-not $copied.ContainsKey($key)) {
                  $destination = Join-Path $bundleRoot $dependency
                  Copy-Item -LiteralPath $crtByName[$key] -Destination $destination
                  $copied[$key] = $destination
                  $pending.Enqueue($destination)
                }
              } elseif ($angleDllNames -contains $dependency) {
                if (-not (Test-Path -LiteralPath (Join-Path $bundleRoot $dependency) -PathType Leaf)) {
                  throw "required app-local ANGLE DLL is unavailable: $dependency"
                }
              } elseif (Test-Path -LiteralPath (Join-Path $bundleRoot $dependency) -PathType Leaf) {
                # An already-staged app-local dependency is part of the closed bundle graph.
              } elseif ($dependency -match '^(?i:(?:msvcp|vcruntime|concrt)[0-9].*\.dll)$') {
                throw "required app-local MSVC runtime DLL is unavailable: $dependency"
              } elseif ($dependency -match '^(?i:(?:api-ms-win-|ext-ms-win-).+\.dll)$') {
                if (-not [StasisSystem32Loader]::TryLoad($dependency)) {
                  throw "Windows cannot resolve the API-set contract from System32: $dependency"
                }
              } elseif (Test-Path -LiteralPath `
                  (Join-Path (Join-Path $env:SystemRoot 'System32') $dependency) -PathType Leaf) {
                # A concrete System32 image is an operating-system dependency, not ambient PATH.
              } else {
                throw "unclassified non-system DLL dependency is not app-local: $dependency (imported by $current)"
              }
            }
          }
          if ($copied.Count -lt 1) {
            throw 'the Windows executable did not resolve any app-local MSVC runtime DLLs'
          }

          $runtimeLines = foreach ($name in @($copied.Keys | Sort-Object)) {
            $file = $copied[$name]
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          @(
            'App-local MSVC runtime closure determined from PE imports with dumpbin.'
            $runtimeLines
          ) | Set-Content -LiteralPath (Join-Path $bundleRoot 'MSVC-RUNTIME.txt') `
            -Encoding utf8NoBOM

          $upstream = (Get-Content -LiteralPath 'STASIS_UPSTREAM.toml' -Raw).TrimEnd()
          @"
          $upstream
          stasis_repository = "https://github.com/oxhq/stasis.git"
          stasis_revision = "$env:GITHUB_SHA"
          "@ | Set-Content -LiteralPath (Join-Path $bundleRoot 'SOURCE.txt') -Encoding utf8NoBOM
          "$env:STASIS_WINDOWS_VERSION`n" `
            | Set-Content -LiteralPath (Join-Path $bundleRoot 'VERSION.txt') -Encoding utf8NoBOM
          @"
          Unzip the complete directory before running stasis.exe.
          Use @oxhq/stasis with an explicit executablePath that names this stasis.exe.
          The app-local ANGLE and MSVC runtime DLLs must remain beside the executable.

          This unsigned Windows x86-64 bundle is a CI proof artifact. It is not a GitHub
          release asset and is not available through managed npm runtime acquisition.
          "@ | Set-Content -LiteralPath (Join-Path $bundleRoot 'INSTALL.txt') -Encoding utf8NoBOM
          @"
          Stasis Windows x86-64 CI-only artifact

          Version: $env:STASIS_WINDOWS_VERSION
          Revision: $env:GITHUB_SHA
          Run: $env:GITHUB_RUN_ID
          Attempt: $env:GITHUB_RUN_ATTEMPT
          Build: mach.ps1 exec -- cargo build --locked -p stasis-shell --profile production-stripped
          Python: $env:STASIS_WINDOWS_PYTHON_BOUNDARY
          Assembly: $env:STASIS_WINDOWS_ASSEMBLER_BOUNDARY
          AWS_LC_SYS_PREBUILT_NASM: $env:STASIS_WINDOWS_PREBUILT_NASM

          Proof boundary: exact-SHA Windows build, explicit-executable TypeScript session
          North Star, complete baseline_protocol plus native fixture and redirect-order tests,
          canonical controlled-web-session-v2 profile and versioned contract, ANGLE rendering backend,
          app-local MSVC runtime closure, fresh ZIP extraction, and extracted-binary
          act-settle-inspect. This artifact is outside the stable macOS/Linux release,
          promotion, provenance, runtime-manifest, and npm managed-runtime inventories.
          "@ | Set-Content -LiteralPath (Join-Path $bundleRoot 'WINDOWS-CI-ARTIFACT.txt') `
            -Encoding utf8NoBOM

          $manifestLines = foreach ($file in Get-ChildItem -LiteralPath $bundleRoot -File `
            | Sort-Object Name) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $env:STASIS_WINDOWS_BUNDLE/$($file.Name)"
          }
          $manifestLines | Set-Content -LiteralPath (Join-Path $bundleRoot 'SHA256SUMS.txt') `
            -Encoding ascii

          $archive = Join-Path $env:STASIS_WINDOWS_ARTIFACTS `
            "$env:STASIS_WINDOWS_BUNDLE.zip"
          Compress-Archive -LiteralPath $bundleRoot -DestinationPath $archive `
            -CompressionLevel Optimal
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $binaryHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath (Join-Path $bundleRoot 'stasis.exe')).Hash.ToLowerInvariant()
          "$archiveHash  $([IO.Path]::GetFileName($archive))" `
            | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          "$binaryHash  $env:STASIS_WINDOWS_BUNDLE/stasis.exe" `
            | Set-Content -LiteralPath `
              (Join-Path $env:STASIS_WINDOWS_ARTIFACTS `
                "$env:STASIS_WINDOWS_BUNDLE.binary.sha256") `
              -Encoding ascii
          Get-ChildItem -LiteralPath $bundleRoot -File `
            | Sort-Object Name `
            | Select-Object Name, Length `
            | Format-Table -AutoSize `
            | Out-String `
            | Set-Content -LiteralPath `
              (Join-Path $env:STASIS_WINDOWS_LOGS 'bundle-inventory.txt') `
              -Encoding utf8NoBOM

      - name: Extract and gate the Windows CI bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:STASIS_WINDOWS_ARTIFACTS `
            "$env:STASIS_WINDOWS_BUNDLE.zip"
          $archiveSidecar = "$archive.sha256"
          $binarySidecar = Join-Path $env:STASIS_WINDOWS_ARTIFACTS `
            "$env:STASIS_WINDOWS_BUNDLE.binary.sha256"
          foreach ($path in @($archive, $archiveSidecar, $binarySidecar)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows CI artifact component is missing: $path"
            }
          }
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $archiveRecord = (Get-Content -LiteralPath $archiveSidecar -Raw).Trim()
          if ($archiveRecord -cne "$archiveHash  $([IO.Path]::GetFileName($archive))") {
            throw 'the Windows ZIP checksum sidecar does not match the archive'
          }

          $extractTo = Join-Path $env:RUNNER_TEMP `
            "stasis-windows-artifact-gate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $extractTo | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractTo
          $sourceRoot = Join-Path $env:STASIS_WINDOWS_DIST $env:STASIS_WINDOWS_BUNDLE
          $extractedRoot = Join-Path $extractTo $env:STASIS_WINDOWS_BUNDLE
          if (-not (Test-Path -LiteralPath $extractedRoot -PathType Container)) {
            throw 'the Windows ZIP omitted its single normalized root directory'
          }
          $sourceNames = @(Get-ChildItem -LiteralPath $sourceRoot -File `
            | ForEach-Object Name | Sort-Object)
          $extractedNames = @(Get-ChildItem -LiteralPath $extractedRoot -File `
            | ForEach-Object Name | Sort-Object)
          $inventoryDifference = Compare-Object $sourceNames $extractedNames
          if ($null -ne $inventoryDifference) {
            throw "fresh extraction inventory differs:`n$($inventoryDifference | Out-String)"
          }
          foreach ($name in $sourceNames) {
            $expected = (Get-FileHash -Algorithm SHA256 `
              -LiteralPath (Join-Path $sourceRoot $name)).Hash
            $actual = (Get-FileHash -Algorithm SHA256 `
              -LiteralPath (Join-Path $extractedRoot $name)).Hash
            if ($actual -cne $expected) {
              throw "fresh extraction changed $name"
            }
          }
          foreach ($line in Get-Content -LiteralPath `
            (Join-Path $extractedRoot 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)$') {
              throw "invalid inner checksum record: $line"
            }
            $expectedHash = $Matches[1]
            $portablePath = $Matches[2]
            $prefix = "$env:STASIS_WINDOWS_BUNDLE/"
            if (-not $portablePath.StartsWith($prefix, [StringComparison]::Ordinal)) {
              throw "inner checksum escaped the bundle root: $portablePath"
            }
            $name = $portablePath.Substring($prefix.Length)
            $actualHash = (Get-FileHash -Algorithm SHA256 `
              -LiteralPath (Join-Path $extractedRoot $name)).Hash.ToLowerInvariant()
            if ($actualHash -cne $expectedHash) {
              throw "inner checksum differs for $portablePath"
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = (& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          $vcToolsVersion = (Get-Content -LiteralPath `
            (Join-Path $vsInstall 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') `
            -Raw).Trim()
          $dumpbin = Join-Path $vsInstall `
            "VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "dumpbin is missing during fresh extraction verification: $dumpbin"
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class StasisSystem32Loader
          {
              private const uint LoadLibrarySearchSystem32 = 0x00000800;

              [DllImport("kernel32.dll", EntryPoint = "LoadLibraryExW", CharSet = CharSet.Unicode,
                  SetLastError = true)]
              private static extern IntPtr LoadLibraryEx(
                  string fileName, IntPtr reserved, uint flags);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool FreeLibrary(IntPtr module);

              public static bool TryLoad(string fileName)
              {
                  IntPtr module = LoadLibraryEx(fileName, IntPtr.Zero, LoadLibrarySearchSystem32);
                  if (module == IntPtr.Zero) return false;
                  if (!FreeLibrary(module)) {
                      throw new InvalidOperationException("FreeLibrary failed for " + fileName);
                  }
                  return true;
              }
          }
          '@
          function Get-ImportedDllNames([string] $path) {
            $output = @(& $dumpbin /nologo /dependents $path 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for extracted file $path with exit code $LASTEXITCODE"
            }
            $inDependencySection = $false
            $sawDependencySection = $false
            $imports = [Collections.Generic.List[string]]::new()
            foreach ($outputLine in $output) {
              $line = "$outputLine"
              if ($line -match '^\s*Image has the following (?:delay load )?dependencies:\s*$') {
                $inDependencySection = $true
                $sawDependencySection = $true
                continue
              }
              if ($line -match '^\s*Summary\s*$') {
                $inDependencySection = $false
                continue
              }
              if (-not $inDependencySection -or [string]::IsNullOrWhiteSpace($line)) {
                continue
              }
              $dependency = $line.Trim()
              if ($dependency -notmatch '^[A-Za-z0-9._-]+\.dll$') {
                throw "dumpbin reported an unrepresentable dependency '$dependency' for $path"
              }
              [void]$imports.Add($dependency)
            }
            if (-not $sawDependencySection) {
              throw "dumpbin did not report a dependency section for extracted file $path"
            }
            return @($imports | Sort-Object -Unique)
          }
          $extractedBinary = Join-Path $extractedRoot 'stasis.exe'
          $headers = (& $dumpbin /nologo /headers $extractedBinary 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch '(?im)^\s*8664 machine \(x64\)\s*$') {
            throw 'the extracted Stasis executable is not PE x86-64'
          }
          $runtimeDlls = @(Get-ChildItem -LiteralPath $extractedRoot -File -Filter '*.dll')
          if ($runtimeDlls.Count -lt 1) {
            throw 'the extracted bundle has no app-local native runtime DLLs'
          }
          foreach ($dllName in @('libEGL.dll', 'libGLESv2.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extractedRoot $dllName) -PathType Leaf)) {
              throw "the extracted bundle omitted required ANGLE runtime $dllName"
            }
          }
          foreach ($file in @((Get-Item -LiteralPath $extractedBinary)) + $runtimeDlls) {
            $fileHeaders = (& $dumpbin /nologo /headers $file.FullName 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $fileHeaders -notmatch '(?im)^\s*8664 machine \(x64\)\s*$') {
              throw "the extracted bundled PE is not x86-64: $($file.Name)"
            }
            foreach ($dependency in Get-ImportedDllNames $file.FullName) {
              $appLocalDependency = Join-Path $extractedRoot $dependency
              if ($dependency -match '^(?i:(?:msvcp|vcruntime|concrt)[0-9].*\.dll)$' `
                  -and -not (Test-Path -LiteralPath $appLocalDependency -PathType Leaf)) {
                throw "the extracted app-local MSVC runtime closure omitted $dependency"
              }
              if (Test-Path -LiteralPath $appLocalDependency -PathType Leaf) {
                continue
              }
              if ($dependency -match '^(?i:(?:api-ms-win-|ext-ms-win-).+\.dll)$') {
                if (-not [StasisSystem32Loader]::TryLoad($dependency)) {
                  throw "fresh extraction cannot resolve API-set contract from System32: $dependency"
                }
                continue
              }
              $systemDependency = Join-Path `
                (Join-Path $env:SystemRoot 'System32') $dependency
              if (Test-Path -LiteralPath $systemDependency -PathType Leaf) {
                continue
              }
              throw "fresh extraction has an unclassified non-system DLL dependency: $dependency (imported by $($file.Name))"
            }
          }

          $binaryHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath $extractedBinary).Hash.ToLowerInvariant()
          $binaryRecord = (Get-Content -LiteralPath $binarySidecar -Raw).Trim()
          if ($binaryRecord -cne "$binaryHash  $env:STASIS_WINDOWS_BUNDLE/stasis.exe") {
            throw 'the Windows executable checksum sidecar does not match fresh extraction'
          }
          $env:STASIS_RELEASE_BINARY = $extractedBinary
          $env:STASIS_RELEASE_ARCHIVE = $archive
          $env:STASIS_RELEASE_REVISION = $env:GITHUB_SHA
          $env:STASIS_RELEASE_SHA256 = $binaryHash
          $gateLog = Join-Path $env:STASIS_WINDOWS_LOGS 'artifact-gate.raw.log'
          $failureSummary = Join-Path $env:STASIS_WINDOWS_LOGS `
            'artifact-gate-failure-summary.log'
          $sanitizer = Join-Path $env:GITHUB_WORKSPACE `
            'etc/ci/stasis/sanitize_lifecycle_diagnostics.py'
          $testCommand = '$ErrorActionPreference = ''Stop''; ' +
            '& cargo test --locked --profile production-stripped -p stasis-shell ' +
            '--test controlled_mvp release_gate_published_binary_completes_act_settle_inspect ' +
            '-- --ignored --exact --test-threads=1 --show-output; exit $LASTEXITCODE'
          & .\mach.ps1 exec -- pwsh -NoProfile -Command $testCommand *> $gateLog
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            & $env:PYTHON3 $sanitizer sanitize `
              --input $gateLog `
              --output $failureSummary `
              --failed-gate release_artifact_gate `
              --workspace $env:GITHUB_WORKSPACE
            $sanitizerExit = $LASTEXITCODE
            Remove-Item -LiteralPath $gateLog -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $failureSummary -PathType Leaf) {
              Get-Content -LiteralPath $failureSummary
            }
            Write-Output "windows_artifact_gate_sanitizer_status=$sanitizerExit"
            throw "the extracted Windows artifact gate failed with exit code $exitCode"
          }
          $gateText = Get-Content -LiteralPath $gateLog -Raw
          Remove-Item -LiteralPath $gateLog -Force
          if (-not $gateText.Contains('test release_gate_published_binary_completes_act_settle_inspect ... ok') `
            -or -not $gateText.Contains('[RELEASE ARTIFACT]')) {
            throw 'the extracted Windows artifact gate log lacks its success evidence'
          }
          @"
          schema=1
          boundary=windows_ci_only_not_managed_release
          revision=$env:GITHUB_SHA
          run_id=$env:GITHUB_RUN_ID
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          archive=$([IO.Path]::GetFileName($archive))
          archive_sha256=$archiveHash
          binary_sha256=$binaryHash
          runtime_dll_count=$($runtimeDlls.Count)
          assembler_boundary=$env:STASIS_WINDOWS_ASSEMBLER_BOUNDARY
          aws_lc_sys_prebuilt_nasm=$env:STASIS_WINDOWS_PREBUILT_NASM
          artifact_gate=passed
          raw_log_uploaded=false
          "@ | Set-Content -LiteralPath `
            (Join-Path $env:STASIS_WINDOWS_LOGS 'bundle-verification.txt') `
            -Encoding utf8NoBOM

      - name: Delete any runner-private Windows logs after a failed gate
        if: failure()
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:STASIS_WINDOWS_LOGS -and `
            (Test-Path -LiteralPath $env:STASIS_WINDOWS_LOGS -PathType Container)) {
            Get-ChildItem -LiteralPath $env:STASIS_WINDOWS_LOGS -File `
              | Where-Object { $_.Name.EndsWith('.raw.log') } `
              | Remove-Item -Force
            @(
              'schema=1'
              'boundary=failure_only_sanitized_windows_gate_evidence'
              "revision=$env:GITHUB_SHA"
              "run_id=$env:GITHUB_RUN_ID"
              "run_attempt=$env:GITHUB_RUN_ATTEMPT"
              'raw_logs_uploaded=false'
              'raw_core_memory_uploaded=false'
              'process_environment_values_captured=false'
            ) | Set-Content -LiteralPath `
              (Join-Path $env:STASIS_WINDOWS_LOGS 'failure-metadata.txt') `
              -Encoding utf8NoBOM
          }

      - name: Upload bounded Windows failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.windows-names.outputs.log_artifact_name }}
          path: |
            ${{ runner.temp }}/stasis-windows-ci/logs/*-failure-summary.log
            ${{ runner.temp }}/stasis-windows-ci/logs/failure-metadata.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload the attempt-qualified Windows CI bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.windows-names.outputs.bundle_artifact_name }}
          path: |
            ${{ runner.temp }}/stasis-windows-ci/artifacts/*.zip
            ${{ runner.temp }}/stasis-windows-ci/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload the attempt-qualified bounded Windows gate proofs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.windows-names.outputs.log_artifact_name }}
          path: |
            ${{ runner.temp }}/stasis-windows-ci/logs/*-proof.txt
            ${{ runner.temp }}/stasis-windows-ci/logs/bundle-inventory.txt
            ${{ runner.temp }}/stasis-windows-ci/logs/bundle-verification.txt
          if-no-files-found: error
          retention-days: 90

  package-sdk:
    name: Bind both native runtimes and gate the TypeScript package
    needs:
      - validate-invocation
      - archive-contract
      - package-native
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.archive-contract.result == 'success'
        && needs.package-native.result == 'success'
    outputs:
      linux_run_attempt: ${{ steps.producer-attempts.outputs.linux_run_attempt }}
      macos_run_attempt: ${{ steps.producer-attempts.outputs.macos_run_attempt }}
      sdk_run_attempt: ${{ steps.producer-attempts.outputs.sdk_run_attempt }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      STASIS_VERSION: 0.3.0
      STASIS_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require space for native verification and SDK packing
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh prepare 6291456

      - id: producer-attempts
        name: Resolve the exact successful native producer attempts
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/native-artifact-pages.json"
          native_job_attempts="$RUNNER_TEMP/native-job-attempt-pages"
          mkdir "$native_job_attempts"
          for ((attempt = 1; attempt <= GITHUB_RUN_ATTEMPT; attempt++)); do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
              > "$native_job_attempts/$attempt.json"
          done
          read -r macos_run_attempt linux_run_attempt < <(
            RUN_ID="$GITHUB_RUN_ID" HEAD_SHA="$RUN_HEAD_SHA" \
              JOB_ATTEMPT_DIR="$native_job_attempts" \
              OVERALL_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          run_id = int(os.environ["RUN_ID"])
          head_sha = os.environ["HEAD_SHA"]
          overall_attempt = int(os.environ["OVERALL_RUN_ATTEMPT"])

          def flatten_pages(filename, key):
              pages = json.load(open(filename, encoding="utf-8"))
              if not isinstance(pages, list) or not pages:
                  raise SystemExit(f"{key} pagination response is malformed")
              entries = []
              totals = set()
              for page in pages:
                  if not isinstance(page, dict) or type(page.get("total_count")) is not int:
                      raise SystemExit(f"{key} pagination response is malformed")
                  values = page.get(key)
                  if not isinstance(values, list):
                      raise SystemExit(f"{key} pagination response is malformed")
                  totals.add(page["total_count"])
                  entries.extend(values)
              if len(totals) != 1 or totals.pop() != len(entries):
                  raise SystemExit(f"{key} pagination response is incomplete")
              identifiers = [entry.get("id") for entry in entries if isinstance(entry, dict)]
              if len(identifiers) != len(entries) or any(type(value) is not int for value in identifiers):
                  raise SystemExit(f"{key} identity is malformed")
              if len(set(identifiers)) != len(identifiers):
                  raise SystemExit(f"{key} pagination response contains duplicates")
              return entries

          artifacts = flatten_pages(
              os.path.join(os.environ["RUNNER_TEMP"], "native-artifact-pages.json"),
              "artifacts",
          )
          jobs_by_attempt = []
          job_ids = set()
          job_attempt_dir = pathlib.Path(os.environ["JOB_ATTEMPT_DIR"])
          for attempt in range(1, overall_attempt + 1):
              attempt_jobs = flatten_pages(job_attempt_dir / f"{attempt}.json", "jobs")
              for job in attempt_jobs:
                  job_id = job["id"]
                  if job_id in job_ids:
                      raise SystemExit("job history contains a duplicate job identity")
                  job_ids.add(job_id)
                  reported_attempt = job.get("run_attempt")
                  if reported_attempt is not None and reported_attempt != attempt:
                      raise SystemExit("attempt-specific job history claims another run attempt")
                  jobs_by_attempt.append((attempt, job))
          prefixes = (
              "stasis-macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof",
              "stasis-linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof",
              "stasis-runtime-manifest",
              "stasis-typescript",
              # These are CI-only proof/diagnostic boundaries. Their exact artifacts may already
              # exist when this concurrent SDK job inspects the run, but they are not native SDK
              # inputs.
              "stasis-windows-x86_64-ci",
              "stasis-windows-x86_64-ci-logs",
              "stasis-linux-crash-diagnostics",
          )
          permitted_non_native_prefixes = {
              "stasis-runtime-manifest",
              "stasis-typescript",
              "stasis-windows-x86_64-ci",
              "stasis-windows-x86_64-ci-logs",
              "stasis-linux-crash-diagnostics",
          }
          native_prefixes = set(prefixes) - permitted_non_native_prefixes
          if (
              len(prefixes) != len(set(prefixes))
              or native_prefixes
                  != {
                      "stasis-macos-aarch64",
                      "stasis-macos-aarch64-act-settle-inspect-proof",
                      "stasis-linux-x86_64",
                      "stasis-linux-x86_64-act-settle-inspect-proof",
                  }
          ):
              raise SystemExit("package SDK artifact prefix classifier is inconsistent")
          patterns = tuple(
              (prefix, re.compile(rf"^{re.escape(prefix)}-attempt-([1-9][0-9]*)$"))
              for prefix in prefixes
          )
          native_by_platform_attempt = {
              "macos-aarch64": {},
              "linux-x86_64": {},
          }
          for artifact in artifacts:
              if artifact.get("expired") is True:
                  continue
              workflow_run = artifact.get("workflow_run")
              if (
                  artifact.get("expired") is not False
                  or not isinstance(workflow_run, dict)
                  or workflow_run.get("id") != run_id
                  or workflow_run.get("head_sha") != head_sha
              ):
                  raise SystemExit("active package artifact identity is malformed")
              name = artifact.get("name")
              if not isinstance(name, str):
                  raise SystemExit("active package artifact name is malformed")
              matched = next(
                  ((prefix, match) for prefix, pattern in patterns if (match := pattern.fullmatch(name))),
                  None,
              )
              if matched is None:
                  raise SystemExit(f"unexpected active package artifact: {name!r}")
              attempt = int(matched[1].group(1))
              if attempt > overall_attempt:
                  raise SystemExit("package artifact claims a future run attempt")
              if matched[0] in permitted_non_native_prefixes:
                  continue
              if matched[0].startswith("stasis-macos-"):
                  platform = "macos-aarch64"
              elif matched[0].startswith("stasis-linux-"):
                  platform = "linux-x86_64"
              else:
                  raise SystemExit("package SDK artifact classifier accepted an unknown prefix")
              native_by_platform_attempt[platform].setdefault(attempt, []).append(name)

          producer_names = {
              "macos-aarch64": "Package and gate macos-aarch64",
              "linux-x86_64": "Package and gate linux-x86_64",
          }
          producer_jobs = {name: {} for name in producer_names.values()}
          seen_jobs = set()
          for attempt, job in jobs_by_attempt:
              name = job.get("name")
              if name not in producer_names.values():
                  continue
              identity = (attempt, name)
              if (
                  job.get("run_id") != run_id
                  or job.get("head_sha") != head_sha
                  or identity in seen_jobs
              ):
                  raise SystemExit("native producer job identity is malformed or ambiguous")
              seen_jobs.add(identity)
              producer_jobs[name][attempt] = (job.get("status"), job.get("conclusion"))

          selected = []
          for platform in ("macos-aarch64", "linux-x86_64"):
              prefixes_for_platform = (
                  f"stasis-{platform}",
                  f"stasis-{platform}-act-settle-inspect-proof",
              )
              producer_attempts = producer_jobs[producer_names[platform]]
              if not producer_attempts:
                  raise SystemExit(f"no {platform} producer job exists")
              artifact_attempts = native_by_platform_attempt[platform]
              if not artifact_attempts:
                  raise SystemExit(f"no {platform} producer artifacts exist")
              # A rerun-failed operation carries untouched successful jobs into the new attempt
              # without rerunning them or renaming their immutable artifacts. Older failed upload
              # attempts are non-authoritative; the newest artifact-bearing attempt must be both
              # complete and bound to its exact successful producer.
              producer_attempt = max(artifact_attempts)
              expected = sorted(
                  f"{prefix}-attempt-{producer_attempt}"
                  for prefix in prefixes_for_platform
              )
              if sorted(artifact_attempts[producer_attempt]) != expected:
                  raise SystemExit(f"{platform} producer artifacts are incomplete")
              if producer_attempts.get(producer_attempt) != ("completed", "success"):
                  raise SystemExit(
                      f"{platform} artifacts do not have an exact successful producer"
                  )
              selected.append(producer_attempt)
          print(*selected)
          PY
          )
          if [[ ! "$macos_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$linux_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'native producer attempts are invalid' >&2
            exit 1
          fi
          {
            echo "MACOS_RUN_ATTEMPT=$macos_run_attempt"
            echo "LINUX_RUN_ATTEMPT=$linux_run_attempt"
            echo "SDK_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
          {
            echo "macos_run_attempt=$macos_run_attempt"
            echo "linux_run_attempt=$linux_run_attempt"
            echo "sdk_run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact macOS native archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}
          path: native-inputs/stasis-macos-aarch64-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}

      - name: Download the exact macOS native gate proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}
          path: native-inputs/stasis-macos-aarch64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.macos_run_attempt }}

      - name: Download the exact Linux native archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}
          path: native-inputs/stasis-linux-x86_64-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}

      - name: Download the exact Linux native gate proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}
          path: native-inputs/stasis-linux-x86_64-act-settle-inspect-proof-attempt-${{ steps.producer-attempts.outputs.linux_run_attempt }}

      - name: Verify the exact native handoff and extract the macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected=$(printf '%s\n' \
            "stasis-linux-x86_64-act-settle-inspect-proof-attempt-$LINUX_RUN_ATTEMPT" \
            "stasis-linux-x86_64-attempt-$LINUX_RUN_ATTEMPT" \
            "stasis-macos-aarch64-act-settle-inspect-proof-attempt-$MACOS_RUN_ATTEMPT" \
            "stasis-macos-aarch64-attempt-$MACOS_RUN_ATTEMPT")
          actual=$(find native-inputs -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | LC_ALL=C sort)
          test "$actual" = "$expected"
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$MACOS_RUN_ATTEMPT
            else
              producer_attempt=$LINUX_RUN_ATTEMPT
            fi
            asset_dir="native-inputs/stasis-${platform}-attempt-$producer_attempt"
            proof_dir="native-inputs/stasis-${platform}-act-settle-inspect-proof-attempt-$producer_attempt"
            if [[ "$platform" == 'macos-aarch64' ]]; then
              python3 etc/ci/stasis/release_archive.py verify \
                --asset-directory "$asset_dir" \
                --version "$STASIS_VERSION" \
                --platform "$platform" \
                --revision "$GITHUB_SHA" \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --source-root . \
                --extract-to "$RUNNER_TEMP/stasis-sdk-native"
            else
              python3 etc/ci/stasis/release_archive.py verify \
                --asset-directory "$asset_dir" \
                --version "$STASIS_VERSION" \
                --platform "$platform" \
                --revision "$GITHUB_SHA" \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --source-root .
            fi
            python3 etc/ci/stasis/release_archive.py verify-gate-proof \
              --proof-directory "$proof_dir" \
              --asset-directory "$asset_dir" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$producer_attempt"
          done

      - name: Set up Node for manifest generation and SDK release preflight
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate the exact public runtime distribution manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-manifest
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["GITHUB_SHA"]
          native_run_attempts = {
              "macos-aarch64": os.environ["MACOS_RUN_ATTEMPT"],
              "linux-x86_64": os.environ["LINUX_RUN_ATTEMPT"],
          }
          repository = os.environ["GITHUB_REPOSITORY"]
          if version != "0.3.0" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("runtime manifest release identity is invalid")
          upstream = tomllib.loads(pathlib.Path("STASIS_UPSTREAM.toml").read_text(encoding="utf-8"))
          expected_upstream_keys = {
              "servo_repository", "servo_revision", "pliego_repository",
              "pliego_revision", "pliego_servo_merge_base",
          }
          if set(upstream) != expected_upstream_keys or any(
              not isinstance(value, str) or not value for value in upstream.values()
          ):
              raise SystemExit("source identity manifest changed")
          source = {
              **upstream,
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }
          archive_files = [
              "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
              "VERSION.txt", "controlled-web-session-v2.json",
              "session-v0.3-candidate.md", "stasis",
          ]

          def sha256(filename):
              digest = hashlib.sha256()
              with filename.open("rb") as source_file:
                  for chunk in iter(lambda: source_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def checksum(filename, label):
              match = re.fullmatch(
                  r"([0-9a-f]{64})  " + re.escape(label) + r"\n",
                  filename.read_text(encoding="ascii"),
              )
              if match is None:
                  raise SystemExit(f"invalid checksum sidecar: {filename}")
              return match.group(1)

          artifacts = {}
          for node_key, node_platform, node_arch, release_platform in (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          ):
              directory = pathlib.Path(
                  f"native-inputs/stasis-{release_platform}-attempt-"
                  f"{native_run_attempts[release_platform]}"
              )
              root = f"stasis-{version}-{release_platform}"
              archive_name = f"{root}.tar.gz"
              archive = directory / archive_name
              archive_digest = sha256(archive)
              if checksum(directory / f"{archive_name}.sha256", archive_name) != archive_digest:
                  raise SystemExit(f"archive digest changed for {release_platform}")
              executable_digest = checksum(
                  directory / f"{root}.binary.sha256", f"{root}/stasis"
              )
              artifacts[node_key] = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": release_platform,
                  "archiveUrl": (
                      f"https://github.com/{repository}/releases/download/v{version}/{archive_name}"
                  ),
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": root,
                  "archiveFiles": archive_files,
                  "executablePath": "stasis",
                  "executableSha256": executable_digest,
              }
          manifest = {
              "schema": 1,
              "packageName": "@oxhq/stasis",
              "sdkVersion": version,
              "releaseTag": f"v{version}",
              "implementation": {"name": "stasis-shell", "source": source},
              "artifacts": artifacts,
          }
          output = pathlib.Path(f"dist/runtime-manifest/stasis-{version}-runtime-manifest.json")
          output.write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          node sdk/typescript/scripts/generate-runtime-manifest.mjs \
            --input "dist/runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json" \
            --output sdk/typescript/src/runtime-manifest.generated.ts

      - name: Install, typecheck, test, build, and pack the SDK
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          mkdir "$GITHUB_WORKSPACE/dist/sdk"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/sdk"
          shopt -s nullglob
          packages=("$GITHUB_WORKSPACE"/dist/sdk/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "pnpm pack produced ${#packages[@]} tarballs, expected exactly one" >&2
            exit 1
          fi
          {
            echo "STASIS_SDK_TARBALL=${packages[0]}"
            echo "STASIS_SDK_TARBALL_NAME=$(basename "${packages[0]}")"
            echo "STASIS_SDK_PROOF=stasis-${STASIS_VERSION}-typescript-act-settle-inspect.json"
          } >> "$GITHUB_ENV"

      - name: Gate the native synchronous-hang fail-stop supervisor
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/stasis-sdk-native/stasis-${STASIS_VERSION}-macos-aarch64/stasis"
          test -x "$binary"
          raw_log="$RUNNER_TEMP/stasis-native-command-timeout.raw.log"
          set +e
          STASIS_NORTH_STAR_BINARY="$binary" \
            pnpm exec tsx --test test/native-command-timeout.test.ts \
              > "$raw_log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            summary="$RUNNER_TEMP/stasis-native-command-timeout-failure-summary.log"
            set +e
            python3 "$GITHUB_WORKSPACE/etc/ci/stasis/sanitize_lifecycle_diagnostics.py" \
              sanitize \
              --input "$raw_log" \
              --output "$summary" \
              --failed-gate sdk_registry_gate \
              --workspace "$GITHUB_WORKSPACE"
            sanitizer_status=$?
            if [[ -f "$summary" && ! -L "$summary" ]]; then
              cat "$summary"
            fi
            rm -f -- "$raw_log" "$summary"
            echo "native_command_timeout_sanitizer_status=$sanitizer_status"
            exit "$status"
          fi
          rm -f -- "$raw_log"
          echo 'native_command_timeout_gate=passed'

      - name: Gate the packed SDK against the extracted macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/stasis-package-sdk-consumer"
          mkdir "$consumer"
          (
            cd "$consumer"
            pnpm init
            pnpm add --ignore-scripts "$STASIS_SDK_TARBALL"
          )
          bundle="stasis-${STASIS_VERSION}-macos-aarch64"
          binary="$RUNNER_TEMP/stasis-sdk-native/$bundle/stasis"
          sdk_gate_log="$RUNNER_TEMP/stasis-sdk-act-settle-inspect.log"
          north_star_log="$RUNNER_TEMP/stasis-package-north-star.jsonl"
          session_north_star_log="$RUNNER_TEMP/stasis-package-session-north-star.jsonl"
          trap 'rm -f -- "$sdk_gate_log" "$north_star_log" "$session_north_star_log"' EXIT
          sanitize_failed_gate() {
            local input="$1"
            local gate="$2"
            local exit_status="$3"
            local summary="${input}.failure-summary.log"
            set +e
            python3 etc/ci/stasis/sanitize_lifecycle_diagnostics.py sanitize \
              --input "$input" \
              --output "$summary" \
              --failed-gate "$gate" \
              --workspace "$GITHUB_WORKSPACE"
            local sanitizer_status=$?
            if [[ -f "$summary" && ! -L "$summary" ]]; then
              cat "$summary"
            fi
            rm -f -- "$input" "$summary"
            echo "private_gate_sanitizer_status=$sanitizer_status"
            exit "$exit_status"
          }
          set +e
          node etc/ci/stasis/verify_registry_sdk.mjs \
            --binary "$binary" \
            --fixture ports/stasis/tests/fixtures/timer_10s.html \
            --session-v2-fixture ports/stasis/tests/fixtures/message_channel_buffered.html \
            --session-v2-image-fixture ports/stasis/tests/fixtures/controlled_v2_image_data_svg.html \
            --session-v2-http-image-fixture ports/stasis/tests/fixtures/controlled_v2_image_http.html \
            --session-v2-inline-svg-fixture ports/stasis/tests/fixtures/controlled_v2_inline_svg.html \
            --session-v2-inline-svg-shared-pending-fixture ports/stasis/tests/fixtures/controlled_v2_inline_svg_shared_pending.html \
            --session-v2-settlement-url-fixture ports/stasis/tests/fixtures/controlled_v2_settlement_url.html \
            --session-v2-interval-before-finite-fixture ports/stasis/tests/fixtures/controlled_v2_interval_before_finite.html \
            --session-v2-focus-fixture ports/stasis/tests/fixtures/input_method_focus_timestamp.html \
            --session-v2-automation-event-fixture ports/stasis/tests/fixtures/controlled_v2_form_event_timestamp.html \
            --session-v2-css-animation-event-fixture ports/stasis/tests/fixtures/controlled_v2_css_animation_event_timestamp.html \
            --session-v2-cookie-fixture sdk/typescript/test/fixtures/controlled-v2-cookie-login.html \
            --consumer-root "$consumer" \
            --package "$STASIS_SDK_TARBALL" \
            --revision "$GITHUB_SHA" \
            --version "$STASIS_VERSION" \
            > "$sdk_gate_log" 2>&1
          sdk_gate_status=$?
          set -e
          if (( sdk_gate_status != 0 )); then
            sanitize_failed_gate "$sdk_gate_log" sdk_registry_gate "$sdk_gate_status"
          fi
          cp sdk/typescript/test/fixtures/public-package-north-star.mjs \
            "$consumer/public-package-north-star.mjs"
          cp sdk/typescript/test/fixtures/north-star.html "$consumer/north-star.html"
          set +e
          STASIS_NORTH_STAR_BINARY="$binary" \
            node "$consumer/public-package-north-star.mjs" > "$north_star_log" 2>&1
          north_star_status=$?
          set -e
          if (( north_star_status != 0 )); then
            sanitize_failed_gate "$north_star_log" session_north_star "$north_star_status"
          fi
          if ! grep -Fq '"proof":"stasis-v0.1-north-star"' "$north_star_log" || \
            ! grep -Fq '"runs":3' "$north_star_log"; then
            rm -f -- "$north_star_log"
            echo 'the private package North Star log omitted fixed success evidence' >&2
            exit 1
          fi
          cat "$north_star_log" >> "$sdk_gate_log"
          rm -f -- "$north_star_log"
          cp sdk/typescript/test/fixtures/public-package-session-north-star.mjs \
            "$consumer/public-package-session-north-star.mjs"
          cp -R sdk/typescript/test/fixtures/session-north-star \
            "$consumer/session-north-star"
          explicit_runtime_cache="$RUNNER_TEMP/stasis-package-session-explicit-runtime-cache"
          mkdir "$explicit_runtime_cache"
          set +e
          STASIS_SESSION_NORTH_STAR_BINARY="$binary" \
            STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE="$explicit_runtime_cache" \
            node "$consumer/public-package-session-north-star.mjs" \
              > "$session_north_star_log" 2>&1
          session_north_star_status=$?
          set -e
          if (( session_north_star_status != 0 )); then
            sanitize_failed_gate \
              "$session_north_star_log" session_north_star "$session_north_star_status"
          fi
          if ! grep -Fq '"proof":"stasis-v0.2-session-north-star"' \
              "$session_north_star_log" || \
            ! grep -Fq '"runs":3' "$session_north_star_log" || \
            ! grep -Fq '"sessions":6' "$session_north_star_log" || \
            ! grep -Fq '"runtimeAcquisition":"explicit-executable-override-cache-bypassed"' \
              "$session_north_star_log"; then
            rm -f -- "$session_north_star_log"
            echo 'the private session North Star log omitted fixed success evidence' >&2
            exit 1
          fi
          cat "$session_north_star_log" >> "$sdk_gate_log"
          rm -f -- "$session_north_star_log"
          binary_sha256=$(awk '{print $1}' \
            "native-inputs/stasis-macos-aarch64-attempt-$MACOS_RUN_ATTEMPT/$bundle.binary.sha256")
          python3 etc/ci/stasis/npm_release.py create-proof \
            --package "$STASIS_SDK_TARBALL" \
            --gate-log "$sdk_gate_log" \
            --output "dist/sdk/$STASIS_SDK_PROOF" \
            --version "$STASIS_VERSION" \
            --revision "$GITHUB_SHA" \
            --native-binary-sha256 "$binary_sha256" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$SDK_RUN_ATTEMPT"
          rm -f -- "$sdk_gate_log"
          trap - EXIT
          echo 'packed_sdk_native_gates=passed'

      - name: Recheck runner disk after all package gates
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 1048576

      - name: Upload the pre-gated TypeScript package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-typescript-attempt-${{ github.run_attempt }}
          path: |
            dist/sdk/${{ env.STASIS_SDK_TARBALL_NAME }}
            dist/sdk/${{ env.STASIS_SDK_PROOF }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload the exact runtime distribution manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stasis-runtime-manifest-attempt-${{ github.run_attempt }}
          path: dist/runtime-manifest/stasis-${{ env.STASIS_VERSION }}-runtime-manifest.json
          if-no-files-found: error
          retention-days: 90


  attest-package:
    name: Attest exact credential-free package outputs
    needs:
      - validate-invocation
      - package-native
      - package-windows-ci
      - package-sdk
    if: |
      needs.validate-invocation.outputs.mode == 'package'
        && needs.package-native.result == 'success'
        && needs.package-windows-ci.result == 'success'
        && needs.package-sdk.result == 'success'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && github.repository == 'oxhq/stasis'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      LINUX_RUN_ATTEMPT: ${{ needs.package-sdk.outputs.linux_run_attempt }}
      MACOS_RUN_ATTEMPT: ${{ needs.package-sdk.outputs.macos_run_attempt }}
      SDK_RUN_ATTEMPT: ${{ needs.package-sdk.outputs.sdk_run_attempt }}
    steps:
      - name: Validate the exact producer attempt handoff
        shell: bash
        run: |
          set -euo pipefail
          for producer_attempt in \
            "$MACOS_RUN_ATTEMPT" "$LINUX_RUN_ATTEMPT" "$SDK_RUN_ATTEMPT"; do
            if [[ ! "$producer_attempt" =~ ^[1-9][0-9]*$ \
              || "$producer_attempt" -gt "$GITHUB_RUN_ATTEMPT" ]]; then
              echo 'package producer attempt handoff is invalid' >&2
              exit 1
            fi
          done
          if [[ "$MACOS_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" ]]; then
            echo 'SDK producer attempt predates a selected native producer' >&2
            exit 1
          fi

      - name: Download macOS native files from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-attempt-${{ needs.package-sdk.outputs.macos_run_attempt }}
          path: release-assets/macos-aarch64

      - name: Download macOS native gate proof from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-macos-aarch64-act-settle-inspect-proof-attempt-${{ needs.package-sdk.outputs.macos_run_attempt }}
          path: gate-proof/macos-aarch64

      - name: Download Linux native files from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-attempt-${{ needs.package-sdk.outputs.linux_run_attempt }}
          path: release-assets/linux-x86_64

      - name: Download Linux native gate proof from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-linux-x86_64-act-settle-inspect-proof-attempt-${{ needs.package-sdk.outputs.linux_run_attempt }}
          path: gate-proof/linux-x86_64

      - name: Download SDK files from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-typescript-attempt-${{ needs.package-sdk.outputs.sdk_run_attempt }}
          path: sdk-proof

      - name: Download runtime manifest from its exact producer attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stasis-runtime-manifest-attempt-${{ needs.package-sdk.outputs.sdk_run_attempt }}
          path: runtime-manifest

      - name: Recheck exact identities and digests without repository code
        shell: bash
        env:
          STASIS_VERSION: 0.3.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
