              exit 1
            fi
          done

          package_run="$RUNNER_TEMP/stasis-package-run-before-mutation.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$package_run"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_branch "$HEAD_BRANCH" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$OVERALL_RUN_ATTEMPT" '
              .id == $run_id
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .name == "Stasis package and promote"
              and .path == ".github/workflows/stasis-package.yml"
              and .event == "push"
              and .head_sha == $head_sha
              and .head_branch == $head_branch
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == $run_attempt
            ' "$package_run" > /dev/null

          current_default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [[ -z "$current_default_branch" || "$current_default_branch" != "$HEAD_BRANCH" ]]; then
            echo 'repository default branch changed before release mutation' >&2
            exit 1
          fi
