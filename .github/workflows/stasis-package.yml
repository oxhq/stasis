                                          reader = binary_reader
                                      info = normalized_native_info(
                                          member.name,
                                          directory=False,
                                          executable=name == "stasis",
                                      )
                                      info.size = member.size
                                      normalized.addfile(info, reader)
                      except SystemExit:
                          raise
                      except (EOFError, OSError, tarfile.TarError) as error:
                          raise SystemExit(
                              f"native archive is not a valid bounded tar stream: {error}"
                          ) from error
                      if binary_reader is None or binary_reader.bytes_read != by_name[
                          f"{selected_bundle}/stasis"
                      ].size:
                          raise SystemExit("native archive binary is truncated")
                      if binary_reader.digest.hexdigest() != expected_binary_digest:
                          raise SystemExit("native archive binary digest changed")
                      if not streams_equal(expanded, canonical):
                          raise SystemExit(
                              "native archive tar bytes are not the canonical normalized serialization"
                          )

          def verify_native_target(platform):
              bundle = f"stasis-{version}-{platform}"
              archive_name = f"{bundle}.tar.gz"
              archive_sidecar_name = f"{archive_name}.sha256"
              binary_sidecar_name = f"{bundle}.binary.sha256"
              native_proof_name = f"{bundle}-act-settle-inspect.json"
              native = exact_directory(
                  f"release-assets/{platform}",
                  {archive_name, archive_sidecar_name, binary_sidecar_name},
              )
              gate = exact_directory(f"gate-proof/{platform}", {native_proof_name})
              archive = native / archive_name
              if archive.stat().st_size <= 0 or archive.stat().st_size > native_max_compressed_bytes:
                  raise SystemExit("native archive compressed size is outside the release limit")
              binary_label = f"{bundle}/stasis"
              binary_digest = checksum(native / binary_sidecar_name, binary_label)
              verify_native_archive(archive, bundle, binary_digest)
              archive_digest = sha256(archive)
              if checksum(native / archive_sidecar_name, archive_name) != archive_digest:
                  raise SystemExit("archive sidecar changed after the credential-free build")

              native_proof_file = gate / native_proof_name
              if native_proof_file.stat().st_size <= 0 or native_proof_file.stat().st_size > 64 * 1024:
                  raise SystemExit("native gate proof size is outside the release limit")
              native_proof = strict_json_loads(
                  native_proof_file.read_text(encoding="utf-8"), "native gate proof"
              )
              expected_native = {
                  "schema": 2,
                  "gate": "act-settle-inspect",
                  "test": "release_gate_published_binary_completes_act_settle_inspect",
                  "version": version,
                  "platform": platform,
                  "revision": revision,
                  "workflowRunId": run_id,
                  "workflowRunAttempt": native_run_attempts[platform],
                  "archive": {"name": archive_name, "sha256": archive_digest},
                  "binary": {"path": binary_label, "sha256": binary_digest},
                  "source": source,
              }
              if (
                  not isinstance(native_proof, dict)
                  or set(native_proof) != set(expected_native) | {"gateLogSha256"}
                  or type(native_proof.get("schema")) is not int
              ):
                  raise SystemExit("native gate proof schema changed")
              for field, keys in (
                  ("archive", {"name", "sha256"}),
                  ("binary", {"path", "sha256"}),
              ):
                  binding = native_proof.get(field)
                  if (
                      not isinstance(binding, dict)
                      or set(binding) != keys
                      or any(not isinstance(binding.get(key), str) for key in keys)
                  ):
                      raise SystemExit(f"native gate proof {field} binding has invalid types")
              if any(native_proof.get(key) != value for key, value in expected_native.items()):
                  raise SystemExit("native gate proof identity changed")
              native_log_digest = native_proof.get("gateLogSha256")
              if (
                  not isinstance(native_log_digest, str)
                  or re.fullmatch(r"[0-9a-f]{64}", native_log_digest) is None
              ):
                  raise SystemExit("native gate proof log digest is invalid")
              return {
                  "archiveName": archive_name,
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": bundle,
                  "executableSha256": binary_digest,
              }

          native_bindings = {
              platform: verify_native_target(platform) for platform in platforms
          }
          sdk = exact_directory("sdk-proof", {sdk_name, sdk_proof_name})
          manifest_directory = exact_directory(
              "runtime-manifest", {runtime_manifest_name}
          )
          runtime_manifest_file = manifest_directory / runtime_manifest_name
          if runtime_manifest_file.stat().st_size <= 0 or runtime_manifest_file.stat().st_size > 128 * 1024:
              raise SystemExit("runtime distribution manifest size is outside the release limit")
          runtime_manifest = strict_json_loads(
              runtime_manifest_file.read_text(encoding="utf-8"),
              "runtime distribution manifest",
          )
          expected_artifacts = {}
          for node_key, node_platform, node_arch, platform in (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          ):
              binding = native_bindings[platform]
              expected_artifacts[node_key] = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": platform,
                  "archiveUrl": (
                      f"https://github.com/oxhq/stasis/releases/download/v{version}/"
                      f"{binding['archiveName']}"
                  ),
                  "archiveSizeBytes": binding["archiveSizeBytes"],
                  "archiveSha256": binding["archiveSha256"],
                  "archiveRoot": binding["archiveRoot"],
                  "archiveFiles": [
                      "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
                      "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
                      "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
                      "VERSION.txt", "controlled-web-session-v2.json",
                      "session-v0.3-candidate.md", "stasis",
                  ],
                  "executablePath": "stasis",
                  "executableSha256": binding["executableSha256"],
              }
          expected_manifest = {
              "schema": 1,
              "packageName": "@oxhq/stasis",
              "sdkVersion": version,
              "releaseTag": f"v{version}",
              "implementation": {"name": "stasis-shell", "source": source},
              "artifacts": expected_artifacts,
          }
          if runtime_manifest != expected_manifest:
              raise SystemExit("runtime distribution manifest changed after SDK packing")
          binary_digest = native_bindings["macos-aarch64"]["executableSha256"]

          sdk_tarball = sdk / sdk_name
          verify_sdk_tarball(sdk_tarball, version)
          sdk_sha256 = sha256(sdk_tarball)
          sdk_integrity = sha512_integrity(sdk_tarball)

          sdk_proof_file = sdk / sdk_proof_name
          if sdk_proof_file.stat().st_size <= 0 or sdk_proof_file.stat().st_size > 64 * 1024:
              raise SystemExit("SDK gate proof size is outside the release limit")
          sdk_proof = strict_json_loads(
              sdk_proof_file.read_text(encoding="utf-8"), "SDK gate proof"
          )
          expected_sdk = {
              "schema": 10,
              "gate": "sdk-act-settle-inspect",
              "package": f"@oxhq/stasis@{version}",
              "revision": revision,
              "workflowRunId": run_id,
              "workflowRunAttempt": sdk_run_attempt,
              "source": source,
              "tarball": {"name": sdk_name, "sha256": sdk_sha256, "integrity": sdk_integrity},
              "nativeBinarySha256": binary_digest,
          }
          if (
              not isinstance(sdk_proof, dict)
              or set(sdk_proof)
                  != set(expected_sdk) | {
                      "gateLogSha256", "v2MessageChannel", "v2DirectDataSvg",
                      "v2InlineSvgRendering", "v2SettlementUrl",
                      "v2PersistentIntervalProgression", "v2InputMethodFocus",
                      "v2AutomationEventTimestamps",
                      "v2CssAnimationEventTimestamps",
                      "v2CookieSession",
                  }
              or type(sdk_proof.get("schema")) is not int
          ):
              raise SystemExit("SDK gate proof schema changed")
          if not exact_tarball_binding(sdk_proof.get("tarball"), expected_sdk["tarball"]):
              raise SystemExit("SDK gate proof tarball binding has invalid types")
          if (
              not isinstance(sdk_proof.get("nativeBinarySha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", sdk_proof["nativeBinarySha256"]) is None
          ):
              raise SystemExit("SDK gate proof native digest is invalid")
          if any(sdk_proof.get(key) != value for key, value in expected_sdk.items()):
              raise SystemExit("SDK gate proof identity changed")
          v2_message_channel = sdk_proof.get("v2MessageChannel")
          expected_v2_fields = {
              "profile", "idleOutcome", "idleMessagePortSources", "idleRuntimeFailures",
              "bufferActionRotatedStateToken", "pendingPreservedBufferedStateToken",
              "pendingMessagePortSources", "pendingRuntimeFailures",
              "startActionRotatedStateToken", "drainedOutcome",
              "drainedMessagePortSources", "drainedRuntimeFailures",
              "aggregateProcessedOrdinaryTasks", "trace", "evidenceProfile",
              "unsupportedWork", "exactBinaryLaunch", "closeResponseAndEof",
          }
          expected_v2_fixed = {
              "profile": "controlled-web-session-v2",
              "idleOutcome": "quiescent",
              "idleMessagePortSources": "0",
              "idleRuntimeFailures": "0",
              "bufferActionRotatedStateToken": True,
              "pendingPreservedBufferedStateToken": True,
              "pendingMessagePortSources": "1",
              "pendingRuntimeFailures": "0",
              "startActionRotatedStateToken": True,
              "drainedOutcome": "quiescent",
              "drainedMessagePortSources": "0",
              "drainedRuntimeFailures": "0",
              "trace": "callback1>microtask1>callback2>microtask2",
              "evidenceProfile": "controlled-web-session-v2",
              "unsupportedWork": "0",
              "exactBinaryLaunch": True,
              "closeResponseAndEof": True,
          }
          aggregate_tasks = (
              v2_message_channel.get("aggregateProcessedOrdinaryTasks", "")
              if isinstance(v2_message_channel, dict)
              else ""
          )
          if (
              not isinstance(v2_message_channel, dict)
              or set(v2_message_channel) != expected_v2_fields
              or any(
                  v2_message_channel.get(key) != value
                  for key, value in expected_v2_fixed.items()
              )
              or any(
                  v2_message_channel.get(key) is not True
                  for key in (
                      "bufferActionRotatedStateToken",
                      "pendingPreservedBufferedStateToken",
                      "startActionRotatedStateToken",
                      "exactBinaryLaunch",
                      "closeResponseAndEof",
                  )
              )
              or not isinstance(aggregate_tasks, str)
              or re.fullmatch(r"(?:0|[1-9][0-9]*)", aggregate_tasks) is None
              or int(aggregate_tasks) < 2
          ):
              raise SystemExit("SDK gate proof does not preserve exact v2 MessageChannel evidence")
          require_exact_v2_fixture_proofs(sdk_proof, "SDK gate proof")
          sdk_log_digest = sdk_proof.get("gateLogSha256")
          if (
              not isinstance(sdk_log_digest, str)
              or re.fullmatch(r"[0-9a-f]{64}", sdk_log_digest) is None
          ):
              raise SystemExit("SDK gate proof log digest is invalid")
          PY

      - name: Generate GitHub build provenance for all eleven outputs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/macos-aarch64/stasis-0.3.0-macos-aarch64.tar.gz
            release-assets/macos-aarch64/stasis-0.3.0-macos-aarch64.tar.gz.sha256
            release-assets/macos-aarch64/stasis-0.3.0-macos-aarch64.binary.sha256
            gate-proof/macos-aarch64/stasis-0.3.0-macos-aarch64-act-settle-inspect.json
            release-assets/linux-x86_64/stasis-0.3.0-linux-x86_64.tar.gz
            release-assets/linux-x86_64/stasis-0.3.0-linux-x86_64.tar.gz.sha256
            release-assets/linux-x86_64/stasis-0.3.0-linux-x86_64.binary.sha256
            gate-proof/linux-x86_64/stasis-0.3.0-linux-x86_64-act-settle-inspect.json
            runtime-manifest/stasis-0.3.0-runtime-manifest.json
            sdk-proof/oxhq-stasis-0.3.0.tgz
            sdk-proof/stasis-0.3.0-typescript-act-settle-inspect.json

  verify-promotion:
    name: Verify immutable promotion inputs
    needs: validate-invocation
    if: needs.validate-invocation.outputs.mode == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      attestations: read
    outputs:
      attest_run_attempt: ${{ steps.selected-run.outputs.attest_run_attempt }}
      head_sha: ${{ steps.selected-run.outputs.head_sha }}
      head_branch: ${{ steps.selected-run.outputs.head_branch }}
      linux_run_attempt: ${{ steps.selected-run.outputs.linux_run_attempt }}
      macos_run_attempt: ${{ steps.selected-run.outputs.macos_run_attempt }}
      overall_run_attempt: ${{ steps.selected-run.outputs.overall_run_attempt }}
      sdk_run_attempt: ${{ steps.selected-run.outputs.sdk_run_attempt }}
      staged_gate_artifact_name: ${{ steps.stage-names.outputs.gate_artifact_name }}
      staged_release_artifact_name: ${{ steps.stage-names.outputs.release_artifact_name }}
      version: ${{ steps.selected-run.outputs.version }}
      workflow_ref: ${{ steps.selected-run.outputs.workflow_ref }}
      workflow_sha: ${{ steps.selected-run.outputs.workflow_sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.package_run_id }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - id: selected-run
        name: Verify the selected successful package run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'oxhq/stasis' ]]; then
            echo 'promotion is restricted to oxhq/stasis' >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml@refs/heads/$DEFAULT_BRANCH"
          if [[ ! "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            || "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
            echo 'the executing promotion workflow identity is not the exact default-branch workflow' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != 'branch' || "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo 'promotion must be dispatched from the default branch' >&2
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'package_run_id must be a positive integer' >&2
            exit 1
          fi
          if [[ "$TAG" != "v$STASIS_RELEASE_VERSION" ]]; then
            echo "the stable promotion tag must be v$STASIS_RELEASE_VERSION" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          read -r head_sha head_branch overall_run_attempt < <(
            jq -er --arg repository "$GITHUB_REPOSITORY" --arg default_branch "$DEFAULT_BRANCH" '
              select(.repository.full_name == $repository)
              | select(.head_repository.full_name == $repository)
              | select(.name == "Stasis package and promote")
              | select(.path == ".github/workflows/stasis-package.yml")
              | select(.event == "push")
              | select(.status == "completed" and .conclusion == "success")
              | select(.head_branch == $default_branch)
              | [.head_sha, .head_branch, (.run_attempt | tostring)] | @tsv
            ' run.json
          )
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ || ! "$overall_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'selected package run did not resolve to an exact commit and attempt' >&2
            exit 1
          fi

          current_default_sha=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$DEFAULT_BRANCH" \
            -f per_page=1 \
            --jq 'if length == 1 then .[0].sha else error("default branch did not resolve exactly") end')
          if [[ ! "$current_default_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'current default branch did not resolve to an exact commit' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$head_sha...$current_default_sha" > ancestry.json
          jq -e --arg head_sha "$head_sha" '
            .merge_base_commit.sha == $head_sha
            and (.status == "ahead" or .status == "identical")
          ' ancestry.json > /dev/null

          workflow_tree_sha() {
            local commit_sha=$1
            local root_tree_sha dot_github_tree_sha
            root_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha')
            dot_github_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$root_tree_sha" \
              --jq '.tree | map(select(.path == ".github" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github tree") end')
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$dot_github_tree_sha" \
              --jq '.tree | map(select(.path == "workflows" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github/workflows tree") end'
          }
          packaged_workflow_tree=$(workflow_tree_sha "$head_sha")
          current_workflow_tree=$(workflow_tree_sha "$current_default_sha")
          executing_workflow_tree=$(workflow_tree_sha "$GITHUB_WORKFLOW_SHA")
          if [[ ! "$packaged_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$current_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$executing_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || "$packaged_workflow_tree" != "$current_workflow_tree" \
            || "$packaged_workflow_tree" != "$executing_workflow_tree" ]]; then
            echo '.github/workflows differs across the package, executing, or current default revision' >&2
            exit 1
          fi

          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/ports/stasis/Cargo.toml?ref=$head_sha" \
            > stasis-Cargo.toml
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("stasis-Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          if [[ "$version" != "$STASIS_RELEASE_VERSION" || "$TAG" != "v$version" ]]; then
            echo "tag $TAG does not exactly match Stasis version $version at $head_sha" >&2
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > artifact-pages.json
          job_attempts="$RUNNER_TEMP/package-job-attempt-pages"
          mkdir "$job_attempts"
          for ((attempt = 1; attempt <= overall_run_attempt; attempt++)); do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt/jobs?per_page=100" \
              > "$job_attempts/$attempt.json"
          done
          read -r macos_run_attempt linux_run_attempt sdk_run_attempt attest_run_attempt < <(
            RUN_ID="$RUN_ID" HEAD_SHA="$head_sha" HEAD_BRANCH="$head_branch" \
              JOB_ATTEMPT_DIR="$job_attempts" \
              OVERALL_RUN_ATTEMPT="$overall_run_attempt" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          run_id = int(os.environ["RUN_ID"])
          head_sha = os.environ["HEAD_SHA"]
          head_branch = os.environ["HEAD_BRANCH"]
          overall_attempt = int(os.environ["OVERALL_RUN_ATTEMPT"])

          def flatten_pages(filename, key):
              pages = json.load(open(filename, encoding="utf-8"))
              if not isinstance(pages, list) or not pages:
                  raise SystemExit(f"{key} pagination response is malformed")
              entries = []
              totals = set()
              for page in pages:
                  if not isinstance(page, dict) or type(page.get("total_count")) is not int:
                      raise SystemExit(f"{key} pagination response is malformed")
                  values = page.get(key)
                  if not isinstance(values, list):
                      raise SystemExit(f"{key} pagination response is malformed")
                  totals.add(page["total_count"])
                  entries.extend(values)
              if len(totals) != 1 or totals.pop() != len(entries):
                  raise SystemExit(f"{key} pagination response is incomplete")
              identifiers = [entry.get("id") for entry in entries if isinstance(entry, dict)]
              if len(identifiers) != len(entries) or any(type(value) is not int for value in identifiers):
                  raise SystemExit(f"{key} identity is malformed")
              if len(set(identifiers)) != len(identifiers):
                  raise SystemExit(f"{key} pagination response contains duplicates")
              return entries

          artifacts = flatten_pages("artifact-pages.json", "artifacts")
          jobs_by_attempt = []
          job_ids = set()
          job_attempt_dir = pathlib.Path(os.environ["JOB_ATTEMPT_DIR"])
          for attempt in range(1, overall_attempt + 1):
              attempt_jobs = flatten_pages(job_attempt_dir / f"{attempt}.json", "jobs")
              for job in attempt_jobs:
                  job_id = job["id"]
                  if job_id in job_ids:
                      raise SystemExit("job history contains a duplicate job identity")
                  job_ids.add(job_id)
                  reported_attempt = job.get("run_attempt")
                  if reported_attempt is not None and reported_attempt != attempt:
                      raise SystemExit("attempt-specific job history claims another run attempt")
                  jobs_by_attempt.append((attempt, job))

          prefixes = (
              "stasis-macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof",
              "stasis-linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof",
              "stasis-runtime-manifest",
              "stasis-typescript",
              # Windows artifacts prove the CI-only platform boundary and never become release,
              # provenance, runtime-manifest, or managed npm inputs. Linux crash diagnostics are
              # likewise evidence-only and never promotion inputs.
              "stasis-windows-x86_64-ci",
              "stasis-windows-x86_64-ci-logs",
              "stasis-linux-crash-diagnostics",
          )
          patterns = tuple(
              (prefix, re.compile(rf"^{re.escape(prefix)}-attempt-([1-9][0-9]*)$"))
              for prefix in prefixes
          )
          prefix_groups = {
              "stasis-macos-aarch64": "macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof": "macos-aarch64",
              "stasis-linux-x86_64": "linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof": "linux-x86_64",
              "stasis-runtime-manifest": "sdk",
              "stasis-typescript": "sdk",
          }
          permitted_ci_only_prefixes = {
              "stasis-windows-x86_64-ci",
              "stasis-windows-x86_64-ci-logs",
              "stasis-linux-crash-diagnostics",
          }
          if (
              len(prefixes) != len(set(prefixes))
              or set(prefixes) != set(prefix_groups) | permitted_ci_only_prefixes
              or set(prefix_groups) & permitted_ci_only_prefixes
          ):
              raise SystemExit("promotion artifact prefix classifier is inconsistent")
          by_group_attempt = {group: {} for group in set(prefix_groups.values())}
          for artifact in artifacts:
              if artifact.get("expired") is True:
                  continue
              workflow_run = artifact.get("workflow_run")
              if (
                  artifact.get("expired") is not False
                  or not isinstance(workflow_run, dict)
                  or workflow_run.get("id") != run_id
                  or workflow_run.get("head_sha") != head_sha
                  or workflow_run.get("head_branch") != head_branch
              ):
                  raise SystemExit("active package artifact identity is malformed")
              name = artifact.get("name")
              if not isinstance(name, str):
                  raise SystemExit("active package artifact name is malformed")
              matched = next(
                  ((prefix, match) for prefix, pattern in patterns if (match := pattern.fullmatch(name))),
                  None,
              )
              if matched is None:
                  raise SystemExit(f"unexpected active package artifact: {name!r}")
              attempt = int(matched[1].group(1))
              if attempt > overall_attempt:
                  raise SystemExit("package artifact claims a future run attempt")
              if matched[0] in permitted_ci_only_prefixes:
                  continue
              group = prefix_groups[matched[0]]
              by_group_attempt[group].setdefault(attempt, []).append(name)

          producer_names = {
              "macos-aarch64": "Package and gate macos-aarch64",
              "linux-x86_64": "Package and gate linux-x86_64",
              "sdk": "Bind both native runtimes and gate the TypeScript package",
              "attest": "Attest exact credential-free package outputs",
          }
          producer_jobs = {name: {} for name in producer_names.values()}
          seen_jobs = set()
          for attempt, job in jobs_by_attempt:
              name = job.get("name")
              if name not in producer_names.values():
                  continue
              identity = (attempt, name)
              if (
                  job.get("run_id") != run_id
                  or job.get("head_sha") != head_sha
                  or identity in seen_jobs
              ):
                  raise SystemExit("package producer job identity is malformed or ambiguous")
              seen_jobs.add(identity)
              producer_jobs[name][attempt] = (job.get("status"), job.get("conclusion"))

          group_prefixes = {
              "macos-aarch64": (
                  "stasis-macos-aarch64",
                  "stasis-macos-aarch64-act-settle-inspect-proof",
              ),
              "linux-x86_64": (
                  "stasis-linux-x86_64",
                  "stasis-linux-x86_64-act-settle-inspect-proof",
              ),
              "sdk": ("stasis-runtime-manifest", "stasis-typescript"),
          }
          selected = {}
          for group, expected_prefixes in group_prefixes.items():
              producer_attempts = producer_jobs[producer_names[group]]
              if not producer_attempts:
                  raise SystemExit(f"no {group} producer job exists")
              artifact_attempts = by_group_attempt[group]
              if not artifact_attempts:
                  raise SystemExit(f"no {group} producer artifacts exist")
              producer_attempt = max(artifact_attempts)
              expected = sorted(
                  f"{prefix}-attempt-{producer_attempt}" for prefix in expected_prefixes
              )
              if sorted(artifact_attempts[producer_attempt]) != expected:
                  raise SystemExit(f"{group} producer artifacts are incomplete")
              if producer_attempts.get(producer_attempt) != ("completed", "success"):
                  raise SystemExit(
                      f"{group} artifacts do not have an exact successful producer"
                  )
              selected[group] = producer_attempt
          if (
              selected["macos-aarch64"] > selected["sdk"]
              or selected["linux-x86_64"] > selected["sdk"]
          ):
              raise SystemExit("selected SDK producer predates a selected native producer")
          attest_attempts = producer_jobs[producer_names["attest"]]
          if not attest_attempts:
              raise SystemExit("no package attestation producer job exists")
          attest_attempt = max(attest_attempts)
          if attest_attempts[attest_attempt] != ("completed", "success"):
              raise SystemExit("latest package attestation producer job did not succeed")
          if attest_attempt != overall_attempt:
              raise SystemExit("successful package attestation is not from the overall run attempt")
          if max(selected.values()) > attest_attempt:
              raise SystemExit("selected package attestation predates a selected producer")
          print(
              selected["macos-aarch64"],
              selected["linux-x86_64"],
              selected["sdk"],
              attest_attempt,
          )
          PY
          )
          if [[ ! "$macos_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$linux_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$sdk_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$attest_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'package producer attempts are invalid' >&2
            exit 1
          fi

          {
            echo "HEAD_SHA=$head_sha"
            echo "HEAD_BRANCH=$head_branch"
            echo "MACOS_RUN_ATTEMPT=$macos_run_attempt"
            echo "LINUX_RUN_ATTEMPT=$linux_run_attempt"
            echo "SDK_RUN_ATTEMPT=$sdk_run_attempt"
            echo "ATTEST_RUN_ATTEMPT=$attest_run_attempt"
            echo "OVERALL_RUN_ATTEMPT=$overall_run_attempt"
            echo "STASIS_VERSION=$version"
          } >> "$GITHUB_ENV"
          {
            echo "head_sha=$head_sha"
            echo "head_branch=$head_branch"
            echo "macos_run_attempt=$macos_run_attempt"
            echo "linux_run_attempt=$linux_run_attempt"
            echo "sdk_run_attempt=$sdk_run_attempt"
            echo "attest_run_attempt=$attest_run_attempt"
            echo "overall_run_attempt=$overall_run_attempt"
            echo "version=$version"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "eligible package run: $RUN_ID native attempts $macos_run_attempt/$linux_run_attempt, SDK attempt $sdk_run_attempt, and attestation attempt $attest_run_attempt (overall attempt $overall_run_attempt) at $head_sha"

      - name: Check out the exact packaged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.selected-run.outputs.head_sha }}

      - name: Verify workflow-owned frozen profile identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(sha256sum profiles/controlled-webapp-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V1_PROFILE_SHA256"
          test "$(sha256sum profiles/controlled-web-session-v1.json | awk '{print $1}')" \
            = "$STASIS_FROZEN_V2_PROFILE_SHA256"

      - name: Download the exact package and gate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$MACOS_RUN_ATTEMPT
            else
              producer_attempt=$LINUX_RUN_ATTEMPT
            fi
            native_artifact="stasis-${platform}-attempt-$producer_attempt"
            proof_artifact="stasis-${platform}-act-settle-inspect-proof-attempt-$producer_attempt"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$native_artifact" --dir "release-assets/$platform"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$proof_artifact" --dir "gate-proof/$platform"
          done
          sdk_artifact="stasis-typescript-attempt-$SDK_RUN_ATTEMPT"
          manifest_artifact="stasis-runtime-manifest-attempt-$SDK_RUN_ATTEMPT"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$sdk_artifact" --dir sdk-proof
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$manifest_artifact" --dir runtime-manifest

      - name: Verify exact contents, checksums, gate proof, and provenance
        shell: bash
        run: |
          set -euo pipefail
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$MACOS_RUN_ATTEMPT
            else
              producer_attempt=$LINUX_RUN_ATTEMPT
            fi
            python3 etc/ci/stasis/release_archive.py verify \
              --asset-directory "release-assets/$platform" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$HEAD_SHA" \
              --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --source-root .
            python3 etc/ci/stasis/release_archive.py verify-gate-proof \
              --proof-directory "gate-proof/$platform" \
              --asset-directory "release-assets/$platform" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$HEAD_SHA" \
              --run-id "$RUN_ID" \
              --run-attempt "$producer_attempt"
          done
          manifest="runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json"
          test -f "$manifest" && test ! -L "$manifest"
          node sdk/typescript/scripts/generate-runtime-manifest.mjs \
            --input "$manifest" \
            --output "$RUNNER_TEMP/runtime-manifest.generated.ts"
          STASIS_RUNTIME_MANIFEST="$manifest" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["HEAD_SHA"]
          manifest = json.loads(
              pathlib.Path(os.environ["STASIS_RUNTIME_MANIFEST"]).read_text(encoding="utf-8")
          )
          upstream = tomllib.loads(pathlib.Path("STASIS_UPSTREAM.toml").read_text(encoding="utf-8"))
          source = {
              **upstream,
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }
          if (
              set(manifest) != {
                  "schema", "packageName", "sdkVersion", "releaseTag",
                  "implementation", "artifacts",
              }
              or manifest["schema"] != 1
              or manifest["packageName"] != "@oxhq/stasis"
              or manifest["sdkVersion"] != version
              or manifest["releaseTag"] != f"v{version}"
              or manifest["implementation"] != {"name": "stasis-shell", "source": source}
          ):
              raise SystemExit("runtime manifest root identity changed")
          inventory = [
              "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
              "VERSION.txt", "controlled-web-session-v2.json",
              "session-v0.3-candidate.md", "stasis",
          ]
          targets = (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          )
          if set(manifest["artifacts"]) != {target[0] for target in targets}:
              raise SystemExit("runtime manifest target inventory changed")
          for key, node_platform, node_arch, platform in targets:
              root = f"stasis-{version}-{platform}"
              archive_name = f"{root}.tar.gz"
              directory = pathlib.Path("release-assets") / platform
              archive = directory / archive_name
              archive_digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              archive_sidecar = (directory / f"{archive_name}.sha256").read_text(encoding="ascii")
              binary_sidecar = (directory / f"{root}.binary.sha256").read_text(encoding="ascii")
              archive_match = re.fullmatch(
                  rf"([0-9a-f]{{64}})  {re.escape(archive_name)}\n", archive_sidecar
              )
              binary_match = re.fullmatch(
                  rf"([0-9a-f]{{64}})  {re.escape(root)}/stasis\n", binary_sidecar
              )
              if archive_match is None or archive_match.group(1) != archive_digest or binary_match is None:
                  raise SystemExit(f"runtime manifest sidecar input changed for {platform}")
              expected = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": platform,
                  "archiveUrl": (
                      f"https://github.com/oxhq/stasis/releases/download/v{version}/{archive_name}"
                  ),
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": root,
                  "archiveFiles": inventory,
                  "executablePath": "stasis",
                  "executableSha256": binary_match.group(1),
              }
              if manifest["artifacts"][key] != expected:
                  raise SystemExit(f"runtime manifest binding changed for {platform}")
          PY
          binary_sha256=$(awk '{print $1}' \
            "release-assets/macos-aarch64/stasis-${STASIS_VERSION}-macos-aarch64.binary.sha256")
          python3 etc/ci/stasis/npm_release.py verify-proof \
            --directory sdk-proof \
            --version "$STASIS_VERSION" \
            --revision "$HEAD_SHA" \
            --native-binary-sha256 "$binary_sha256" \
            --run-id "$RUN_ID" \
            --run-attempt "$SDK_RUN_ATTEMPT"
          provenance_subjects=(
            release-assets/*/*
            gate-proof/*/*
            runtime-manifest/*
            sdk-proof/*
          )
          test "${#provenance_subjects[@]}" -eq 11
          provenance_json="$RUNNER_TEMP/stasis-package-provenance.json"
          gh attestation verify "${provenance_subjects[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/$HEAD_BRANCH" \
            --deny-self-hosted-runners \
            --limit 100 \
            --format json > "$provenance_json"
          provenance_verifier=(
            python3 etc/ci/stasis/verify_build_provenance.py verify
            --verification-json "$provenance_json"
            --repository "$GITHUB_REPOSITORY"
            --workflow .github/workflows/stasis-package.yml
            --revision "$HEAD_SHA"
            --source-ref "refs/heads/$HEAD_BRANCH"
            --server-url "$GITHUB_SERVER_URL"
            --run-id "$RUN_ID"
            --run-attempt "$ATTEST_RUN_ATTEMPT"
            --expected-subject-count 11
          )
          for provenance_subject in "${provenance_subjects[@]}"; do
            provenance_verifier+=(--subject "$provenance_subject")
          done
          "${provenance_verifier[@]}"
          mkdir staged-release-assets staged-gate-proof
          cp release-assets/*/* staged-release-assets/
          cp "$manifest" staged-release-assets/
          cp gate-proof/*/* staged-gate-proof/

      - id: stage-names
        name: Resolve this promotion attempt's handoff names
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "release_artifact_name=verified-stasis-release-assets-attempt-$GITHUB_RUN_ATTEMPT"
            echo "gate_artifact_name=verified-stasis-gate-proof-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Stage verified release assets for the credentialed job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.stage-names.outputs.release_artifact_name }}
          path: |
            staged-release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Stage verified gate proof for the credentialed job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.stage-names.outputs.gate_artifact_name }}
          path: |
            staged-gate-proof/*
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Create immutable draft stable release
    needs:
      - validate-invocation
      - verify-promotion
    if: |
      needs.validate-invocation.outputs.mode == 'promote'
        && needs.verify-promotion.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      ATTEST_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.attest_run_attempt }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.verify-promotion.outputs.head_sha }}
      HEAD_BRANCH: ${{ needs.verify-promotion.outputs.head_branch }}
      LINUX_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.linux_run_attempt }}
      MACOS_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.macos_run_attempt }}
      OVERALL_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.overall_run_attempt }}
      SDK_RUN_ATTEMPT: ${{ needs.verify-promotion.outputs.sdk_run_attempt }}
      RUN_ID: ${{ inputs.package_run_id }}
      STASIS_VERSION: ${{ needs.verify-promotion.outputs.version }}
      TAG: ${{ inputs.release_tag }}
      VERIFIED_WORKFLOW_REF: ${{ needs.verify-promotion.outputs.workflow_ref }}
      VERIFIED_WORKFLOW_SHA: ${{ needs.verify-promotion.outputs.workflow_sha }}
    steps:
      - name: Recheck selected commit is on the current default branch
        shell: bash
        run: |
          set -euo pipefail
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml@refs/heads/$HEAD_BRANCH"
          if [[ ! "$VERIFIED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            || "$GITHUB_WORKFLOW_SHA" != "$VERIFIED_WORKFLOW_SHA" \
            || "$VERIFIED_WORKFLOW_REF" != "$expected_workflow_ref" \
            || "$GITHUB_WORKFLOW_REF" != "$VERIFIED_WORKFLOW_REF" ]]; then
            echo 'credentialed job is not executing the exact verified promotion workflow revision' >&2
            exit 1
          fi
          current_default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [[ -z "$current_default_branch" ]]; then
            echo 'repository has no current default branch' >&2
            exit 1
          fi
          if [[ "$current_default_branch" != "$HEAD_BRANCH" ]]; then
            echo 'repository default branch changed after promotion verification' >&2
            exit 1
          fi
          current_default_sha=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$current_default_branch" \
            -f per_page=1 \
            --jq 'if length == 1 then .[0].sha else error("default branch did not resolve exactly") end')
          if [[ ! "$current_default_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'current default branch did not resolve to an exact commit' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$current_default_sha" > ancestry.json
          jq -e --arg head_sha "$HEAD_SHA" '
            .merge_base_commit.sha == $head_sha
            and (.status == "ahead" or .status == "identical")
          ' ancestry.json > /dev/null

          workflow_tree_sha() {
            local commit_sha=$1
            local root_tree_sha dot_github_tree_sha
            root_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha')
            dot_github_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$root_tree_sha" \
              --jq '.tree | map(select(.path == ".github" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github tree") end')
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$dot_github_tree_sha" \
              --jq '.tree | map(select(.path == "workflows" and .mode == "040000" and .type == "tree")) | if length == 1 then .[0].sha else error("missing .github/workflows tree") end'
          }
          packaged_workflow_tree=$(workflow_tree_sha "$HEAD_SHA")
          current_workflow_tree=$(workflow_tree_sha "$current_default_sha")
          executing_workflow_tree=$(workflow_tree_sha "$GITHUB_WORKFLOW_SHA")
          if [[ ! "$packaged_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$current_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || ! "$executing_workflow_tree" =~ ^[0-9a-f]{40}$ \
            || "$packaged_workflow_tree" != "$current_workflow_tree" \
            || "$packaged_workflow_tree" != "$executing_workflow_tree" ]]; then
            echo '.github/workflows differs across the package, executing, or current default revision' >&2
            exit 1
          fi

      - name: Download release assets verified by the read-only job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify-promotion.outputs.staged_release_artifact_name }}
          path: release-assets

      - name: Download gate proof verified by the read-only job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify-promotion.outputs.staged_gate_artifact_name }}
          path: gate-proof

      - name: Recheck staged identities and provenance without source code
        shell: bash
        run: |
          set -euo pipefail
          for producer_attempt in \
            "$MACOS_RUN_ATTEMPT" "$LINUX_RUN_ATTEMPT" "$SDK_RUN_ATTEMPT" \
            "$ATTEST_RUN_ATTEMPT"; do
            if [[ ! "$producer_attempt" =~ ^[1-9][0-9]*$ ]]; then
              echo 'staged producer attempt handoff is invalid' >&2
              exit 1
            fi
          done
          if [[ "$MACOS_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" ]]; then
            echo 'staged SDK producer predates a native producer' >&2
            exit 1
          fi
          if [[ "$SDK_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" \
            || "$MACOS_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" ]]; then
            echo 'staged attestation predates a selected producer' >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["HEAD_SHA"]
          run_id = os.environ["RUN_ID"]
          native_run_attempts = {
              "macos-aarch64": os.environ["MACOS_RUN_ATTEMPT"],
              "linux-x86_64": os.environ["LINUX_RUN_ATTEMPT"],
          }
          platforms = ("macos-aarch64", "linux-x86_64")
          assets_root = pathlib.Path("release-assets")
          proof_root = pathlib.Path("gate-proof")
          manifest_name = f"stasis-{version}-runtime-manifest.json"
          expected_release_names = {manifest_name}
          expected_proof_names = set()
          for platform in platforms:
              bundle = f"stasis-{version}-{platform}"
              archive_name = f"{bundle}.tar.gz"
              expected_release_names.update({
                  archive_name, f"{archive_name}.sha256", f"{bundle}.binary.sha256",
              })
              expected_proof_names.add(f"{bundle}-act-settle-inspect.json")
          if {item.name for item in assets_root.iterdir()} != expected_release_names:
              raise SystemExit("staged release inventory changed after read-only verification")
          if {item.name for item in proof_root.iterdir()} != expected_proof_names:
              raise SystemExit("staged proof inventory changed after read-only verification")
          if any(item.is_symlink() or not item.is_file() for item in assets_root.iterdir()) or any(
              item.is_symlink() or not item.is_file() for item in proof_root.iterdir()
          ):
              raise SystemExit("staged handoff contains a symbolic link")

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(document, context):
              try:
                  return json.loads(
                      document,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          def checksum(filename: pathlib.Path, label: str) -> str:
              if filename.stat().st_size <= 0 or filename.stat().st_size > 1024:
                  raise SystemExit(f"checksum sidecar size is outside the release limit: {filename}")
              match = re.fullmatch(r"([0-9a-f]{64})  ([^\r\n]+)\n", filename.read_text(encoding="ascii"))
              if match is None or match.group(2) != label:
                  raise SystemExit(f"invalid checksum sidecar: {filename}")
              return match.group(1)

          source = {
              "servo_repository": "https://github.com/servo/servo.git",
              "servo_revision": "0d579bd5aab6df3764fad805427254751632a6e4",
              "pliego_repository": "https://github.com/oxhq/pliego.git",
              "pliego_revision": "556c774242b272b11bc60999449c5debff1ad20f",
              "pliego_servo_merge_base": "313b6d5ecc113b08010ce434140db3ca5abcc71c",
              "stasis_repository": "https://github.com/oxhq/stasis.git",
              "stasis_revision": revision,
          }
          bindings = {}
          for platform in platforms:
              bundle = f"stasis-{version}-{platform}"
              archive_name = f"{bundle}.tar.gz"
              binary_sidecar_name = f"{bundle}.binary.sha256"
              proof_name = f"{bundle}-act-settle-inspect.json"
              archive = assets_root / archive_name
              archive_digest_state = hashlib.sha256()
              with archive.open("rb") as archive_source:
                  for chunk in iter(lambda: archive_source.read(1024 * 1024), b""):
                      archive_digest_state.update(chunk)
              archive_digest = archive_digest_state.hexdigest()
              if checksum(assets_root / f"{archive_name}.sha256", archive_name) != archive_digest:
                  raise SystemExit("staged archive digest changed")
              binary_label = f"{bundle}/stasis"
              binary_digest = checksum(assets_root / binary_sidecar_name, binary_label)
              proof_file = proof_root / proof_name
              if proof_file.stat().st_size <= 0 or proof_file.stat().st_size > 64 * 1024:
                  raise SystemExit("staged native gate proof size is outside the release limit")
              proof = strict_json_loads(
                  proof_file.read_text(encoding="utf-8"), "staged native gate proof"
              )
              expected = {
                  "schema": 2,
                  "gate": "act-settle-inspect",
                  "test": "release_gate_published_binary_completes_act_settle_inspect",
                  "version": version,
                  "platform": platform,
                  "revision": revision,
                  "workflowRunId": run_id,
                  "workflowRunAttempt": native_run_attempts[platform],
                  "archive": {"name": archive_name, "sha256": archive_digest},
                  "binary": {"path": binary_label, "sha256": binary_digest},
                  "source": source,
              }
              if (
                  not isinstance(proof, dict)
                  or set(proof) != set(expected) | {"gateLogSha256"}
                  or type(proof.get("schema")) is not int
                  or any(proof.get(key) != value for key, value in expected.items())
                  or re.fullmatch(r"[0-9a-f]{64}", proof.get("gateLogSha256", "")) is None
              ):
                  raise SystemExit(f"staged gate proof changed for {platform}")
              bindings[platform] = {
                  "archiveName": archive_name,
                  "archiveSizeBytes": archive.stat().st_size,
                  "archiveSha256": archive_digest,
                  "archiveRoot": bundle,
                  "executableSha256": binary_digest,
              }

          manifest_file = assets_root / manifest_name
          if manifest_file.stat().st_size <= 0 or manifest_file.stat().st_size > 128 * 1024:
              raise SystemExit("staged runtime manifest size is outside the release limit")
          manifest = strict_json_loads(
              manifest_file.read_text(encoding="utf-8"), "staged runtime manifest"
          )
          inventory = [
              "INSTALL.txt", "LICENSE", "LICENSE_WHATWG_SPECS",
              "NATIVE-LIBRARIES.txt", "README.md", "SOURCE.txt",
              "STASIS_UPSTREAM.toml", "THIRD_PARTY_LICENSES.html",
              "VERSION.txt", "controlled-web-session-v2.json",
              "session-v0.3-candidate.md", "stasis",
          ]
          artifacts = {}
          for key, node_platform, node_arch, platform in (
              ("darwin-arm64", "darwin", "arm64", "macos-aarch64"),
              ("linux-x64", "linux", "x64", "linux-x86_64"),
          ):
              binding = bindings[platform]
              artifacts[key] = {
                  "nodePlatform": node_platform,
                  "nodeArch": node_arch,
                  "releasePlatform": platform,
                  "archiveUrl": (
                      f"https://github.com/oxhq/stasis/releases/download/v{version}/"
                      f"{binding['archiveName']}"
                  ),
                  "archiveSizeBytes": binding["archiveSizeBytes"],
                  "archiveSha256": binding["archiveSha256"],
                  "archiveRoot": binding["archiveRoot"],
                  "archiveFiles": inventory,
                  "executablePath": "stasis",
                  "executableSha256": binding["executableSha256"],
              }
          expected_manifest = {
              "schema": 1,
              "packageName": "@oxhq/stasis",
              "sdkVersion": version,
              "releaseTag": f"v{version}",
              "implementation": {"name": "stasis-shell", "source": source},
              "artifacts": artifacts,
          }
          if manifest != expected_manifest:
              raise SystemExit("staged runtime distribution manifest changed")
          PY
          provenance_subjects=(release-assets/* gate-proof/*)
          test "${#provenance_subjects[@]}" -eq 9
          provenance_json="$RUNNER_TEMP/stasis-staged-release-provenance.json"
          gh attestation verify "${provenance_subjects[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/$HEAD_BRANCH" \
            --deny-self-hosted-runners \
            --limit 100 \
            --format json > "$provenance_json"
          PROVENANCE_JSON="$provenance_json" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def nested(value, *keys):
              for key in keys:
                  if not isinstance(value, dict):
                      return None
                  value = value.get(key)
              return value

          def sha256(filename):
              digest = hashlib.sha256()
              with filename.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          try:
              document = json.loads(
                  pathlib.Path(os.environ["PROVENANCE_JSON"]).read_text(encoding="utf-8"),
                  object_pairs_hook=strict_object,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite number {value!r}")
                  ),
              )
          except (OSError, UnicodeError, ValueError, RecursionError) as error:
              raise SystemExit(f"cannot read strict staged provenance JSON: {error}") from error
          if not isinstance(document, list) or not document:
              raise SystemExit("staged provenance verification returned no statements")

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["HEAD_SHA"]
          source_ref = f"refs/heads/{os.environ['HEAD_BRANCH']}"
          repository = os.environ["GITHUB_REPOSITORY"]
          repository_uri = f"https://github.com/{repository}"
          signer_uri = (
              f"{repository_uri}/.github/workflows/stasis-package.yml@{source_ref}"
          )
          invocation_uri = (
              f"{repository_uri}/actions/runs/{os.environ['RUN_ID']}/attempts/"
              f"{os.environ['ATTEST_RUN_ATTEMPT']}"
          )
          candidates = []
          for record in document:
              certificate_invocation = nested(
                  record, "verificationResult", "signature", "certificate", "runInvocationURI"
              )
              predicate_invocation = nested(
                  record, "verificationResult", "statement", "predicate", "runDetails",
                  "metadata", "invocationId",
              )
              if certificate_invocation == invocation_uri or predicate_invocation == invocation_uri:
                  candidates.append(record)
          if len(candidates) != 1:
              raise SystemExit("staged release did not resolve to one exact package attestation")

          result = nested(candidates[0], "verificationResult")
          certificate = nested(result, "signature", "certificate")
          if not isinstance(certificate, dict):
              raise SystemExit("staged release verified certificate is missing")
          expected_certificate = {
              "subjectAlternativeName": signer_uri,
              "githubWorkflowSHA": revision,
              "githubWorkflowRepository": repository,
              "githubWorkflowRef": source_ref,
              "runnerEnvironment": "github-hosted",
              "sourceRepositoryURI": repository_uri,
              "sourceRepositoryDigest": revision,
              "sourceRepositoryRef": source_ref,
              "buildSignerURI": signer_uri,
              "runInvocationURI": invocation_uri,
          }
          if any(certificate.get(key) != value for key, value in expected_certificate.items()):
              raise SystemExit("staged release verified certificate identity changed")

          statement = nested(result, "statement")
          if (
              not isinstance(statement, dict)
              or statement.get("_type") != "https://in-toto.io/Statement/v1"
              or statement.get("predicateType") != "https://slsa.dev/provenance/v1"
          ):
              raise SystemExit("staged release provenance statement type changed")
          expected_names = {f"stasis-{version}-runtime-manifest.json"}
          for platform in ("macos-aarch64", "linux-x86_64"):
              bundle = f"stasis-{version}-{platform}"
              archive = f"{bundle}.tar.gz"
              expected_names.update({
                  archive,
                  f"{archive}.sha256",
                  f"{bundle}.binary.sha256",
                  f"{bundle}-act-settle-inspect.json",
              })
          sdk_names = {
              f"oxhq-stasis-{version}.tgz",
              f"stasis-{version}-typescript-act-settle-inspect.json",
          }
          expected_names.update(sdk_names)
          actual_subjects = {}
          for subject in statement.get("subject", []):
              if not isinstance(subject, dict) or set(subject) != {"name", "digest"}:
                  raise SystemExit("staged release provenance subject shape changed")
              name = subject.get("name")
              digest = subject.get("digest")
              if (
                  not isinstance(name, str)
                  or name in actual_subjects
                  or not isinstance(digest, dict)
                  or set(digest) != {"sha256"}
                  or re.fullmatch(r"[0-9a-f]{64}", digest.get("sha256", "")) is None
              ):
                  raise SystemExit("staged release provenance subject is malformed")
              actual_subjects[name] = digest["sha256"]
          if set(actual_subjects) != expected_names:
              raise SystemExit("staged release provenance subject inventory changed")
          local_subjects = {}
          for filename in (*pathlib.Path("release-assets").iterdir(), *pathlib.Path("gate-proof").iterdir()):
              if filename.is_symlink() or not filename.is_file() or filename.name in local_subjects:
                  raise SystemExit("staged release provenance file identity is invalid")
              local_subjects[filename.name] = sha256(filename)
          if set(local_subjects) != expected_names - sdk_names or any(
              actual_subjects[name] != digest for name, digest in local_subjects.items()
          ):
              raise SystemExit("staged release provenance digest binding changed")
          predicate = statement.get("predicate")
          if nested(predicate, "runDetails", "metadata") != {"invocationId": invocation_uri}:
              raise SystemExit("staged release SLSA invocation identity changed")
          if nested(predicate, "runDetails", "builder") != {"id": signer_uri}:
              raise SystemExit("staged release SLSA builder identity changed")
          PY

      - name: Verify immutable tag and resumable draft state
        shell: bash
        run: |
          set -euo pipefail
          get_or_404() {
            local endpoint=$1
            local output=$2
            local response status
            set +e
            response=$(gh api "$endpoint" 2>&1)
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              printf '%s\n' "$response" > "$output"
              return 0
            fi
            if [[ "$response" == *'HTTP 404'* ]]; then
              return 1
            fi
            echo "$response" >&2
