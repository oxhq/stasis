          import json
          import math
          import pathlib
          import sys

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(document):
              return json.loads(
                  document,
                  object_pairs_hook=strict_object,
                  parse_float=strict_float,
                  parse_constant=strict_constant,
              )

          def is_e404(document):
              return (
                  isinstance(document, dict)
                  and set(document) == {"error"}
                  and isinstance(document["error"], dict)
                  and document["error"].get("code") == "E404"
              )

          if not is_e404(strict_json_loads('{"error":{"code":"E404"}}')):
              raise SystemExit("npm E404 classifier self-test rejected its positive case")
          for rejected in (
              '{"error":{"code":"E500"}}',
              '{"error":{"code":"E404"},"extra":true}',
              '"E404"',
              '[]',
          ):
              if is_e404(strict_json_loads(rejected)):
                  raise SystemExit("npm E404 classifier self-test accepted a negative case")
          for ambiguous in (
              '{"error":{"code":"E500"},"error":{"code":"E404"}}',
              '{"error":{"code":"E500","code":"E404"}}',
          ):
              try:
                  strict_json_loads(ambiguous)
              except ValueError:
                  pass
              else:
                  raise SystemExit("npm E404 classifier self-test accepted duplicate JSON keys")

          response_file = pathlib.Path(sys.argv[1])
          try:
              response_size = response_file.stat().st_size
              if response_size <= 0 or response_size > 64 * 1024:
                  raise ValueError("response size is outside the classifier limit")
              response = strict_json_loads(response_file.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, ValueError, RecursionError):
              raise SystemExit(1)
          raise SystemExit(0 if is_e404(response) else 1)
          PY
            then
              echo 'publish_required=true' >> "$GITHUB_OUTPUT"
            else
              cat "$view_stderr" >&2
              echo "npm view failed without a confirmed public-registry E404 (exit $view_status); refusing to publish" >&2
              exit 1
            fi
          fi

      - name: Recheck immutable release identity immediately before npm mutation
        if: github.event_name == 'release' && steps.npm-state.outputs.publish_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_by_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          release_by_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          for release in "$release_by_id" "$release_by_tag"; do
            jq -e \
              --argjson release_id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" '
                .id == $release_id
                and .tag_name == $tag
                and .draft == false
                and .prerelease == false
                and .immutable == true
                and (.published_at | type == "string" and length > 0)
              ' <<< "$release" > /dev/null
          done
          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || "$tag_sha" != "$STASIS_REVISION" ]]; then
            echo "$RELEASE_TAG changed before npm publication" >&2
            exit 1
          fi

      - name: Publish with npm trusted publishing and provenance
        if: github.event_name == 'release' && steps.npm-state.outputs.publish_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm publish "$NPM_TARBALL" --ignore-scripts --access public --tag latest --provenance \
            --registry="$NPM_CONFIG_REGISTRY"

      - name: Require registry convergence to exact bytes and npm tag aliases
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in {1..60}; do
            set +e
            registry_version=$(npm view "@oxhq/stasis@$STASIS_VERSION" version --json \
              --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
            version_status=$?
            registry_integrity=$(npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity --json \
              --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
            integrity_status=$?
            dist_tags=$(npm view '@oxhq/stasis' dist-tags --json \
              --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
            dist_tags_status=$?
            set -e
            if [[ $version_status -eq 0 && $integrity_status -eq 0 && $dist_tags_status -eq 0 \
              && -n "$registry_version" && -n "$registry_integrity" && -n "$dist_tags" ]]; then
              registry_version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_version")
              registry_integrity=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_integrity")
              dist_tags_match=$(node -e '
                const tags = JSON.parse(process.argv[1]);
                const keys = tags !== null && typeof tags === "object" && !Array.isArray(tags)
                  ? Object.keys(tags).sort()
                  : [];
                process.stdout.write(String(
                  keys.length === 2
                    && keys[0] === "alpha"
                    && keys[1] === "latest"
                    && tags.alpha === "0.1.0-alpha.0"
                    && tags.latest === process.argv[2]
                ));
              ' "$dist_tags" "$STASIS_VERSION")
              if [[ "$registry_version" == "$STASIS_VERSION" \
                && "$registry_integrity" == "$NPM_LOCAL_INTEGRITY" \
                && "$dist_tags_match" == 'true' ]]; then
                matched=true
                break
              fi
            fi
            sleep 10
          done
          if [[ "$matched" != 'true' ]]; then
            echo 'npm registry did not converge to the exact stable bytes and dist-tags' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/stasis-registry-pack"
          npm pack "@oxhq/stasis@$STASIS_VERSION" --ignore-scripts \
            --pack-destination "$RUNNER_TEMP/stasis-registry-pack" \
            --registry="$NPM_CONFIG_REGISTRY"
          shopt -s nullglob
          registry_packages=("$RUNNER_TEMP"/stasis-registry-pack/*.tgz)
          test ${#registry_packages[@]} -eq 1
          cmp "$NPM_TARBALL" "${registry_packages[0]}"

          audit_consumer="$RUNNER_TEMP/stasis-credentialed-audit-consumer"
          mkdir "$audit_consumer"
          (
            cd "$audit_consumer"
            npm init --yes > /dev/null
            npm install --ignore-scripts "@oxhq/stasis@$STASIS_VERSION" \
              --registry="$NPM_CONFIG_REGISTRY"
          )
          audit_json="$RUNNER_TEMP/stasis-credentialed-registry-audit.json"
          audit_stderr="$RUNNER_TEMP/stasis-credentialed-registry-audit.stderr"
          attestations_ready=false
          for attempt in {1..60}; do
            set +e
            (
              cd "$audit_consumer"
              npm audit signatures --json --include-attestations \
                --registry="$NPM_CONFIG_REGISTRY" \
                > "$audit_json" 2> "$audit_stderr"
            )
            audit_status=$?
            set -e
            if [[ $audit_status -eq 0 ]] && jq -e \
              --arg version "$STASIS_VERSION" \
              --arg registry "$NPM_CONFIG_REGISTRY" \
              --arg provenance_predicate "https://slsa.dev/provenance/v1" \
              --arg publish_predicate "https://github.com/npm/attestation/tree/main/specs/publish/v0.1" '
                (keys | sort) == ["invalid", "missing", "verified"]
                and .invalid == []
                and .missing == []
                and (.verified | type) == "array"
                and (.verified | length) == 1
                and .verified[0].name == "@oxhq/stasis"
                and .verified[0].version == $version
                and .verified[0].registry == $registry
                and .verified[0].attestations.provenance.predicateType == $provenance_predicate
                and (.verified[0].attestationBundles | type) == "array"
                and (.verified[0].attestationBundles | length) == 2
                and (
                  [.verified[0].attestationBundles[].predicateType] | sort
                ) == ([$provenance_predicate, $publish_predicate] | sort)
              ' "$audit_json" > /dev/null; then
              attestations_ready=true
              break
            fi
            if [[ $attempt -lt 60 ]]; then
              sleep 10
            fi
          done
          if [[ "$attestations_ready" != 'true' ]]; then
            cat "$audit_stderr" >&2
            echo 'npm registry did not converge to one verified publish attestation and one SLSA provenance bundle' >&2
            exit 1
          fi
          PUBLICATION_RUN_ID="$GITHUB_RUN_ID" \
            PUBLICATION_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            python3 - "$audit_json" "$NPM_TARBALL" <<'PY'
          import base64
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import sys

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(document, context):
              try:
                  return json.loads(
                      document,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          audit_file = pathlib.Path(sys.argv[1])
          if audit_file.stat().st_size <= 0 or audit_file.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit("npm signature audit size is outside the verification limit")
          audit = strict_json_loads(
              audit_file.read_text(encoding="utf-8"), "npm signature audit"
          )
          tarball = pathlib.Path(sys.argv[2])
          version = os.environ["STASIS_VERSION"]
          revision = os.environ["STASIS_REVISION"]
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["PUBLICATION_RUN_ID"]
          expected_attempt = int(os.environ["PUBLICATION_RUN_ATTEMPT"])

          verified = audit.get("verified")
          if not isinstance(verified, list) or len(verified) != 1:
              raise SystemExit("npm audit did not return exactly one verified package")
          entry = verified[0]
          if not isinstance(entry, dict):
              raise SystemExit("npm audit verified package entry is not an object")
          expected_attestation_url = (
              f"https://registry.npmjs.org/-/npm/v1/attestations/"
              f"@oxhq%2fstasis@{version}"
          )
          attestations = entry.get("attestations")
          if not isinstance(attestations, dict) or attestations.get("url") != expected_attestation_url:
              raise SystemExit("npm attestation URL is not the exact public registry identity")

          expected_sha512_state = hashlib.sha512()
          with tarball.open("rb") as tarball_source:
              for chunk in iter(lambda: tarball_source.read(1024 * 1024), b""):
                  expected_sha512_state.update(chunk)
          expected_sha512 = expected_sha512_state.hexdigest()
          expected_subject = [{
              "name": f"pkg:npm/%40oxhq/stasis@{version}",
              "digest": {"sha512": expected_sha512},
          }]

          provenance_predicate_type = "https://slsa.dev/provenance/v1"
          publish_predicate_type = (
              "https://github.com/npm/attestation/tree/main/specs/publish/v0.1"
          )
          bundles = entry.get("attestationBundles")
          if (
              not isinstance(bundles, list)
              or len(bundles) != 2
              or any(not isinstance(item, dict) for item in bundles)
          ):
              raise SystemExit("npm audit did not return exactly two verified attestation bundles")
          bundles_by_type = {}
          for bundle in bundles:
              predicate_type = bundle.get("predicateType")
              if (
                  predicate_type not in {provenance_predicate_type, publish_predicate_type}
                  or predicate_type in bundles_by_type
              ):
                  raise SystemExit("npm audit attestation predicate inventory changed")
              bundles_by_type[predicate_type] = bundle
          if set(bundles_by_type) != {provenance_predicate_type, publish_predicate_type}:
              raise SystemExit("npm audit omitted required provenance or publish attestation")

          def decode_statement(bundle, context):
              bundle_body = bundle.get("bundle")
              if not isinstance(bundle_body, dict):
                  raise SystemExit(f"{context} bundle body is missing")
              envelope = bundle_body.get("dsseEnvelope")
              if (
                  not isinstance(envelope, dict)
                  or envelope.get("payloadType") != "application/vnd.in-toto+json"
              ):
                  raise SystemExit(f"{context} DSSE envelope type changed")
              signatures = envelope.get("signatures")
              if (
                  not isinstance(signatures, list)
                  or not signatures
                  or any(
                      not isinstance(signature, dict)
                      or not isinstance(signature.get("sig"), str)
                      or not signature["sig"]
                      for signature in signatures
                  )
              ):
                  raise SystemExit(f"{context} DSSE envelope has no verified signature")
              payload_value = envelope.get("payload")
              if not isinstance(payload_value, str):
                  raise SystemExit(f"{context} DSSE payload is missing")
              try:
                  payload = base64.b64decode(payload_value, validate=True)
                  statement = strict_json_loads(payload.decode("utf-8"), f"{context} statement")
              except (ValueError, UnicodeDecodeError) as error:
                  raise SystemExit(f"{context} DSSE payload is invalid") from error
              if not isinstance(statement, dict):
                  raise SystemExit(f"{context} statement is not an object")
              return statement

          publish_statement = decode_statement(
              bundles_by_type[publish_predicate_type], "npm publish attestation"
          )
          if set(publish_statement) != {"_type", "subject", "predicateType", "predicate"}:
              raise SystemExit("npm publish attestation statement schema changed")
          if publish_statement.get("_type") != "https://in-toto.io/Statement/v0.1":
              raise SystemExit("npm publish attestation is not an in-toto v0.1 statement")
          if publish_statement.get("predicateType") != publish_predicate_type:
              raise SystemExit("npm publish attestation predicate type changed")
          if publish_statement.get("subject") != expected_subject:
              raise SystemExit("npm publish attestation does not bind the exact registry tarball")
          expected_publish_predicate = {
              "name": "@oxhq/stasis",
              "version": version,
              "registry": "https://registry.npmjs.org",
          }
          if publish_statement.get("predicate") != expected_publish_predicate:
              raise SystemExit("npm publish attestation registry predicate changed")

          statement = decode_statement(
              bundles_by_type[provenance_predicate_type], "npm provenance"
          )
          if set(statement) != {"_type", "subject", "predicateType", "predicate"}:
              raise SystemExit("npm provenance statement schema changed")
          if statement.get("_type") != "https://in-toto.io/Statement/v1":
              raise SystemExit("npm provenance is not an in-toto v1 statement")
          if statement.get("predicateType") != provenance_predicate_type:
              raise SystemExit("npm provenance predicate type changed")
          if statement.get("subject") != expected_subject:
              raise SystemExit("npm provenance subject does not bind the exact registry tarball")

          predicate = statement.get("predicate")
          if not isinstance(predicate, dict) or set(predicate) != {"buildDefinition", "runDetails"}:
              raise SystemExit("npm provenance predicate schema changed")
          build = predicate.get("buildDefinition")
          expected_ref = f"refs/tags/v{version}"
          expected_workflow = {
              "ref": expected_ref,
              "repository": f"{server_url}/{repository}",
              "path": ".github/workflows/stasis-publish-npm.yml",
          }
          if not isinstance(build, dict):
              raise SystemExit("npm provenance build definition is missing")
          if build.get("buildType") != "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1":
              raise SystemExit("npm provenance build type changed")
          if build.get("externalParameters") != {"workflow": expected_workflow}:
              raise SystemExit("npm provenance workflow identity changed")
          expected_dependencies = [{
              "uri": f"git+{server_url}/{repository}@{expected_ref}",
              "digest": {"gitCommit": revision},
          }]
          if build.get("resolvedDependencies") != expected_dependencies:
              raise SystemExit("npm provenance source commit changed")
          internal = build.get("internalParameters")
          if not isinstance(internal, dict) or internal.get("github", {}).get("event_name") != "release":
              raise SystemExit("npm provenance did not originate from the release event")

          run_details = predicate.get("runDetails")
          if not isinstance(run_details, dict):
              raise SystemExit("npm provenance run details are missing")
          if run_details.get("builder") != {"id": "https://github.com/actions/runner/github-hosted"}:
              raise SystemExit("npm provenance was not produced by a GitHub-hosted runner")
          metadata = run_details.get("metadata")
          if not isinstance(metadata, dict) or set(metadata) != {"invocationId"}:
              raise SystemExit("npm provenance invocation metadata changed")
          prefix = f"{server_url}/{repository}/actions/runs/{run_id}/attempts/"
          match = re.fullmatch(re.escape(prefix) + r"([1-9][0-9]*)", metadata["invocationId"])
          if match is None:
              raise SystemExit("npm provenance invocation is not the selected publication run")
          provenance_attempt = int(match.group(1))
          if provenance_attempt > expected_attempt:
              raise SystemExit("npm provenance claims a future workflow attempt")
          print(
              f"verified exact npm publish attestation and provenance for {repository}@{revision} "
              f"run {run_id} attempt {provenance_attempt}"
          )
          PY

  recover_published:
    name: Recover verification of the exact published SDK
    needs: verify
    if: needs.verify.result == 'success' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      STASIS_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Set up Node without publication credentials
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the exact SDK staged by recovery verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify.outputs.staged_artifact_name }}
          path: verified-sdk

      - name: Require exact public bytes and npm tag aliases without mutation
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --registry="$NPM_CONFIG_REGISTRY"
          test "$(npm --version)" = '11.19.0'
          npm_tarball="$GITHUB_WORKSPACE/verified-sdk/oxhq-stasis-${STASIS_VERSION}.tgz"
          test -f "$npm_tarball"
          local_integrity=$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
          ' "$npm_tarball")
          registry_version=$(npm view "@oxhq/stasis@$STASIS_VERSION" version --json \
            --registry="$NPM_CONFIG_REGISTRY")
          registry_integrity=$(npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity --json \
            --registry="$NPM_CONFIG_REGISTRY")
          dist_tags=$(npm view '@oxhq/stasis' dist-tags --json \
            --registry="$NPM_CONFIG_REGISTRY")
          registry_version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_version")
          registry_integrity=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_integrity")
          node -e '
            const assert = require("node:assert/strict");
            const tags = JSON.parse(process.argv[1]);
            assert.deepEqual(Object.keys(tags).sort(), ["alpha", "latest"]);
            assert.equal(tags.alpha, "0.1.0-alpha.0");
            assert.equal(tags.latest, process.argv[2]);
          ' "$dist_tags" "$STASIS_VERSION"
          test "$registry_version" = "$STASIS_VERSION"
          test "$registry_integrity" = "$local_integrity"
          mkdir "$RUNNER_TEMP/stasis-registry-recovery"
          npm pack "@oxhq/stasis@$STASIS_VERSION" --ignore-scripts \
            --pack-destination "$RUNNER_TEMP/stasis-registry-recovery" \
            --registry="$NPM_CONFIG_REGISTRY"
          shopt -s nullglob
          registry_packages=("$RUNNER_TEMP"/stasis-registry-recovery/*.tgz)
          test ${#registry_packages[@]} -eq 1
          cmp "$npm_tarball" "${registry_packages[0]}"

  verify-registry:
    name: Verify registry SDK on ${{ matrix.release_platform }}
    needs:
      - verify
      - publish
      - recover_published
    if: |
      always()
        && needs.verify.result == 'success'
        && (
          (github.event_name == 'release' && needs.publish.result == 'success')
          || (
            github.event_name == 'workflow_dispatch'
              && needs.recover_published.result == 'success'
          )
        )
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_platform: macos-aarch64
            runner: macos-15
            kernel: Darwin
            architecture: arm64
          - release_platform: linux-x86_64
            runner: ubuntu-22.04
            kernel: Linux
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      ATTEST_RUN_ATTEMPT: ${{ needs.verify.outputs.attest_run_attempt }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      LINUX_RUN_ATTEMPT: ${{ needs.verify.outputs.linux_run_attempt }}
      MACOS_RUN_ATTEMPT: ${{ needs.verify.outputs.macos_run_attempt }}
      PACKAGE_RUN_ID: ${{ needs.verify.outputs.package_run_id }}
      PUBLICATION_RUN_ATTEMPT: ${{ github.event_name == 'release' && github.run_attempt || needs.verify.outputs.publication_run_attempt }}
      PUBLICATION_RUN_ID: ${{ github.event_name == 'release' && github.run_id || needs.verify.outputs.publication_run_id }}
      STASIS_NATIVE_BINARY_SHA256: ${{ needs.verify.outputs.native_binary_sha256 }}
      STASIS_PLATFORM: ${{ matrix.release_platform }}
      STASIS_REVISION: ${{ needs.verify.outputs.revision }}
      STASIS_VERSION: ${{ needs.verify.outputs.version }}
      SDK_RUN_ATTEMPT: ${{ needs.verify.outputs.sdk_run_attempt }}
    steps:
      - name: Check out the exact published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.STASIS_RELEASE_TAG }}

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Require space for bounded public artifact verification
        if: matrix.release_platform == 'macos-aarch64'
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 4194304

      - name: Prepare the Linux public-fixture runner
        if: matrix.release_platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libfontconfig1 \
            libgl1-mesa-dri \
            libstdc++6 \
            xvfb \
            zlib1g
          python3 -c 'import ctypes; ctypes.CDLL("libEGL.so.1")'

      - name: Set up Node without publication credentials
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download and recheck the exact published native inputs
        shell: bash
        env:
          TAG: ${{ env.STASIS_RELEASE_TAG }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = '${{ matrix.kernel }}'
          test "$(uname -m)" = '${{ matrix.architecture }}'
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            test "$(sysctl -n hw.optional.arm64)" = '1'
          else
            test "$(LC_ALL=C getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          fi
          for producer_attempt in \
            "$MACOS_RUN_ATTEMPT" "$LINUX_RUN_ATTEMPT" "$SDK_RUN_ATTEMPT" \
            "$ATTEST_RUN_ATTEMPT"; do
            if [[ ! "$producer_attempt" =~ ^[1-9][0-9]*$ ]]; then
              echo 'public verification received an invalid package producer attempt' >&2
              exit 1
            fi
          done
          if [[ "$MACOS_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$SDK_RUN_ATTEMPT" ]]; then
            echo 'public verification received an SDK attempt older than a native attempt' >&2
            exit 1
          fi
          if [[ "$SDK_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" \
            || "$MACOS_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" \
            || "$LINUX_RUN_ATTEMPT" -gt "$ATTEST_RUN_ATTEMPT" ]]; then
            echo 'public verification received an attestation older than a selected producer' >&2
            exit 1
          fi
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            native_run_attempt=$MACOS_RUN_ATTEMPT
          else
            native_run_attempt=$LINUX_RUN_ATTEMPT
          fi
          test "$(git rev-parse HEAD)" = "$STASIS_REVISION"
          bundle="stasis-${STASIS_VERSION}-${STASIS_PLATFORM}"
          archive="${bundle}.tar.gz"
          binary_sidecar="${bundle}.binary.sha256"
          proof="${bundle}-act-settle-inspect.json"
          mkdir release-assets gate-proof runtime-manifest provenance-subjects
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --pattern "$binary_sidecar"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir gate-proof \
            --pattern "$proof"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir runtime-manifest \
            --pattern "stasis-${STASIS_VERSION}-runtime-manifest.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir provenance-subjects \
            --pattern "stasis-${STASIS_VERSION}-*"
          shopt -s nullglob
          provenance_release_subjects=(provenance-subjects/*)
          test "${#provenance_release_subjects[@]}" -eq 9
          for provenance_release_subject in "${provenance_release_subjects[@]}"; do
            test -f "$provenance_release_subject"
            test ! -L "$provenance_release_subject"
          done
          python3 etc/ci/stasis/release_archive.py verify \
            --asset-directory release-assets \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$STASIS_REVISION" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root . \
            --extract-to "$RUNNER_TEMP/stasis-registry-release"
          python3 etc/ci/stasis/release_archive.py verify-gate-proof \
            --proof-directory gate-proof \
            --asset-directory release-assets \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$STASIS_REVISION" \
            --run-id "$PACKAGE_RUN_ID" \
            --run-attempt "$native_run_attempt"
          selected_binary_sha256=$(awk '{print $1}' "release-assets/$binary_sidecar")
          if [[ "$STASIS_PLATFORM" == 'macos-aarch64' ]]; then
            test "$STASIS_NATIVE_BINARY_SHA256" = "$selected_binary_sha256"
          fi
          node sdk/typescript/scripts/generate-runtime-manifest.mjs \
            --input "runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json" \
            --output "$RUNNER_TEMP/runtime-manifest.generated.ts"
          node - \
            "runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json" \
            "release-assets/$archive" \
            "$archive" \
            "$selected_binary_sha256" \
            "$STASIS_PLATFORM" <<'JS'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const [manifestFile, archiveFile, archiveName, executableSha256, platform] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
          const key = platform === "macos-aarch64" ? "darwin-arm64" : "linux-x64";
          const artifact = manifest.artifacts[key];
          const archiveBytes = fs.readFileSync(archiveFile);
          assert.equal(artifact.releasePlatform, platform);
          assert.equal(artifact.archiveSizeBytes, archiveBytes.byteLength);
          assert.equal(artifact.archiveSha256, crypto.createHash("sha256").update(archiveBytes).digest("hex"));
          assert.equal(artifact.executableSha256, executableSha256);
          assert.equal(new URL(artifact.archiveUrl).pathname.split("/").at(-1), archiveName);
          JS
          echo "STASIS_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Download the exact pre-gated SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify.outputs.staged_artifact_name }}
          path: staged-sdk

      - name: Verify registry bytes, signatures, and real SDK fixture
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --registry="$NPM_CONFIG_REGISTRY"
          test "$(npm --version)" = '11.19.0'
          mkdir verified-sdk
          cp \
            "staged-sdk/oxhq-stasis-${STASIS_VERSION}.tgz" \
            "staged-sdk/stasis-${STASIS_VERSION}-typescript-act-settle-inspect.json" \
            verified-sdk/
          python3 etc/ci/stasis/npm_release.py verify-proof \
            --directory verified-sdk \
            --version "$STASIS_VERSION" \
            --revision "$STASIS_REVISION" \
            --native-binary-sha256 "$STASIS_NATIVE_BINARY_SHA256" \
            --run-id "$PACKAGE_RUN_ID" \
            --run-attempt "$SDK_RUN_ATTEMPT"
          shopt -s nullglob
          provenance_subjects=(provenance-subjects/* verified-sdk/*)
          test "${#provenance_subjects[@]}" -eq 11
          provenance_json="$RUNNER_TEMP/stasis-public-package-provenance.json"
          gh attestation verify "${provenance_subjects[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
            --source-digest "$STASIS_REVISION" \
            --source-ref "refs/heads/$DEFAULT_BRANCH" \
            --deny-self-hosted-runners \
            --limit 100 \
            --format json > "$provenance_json"
          provenance_verifier=(
            python3 etc/ci/stasis/verify_build_provenance.py verify
            --verification-json "$provenance_json"
            --repository "$GITHUB_REPOSITORY"
            --workflow .github/workflows/stasis-package.yml
            --revision "$STASIS_REVISION"
            --source-ref "refs/heads/$DEFAULT_BRANCH"
            --server-url "$GITHUB_SERVER_URL"
            --run-id "$PACKAGE_RUN_ID"
            --run-attempt "$ATTEST_RUN_ATTEMPT"
            --expected-subject-count 11
          )
          for provenance_subject in "${provenance_subjects[@]}"; do
            provenance_verifier+=(--subject "$provenance_subject")
          done
          "${provenance_verifier[@]}"
          expected_tarball="$GITHUB_WORKSPACE/verified-sdk/oxhq-stasis-${STASIS_VERSION}.tgz"
          expected_integrity=$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
          ' "$expected_tarball")
          mkdir "$RUNNER_TEMP/stasis-registry-verification"
          consumer="$RUNNER_TEMP/stasis-registry-consumer"
          mkdir "$consumer"
          audit_json="$RUNNER_TEMP/stasis-registry-audit.json"
          (
            cd "$consumer"
            npm init --yes
            scope_registry=$(npm config get '@oxhq:registry')
            if [[ "$scope_registry" != 'undefined' && "$scope_registry" != "$NPM_CONFIG_REGISTRY" ]]; then
              echo "unexpected @oxhq registry: $scope_registry" >&2
              exit 1
            fi
            npm install --ignore-scripts "@oxhq/stasis@$STASIS_VERSION" \
              --registry="$NPM_CONFIG_REGISTRY"
            test "$(npm view "@oxhq/stasis@$STASIS_VERSION" version \
              --registry="$NPM_CONFIG_REGISTRY")" = "$STASIS_VERSION"
            dist_tags=$(npm view '@oxhq/stasis' dist-tags --json \
              --registry="$NPM_CONFIG_REGISTRY")
            node -e '
              const assert = require("node:assert/strict");
              const tags = JSON.parse(process.argv[1]);
              assert.deepEqual(Object.keys(tags).sort(), ["alpha", "latest"]);
              assert.equal(tags.alpha, "0.1.0-alpha.0");
              assert.equal(tags.latest, process.argv[2]);
            ' "$dist_tags" "$STASIS_VERSION"
            test "$(npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity \
              --registry="$NPM_CONFIG_REGISTRY")" = "$expected_integrity"
            npm pack "@oxhq/stasis@$STASIS_VERSION" --ignore-scripts \
              --pack-destination "$RUNNER_TEMP/stasis-registry-verification" \
              --registry="$NPM_CONFIG_REGISTRY"
            npm audit signatures --json --include-attestations \
              --registry="$NPM_CONFIG_REGISTRY" > "$audit_json"
          )
          shopt -s nullglob
          registry_packages=("$RUNNER_TEMP"/stasis-registry-verification/*.tgz)
          test ${#registry_packages[@]} -eq 1
          cmp "$expected_tarball" "${registry_packages[0]}"
          jq -e \
            --arg version "$STASIS_VERSION" \
            --arg registry "$NPM_CONFIG_REGISTRY" \
            --arg provenance_predicate "https://slsa.dev/provenance/v1" \
            --arg publish_predicate "https://github.com/npm/attestation/tree/main/specs/publish/v0.1" '
            (keys | sort) == ["invalid", "missing", "verified"]
            and .invalid == []
            and .missing == []
            and (.verified | type) == "array"
            and (.verified | length) == 1
            and .verified[0].name == "@oxhq/stasis"
            and .verified[0].version == $version
            and .verified[0].registry == $registry
            and .verified[0].attestations.provenance.predicateType == $provenance_predicate
            and (.verified[0].attestationBundles | type) == "array"
            and (.verified[0].attestationBundles | length) == 2
            and (
              [.verified[0].attestationBundles[].predicateType] | sort
            ) == ([$provenance_predicate, $publish_predicate] | sort)
          ' "$audit_json" > /dev/null
          python3 - "$audit_json" "$expected_tarball" <<'PY'
          import base64
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import sys

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(document, context):
              try:
                  return json.loads(
                      document,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          audit_file = pathlib.Path(sys.argv[1])
          if audit_file.stat().st_size <= 0 or audit_file.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit("npm signature audit size is outside the verification limit")
          audit = strict_json_loads(
              audit_file.read_text(encoding="utf-8"), "npm signature audit"
          )
          tarball = pathlib.Path(sys.argv[2])
          version = os.environ["STASIS_VERSION"]
          revision = os.environ["STASIS_REVISION"]
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["PUBLICATION_RUN_ID"]
          expected_attempt = int(os.environ["PUBLICATION_RUN_ATTEMPT"])

          verified = audit.get("verified")
          if not isinstance(verified, list) or len(verified) != 1:
              raise SystemExit("npm audit did not return exactly one verified package")
          entry = verified[0]
          if not isinstance(entry, dict):
              raise SystemExit("npm audit verified package entry is not an object")
          expected_attestation_url = (
              f"https://registry.npmjs.org/-/npm/v1/attestations/"
              f"@oxhq%2fstasis@{version}"
          )
          attestations = entry.get("attestations")
          if not isinstance(attestations, dict) or attestations.get("url") != expected_attestation_url:
              raise SystemExit("npm attestation URL is not the exact public registry identity")

          expected_sha512_state = hashlib.sha512()
          with tarball.open("rb") as tarball_source:
              for chunk in iter(lambda: tarball_source.read(1024 * 1024), b""):
                  expected_sha512_state.update(chunk)
          expected_sha512 = expected_sha512_state.hexdigest()
          expected_subject = [{
              "name": f"pkg:npm/%40oxhq/stasis@{version}",
              "digest": {"sha512": expected_sha512},
          }]

          provenance_predicate_type = "https://slsa.dev/provenance/v1"
          publish_predicate_type = (
              "https://github.com/npm/attestation/tree/main/specs/publish/v0.1"
          )
          bundles = entry.get("attestationBundles")
          if (
              not isinstance(bundles, list)
              or len(bundles) != 2
              or any(not isinstance(item, dict) for item in bundles)
          ):
              raise SystemExit("npm audit did not return exactly two verified attestation bundles")
          bundles_by_type = {}
          for bundle in bundles:
              predicate_type = bundle.get("predicateType")
              if (
                  predicate_type not in {provenance_predicate_type, publish_predicate_type}
                  or predicate_type in bundles_by_type
              ):
                  raise SystemExit("npm audit attestation predicate inventory changed")
              bundles_by_type[predicate_type] = bundle
          if set(bundles_by_type) != {provenance_predicate_type, publish_predicate_type}:
              raise SystemExit("npm audit omitted required provenance or publish attestation")

          def decode_statement(bundle, context):
              bundle_body = bundle.get("bundle")
              if not isinstance(bundle_body, dict):
                  raise SystemExit(f"{context} bundle body is missing")
              envelope = bundle_body.get("dsseEnvelope")
              if (
                  not isinstance(envelope, dict)
                  or envelope.get("payloadType") != "application/vnd.in-toto+json"
              ):
                  raise SystemExit(f"{context} DSSE envelope type changed")
              signatures = envelope.get("signatures")
              if (
                  not isinstance(signatures, list)
                  or not signatures
                  or any(
                      not isinstance(signature, dict)
                      or not isinstance(signature.get("sig"), str)
                      or not signature["sig"]
                      for signature in signatures
                  )
              ):
                  raise SystemExit(f"{context} DSSE envelope has no verified signature")
              payload_value = envelope.get("payload")
              if not isinstance(payload_value, str):
                  raise SystemExit(f"{context} DSSE payload is missing")
              try:
                  payload = base64.b64decode(payload_value, validate=True)
                  statement = strict_json_loads(payload.decode("utf-8"), f"{context} statement")
              except (ValueError, UnicodeDecodeError) as error:
                  raise SystemExit(f"{context} DSSE payload is invalid") from error
              if not isinstance(statement, dict):
                  raise SystemExit(f"{context} statement is not an object")
              return statement

          publish_statement = decode_statement(
              bundles_by_type[publish_predicate_type], "npm publish attestation"
          )
          if set(publish_statement) != {"_type", "subject", "predicateType", "predicate"}:
              raise SystemExit("npm publish attestation statement schema changed")
          if publish_statement.get("_type") != "https://in-toto.io/Statement/v0.1":
              raise SystemExit("npm publish attestation is not an in-toto v0.1 statement")
          if publish_statement.get("predicateType") != publish_predicate_type:
              raise SystemExit("npm publish attestation predicate type changed")
          if publish_statement.get("subject") != expected_subject:
              raise SystemExit("npm publish attestation does not bind the exact registry tarball")
          expected_publish_predicate = {
              "name": "@oxhq/stasis",
              "version": version,
              "registry": "https://registry.npmjs.org",
          }
          if publish_statement.get("predicate") != expected_publish_predicate:
              raise SystemExit("npm publish attestation registry predicate changed")

          statement = decode_statement(
              bundles_by_type[provenance_predicate_type], "npm provenance"
          )
          if set(statement) != {"_type", "subject", "predicateType", "predicate"}:
              raise SystemExit("npm provenance statement schema changed")
          if statement.get("_type") != "https://in-toto.io/Statement/v1":
              raise SystemExit("npm provenance is not an in-toto v1 statement")
          if statement.get("predicateType") != provenance_predicate_type:
              raise SystemExit("npm provenance predicate type changed")
          if statement.get("subject") != expected_subject:
              raise SystemExit("npm provenance subject does not bind the exact registry tarball")

          predicate = statement.get("predicate")
          if not isinstance(predicate, dict) or set(predicate) != {"buildDefinition", "runDetails"}:
              raise SystemExit("npm provenance predicate schema changed")
          build = predicate.get("buildDefinition")
          expected_ref = f"refs/tags/v{version}"
          expected_workflow = {
              "ref": expected_ref,
              "repository": f"{server_url}/{repository}",
              "path": ".github/workflows/stasis-publish-npm.yml",
          }
          if not isinstance(build, dict):
              raise SystemExit("npm provenance build definition is missing")
          if build.get("buildType") != "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1":
              raise SystemExit("npm provenance build type changed")
          if build.get("externalParameters") != {"workflow": expected_workflow}:
              raise SystemExit("npm provenance workflow identity changed")
          expected_dependencies = [{
              "uri": f"git+{server_url}/{repository}@{expected_ref}",
              "digest": {"gitCommit": revision},
          }]
          if build.get("resolvedDependencies") != expected_dependencies:
              raise SystemExit("npm provenance source commit changed")
          internal = build.get("internalParameters")
          if not isinstance(internal, dict) or internal.get("github", {}).get("event_name") != "release":
              raise SystemExit("npm provenance did not originate from the release event")

          run_details = predicate.get("runDetails")
          if not isinstance(run_details, dict):
              raise SystemExit("npm provenance run details are missing")
          if run_details.get("builder") != {"id": "https://github.com/actions/runner/github-hosted"}:
              raise SystemExit("npm provenance was not produced by a GitHub-hosted runner")
          metadata = run_details.get("metadata")
          if not isinstance(metadata, dict) or set(metadata) != {"invocationId"}:
              raise SystemExit("npm provenance invocation metadata changed")
          prefix = f"{server_url}/{repository}/actions/runs/{run_id}/attempts/"
          match = re.fullmatch(re.escape(prefix) + r"([1-9][0-9]*)", metadata["invocationId"])
          if match is None:
              raise SystemExit("npm provenance invocation is not the selected publication run")
          provenance_attempt = int(match.group(1))
          if (
              os.environ["GITHUB_EVENT_NAME"] == "release"
              and provenance_attempt > expected_attempt
          ):
              raise SystemExit("npm provenance claims a future workflow attempt")
          if (
              os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              and provenance_attempt != expected_attempt
          ):
              raise SystemExit("npm provenance invocation is not the selected publication attempt")
          print(
              f"verified exact npm publish attestation and provenance for {repository}@{revision} "
              f"run {run_id} attempt {provenance_attempt}"
          )
          PY
          gate_runner=(env)
          if [[ "$STASIS_PLATFORM" == 'linux-x86_64' ]]; then
            gate_runner=(xvfb-run -a env)
          fi
          "${gate_runner[@]}" node etc/ci/stasis/verify_registry_sdk.mjs \
            --binary "$RUNNER_TEMP/stasis-registry-release/$STASIS_BUNDLE/stasis" \
            --fixture ports/stasis/tests/fixtures/timer_10s.html \
            --session-v2-fixture ports/stasis/tests/fixtures/message_channel_buffered.html \
            --session-v2-image-fixture ports/stasis/tests/fixtures/controlled_v2_image_data_svg.html \
            --session-v2-http-image-fixture ports/stasis/tests/fixtures/controlled_v2_image_http.html \
            --session-v2-inline-svg-fixture ports/stasis/tests/fixtures/controlled_v2_inline_svg.html \
            --session-v2-inline-svg-shared-pending-fixture ports/stasis/tests/fixtures/controlled_v2_inline_svg_shared_pending.html \
            --session-v2-settlement-url-fixture ports/stasis/tests/fixtures/controlled_v2_settlement_url.html \
            --session-v2-interval-before-finite-fixture ports/stasis/tests/fixtures/controlled_v2_interval_before_finite.html \
            --session-v2-focus-fixture ports/stasis/tests/fixtures/input_method_focus_timestamp.html \
            --session-v2-automation-event-fixture ports/stasis/tests/fixtures/controlled_v2_form_event_timestamp.html \
            --session-v2-css-animation-event-fixture ports/stasis/tests/fixtures/controlled_v2_css_animation_event_timestamp.html \
            --session-v2-cookie-fixture sdk/typescript/test/fixtures/controlled-v2-cookie-login.html \
            --consumer-root "$consumer" \
            --package "${registry_packages[0]}" \
            --revision "$STASIS_REVISION" \
            --version "$STASIS_VERSION"
          cp sdk/typescript/test/fixtures/public-package-north-star.mjs \
            "$consumer/public-package-north-star.mjs"
          cp sdk/typescript/test/fixtures/north-star.html "$consumer/north-star.html"
          cp sdk/typescript/test/fixtures/public-package-session-north-star.mjs \
            "$consumer/public-package-session-north-star.mjs"
          cp -R sdk/typescript/test/fixtures/session-north-star \
            "$consumer/session-north-star"
          managed_runtime_cache="$RUNNER_TEMP/stasis-public-managed-runtime-cache"
          mkdir "$managed_runtime_cache"
          managed_archive_sha256=$(awk '{print $1}' \
            "release-assets/$STASIS_BUNDLE.tar.gz.sha256")
          managed_binary_sha256=$(awk '{print $1}' \
            "release-assets/$STASIS_BUNDLE.binary.sha256")
          v2_north_star_log="$RUNNER_TEMP/stasis-public-v2-session-north-star.jsonl"
          (
            cd "$consumer"
            unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN \
              STASIS_NORTH_STAR_BINARY STASIS_SESSION_NORTH_STAR_BINARY \
              STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE
            export STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE="$managed_runtime_cache"
            export STASIS_SESSION_NORTH_STAR_EXPECTED_ARCHIVE_SHA256="$managed_archive_sha256"
            export STASIS_SESSION_NORTH_STAR_EXPECTED_BINARY_SHA256="$managed_binary_sha256"
            export STASIS_SESSION_NORTH_STAR_EXPECTED_REVISION="$STASIS_REVISION"
            "${gate_runner[@]}" node ./public-package-session-north-star.mjs
          ) 2>&1 | tee "$v2_north_star_log"
          grep -F '"proof":"stasis-v0.2-session-north-star"' "$v2_north_star_log"
          grep -F '"runs":3' "$v2_north_star_log"
          grep -F '"sessions":6' "$v2_north_star_log"
          grep -F '"runtimeAcquisition":"managed-empty-cache-installed"' \
            "$v2_north_star_log"
          v1_north_star_log="$RUNNER_TEMP/stasis-public-v1-north-star.jsonl"
          (
            cd "$consumer"
            unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN \
              STASIS_NORTH_STAR_BINARY STASIS_SESSION_NORTH_STAR_BINARY
            "${gate_runner[@]}" node ./public-package-north-star.mjs
          ) 2>&1 | tee "$v1_north_star_log"
          grep -F '"proof":"stasis-v0.1-north-star"' "$v1_north_star_log"
          grep -F '"runs":3' "$v1_north_star_log"
