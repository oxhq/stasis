name: Publish @oxhq/stasis stable

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable stable release tag to verify
        required: true
        default: v0.3.0
        type: string
      publication_run_id:
        description: Release-event workflow run that published the npm package
        required: true
        type: string
      publication_run_attempt:
        description: Exact attempt of the release-event publication run
        required: true
        type: string

permissions: {}

concurrency:
  group: stasis-npm-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  STASIS_PLATFORM: macos-aarch64
  STASIS_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

jobs:
  verify:
    name: Verify native release and pre-gate exact SDK
    if: |
      github.repository == 'oxhq/stasis'
        && (
          (
            github.event_name == 'release'
              && github.event.release.draft == false
              && github.event.release.prerelease == false
              && github.event.release.tag_name == 'v0.3.0'
          )
          || (
            github.event_name == 'workflow_dispatch'
              && inputs.release_tag == 'v0.3.0'
          )
        )
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      attest_run_attempt: ${{ steps.inputs.outputs.attest_run_attempt }}
      linux_run_attempt: ${{ steps.inputs.outputs.linux_run_attempt }}
      macos_run_attempt: ${{ steps.inputs.outputs.macos_run_attempt }}
      native_binary_sha256: ${{ steps.inputs.outputs.native_binary_sha256 }}
      package_run_id: ${{ steps.inputs.outputs.package_run_id }}
      prepublish_run_attempt: ${{ steps.prepublish_gate.outputs.run_attempt }}
      publication_run_attempt: ${{ steps.release.outputs.publication_run_attempt }}
      publication_run_id: ${{ steps.release.outputs.publication_run_id }}
      release_id: ${{ steps.release.outputs.release_id }}
      revision: ${{ steps.release.outputs.revision }}
      sdk_run_attempt: ${{ steps.inputs.outputs.sdk_run_attempt }}
      staged_artifact_name: ${{ steps.inputs.outputs.staged_artifact_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.STASIS_RELEASE_TAG }}

      - name: Require space for bounded native archive verification
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 4194304

      - name: Set up Node without publication credentials
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - id: release
        name: Verify exact release, tag, commit, and asset inventory
        shell: bash
        env:
          RECOVERY_PUBLICATION_RUN_ATTEMPT: ${{ inputs.publication_run_attempt }}
          RECOVERY_PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          TAG: ${{ env.STASIS_RELEASE_TAG }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          test "$(sysctl -n hw.optional.arm64)" = '1'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -e --arg tag "$TAG" '
            .tag_name == $tag
            and .draft == false
            and .prerelease == false
            and .immutable == true
          ' release.json > /dev/null
          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "$TAG is not an exact lightweight commit tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'release' ]]; then
            test "$tag_sha" = "$GITHUB_SHA"
            publication_run_id=$GITHUB_RUN_ID
            publication_run_attempt=$GITHUB_RUN_ATTEMPT
          else
            if [[ "$GITHUB_REF_TYPE" != 'branch' || "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              echo 'recovery verification must be dispatched from the default branch' >&2
              exit 1
            fi
            if [[ ! "$RECOVERY_PUBLICATION_RUN_ID" =~ ^[1-9][0-9]*$ \
              || ! "$RECOVERY_PUBLICATION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo 'recovery publication run identity is invalid' >&2
              exit 1
            fi
            publication_run_id=$RECOVERY_PUBLICATION_RUN_ID
            publication_run_attempt=$RECOVERY_PUBLICATION_RUN_ATTEMPT
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$publication_run_id/attempts/$publication_run_attempt" \
              > publication-run.json
            jq -e \
              --arg tag "$TAG" \
              --arg revision "$tag_sha" \
              --argjson run_id "$publication_run_id" \
              --argjson run_attempt "$publication_run_attempt" '
                .id == $run_id
                and .run_attempt == $run_attempt
                and .event == "release"
                and .status == "completed"
                and (.conclusion == "success" or .conclusion == "failure")
                and .head_branch == $tag
                and .head_sha == $revision
                and .path == ".github/workflows/stasis-publish-npm.yml"
                and .name == "Publish @oxhq/stasis stable"
                and .repository.full_name == "oxhq/stasis"
                and .head_repository.full_name == "oxhq/stasis"
              ' publication-run.json > /dev/null
          fi
          test "$(git rev-parse HEAD)" = "$tag_sha"

          cargo_version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("ports/stasis/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          sdk_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("sdk/typescript/package.json", "utf8")).version')
          version=${TAG#v}
          if [[ "$version" != '0.3.0' || "$cargo_version" != "$version" || "$sdk_version" != "$version" ]]; then
            echo 'native, SDK, and release tag versions do not match exact 0.3.0' >&2
            exit 1
          fi
          bundle="stasis-${version}-${STASIS_PLATFORM}"
          expected_assets=$(jq -cn --arg version "$version" '
            ["macos-aarch64", "linux-x86_64"]
            | map(
                "stasis-\($version)-\(.).tar.gz" as $archive
                | [
                    $archive,
                    ($archive + ".sha256"),
                    ($archive | sub("\\.tar\\.gz$"; ".binary.sha256")),
                    ($archive | sub("\\.tar\\.gz$"; "-act-settle-inspect.json"))
                  ]
              )
            | add + ["stasis-\($version)-runtime-manifest.json"]
            | sort
          ')
          jq -e --argjson expected "$expected_assets" '
            ([.assets[].name] | sort) == $expected
          ' release.json > /dev/null
          {
            echo "STASIS_VERSION=$version"
            echo "STASIS_REVISION=$tag_sha"
            echo "STASIS_BUNDLE=$bundle"
            echo "STASIS_ARCHIVE=${bundle}.tar.gz"
            echo "STASIS_BINARY_SHA256=${bundle}.binary.sha256"
            echo "STASIS_GATE_PROOF=${bundle}-act-settle-inspect.json"
          } >> "$GITHUB_ENV"
          release_id=$(jq -er '.id | select(type == "number" and . > 0)' release.json)
          {
            echo "publication_run_id=$publication_run_id"
            echo "publication_run_attempt=$publication_run_attempt"
            echo "release_id=$release_id"
            echo "version=$version"
            echo "revision=$tag_sha"
          } >> "$GITHUB_OUTPUT"

      - id: inputs
        name: Download and verify native and SDK package-run inputs
        shell: bash
        env:
          TAG: ${{ env.STASIS_RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/macos-aarch64 release-assets/linux-x86_64 \
            gate-proof/macos-aarch64 gate-proof/linux-x86_64 runtime-manifest
          for platform in macos-aarch64 linux-x86_64; do
            bundle="stasis-${STASIS_VERSION}-${platform}"
            archive="${bundle}.tar.gz"
            proof="${bundle}-act-settle-inspect.json"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "release-assets/$platform" \
              --pattern "$archive" \
              --pattern "$archive.sha256" \
              --pattern "${bundle}.binary.sha256"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "gate-proof/$platform" \
              --pattern "$proof"
            if [[ "$platform" == "$STASIS_PLATFORM" ]]; then
              python3 etc/ci/stasis/release_archive.py verify \
                --asset-directory "release-assets/$platform" \
                --version "$STASIS_VERSION" \
                --platform "$platform" \
                --revision "$STASIS_REVISION" \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --source-root . \
                --extract-to "$RUNNER_TEMP/stasis-published-release"
            else
              python3 etc/ci/stasis/release_archive.py verify \
                --asset-directory "release-assets/$platform" \
                --version "$STASIS_VERSION" \
                --platform "$platform" \
                --revision "$STASIS_REVISION" \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --source-root .
            fi
          done
          runtime_manifest="runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir runtime-manifest \
            --pattern "$(basename "$runtime_manifest")"
          node sdk/typescript/scripts/generate-runtime-manifest.mjs \
            --input "$runtime_manifest" \
            --output sdk/typescript/src/runtime-manifest.generated.ts

          read -r macos_run_id macos_claim_attempt linux_run_id linux_claim_attempt < <(
            python3 - <<'PY'
          import json
          import math
          import os
          import pathlib
          import re

          def reject_duplicate_members(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          claims = []
          version = os.environ["STASIS_VERSION"]
          for platform in ("macos-aarch64", "linux-x86_64"):
              proof = pathlib.Path(
                  "gate-proof",
                  platform,
                  f"stasis-{version}-{platform}-act-settle-inspect.json",
              )
              try:
                  document = json.loads(
                      proof.read_text(encoding="utf-8"),
                      object_pairs_hook=reject_duplicate_members,
                      parse_float=lambda value: (
                          parsed
                          if math.isfinite(parsed := float(value))
                          else (_ for _ in ()).throw(ValueError(f"non-finite number {value!r}"))
                      ),
                      parse_constant=lambda value: (_ for _ in ()).throw(
                          ValueError(f"non-finite number {value!r}")
                      ),
                  )
              except (OSError, UnicodeError, ValueError, RecursionError) as error:
                  raise SystemExit(f"cannot read strict {platform} gate proof: {error}") from error
              if not isinstance(document, dict):
                  raise SystemExit(f"{platform} gate proof is not an object")
              run_id = document.get("workflowRunId")
              run_attempt = document.get("workflowRunAttempt")
              if (
                  not isinstance(run_id, str)
                  or re.fullmatch(r"[1-9][0-9]*", run_id) is None
                  or not isinstance(run_attempt, str)
                  or re.fullmatch(r"[1-9][0-9]*", run_attempt) is None
              ):
                  raise SystemExit(f"{platform} gate proof has an invalid producer identity")
              claims.extend((run_id, run_attempt))
          print(*claims)
          PY
          )
          if [[ "$macos_run_id" != "$linux_run_id" ]]; then
            echo 'native gate proofs do not share one package workflow run' >&2
            exit 1
          fi
          package_run_id=$macos_run_id
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$package_run_id" > package-run.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$package_run_id/artifacts?per_page=100" \
            > package-artifact-pages.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$package_run_id/jobs?filter=all&per_page=100" \
            > package-job-pages.json
          read -r overall_run_attempt macos_run_attempt linux_run_attempt sdk_run_attempt attest_run_attempt < <(
            PACKAGE_RUN_ID="$package_run_id" \
              MACOS_CLAIM_ATTEMPT="$macos_claim_attempt" \
              LINUX_CLAIM_ATTEMPT="$linux_claim_attempt" \
              python3 - <<'PY'
          import json
          import math
          import os
          import re

          package_run_id_text = os.environ["PACKAGE_RUN_ID"]
          package_run_id = int(package_run_id_text)
          revision = os.environ["STASIS_REVISION"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          claimed_attempts = {
              "macos-aarch64": int(os.environ["MACOS_CLAIM_ATTEMPT"]),
              "linux-x86_64": int(os.environ["LINUX_CLAIM_ATTEMPT"]),
          }

          def reject_duplicate_members(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def load_strict(filename, context):
              try:
                  with open(filename, encoding="utf-8") as source:
                      return json.load(
                          source,
                          object_pairs_hook=reject_duplicate_members,
                          parse_float=lambda value: (
                              parsed
                              if math.isfinite(parsed := float(value))
                              else (_ for _ in ()).throw(
                                  ValueError(f"non-finite number {value!r}")
                              )
                          ),
                          parse_constant=lambda value: (_ for _ in ()).throw(
                              ValueError(f"non-finite number {value!r}")
                          ),
                      )
              except (OSError, UnicodeError, ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          run = load_strict("package-run.json", "package run response")
          repository = run.get("repository") if isinstance(run, dict) else None
          head_repository = run.get("head_repository") if isinstance(run, dict) else None
          overall_attempt = run.get("run_attempt") if isinstance(run, dict) else None
          if (
              not isinstance(run, dict)
              or run.get("id") != package_run_id
              or not isinstance(repository, dict)
              or repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]
              or not isinstance(head_repository, dict)
              or head_repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]
              or run.get("name") != "Stasis package and promote"
              or run.get("path") != ".github/workflows/stasis-package.yml"
              or run.get("event") != "push"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("head_sha") != revision
              or run.get("head_branch") != default_branch
              or type(overall_attempt) is not int
              or overall_attempt < 1
          ):
              raise SystemExit("package workflow run identity is invalid")

          def flatten_pages(filename, key):
              pages = load_strict(filename, f"{key} pagination response")
              if not isinstance(pages, list) or not pages:
                  raise SystemExit(f"{key} pagination response is malformed")
              entries = []
              totals = set()
              for page in pages:
                  if not isinstance(page, dict) or type(page.get("total_count")) is not int:
                      raise SystemExit(f"{key} pagination response is malformed")
                  values = page.get(key)
                  if not isinstance(values, list):
                      raise SystemExit(f"{key} pagination response is malformed")
                  totals.add(page["total_count"])
                  entries.extend(values)
              if len(totals) != 1 or totals.pop() != len(entries):
                  raise SystemExit(f"{key} pagination response is incomplete")
              identifiers = [entry.get("id") for entry in entries if isinstance(entry, dict)]
              if len(identifiers) != len(entries) or any(type(value) is not int for value in identifiers):
                  raise SystemExit(f"{key} identity is malformed")
              if len(set(identifiers)) != len(identifiers):
                  raise SystemExit(f"{key} pagination response contains duplicates")
              return entries

          artifacts = flatten_pages("package-artifact-pages.json", "artifacts")
          jobs = flatten_pages("package-job-pages.json", "jobs")
          prefixes = (
              "stasis-macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof",
              "stasis-linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof",
              "stasis-runtime-manifest",
              "stasis-typescript",
              # Windows artifacts prove the CI-only platform boundary and never become release,
              # provenance, runtime-manifest, or managed npm inputs. Linux crash diagnostics are
              # likewise evidence-only and never publication inputs.
              "stasis-windows-x86_64-ci",
              "stasis-windows-x86_64-ci-logs",
              "stasis-linux-crash-diagnostics",
          )
          patterns = tuple(
              (prefix, re.compile(rf"^{re.escape(prefix)}-attempt-([1-9][0-9]*)$"))
              for prefix in prefixes
          )
          prefix_groups = {
              "stasis-macos-aarch64": "macos-aarch64",
              "stasis-macos-aarch64-act-settle-inspect-proof": "macos-aarch64",
              "stasis-linux-x86_64": "linux-x86_64",
              "stasis-linux-x86_64-act-settle-inspect-proof": "linux-x86_64",
              "stasis-runtime-manifest": "sdk",
              "stasis-typescript": "sdk",
          }
          permitted_ci_only_prefixes = {
              "stasis-windows-x86_64-ci",
              "stasis-windows-x86_64-ci-logs",
              "stasis-linux-crash-diagnostics",
          }
          if (
              len(prefixes) != len(set(prefixes))
              or set(prefixes) != set(prefix_groups) | permitted_ci_only_prefixes
              or set(prefix_groups) & permitted_ci_only_prefixes
          ):
              raise SystemExit("npm package artifact prefix classifier is inconsistent")
          by_group_attempt = {group: {} for group in set(prefix_groups.values())}
          seen_artifact_names = set()
          for artifact in artifacts:
              expired = artifact.get("expired")
              workflow_run = artifact.get("workflow_run")
              if (
                  type(expired) is not bool
                  or not isinstance(workflow_run, dict)
                  or workflow_run.get("id") != package_run_id
                  or workflow_run.get("head_sha") != revision
                  or workflow_run.get("head_branch") != default_branch
              ):
                  raise SystemExit("package artifact identity is malformed")
              name = artifact.get("name")
              if not isinstance(name, str):
                  raise SystemExit("package artifact name is malformed")
              if name in seen_artifact_names:
                  raise SystemExit("package artifact name is duplicated")
              seen_artifact_names.add(name)
              matched = next(
                  ((prefix, match) for prefix, pattern in patterns if (match := pattern.fullmatch(name))),
                  None,
              )
              if matched is None:
                  raise SystemExit(f"unexpected active package artifact: {name!r}")
              attempt = int(matched[1].group(1))
              if attempt > overall_attempt:
                  raise SystemExit("package artifact claims a future run attempt")
              if expired:
                  continue
              if matched[0] in permitted_ci_only_prefixes:
                  continue
              group = prefix_groups[matched[0]]
              by_group_attempt[group].setdefault(attempt, []).append(name)

          producer_names = {
              "macos-aarch64": "Package and gate macos-aarch64",
              "linux-x86_64": "Package and gate linux-x86_64",
              "sdk": "Bind both native runtimes and gate the TypeScript package",
              "attest": "Attest exact credential-free package outputs",
          }
          producer_jobs = {name: {} for name in producer_names.values()}
          seen_jobs = set()
          for job in jobs:
              name = job.get("name")
              if name not in producer_names.values():
                  continue
              attempt = job.get("run_attempt")
              identity = (attempt, name)
              if (
                  type(attempt) is not int
                  or attempt < 1
                  or attempt > overall_attempt
                  or job.get("run_id") != package_run_id
                  or job.get("head_sha") != revision
                  or identity in seen_jobs
              ):
                  raise SystemExit("package producer job identity is malformed or ambiguous")
              seen_jobs.add(identity)
              producer_jobs[name][attempt] = (job.get("status"), job.get("conclusion"))

          group_prefixes = {
              "macos-aarch64": (
                  "stasis-macos-aarch64",
                  "stasis-macos-aarch64-act-settle-inspect-proof",
              ),
              "linux-x86_64": (
                  "stasis-linux-x86_64",
                  "stasis-linux-x86_64-act-settle-inspect-proof",
              ),
              "sdk": ("stasis-runtime-manifest", "stasis-typescript"),
          }
          selected = {}
          for group, expected_prefixes in group_prefixes.items():
              attempts = producer_jobs[producer_names[group]]
              if not attempts:
                  raise SystemExit(f"no {group} producer job exists")
              artifact_attempts = by_group_attempt[group]
              if not artifact_attempts:
                  raise SystemExit(f"no {group} producer artifacts exist")
              # A rerun-failed operation can carry a successful job into the new attempt without
              # rerunning it or renaming its immutable artifacts. Older failed upload attempts are
              # non-authoritative; the newest artifact-bearing attempt must be both complete and
              # bound to its exact successful producer.
              producer_attempt = max(artifact_attempts)
              expected = sorted(
                  f"{prefix}-attempt-{producer_attempt}" for prefix in expected_prefixes
              )
              if sorted(artifact_attempts[producer_attempt]) != expected:
                  raise SystemExit(f"{group} producer artifacts are incomplete")
              if attempts.get(producer_attempt) != ("completed", "success"):
                  raise SystemExit(
                      f"{group} artifacts do not have an exact successful producer"
                  )
              selected[group] = producer_attempt

          for platform, claimed_attempt in claimed_attempts.items():
              if selected[platform] != claimed_attempt:
                  raise SystemExit(f"published {platform} proof does not name the selected producer")
          if (
              selected["macos-aarch64"] > selected["sdk"]
              or selected["linux-x86_64"] > selected["sdk"]
          ):
              raise SystemExit("selected SDK producer predates a selected native producer")
          attest_attempts = producer_jobs[producer_names["attest"]]
          if not attest_attempts:
              raise SystemExit("no package attestation producer job exists")
          attest_attempt = max(attest_attempts)
          if attest_attempts[attest_attempt] != ("completed", "success"):
              raise SystemExit("latest package attestation producer job did not succeed")
          if max(selected.values()) > attest_attempt:
              raise SystemExit("selected package attestation predates a selected producer")
          print(
              overall_attempt,
              selected["macos-aarch64"],
              selected["linux-x86_64"],
              selected["sdk"],
              attest_attempt,
          )
          PY
          )
          if [[ ! "$overall_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$macos_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$linux_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$sdk_run_attempt" =~ ^[1-9][0-9]*$ \
            || ! "$attest_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'selected package producer attempts are invalid' >&2
            exit 1
          fi
          for platform in macos-aarch64 linux-x86_64; do
            if [[ "$platform" == 'macos-aarch64' ]]; then
              producer_attempt=$macos_run_attempt
            else
              producer_attempt=$linux_run_attempt
            fi
            python3 etc/ci/stasis/release_archive.py verify-gate-proof \
              --proof-directory "gate-proof/$platform" \
              --asset-directory "release-assets/$platform" \
              --version "$STASIS_VERSION" \
              --platform "$platform" \
              --revision "$STASIS_REVISION" \
              --run-id "$package_run_id" \
              --run-attempt "$producer_attempt"
          done
          binary_sha256=$(awk '{print $1}' \
            "release-assets/macos-aarch64/$STASIS_BINARY_SHA256")
          test "$binary_sha256" = "$(jq -er '.binary.sha256' \
            "gate-proof/macos-aarch64/$STASIS_GATE_PROOF")"
          sdk_artifact="stasis-typescript-attempt-$sdk_run_attempt"
          manifest_artifact="stasis-runtime-manifest-attempt-$sdk_run_attempt"
          gh run download "$package_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$sdk_artifact" --dir pregated-sdk
          gh run download "$package_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$manifest_artifact" --dir package-runtime-manifest
          cmp "$runtime_manifest" \
            "package-runtime-manifest/stasis-${STASIS_VERSION}-runtime-manifest.json"
          python3 etc/ci/stasis/npm_release.py verify-proof \
            --directory pregated-sdk \
            --version "$STASIS_VERSION" \
            --revision "$STASIS_REVISION" \
            --native-binary-sha256 "$binary_sha256" \
            --run-id "$package_run_id" \
            --run-attempt "$sdk_run_attempt"
          provenance_subjects=(
            release-assets/*/*
            gate-proof/*/*
            runtime-manifest/*
            pregated-sdk/*
          )
          test "${#provenance_subjects[@]}" -eq 11
          provenance_json="$RUNNER_TEMP/stasis-publish-input-provenance.json"
          gh attestation verify "${provenance_subjects[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
            --source-digest "$STASIS_REVISION" \
            --source-ref "refs/heads/$DEFAULT_BRANCH" \
            --deny-self-hosted-runners \
            --limit 100 \
            --format json > "$provenance_json"
          provenance_verifier=(
            python3 etc/ci/stasis/verify_build_provenance.py verify
            --verification-json "$provenance_json"
            --repository "$GITHUB_REPOSITORY"
            --workflow .github/workflows/stasis-package.yml
            --revision "$STASIS_REVISION"
            --source-ref "refs/heads/$DEFAULT_BRANCH"
            --server-url "$GITHUB_SERVER_URL"
            --run-id "$package_run_id"
            --run-attempt "$attest_run_attempt"
            --expected-subject-count 11
          )
          for provenance_subject in "${provenance_subjects[@]}"; do
            provenance_verifier+=(--subject "$provenance_subject")
          done
          "${provenance_verifier[@]}"
          {
            echo "NPM_TARBALL=$GITHUB_WORKSPACE/pregated-sdk/oxhq-stasis-${STASIS_VERSION}.tgz"
            echo "PACKAGE_RUN_ID=$package_run_id"
            echo "MACOS_RUN_ATTEMPT=$macos_run_attempt"
            echo "LINUX_RUN_ATTEMPT=$linux_run_attempt"
            echo "SDK_RUN_ATTEMPT=$sdk_run_attempt"
            echo "ATTEST_RUN_ATTEMPT=$attest_run_attempt"
            echo "STASIS_NATIVE_BINARY_SHA256=$binary_sha256"
          } >> "$GITHUB_ENV"
          {
            echo "package_run_id=$package_run_id"
            echo "macos_run_attempt=$macos_run_attempt"
            echo "linux_run_attempt=$linux_run_attempt"
            echo "sdk_run_attempt=$sdk_run_attempt"
            echo "attest_run_attempt=$attest_run_attempt"
            echo "native_binary_sha256=$binary_sha256"
            echo "staged_artifact_name=verified-stasis-npm-package-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Activate pinned npm and pnpm clients
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --registry="$NPM_CONFIG_REGISTRY"
          test "$(npm --version)" = '11.19.0'
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'

      - name: Install, typecheck, test, build, and reproduce the SDK pack
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          mkdir "$RUNNER_TEMP/stasis-npm-rebuild"
          pnpm pack --pack-destination "$RUNNER_TEMP/stasis-npm-rebuild"
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/stasis-npm-rebuild/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "pnpm pack produced ${#packages[@]} tarballs, expected exactly one" >&2
            exit 1
          fi
          expected_name="oxhq-stasis-${STASIS_VERSION}.tgz"
          test "$(basename "${packages[0]}")" = "$expected_name"
          cmp "${packages[0]}" "$NPM_TARBALL"

      - id: prepublish_gate
        name: Non-skippable packed-SDK act-settle-inspect gate
        shell: bash
        run: |
          set -euo pipefail
          prepublish_run_attempt=$GITHUB_RUN_ATTEMPT
          if [[ ! "$prepublish_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'prepublish producer run attempt is invalid' >&2
            exit 1
          fi
          consumer="$RUNNER_TEMP/stasis-packed-sdk-consumer"
          mkdir "$consumer"
          (
            cd "$consumer"
            pnpm init
            pnpm add --ignore-scripts "$NPM_TARBALL"
          )
          gate_log="$RUNNER_TEMP/stasis-prepublish-sdk-gate.log"
          staged_gate_log="pregated-sdk/stasis-${STASIS_VERSION}-typescript-prepublish-act-settle-inspect.log"
          staged_gate_proof="pregated-sdk/stasis-${STASIS_VERSION}-typescript-prepublish-act-settle-inspect.json"
          node etc/ci/stasis/verify_registry_sdk.mjs \
            --binary "$RUNNER_TEMP/stasis-published-release/$STASIS_BUNDLE/stasis" \
            --fixture ports/stasis/tests/fixtures/timer_10s.html \
            --session-v2-fixture ports/stasis/tests/fixtures/message_channel_buffered.html \
            --session-v2-image-fixture ports/stasis/tests/fixtures/controlled_v2_image_data_svg.html \
            --session-v2-http-image-fixture ports/stasis/tests/fixtures/controlled_v2_image_http.html \
            --session-v2-inline-svg-fixture ports/stasis/tests/fixtures/controlled_v2_inline_svg.html \
            --session-v2-inline-svg-shared-pending-fixture ports/stasis/tests/fixtures/controlled_v2_inline_svg_shared_pending.html \
            --session-v2-settlement-url-fixture ports/stasis/tests/fixtures/controlled_v2_settlement_url.html \
            --session-v2-interval-before-finite-fixture ports/stasis/tests/fixtures/controlled_v2_interval_before_finite.html \
            --session-v2-focus-fixture ports/stasis/tests/fixtures/input_method_focus_timestamp.html \
            --session-v2-automation-event-fixture ports/stasis/tests/fixtures/controlled_v2_form_event_timestamp.html \
            --session-v2-css-animation-event-fixture ports/stasis/tests/fixtures/controlled_v2_css_animation_event_timestamp.html \
            --session-v2-cookie-fixture sdk/typescript/test/fixtures/controlled-v2-cookie-login.html \
            --consumer-root "$consumer" \
            --package "$NPM_TARBALL" \
            --revision "$STASIS_REVISION" \
            --version "$STASIS_VERSION" \
            2>&1 | tee "$gate_log"
          cp sdk/typescript/test/fixtures/public-package-north-star.mjs \
            "$consumer/public-package-north-star.mjs"
          cp sdk/typescript/test/fixtures/north-star.html "$consumer/north-star.html"
          cp sdk/typescript/test/fixtures/public-package-session-north-star.mjs \
            "$consumer/public-package-session-north-star.mjs"
          cp -R sdk/typescript/test/fixtures/session-north-star \
            "$consumer/session-north-star"
          v1_north_star_log="$RUNNER_TEMP/stasis-prepublish-v1-north-star.jsonl"
          (
            cd "$consumer"
            unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN \
              STASIS_NORTH_STAR_BINARY STASIS_SESSION_NORTH_STAR_BINARY
            node ./public-package-north-star.mjs
          ) 2>&1 | tee "$v1_north_star_log"
          grep -F '"proof":"stasis-v0.1-north-star"' "$v1_north_star_log"
          grep -F '"runs":3' "$v1_north_star_log"
          explicit_runtime_cache="$RUNNER_TEMP/stasis-prepublish-explicit-runtime-cache"
          mkdir "$explicit_runtime_cache"
          v2_north_star_log="$RUNNER_TEMP/stasis-prepublish-v2-session-north-star.jsonl"
          (
            cd "$consumer"
            unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN \
              STASIS_NORTH_STAR_BINARY STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE
            export STASIS_SESSION_NORTH_STAR_BINARY="$RUNNER_TEMP/stasis-published-release/$STASIS_BUNDLE/stasis"
            export STASIS_SESSION_NORTH_STAR_RUNTIME_CACHE="$explicit_runtime_cache"
            node ./public-package-session-north-star.mjs
          ) 2>&1 | tee "$v2_north_star_log"
          grep -F '"proof":"stasis-v0.2-session-north-star"' "$v2_north_star_log"
          grep -F '"runs":3' "$v2_north_star_log"
          grep -F '"sessions":6' "$v2_north_star_log"
          grep -F '"runtimeAcquisition":"explicit-executable-override-cache-bypassed"' \
            "$v2_north_star_log"
          cat "$v1_north_star_log" "$v2_north_star_log" >> "$gate_log"
          cp "$gate_log" "$staged_gate_log"
          python3 etc/ci/stasis/npm_release.py create-proof \
            --package "$NPM_TARBALL" \
            --gate-log "$gate_log" \
            --output "$staged_gate_proof" \
            --version "$STASIS_VERSION" \
            --revision "$STASIS_REVISION" \
            --native-binary-sha256 "$STASIS_NATIVE_BINARY_SHA256" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$prepublish_run_attempt"
          echo "run_attempt=$prepublish_run_attempt" >> "$GITHUB_OUTPUT"

      - name: Stage only the exact attested and pre-gated npm inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.inputs.outputs.staged_artifact_name }}
          path: |
            pregated-sdk/oxhq-stasis-${{ env.STASIS_VERSION }}.tgz
            pregated-sdk/stasis-${{ env.STASIS_VERSION }}-typescript-act-settle-inspect.json
            pregated-sdk/stasis-${{ env.STASIS_VERSION }}-typescript-prepublish-act-settle-inspect.json
            pregated-sdk/stasis-${{ env.STASIS_VERSION }}-typescript-prepublish-act-settle-inspect.log
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the exact pre-gated SDK
    needs: verify
    if: needs.verify.result == 'success' && github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: npm
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      ATTEST_RUN_ATTEMPT: ${{ needs.verify.outputs.attest_run_attempt }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      LINUX_RUN_ATTEMPT: ${{ needs.verify.outputs.linux_run_attempt }}
      MACOS_RUN_ATTEMPT: ${{ needs.verify.outputs.macos_run_attempt }}
      NPM_CONFIG_PROVENANCE: "true"
      PACKAGE_RUN_ID: ${{ needs.verify.outputs.package_run_id }}
      PREPUBLISH_RUN_ATTEMPT: ${{ needs.verify.outputs.prepublish_run_attempt }}
      RELEASE_ID: ${{ needs.verify.outputs.release_id }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      STASIS_NATIVE_BINARY_SHA256: ${{ needs.verify.outputs.native_binary_sha256 }}
      STASIS_REVISION: ${{ needs.verify.outputs.revision }}
      STASIS_VERSION: ${{ needs.verify.outputs.version }}
      SDK_RUN_ATTEMPT: ${{ needs.verify.outputs.sdk_run_attempt }}
    steps:
      - name: Recheck the exact published stable release and lightweight tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'release event has no valid immutable release ID' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$STASIS_VERSION" ]]; then
            echo 'release tag changed from the verified package version' >&2
            exit 1
          fi

          release_by_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          release_by_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          for release in "$release_by_id" "$release_by_tag"; do
            jq -e \
              --argjson release_id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" '
                .id == $release_id
                and .tag_name == $tag
                and .draft == false
                and .prerelease == false
                and .immutable == true
                and (.published_at | type == "string" and length > 0)
              ' <<< "$release" > /dev/null
          done

          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || "$tag_sha" != "$STASIS_REVISION" ]]; then
            echo "$RELEASE_TAG is not a lightweight tag at $STASIS_REVISION" >&2
            exit 1
          fi

      - name: Set up supported trusted-publishing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the SDK staged by the credential-free gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify.outputs.staged_artifact_name }}
          path: verified-sdk

      - name: Recheck exact package identity without repository code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import os
          import pathlib
          import posixpath
          import re
          import tarfile
          import tempfile
          import zlib

          max_tarball_bytes = 32 * 1024 * 1024
          max_member_bytes = 16 * 1024 * 1024
          max_total_member_bytes = 64 * 1024 * 1024
          max_tar_members = 256
          max_expanded_tar_bytes = max_total_member_bytes + 4 * 1024 * 1024
          stream_chunk_bytes = 1024 * 1024
          install_hooks = {
              "preinstall", "install", "postinstall", "prepublish",
              "preprepare", "prepare", "postprepare",
          }
          windows_reserved = {
              "con", "prn", "aux", "nul",
              *(f"com{number}" for number in range(1, 10)),
              *(f"lpt{number}" for number in range(1, 10)),
          }
          windows_forbidden = set('<>:"\\|?*')

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(source_bytes, context):
              if isinstance(source_bytes, bytes):
                  try:
                      source_bytes = source_bytes.decode("utf-8")
                  except UnicodeError as error:
                      raise SystemExit(f"{context} is not UTF-8: {error}") from error
              try:
                  return json.loads(
                      source_bytes,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          def exact_tarball_binding(value, expected):
              return (
                  isinstance(value, dict)
                  and set(value) == {"name", "sha256", "integrity"}
                  and all(
                      isinstance(value.get(field), str)
                      for field in ("name", "sha256", "integrity")
                  )
                  and value == expected
              )

