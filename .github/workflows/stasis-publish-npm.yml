name: Publish @oxhq/stasis alpha

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: stasis-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  STASIS_PLATFORM: macos-aarch64

jobs:
  verify:
    name: Verify native release and pre-gate exact SDK
    if: |
      github.repository == 'oxhq/stasis'
        && github.event.release.draft == false
        && github.event.release.prerelease == true
        && github.event.release.tag_name == 'v0.1.0-alpha.0'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      native_binary_sha256: ${{ steps.inputs.outputs.native_binary_sha256 }}
      package_run_attempt: ${{ steps.inputs.outputs.package_run_attempt }}
      package_run_id: ${{ steps.inputs.outputs.package_run_id }}
      prepublish_run_attempt: ${{ steps.prepublish_gate.outputs.run_attempt }}
      revision: ${{ steps.release.outputs.revision }}
      staged_artifact_name: ${{ steps.inputs.outputs.staged_artifact_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Require space for bounded native archive verification
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 4194304

      - name: Set up Node without publication credentials
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - id: release
        name: Verify exact release, tag, commit, and asset inventory
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          test "$(sysctl -n hw.optional.arm64)" = '1'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -e --arg tag "$TAG" '
            .tag_name == $tag
            and .draft == false
            and .prerelease == true
            and .immutable == true
          ' release.json > /dev/null
          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "$TAG is not an exact lightweight commit tag" >&2
            exit 1
          fi
          test "$tag_sha" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$tag_sha"

          cargo_version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("ports/stasis/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')
          sdk_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("sdk/typescript/package.json", "utf8")).version')
          version=${TAG#v}
          if [[ "$version" != '0.1.0-alpha.0' || "$cargo_version" != "$version" || "$sdk_version" != "$version" ]]; then
            echo 'native, SDK, and release tag versions do not match the first alpha' >&2
            exit 1
          fi
          bundle="stasis-${version}-${STASIS_PLATFORM}"
          expected_assets=$(jq -cn --arg archive "${bundle}.tar.gz" --arg proof "${bundle}-act-settle-inspect.json" \
            '[$archive, ($archive + ".sha256"), ($archive | sub("\\.tar\\.gz$"; ".binary.sha256")), $proof] | sort')
          jq -e --argjson expected "$expected_assets" '
            ([.assets[].name] | sort) == $expected
          ' release.json > /dev/null
          {
            echo "STASIS_VERSION=$version"
            echo "STASIS_REVISION=$tag_sha"
            echo "STASIS_BUNDLE=$bundle"
            echo "STASIS_ARCHIVE=${bundle}.tar.gz"
            echo "STASIS_BINARY_SHA256=${bundle}.binary.sha256"
            echo "STASIS_GATE_PROOF=${bundle}-act-settle-inspect.json"
          } >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "revision=$tag_sha"
          } >> "$GITHUB_OUTPUT"

      - id: inputs
        name: Download and verify native and SDK package-run inputs
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir release-assets gate-proof
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "$STASIS_ARCHIVE" \
            --pattern "$STASIS_ARCHIVE.sha256" \
            --pattern "$STASIS_BINARY_SHA256"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir gate-proof \
            --pattern "$STASIS_GATE_PROOF"
          python3 etc/ci/stasis/release_archive.py verify \
            --asset-directory release-assets \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$STASIS_REVISION" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root . \
            --extract-to "$RUNNER_TEMP/stasis-published-release"
          proof_run_id=$(jq -er '.workflowRunId' "gate-proof/$STASIS_GATE_PROOF")
          proof_run_attempt=$(jq -er '.workflowRunAttempt' "gate-proof/$STASIS_GATE_PROOF")
          python3 etc/ci/stasis/release_archive.py verify-gate-proof \
            --proof-directory gate-proof \
            --asset-directory release-assets \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$STASIS_REVISION" \
            --run-id "$proof_run_id" \
            --run-attempt "$proof_run_attempt"
          for release_asset in release-assets/* gate-proof/*; do
            gh attestation verify "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
              --source-digest "$STASIS_REVISION" \
              --source-ref "refs/heads/$DEFAULT_BRANCH" \
              --deny-self-hosted-runners
          done

          binary_sha256=$(awk '{print $1}' "release-assets/$STASIS_BINARY_SHA256")
          test "$binary_sha256" = "$(jq -er '.binary.sha256' "gate-proof/$STASIS_GATE_PROOF")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$proof_run_id" > package-run.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$STASIS_REVISION" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --argjson attempt "$proof_run_attempt" '
              .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .name == "Stasis package and promote"
              and .path == ".github/workflows/stasis-package.yml"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and .head_sha == $revision
              and .head_branch == $default_branch
              and .run_attempt >= $attempt
            ' package-run.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$proof_run_id/artifacts?per_page=100" > package-artifacts.json
          jq -e --argjson run_id "$proof_run_id" --arg attempt "$proof_run_attempt" '
            .artifacts as $artifacts
            | [
              "stasis-macos-aarch64-attempt-\($attempt)",
              "stasis-macos-aarch64-act-settle-inspect-proof-attempt-\($attempt)",
              "stasis-typescript-alpha-attempt-\($attempt)"
            ] as $expected
            | .total_count == ($artifacts | length)
            and ([$artifacts[].name | select(endswith("-attempt-\($attempt)"))] | sort) == ($expected | sort)
            and all($expected[]; . as $name |
              ([$artifacts[] | select(
                .name == $name and .expired == false and .workflow_run.id == $run_id
              )] | length) == 1
            )
          ' package-artifacts.json > /dev/null
          sdk_artifact="stasis-typescript-alpha-attempt-$proof_run_attempt"
          gh run download "$proof_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$sdk_artifact" --dir pregated-sdk
          python3 etc/ci/stasis/npm_release.py verify-proof \
            --directory pregated-sdk \
            --version "$STASIS_VERSION" \
            --revision "$STASIS_REVISION" \
            --native-binary-sha256 "$binary_sha256" \
            --run-id "$proof_run_id" \
            --run-attempt "$proof_run_attempt"
          for sdk_asset in pregated-sdk/*; do
            gh attestation verify "$sdk_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
              --source-digest "$STASIS_REVISION" \
              --source-ref "refs/heads/$DEFAULT_BRANCH" \
              --deny-self-hosted-runners
          done
          {
            echo "NPM_TARBALL=$GITHUB_WORKSPACE/pregated-sdk/oxhq-stasis-${STASIS_VERSION}.tgz"
            echo "PACKAGE_RUN_ID=$proof_run_id"
            echo "PACKAGE_RUN_ATTEMPT=$proof_run_attempt"
            echo "STASIS_NATIVE_BINARY_SHA256=$binary_sha256"
          } >> "$GITHUB_ENV"
          {
            echo "package_run_id=$proof_run_id"
            echo "package_run_attempt=$proof_run_attempt"
            echo "native_binary_sha256=$binary_sha256"
            echo "staged_artifact_name=verified-stasis-npm-package-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Activate pinned npm and pnpm clients
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --registry="$NPM_CONFIG_REGISTRY"
          test "$(npm --version)" = '11.19.0'
          corepack enable pnpm
          corepack prepare pnpm@9.12.3 --activate
          test "$(pnpm --version)" = '9.12.3'

      - name: Install, typecheck, test, build, and reproduce the SDK pack
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          mkdir "$RUNNER_TEMP/stasis-npm-rebuild"
          pnpm pack --pack-destination "$RUNNER_TEMP/stasis-npm-rebuild"
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/stasis-npm-rebuild/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "pnpm pack produced ${#packages[@]} tarballs, expected exactly one" >&2
            exit 1
          fi
          expected_name="oxhq-stasis-${STASIS_VERSION}.tgz"
          test "$(basename "${packages[0]}")" = "$expected_name"
          cmp "${packages[0]}" "$NPM_TARBALL"

      - id: prepublish_gate
        name: Non-skippable packed-SDK act-settle-inspect gate
        shell: bash
        run: |
          set -euo pipefail
          prepublish_run_attempt=$GITHUB_RUN_ATTEMPT
          if [[ ! "$prepublish_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'prepublish producer run attempt is invalid' >&2
            exit 1
          fi
          consumer="$RUNNER_TEMP/stasis-packed-sdk-consumer"
          mkdir "$consumer"
          (
            cd "$consumer"
            pnpm init
            pnpm add --ignore-scripts "$NPM_TARBALL"
          )
          gate_log="$RUNNER_TEMP/stasis-prepublish-sdk-gate.log"
          staged_gate_log="pregated-sdk/stasis-${STASIS_VERSION}-typescript-prepublish-act-settle-inspect.log"
          staged_gate_proof="pregated-sdk/stasis-${STASIS_VERSION}-typescript-prepublish-act-settle-inspect.json"
          node etc/ci/stasis/verify_registry_sdk.mjs \
            --binary "$RUNNER_TEMP/stasis-published-release/$STASIS_BUNDLE/stasis" \
            --fixture ports/stasis/tests/fixtures/timer_10s.html \
            --consumer-root "$consumer" \
            --package "$NPM_TARBALL" \
            --revision "$STASIS_REVISION" \
            --version "$STASIS_VERSION" \
            2>&1 | tee "$gate_log"
          cp "$gate_log" "$staged_gate_log"
          python3 etc/ci/stasis/npm_release.py create-proof \
            --package "$NPM_TARBALL" \
            --gate-log "$gate_log" \
            --output "$staged_gate_proof" \
            --version "$STASIS_VERSION" \
            --revision "$STASIS_REVISION" \
            --native-binary-sha256 "$STASIS_NATIVE_BINARY_SHA256" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$prepublish_run_attempt"
          echo "run_attempt=$prepublish_run_attempt" >> "$GITHUB_OUTPUT"

      - name: Stage only the exact attested and pre-gated npm inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.inputs.outputs.staged_artifact_name }}
          path: |
            pregated-sdk/oxhq-stasis-${{ env.STASIS_VERSION }}.tgz
            pregated-sdk/stasis-${{ env.STASIS_VERSION }}-typescript-act-settle-inspect.json
            pregated-sdk/stasis-${{ env.STASIS_VERSION }}-typescript-prepublish-act-settle-inspect.json
            pregated-sdk/stasis-${{ env.STASIS_VERSION }}-typescript-prepublish-act-settle-inspect.log
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the exact pre-gated SDK
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_PROVENANCE: "true"
      PACKAGE_RUN_ATTEMPT: ${{ needs.verify.outputs.package_run_attempt }}
      PACKAGE_RUN_ID: ${{ needs.verify.outputs.package_run_id }}
      PREPUBLISH_RUN_ATTEMPT: ${{ needs.verify.outputs.prepublish_run_attempt }}
      RELEASE_ID: ${{ github.event.release.id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      STASIS_NATIVE_BINARY_SHA256: ${{ needs.verify.outputs.native_binary_sha256 }}
      STASIS_REVISION: ${{ needs.verify.outputs.revision }}
      STASIS_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Recheck the exact published prerelease and lightweight tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'release event has no valid immutable release ID' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$STASIS_VERSION" ]]; then
            echo 'release tag changed from the verified package version' >&2
            exit 1
          fi

          release_by_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          release_by_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          for release in "$release_by_id" "$release_by_tag"; do
            jq -e \
              --argjson release_id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" '
                .id == $release_id
                and .tag_name == $tag
                and .draft == false
                and .prerelease == true
                and .immutable == true
                and (.published_at | type == "string" and length > 0)
              ' <<< "$release" > /dev/null
          done

          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || "$tag_sha" != "$STASIS_REVISION" ]]; then
            echo "$RELEASE_TAG is not a lightweight tag at $STASIS_REVISION" >&2
            exit 1
          fi

      - name: Set up supported trusted-publishing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the SDK staged by the credential-free gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify.outputs.staged_artifact_name }}
          path: verified-sdk

      - name: Recheck exact package identity without repository code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import os
          import pathlib
          import posixpath
          import re
          import tarfile
          import tempfile
          import zlib

          max_tarball_bytes = 32 * 1024 * 1024
          max_member_bytes = 16 * 1024 * 1024
          max_total_member_bytes = 64 * 1024 * 1024
          max_tar_members = 256
          max_expanded_tar_bytes = max_total_member_bytes + 4 * 1024 * 1024
          stream_chunk_bytes = 1024 * 1024
          install_hooks = {
              "preinstall", "install", "postinstall", "prepublish",
              "preprepare", "prepare", "postprepare",
          }
          windows_reserved = {
              "con", "prn", "aux", "nul",
              *(f"com{number}" for number in range(1, 10)),
              *(f"lpt{number}" for number in range(1, 10)),
          }
          windows_forbidden = set('<>:"\\|?*')

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(source_bytes, context):
              if isinstance(source_bytes, bytes):
                  try:
                      source_bytes = source_bytes.decode("utf-8")
                  except UnicodeError as error:
                      raise SystemExit(f"{context} is not UTF-8: {error}") from error
              try:
                  return json.loads(
                      source_bytes,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          def exact_tarball_binding(value, expected):
              return (
                  isinstance(value, dict)
                  and set(value) == {"name", "sha256", "integrity"}
                  and all(
                      isinstance(value.get(field), str)
                      for field in ("name", "sha256", "integrity")
                  )
                  and value == expected
              )

          def hash_file(filename, algorithm):
              digest = hashlib.new(algorithm)
              with filename.open("rb") as source_file:
                  for chunk in iter(lambda: source_file.read(stream_chunk_bytes), b""):
                      digest.update(chunk)
              return digest

          def canonical_member_path(member):
              name = member.name
              if not name or not name.isascii():
                  raise SystemExit(f"SDK tarball contains a non-ASCII or empty member: {name!r}")
              if member.isdir() and name.endswith("/"):
                  canonical = name[:-1]
                  if not canonical or canonical.endswith("/"):
                      raise SystemExit(f"SDK tarball contains a non-canonical member: {name!r}")
              else:
                  canonical = name
              if (
                  not canonical
                  or canonical.startswith("/")
                  or (name != canonical and name != canonical + "/")
                  or "\\" in canonical
                  or posixpath.normpath(canonical) != canonical
              ):
                  raise SystemExit(f"SDK tarball contains a non-canonical member: {name!r}")
              components = canonical.split("/")
              for component in components:
                  if (
                      not component
                      or component in {".", ".."}
                      or component != component.strip()
                      or component.endswith(".")
                      or any(ord(character) < 32 or ord(character) == 127 for character in component)
                      or windows_forbidden.intersection(component)
                      or component.split(".", 1)[0].lower() in windows_reserved
                  ):
                      raise SystemExit(
                          f"SDK tarball member is not portable across supported filesystems: {name!r}"
                      )
              return canonical, "/".join(component.lower() for component in components)

          def copy_bounded_gzip(package, destination):
              expanded_bytes = 0
              try:
                  with package.open("rb") as source_file:
                      if source_file.read(3) != b"\x1f\x8b\x08":
                          raise SystemExit("SDK tarball is not a gzip stream")
                      source_file.seek(0)
                      decompressor = zlib.decompressobj(wbits=16 + zlib.MAX_WBITS)
                      while chunk := source_file.read(stream_chunk_bytes):
                          pending = chunk
                          while pending:
                              remaining = max_expanded_tar_bytes - expanded_bytes
                              decompressed = decompressor.decompress(
                                  pending, min(stream_chunk_bytes, remaining + 1)
                              )
                              expanded_bytes += len(decompressed)
                              if expanded_bytes > max_expanded_tar_bytes:
                                  raise SystemExit("SDK tarball exceeds the expanded tar-stream limit")
                              destination.write(decompressed)
                              pending = decompressor.unconsumed_tail
                              if decompressor.eof:
                                  break
                          if decompressor.eof:
                              if decompressor.unused_data or source_file.read(1):
                                  raise SystemExit("SDK tarball has trailing data or another gzip member")
                              break
                      flushed = decompressor.flush(
                          min(stream_chunk_bytes, max_expanded_tar_bytes - expanded_bytes + 1)
                      )
                      expanded_bytes += len(flushed)
                      if expanded_bytes > max_expanded_tar_bytes:
                          raise SystemExit("SDK tarball exceeds the expanded tar-stream limit")
                      destination.write(flushed)
                      if not decompressor.eof:
                          raise SystemExit("SDK tarball gzip stream ended before its validated trailer")
              except SystemExit:
                  raise
              except (EOFError, OSError, zlib.error) as error:
                  raise SystemExit(f"SDK tarball is not a valid bounded gzip stream: {error}") from error
              if expanded_bytes == 0:
                  raise SystemExit("SDK tarball expands to an empty tar stream")
              destination.seek(0)

          def verify_sdk_tarball(package, selected_version):
              if package.is_symlink() or not package.is_file():
                  raise SystemExit("SDK tarball is not a regular file")
              package_size = package.stat().st_size
              if package_size <= 0 or package_size > max_tarball_bytes:
                  raise SystemExit("SDK tarball compressed size is outside the release limit")
              file_names = set()
              directory_names = set()
              paths = {}
              metadata_bytes = None
              total_member_bytes = 0
              member_count = 0
              with tempfile.SpooledTemporaryFile(max_size=8 * 1024 * 1024, mode="w+b") as expanded:
                  copy_bounded_gzip(package, expanded)
                  try:
                      with tarfile.open(fileobj=expanded, mode="r:") as archive:
                          for member in archive:
                              member_count += 1
                              if member_count > max_tar_members:
                                  raise SystemExit("SDK tarball exceeds the member-count limit")
                              canonical, collision_key = canonical_member_path(member)
                              if collision_key in paths:
                                  raise SystemExit(
                                      f"SDK tarball contains a cross-platform path collision: "
                                      f"{paths[collision_key][0]!r} and {member.name!r}"
                                  )
                              if not member.isfile() and not member.isdir():
                                  raise SystemExit(f"SDK tarball has an unsupported entry: {member.name!r}")
                              paths[collision_key] = (
                                  canonical, "file" if member.isfile() else "directory"
                              )
                              if member.size < 0 or member.size > max_member_bytes:
                                  raise SystemExit(f"SDK tarball member size is invalid: {member.name!r}")
                              if member.isdir():
                                  if member.size != 0:
                                      raise SystemExit(f"SDK tarball directory has a nonzero size: {member.name!r}")
                                  directory_names.add(canonical)
                                  continue
                              total_member_bytes += member.size
                              if total_member_bytes > max_total_member_bytes:
                                  raise SystemExit("SDK tarball exceeds the total member-size limit")
                              member_source = archive.extractfile(member)
                              if member_source is None:
                                  raise SystemExit(f"SDK tarball member cannot be read: {member.name!r}")
                              captured = bytearray() if canonical == "package/package.json" else None
                              actual_size = 0
                              while chunk := member_source.read(stream_chunk_bytes):
                                  actual_size += len(chunk)
                                  if actual_size > member.size or actual_size > max_member_bytes:
                                      raise SystemExit(f"SDK tarball member exceeds its size: {member.name!r}")
                                  if captured is not None:
                                      captured.extend(chunk)
                              if actual_size != member.size:
                                  raise SystemExit(f"SDK tarball member is truncated: {member.name!r}")
                              if captured is not None:
                                  metadata_bytes = bytes(captured)
                              file_names.add(canonical)
                          payload_end = archive.offset
                          expanded.seek(0, 2)
                          expanded_size = expanded.tell()
                          trailing_size = expanded_size - payload_end
                          if (
                              expanded_size < 1024
                              or expanded_size % 512 != 0
                              or payload_end > expanded_size
                              or trailing_size < 1024
                              or trailing_size % 512 != 0
                          ):
                              raise SystemExit("SDK tar stream has non-canonical framing")
                          expanded.seek(payload_end)
                          while trailing := expanded.read(stream_chunk_bytes):
                              if any(trailing):
                                  raise SystemExit(
                                      "SDK tar stream contains nonzero data after its final member"
                                  )
                  except SystemExit:
                      raise
                  except (EOFError, OSError, tarfile.TarError) as error:
                      raise SystemExit(f"SDK tarball is not a valid bounded tar stream: {error}") from error
              for collision_key in paths:
                  components = collision_key.split("/")
                  for index in range(1, len(components)):
                      parent = "/".join(components[:index])
                      if parent in paths and paths[parent][1] == "file":
                          raise SystemExit(f"SDK tarball file is also a parent directory: {paths[parent][0]!r}")
              if directory_names - {"package", "package/dist"}:
                  raise SystemExit("SDK tarball has an unknown directory")
              required = {
                  "package/package.json", "package/README.md", "package/LICENSE",
                  "package/dist/index.js", "package/dist/index.d.ts",
              }
              if not required.issubset(file_names):
                  raise SystemExit("SDK tarball is missing a required public file")
              if any(
                  name not in required and not name.startswith("package/dist/")
                  for name in file_names
              ):
                  raise SystemExit("SDK tarball has a development-only or unknown file")
              if metadata_bytes is None:
                  raise SystemExit("SDK package metadata cannot be read")
              metadata = strict_json_loads(metadata_bytes, "SDK package metadata")
              if not isinstance(metadata, dict):
                  raise SystemExit("SDK package metadata is not an object")
              if "tag" in metadata:
                  raise SystemExit("SDK package metadata overrides the publish dist-tag")
              if metadata.get("name") != "@oxhq/stasis" or metadata.get("version") != selected_version:
                  raise SystemExit("SDK package name/version changed")
              if metadata.get("repository") != {"type": "git", "url": "https://github.com/oxhq/stasis.git"}:
                  raise SystemExit("SDK package repository changed")
              publish = metadata.get("publishConfig")
              if (
                  not isinstance(publish, dict)
                  or set(publish) != {"access", "tag", "provenance"}
                  or publish.get("access") != "public"
                  or publish.get("tag") != "alpha"
                  or publish.get("provenance") is not True
              ):
                  raise SystemExit("SDK package publication policy changed")
              scripts = metadata.get("scripts", {})
              if not isinstance(scripts, dict) or install_hooks.intersection(scripts):
                  raise SystemExit("SDK package defines an install lifecycle script")
              runtime_fields = {
                  "dependencies", "optionalDependencies", "peerDependencies",
                  "bundledDependencies", "bundleDependencies",
              }
              if any(metadata.get(field) not in (None, {}, []) for field in runtime_fields):
                  raise SystemExit("SDK package adds a runtime dependency field")
              expected_entrypoints = {
                  "type": "module", "main": "./dist/index.js", "types": "./dist/index.d.ts",
                  "exports": {".": {"types": "./dist/index.d.ts", "import": "./dist/index.js"}},
              }
              if any(metadata.get(key) != value for key, value in expected_entrypoints.items()):
                  raise SystemExit("SDK package public entrypoint metadata changed")
              return metadata

          version = os.environ["STASIS_VERSION"]
          revision = os.environ["STASIS_REVISION"]
          run_id = os.environ["PACKAGE_RUN_ID"]
          run_attempt = os.environ["PACKAGE_RUN_ATTEMPT"]
          prepublish_run_id = os.environ["GITHUB_RUN_ID"]
          prepublish_run_attempt = os.environ["PREPUBLISH_RUN_ATTEMPT"]
          current_publish_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          binary_digest = os.environ["STASIS_NATIVE_BINARY_SHA256"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+", version) is None:
              raise SystemExit("invalid staged SDK version")
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("invalid staged SDK revision")
          if revision != os.environ["GITHUB_SHA"]:
              raise SystemExit("staged SDK revision differs from the release-event provenance SHA")
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None or re.fullmatch(r"[1-9][0-9]*", run_attempt) is None:
              raise SystemExit("invalid staged package run identity")
          if (
              re.fullmatch(r"[1-9][0-9]*", prepublish_run_id) is None
              or re.fullmatch(r"[1-9][0-9]*", prepublish_run_attempt) is None
              or re.fullmatch(r"[1-9][0-9]*", current_publish_attempt) is None
          ):
              raise SystemExit("invalid staged prepublish run identity")
          if int(prepublish_run_attempt) > int(current_publish_attempt):
              raise SystemExit("staged prepublish proof claims a future workflow attempt")
          if re.fullmatch(r"[0-9a-f]{64}", binary_digest) is None:
              raise SystemExit("invalid staged native binary digest")

          directory = pathlib.Path("verified-sdk")
          package_name = f"oxhq-stasis-{version}.tgz"
          proof_name = f"stasis-{version}-typescript-act-settle-inspect.json"
          prepublish_proof_name = f"stasis-{version}-typescript-prepublish-act-settle-inspect.json"
          prepublish_log_name = f"stasis-{version}-typescript-prepublish-act-settle-inspect.log"
          entries = list(directory.iterdir())
          if any(item.is_symlink() or not item.is_file() for item in entries):
              raise SystemExit("staged SDK artifact has a non-regular entry")
          if {item.name for item in entries} != {
              package_name, proof_name, prepublish_proof_name, prepublish_log_name
          }:
              raise SystemExit("staged SDK artifact inventory changed")
          package = directory / package_name
          proof_file = directory / proof_name
          prepublish_proof_file = directory / prepublish_proof_name
          prepublish_log_file = directory / prepublish_log_name

          verify_sdk_tarball(package, version)
          sha256 = hash_file(package, "sha256").hexdigest()
          sha512 = "sha512-" + base64.b64encode(hash_file(package, "sha512").digest()).decode("ascii")
          if proof_file.stat().st_size <= 0 or proof_file.stat().st_size > 64 * 1024:
              raise SystemExit("SDK gate proof size is outside the release limit")
          proof = strict_json_loads(proof_file.read_text(encoding="utf-8"), "SDK gate proof")
          expected_proof = {
              "schema": 2,
              "gate": "sdk-act-settle-inspect",
              "package": f"@oxhq/stasis@{version}",
              "revision": revision,
              "workflowRunId": run_id,
              "workflowRunAttempt": run_attempt,
              "source": {
                  "servo_repository": "https://github.com/servo/servo.git",
                  "servo_revision": "0d579bd5aab6df3764fad805427254751632a6e4",
                  "pliego_repository": "https://github.com/oxhq/pliego.git",
                  "pliego_revision": "556c774242b272b11bc60999449c5debff1ad20f",
                  "pliego_servo_merge_base": "313b6d5ecc113b08010ce434140db3ca5abcc71c",
                  "stasis_repository": "https://github.com/oxhq/stasis.git",
                  "stasis_revision": revision,
              },
              "tarball": {"name": package_name, "sha256": sha256, "integrity": sha512},
              "nativeBinarySha256": binary_digest,
          }
          if not isinstance(proof, dict) or set(proof) != set(expected_proof) | {"gateLogSha256"}:
              raise SystemExit("staged SDK proof schema changed")
          if type(proof.get("schema")) is not int:
              raise SystemExit("staged SDK proof schema type changed")
          if not exact_tarball_binding(proof.get("tarball"), expected_proof["tarball"]):
              raise SystemExit("staged SDK proof tarball binding has invalid types")
          if (
              not isinstance(proof.get("nativeBinarySha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", proof["nativeBinarySha256"]) is None
          ):
              raise SystemExit("staged SDK proof native digest is invalid")
          for key, value in expected_proof.items():
              if proof.get(key) != value:
                  raise SystemExit(f"staged SDK proof field changed: {key}")
          proof_log_digest = proof.get("gateLogSha256")
          if (
              not isinstance(proof_log_digest, str)
              or re.fullmatch(r"[0-9a-f]{64}", proof_log_digest) is None
          ):
              raise SystemExit("staged SDK proof gate digest is invalid")

          if (
              prepublish_proof_file.stat().st_size <= 0
              or prepublish_proof_file.stat().st_size > 64 * 1024
          ):
              raise SystemExit("prepublish SDK gate proof size is outside the release limit")
          prepublish_proof = strict_json_loads(
              prepublish_proof_file.read_text(encoding="utf-8"), "prepublish SDK gate proof"
          )
          expected_prepublish_proof = {
              **expected_proof,
              "workflowRunId": prepublish_run_id,
              "workflowRunAttempt": prepublish_run_attempt,
          }
          if (
              not isinstance(prepublish_proof, dict)
              or set(prepublish_proof) != set(expected_prepublish_proof) | {"gateLogSha256"}
              or type(prepublish_proof.get("schema")) is not int
          ):
              raise SystemExit("prepublish SDK proof schema changed")
          if not exact_tarball_binding(
              prepublish_proof.get("tarball"), expected_prepublish_proof["tarball"]
          ):
              raise SystemExit("prepublish SDK proof tarball binding has invalid types")
          if (
              not isinstance(prepublish_proof.get("nativeBinarySha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", prepublish_proof["nativeBinarySha256"])
              is None
          ):
              raise SystemExit("prepublish SDK proof native digest is invalid")
          for key, value in expected_prepublish_proof.items():
              if prepublish_proof.get(key) != value:
                  raise SystemExit(f"prepublish SDK proof field changed: {key}")
          prepublish_log_size = prepublish_log_file.stat().st_size
          if prepublish_log_size <= 0 or prepublish_log_size > 8 * 1024 * 1024:
              raise SystemExit("prepublish SDK gate log size is outside the release limit")
          prepublish_log_bytes = prepublish_log_file.read_bytes()
          prepublish_log_digest = prepublish_proof.get("gateLogSha256")
          if (
              not isinstance(prepublish_log_digest, str)
              or re.fullmatch(r"[0-9a-f]{64}", prepublish_log_digest) is None
              or hashlib.sha256(prepublish_log_bytes).hexdigest() != prepublish_log_digest
          ):
              raise SystemExit("prepublish SDK proof is not bound to its staged gate log")
          gate_records = []
          try:
              prepublish_log_text = prepublish_log_bytes.decode("utf-8")
          except UnicodeError as error:
              raise SystemExit("prepublish SDK log is not UTF-8") from error
          for line_number, line in enumerate(prepublish_log_text.splitlines(), start=1):
              try:
                  record = strict_json_loads(line, f"prepublish SDK log line {line_number}")
              except SystemExit:
                  if line.lstrip().startswith(("{", "[")):
                      raise
                  continue
              if isinstance(record, dict) and record.get("gate") == "sdk-act-settle-inspect":
                  gate_records.append(record)
          if len(gate_records) != 1:
              raise SystemExit("prepublish SDK log has no unique structured gate success")
          gate_record = gate_records[0]
          wall_elapsed = gate_record.get("wallElapsedMs")
          expected_gate_fields = {
              "gate", "package", "revision", "source", "tarball", "binary",
              "binarySha256", "virtualElapsedNs", "wallElapsedMs", "closeResponseAndEof",
          }
          if (
              set(gate_record) != expected_gate_fields
              or gate_record.get("package") != f"@oxhq/stasis@{version}"
              or gate_record.get("revision") != revision
              or gate_record.get("source") != expected_proof["source"]
              or not exact_tarball_binding(
                  gate_record.get("tarball"), expected_proof["tarball"]
              )
              or not isinstance(gate_record.get("binary"), str)
              or not gate_record.get("binary")
              or not isinstance(gate_record.get("binarySha256"), str)
              or gate_record.get("binarySha256") != binary_digest
              or gate_record.get("virtualElapsedNs") != "10000000000"
              or gate_record.get("closeResponseAndEof") is not True
              or not isinstance(wall_elapsed, (int, float))
              or isinstance(wall_elapsed, bool)
              or not math.isfinite(wall_elapsed)
              or wall_elapsed < 0
              or wall_elapsed >= 8_000
          ):
              raise SystemExit("prepublish SDK gate record does not prove the selected artifacts")
          PY
          for sdk_asset in \
            "verified-sdk/oxhq-stasis-${STASIS_VERSION}.tgz" \
            "verified-sdk/stasis-${STASIS_VERSION}-typescript-act-settle-inspect.json"; do
            gh attestation verify "$sdk_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
              --source-digest "$STASIS_REVISION" \
              --deny-self-hosted-runners
          done
          echo "NPM_TARBALL=$GITHUB_WORKSPACE/verified-sdk/oxhq-stasis-${STASIS_VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Activate pinned npm client
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --registry="$NPM_CONFIG_REGISTRY"
          test "$(npm --version)" = '11.19.0'

      - id: npm-state
        name: Resolve immutable npm publication state
        shell: bash
        run: |
          set -euo pipefail
          local_integrity=$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
          ' "$NPM_TARBALL")
          echo "NPM_LOCAL_INTEGRITY=$local_integrity" >> "$GITHUB_ENV"
          set +e
          existing_integrity=$(npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity --json \
            --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
          view_status=$?
          set -e
          if [[ $view_status -eq 0 && -n "$existing_integrity" && "$existing_integrity" != 'null' ]]; then
            existing_integrity=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$existing_integrity")
            if [[ "$existing_integrity" != "$local_integrity" ]]; then
              echo "@oxhq/stasis@$STASIS_VERSION already exists with different bytes" >&2
              exit 1
            fi
            echo 'publish_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish_required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Recheck immutable release identity immediately before npm mutation
        if: steps.npm-state.outputs.publish_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_by_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          release_by_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          for release in "$release_by_id" "$release_by_tag"; do
            jq -e \
              --argjson release_id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" '
                .id == $release_id
                and .tag_name == $tag
                and .draft == false
                and .prerelease == true
                and .immutable == true
                and (.published_at | type == "string" and length > 0)
              ' <<< "$release" > /dev/null
          done
          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != 'commit' || "$tag_sha" != "$STASIS_REVISION" ]]; then
            echo "$RELEASE_TAG changed before npm publication" >&2
            exit 1
          fi

      - name: Publish with npm OIDC or the one-time seed token
        if: steps.npm-state.outputs.publish_required == 'true'
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
          fi
          npm publish "$NPM_TARBALL" --ignore-scripts --access public --tag alpha --provenance \
            --registry="$NPM_CONFIG_REGISTRY"

      - name: Require registry convergence to exact bytes and only the alpha tag
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in {1..24}; do
            set +e
            registry_version=$(npm view "@oxhq/stasis@$STASIS_VERSION" version --json \
              --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
            version_status=$?
            registry_integrity=$(npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity --json \
              --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
            integrity_status=$?
            dist_tags=$(npm view '@oxhq/stasis' dist-tags --json \
              --registry="$NPM_CONFIG_REGISTRY" 2>/dev/null)
            dist_tags_status=$?
            set -e
            if [[ $version_status -eq 0 && $integrity_status -eq 0 && $dist_tags_status -eq 0 \
              && -n "$registry_version" && -n "$registry_integrity" && -n "$dist_tags" ]]; then
              registry_version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_version")
              registry_integrity=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_integrity")
              dist_tags_match=$(node -e '
                const tags = JSON.parse(process.argv[1]);
                const keys = tags !== null && typeof tags === "object" && !Array.isArray(tags)
                  ? Object.keys(tags).sort()
                  : [];
                process.stdout.write(String(
                  keys.length === 1 && keys[0] === "alpha" && tags.alpha === process.argv[2]
                ));
              ' "$dist_tags" "$STASIS_VERSION")
              if [[ "$registry_version" == "$STASIS_VERSION" \
                && "$registry_integrity" == "$NPM_LOCAL_INTEGRITY" \
                && "$dist_tags_match" == 'true' ]]; then
                matched=true
                break
              fi
            fi
            sleep 10
          done
          if [[ "$matched" != 'true' ]]; then
            echo 'npm registry did not converge to the exact alpha version and integrity' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/stasis-registry-pack"
          npm pack "@oxhq/stasis@$STASIS_VERSION" --ignore-scripts \
            --pack-destination "$RUNNER_TEMP/stasis-registry-pack" \
            --registry="$NPM_CONFIG_REGISTRY"
          shopt -s nullglob
          registry_packages=("$RUNNER_TEMP"/stasis-registry-pack/*.tgz)
          test ${#registry_packages[@]} -eq 1
          cmp "$NPM_TARBALL" "${registry_packages[0]}"

  verify-registry:
    name: Verify registry-installed SDK end to end
    needs:
      - verify
      - publish
    if: needs.verify.result == 'success' && needs.publish.result == 'success'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_RUN_ATTEMPT: ${{ needs.verify.outputs.package_run_attempt }}
      PACKAGE_RUN_ID: ${{ needs.verify.outputs.package_run_id }}
      STASIS_NATIVE_BINARY_SHA256: ${{ needs.verify.outputs.native_binary_sha256 }}
      STASIS_REVISION: ${{ needs.verify.outputs.revision }}
      STASIS_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out the exact published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Require space for bounded public artifact verification
        shell: bash
        run: bash etc/ci/stasis/prepare_macos_runner.sh check 4194304

      - name: Set up Node without publication credentials
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download and recheck the exact published native inputs
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          test "$(sysctl -n hw.optional.arm64)" = '1'
          test "$(git rev-parse HEAD)" = "$STASIS_REVISION"
          bundle="stasis-${STASIS_VERSION}-${STASIS_PLATFORM}"
          archive="${bundle}.tar.gz"
          binary_sidecar="${bundle}.binary.sha256"
          proof="${bundle}-act-settle-inspect.json"
          mkdir release-assets gate-proof
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --pattern "$binary_sidecar"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir gate-proof \
            --pattern "$proof"
          python3 etc/ci/stasis/release_archive.py verify \
            --asset-directory release-assets \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$STASIS_REVISION" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --source-root . \
            --extract-to "$RUNNER_TEMP/stasis-registry-release"
          python3 etc/ci/stasis/release_archive.py verify-gate-proof \
            --proof-directory gate-proof \
            --asset-directory release-assets \
            --version "$STASIS_VERSION" \
            --platform "$STASIS_PLATFORM" \
            --revision "$STASIS_REVISION" \
            --run-id "$PACKAGE_RUN_ID" \
            --run-attempt "$PACKAGE_RUN_ATTEMPT"
          test "$STASIS_NATIVE_BINARY_SHA256" = "$(awk '{print $1}' "release-assets/$binary_sidecar")"
          for release_asset in release-assets/* gate-proof/*; do
            gh attestation verify "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
              --source-digest "$STASIS_REVISION" \
              --deny-self-hosted-runners
          done
          echo "STASIS_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Download the exact pre-gated SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.verify.outputs.staged_artifact_name }}
          path: staged-sdk

      - name: Verify registry bytes, signatures, and real SDK fixture
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --registry="$NPM_CONFIG_REGISTRY"
          test "$(npm --version)" = '11.19.0'
          mkdir verified-sdk
          cp \
            "staged-sdk/oxhq-stasis-${STASIS_VERSION}.tgz" \
            "staged-sdk/stasis-${STASIS_VERSION}-typescript-act-settle-inspect.json" \
            verified-sdk/
          python3 etc/ci/stasis/npm_release.py verify-proof \
            --directory verified-sdk \
            --version "$STASIS_VERSION" \
            --revision "$STASIS_REVISION" \
            --native-binary-sha256 "$STASIS_NATIVE_BINARY_SHA256" \
            --run-id "$PACKAGE_RUN_ID" \
            --run-attempt "$PACKAGE_RUN_ATTEMPT"
          for sdk_asset in verified-sdk/*; do
            gh attestation verify "$sdk_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stasis-package.yml" \
              --source-digest "$STASIS_REVISION" \
              --deny-self-hosted-runners
          done
          expected_tarball="$GITHUB_WORKSPACE/verified-sdk/oxhq-stasis-${STASIS_VERSION}.tgz"
          expected_integrity=$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
          ' "$expected_tarball")
          mkdir "$RUNNER_TEMP/stasis-registry-verification"
          consumer="$RUNNER_TEMP/stasis-registry-consumer"
          mkdir "$consumer"
          audit_json="$RUNNER_TEMP/stasis-registry-audit.json"
          (
            cd "$consumer"
            npm init --yes
            scope_registry=$(npm config get '@oxhq:registry')
            if [[ "$scope_registry" != 'undefined' && "$scope_registry" != "$NPM_CONFIG_REGISTRY" ]]; then
              echo "unexpected @oxhq registry: $scope_registry" >&2
              exit 1
            fi
            npm install --ignore-scripts "@oxhq/stasis@$STASIS_VERSION" \
              --registry="$NPM_CONFIG_REGISTRY"
            test "$(npm view "@oxhq/stasis@$STASIS_VERSION" version \
              --registry="$NPM_CONFIG_REGISTRY")" = "$STASIS_VERSION"
            dist_tags=$(npm view '@oxhq/stasis' dist-tags --json \
              --registry="$NPM_CONFIG_REGISTRY")
            node -e '
              const assert = require("node:assert/strict");
              assert.deepEqual(JSON.parse(process.argv[1]), { alpha: process.argv[2] });
            ' "$dist_tags" "$STASIS_VERSION"
            test "$(npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity \
              --registry="$NPM_CONFIG_REGISTRY")" = "$expected_integrity"
            npm pack "@oxhq/stasis@$STASIS_VERSION" --ignore-scripts \
              --pack-destination "$RUNNER_TEMP/stasis-registry-verification" \
              --registry="$NPM_CONFIG_REGISTRY"
            npm audit signatures --json --include-attestations \
              --registry="$NPM_CONFIG_REGISTRY" > "$audit_json"
          )
          shopt -s nullglob
          registry_packages=("$RUNNER_TEMP"/stasis-registry-verification/*.tgz)
          test ${#registry_packages[@]} -eq 1
          cmp "$expected_tarball" "${registry_packages[0]}"
          jq -e --arg version "$STASIS_VERSION" --arg registry "$NPM_CONFIG_REGISTRY" '
            (keys | sort) == ["invalid", "missing", "verified"]
            and .invalid == []
            and .missing == []
            and (.verified | type) == "array"
            and (.verified | length) == 1
            and .verified[0].name == "@oxhq/stasis"
            and .verified[0].version == $version
            and .verified[0].registry == $registry
            and .verified[0].attestations.provenance.predicateType == "https://slsa.dev/provenance/v1"
          ' "$audit_json" > /dev/null
          python3 - "$audit_json" "$expected_tarball" <<'PY'
          import base64
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import sys

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate object key {key!r}")
                  value[key] = item
              return value

          def strict_float(value):
              parsed = float(value)
              if not math.isfinite(parsed):
                  raise ValueError(f"non-finite number {value!r}")
              return parsed

          def strict_constant(value):
              raise ValueError(f"non-finite number {value!r}")

          def strict_json_loads(document, context):
              try:
                  return json.loads(
                      document,
                      object_pairs_hook=strict_object,
                      parse_float=strict_float,
                      parse_constant=strict_constant,
                  )
              except (ValueError, RecursionError) as error:
                  raise SystemExit(f"{context} is invalid strict JSON: {error}") from error

          audit_file = pathlib.Path(sys.argv[1])
          if audit_file.stat().st_size <= 0 or audit_file.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit("npm signature audit size is outside the verification limit")
          audit = strict_json_loads(
              audit_file.read_text(encoding="utf-8"), "npm signature audit"
          )
          tarball = pathlib.Path(sys.argv[2])
          version = os.environ["STASIS_VERSION"]
          revision = os.environ["STASIS_REVISION"]
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          current_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])

          verified = audit.get("verified")
          if not isinstance(verified, list) or len(verified) != 1:
              raise SystemExit("npm audit did not return exactly one verified package")
          entry = verified[0]
          expected_attestation_url = (
              f"https://registry.npmjs.org/-/npm/v1/attestations/"
              f"@oxhq%2fstasis@{version}"
          )
          attestations = entry.get("attestations")
          if not isinstance(attestations, dict) or attestations.get("url") != expected_attestation_url:
              raise SystemExit("npm attestation URL is not the exact public registry identity")

          bundles = entry.get("attestationBundles")
          if not isinstance(bundles, list):
              raise SystemExit("npm audit omitted verified attestation bundles")
          provenance_bundles = [
              item for item in bundles
              if isinstance(item, dict)
              and item.get("predicateType") == "https://slsa.dev/provenance/v1"
          ]
          if len(provenance_bundles) != 1:
              raise SystemExit("npm audit did not verify exactly one SLSA v1 provenance bundle")
          envelope = provenance_bundles[0].get("bundle", {}).get("dsseEnvelope")
          if not isinstance(envelope, dict) or envelope.get("payloadType") != "application/vnd.in-toto+json":
              raise SystemExit("npm provenance DSSE envelope type changed")
          signatures = envelope.get("signatures")
          if not isinstance(signatures, list) or not signatures:
              raise SystemExit("npm provenance DSSE envelope has no verified signature")
          try:
              payload = base64.b64decode(envelope["payload"], validate=True)
              statement = strict_json_loads(payload.decode("utf-8"), "npm provenance statement")
          except (KeyError, ValueError, UnicodeDecodeError) as error:
              raise SystemExit("npm provenance DSSE payload is invalid") from error

          expected_sha512_state = hashlib.sha512()
          with tarball.open("rb") as tarball_source:
              for chunk in iter(lambda: tarball_source.read(1024 * 1024), b""):
                  expected_sha512_state.update(chunk)
          expected_sha512 = expected_sha512_state.hexdigest()
          expected_subject = [{
              "name": f"pkg:npm/%40oxhq/stasis@{version}",
              "digest": {"sha512": expected_sha512},
          }]
          if set(statement) != {"_type", "subject", "predicateType", "predicate"}:
              raise SystemExit("npm provenance statement schema changed")
          if statement.get("_type") != "https://in-toto.io/Statement/v1":
              raise SystemExit("npm provenance is not an in-toto v1 statement")
          if statement.get("predicateType") != "https://slsa.dev/provenance/v1":
              raise SystemExit("npm provenance predicate type changed")
          if statement.get("subject") != expected_subject:
              raise SystemExit("npm provenance subject does not bind the exact registry tarball")

          predicate = statement.get("predicate")
          if not isinstance(predicate, dict) or set(predicate) != {"buildDefinition", "runDetails"}:
              raise SystemExit("npm provenance predicate schema changed")
          build = predicate.get("buildDefinition")
          expected_ref = f"refs/tags/v{version}"
          expected_workflow = {
              "ref": expected_ref,
              "repository": f"{server_url}/{repository}",
              "path": ".github/workflows/stasis-publish-npm.yml",
          }
          if not isinstance(build, dict):
              raise SystemExit("npm provenance build definition is missing")
          if build.get("buildType") != "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1":
              raise SystemExit("npm provenance build type changed")
          if build.get("externalParameters") != {"workflow": expected_workflow}:
              raise SystemExit("npm provenance workflow identity changed")
          expected_dependencies = [{
              "uri": f"git+{server_url}/{repository}@{expected_ref}",
              "digest": {"gitCommit": revision},
          }]
          if build.get("resolvedDependencies") != expected_dependencies:
              raise SystemExit("npm provenance source commit changed")
          internal = build.get("internalParameters")
          if not isinstance(internal, dict) or internal.get("github", {}).get("event_name") != "release":
              raise SystemExit("npm provenance did not originate from the release event")

          run_details = predicate.get("runDetails")
          if not isinstance(run_details, dict):
              raise SystemExit("npm provenance run details are missing")
          if run_details.get("builder") != {"id": "https://github.com/actions/runner/github-hosted"}:
              raise SystemExit("npm provenance was not produced by a GitHub-hosted runner")
          metadata = run_details.get("metadata")
          if not isinstance(metadata, dict) or set(metadata) != {"invocationId"}:
              raise SystemExit("npm provenance invocation metadata changed")
          prefix = f"{server_url}/{repository}/actions/runs/{run_id}/attempts/"
          match = re.fullmatch(re.escape(prefix) + r"([1-9][0-9]*)", metadata["invocationId"])
          if match is None:
              raise SystemExit("npm provenance invocation is not this exact workflow run")
          provenance_attempt = int(match.group(1))
          if provenance_attempt > current_attempt:
              raise SystemExit("npm provenance claims a future workflow attempt")
          print(
              f"verified exact npm provenance for {repository}@{revision} "
              f"run {run_id} attempt {provenance_attempt}"
          )
          PY
          node etc/ci/stasis/verify_registry_sdk.mjs \
            --binary "$RUNNER_TEMP/stasis-registry-release/$STASIS_BUNDLE/stasis" \
            --fixture ports/stasis/tests/fixtures/timer_10s.html \
            --consumer-root "$consumer" \
            --package "${registry_packages[0]}" \
            --revision "$STASIS_REVISION" \
            --version "$STASIS_VERSION"
