      - id: npm-state
        name: Resolve immutable npm publication state
        shell: bash
        run: |
          set -euo pipefail
          local_integrity=$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            process.stdout.write("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));
          ' "$NPM_TARBALL")
          echo "NPM_LOCAL_INTEGRITY=$local_integrity" >> "$GITHUB_ENV"
          view_json="$RUNNER_TEMP/stasis-npm-view.json"
          view_stderr="$RUNNER_TEMP/stasis-npm-view.stderr"
          set +e
          npm view "@oxhq/stasis@$STASIS_VERSION" dist.integrity --json \
            --prefer-online \
            --registry="$NPM_CONFIG_REGISTRY" \
            > "$view_json" 2> "$view_stderr"
          view_status=$?
          set -e
