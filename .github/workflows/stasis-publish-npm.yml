              end
            ' "$view_json"); then
              cat "$view_stderr" >&2
              echo 'npm view succeeded without one JSON integrity string; refusing to publish' >&2
              exit 1
            fi
            if [[ "$existing_integrity" != "$local_integrity" ]]; then
